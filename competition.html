<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FM Web — Compétition</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #262a33;
    --text: #e8eaed;
    --text-dim: #8b909c;
    --accent: #4ade80;
    --accent-dim: #1f6b42;
    --danger: #ef4444;
    --gold: #fbbf24;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    overflow: hidden;
  }
  button { font-family: inherit; cursor: pointer; border-radius: 8px; font-weight: 600; }

  /* Utilitaire de scroll "natif" : le scroll fonctionne normalement mais la
     barre est fine et discrete plutot que la grosse barre blanche par defaut. */
  .scroll-hide {
    scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.14) transparent;
  }
  .scroll-hide::-webkit-scrollbar { width: 6px; height: 6px; }
  .scroll-hide::-webkit-scrollbar-track { background: transparent; }
  .scroll-hide::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.14); border-radius: 999px; }
  .scroll-hide::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.26); }

  /* ============================================================
     Coquille plein ecran, identique au dashboard : une topbar (fm-header)
     + une sidebar laterale collee au bord + le contenu qui occupe le reste.
     ============================================================ */
  #app { position: fixed; inset: 0; display: flex; flex-direction: column; background: var(--bg); }

  .fm-header {
    display: flex; justify-content: space-between; align-items: center; flex-wrap: nowrap;
    gap: 14px; padding: 12px 22px; flex: 0 0 auto;
    background: linear-gradient(120deg, #4c1116, #7a1620 55%, #9c2430);
    border-bottom: 1px solid rgba(0,0,0,0.3);
  }
  .fm-header .title-block { display: flex; align-items: center; gap: 16px; min-width: 0; }
  .fm-header .back-link {
    color: rgba(255,255,255,0.75); text-decoration: none; font-size: 13px;
    flex-shrink: 0; padding-right: 14px; border-right: 1px solid rgba(255,255,255,0.2);
  }
  .fm-header .back-link:hover { color: #fff; }
  .fm-header .title-block .page-title {
    font-size: 18px; font-weight: 800; letter-spacing: 0.02em; color: #fff; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; max-width: 44vw;
  }
  .fm-header .title-block .manager-line {
    font-size: 12px; color: rgba(255,255,255,0.78); margin-top: 2px; white-space: nowrap;
  }
  .fm-header .right-block { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }

  /* Titre de la topbar transforme en champ de recherche globale
     (clubs + competitions + joueurs) avec suggestions en dessous, comme sur
     dashboard.html / squad.html / club.html / fiche.html. */
  .page-title-wrap { position: relative; min-width: 0; }
  .page-title-input {
    background: transparent; border: none; outline: none; color: #fff;
    font-size: 18px; font-weight: 800; letter-spacing: 0.02em; padding: 2px 0;
    width: 230px; max-width: 40vw; font-family: inherit;
  }
  .page-title-input::placeholder { color: rgba(255,255,255,0.92); font-weight: 800; opacity: 1; }
  .fm-search-dropdown {
    position: absolute; top: calc(100% + 8px); left: 0; min-width: 300px; max-width: 380px;
    background: #14171d; border: 1px solid var(--border); border-radius: 10px;
    box-shadow: 0 12px 32px rgba(0,0,0,0.5); z-index: 200; max-height: 380px; overflow-y: auto;
  }
  .fm-search-dropdown.hidden { display: none !important; }
  .search-group-label {
    padding: 8px 12px 4px; font-size: 10px; text-transform: uppercase;
    letter-spacing: 0.05em; color: var(--text-dim);
  }
  .search-result-item {
    display: flex; align-items: center; gap: 10px; padding: 8px 12px; font-size: 13px;
    color: var(--text); cursor: pointer;
  }
  .search-result-item:hover { background: rgba(251,191,36,0.1); color: var(--gold); }
  .search-result-icon { flex-shrink: 0; font-size: 13px; }
  .search-result-sub { font-size: 11px; color: var(--text-dim); margin-top: 1px; }
  .search-empty { padding: 14px 12px; font-size: 12px; color: var(--text-dim); text-align: center; }

  /* Badge de date (jour/saison), identique aux autres pages. */
  .fm-date-badge {
    background: rgba(0,0,0,0.28); border-radius: 8px; padding: 7px 14px;
    text-align: right; line-height: 1.35; color: #fff; flex-shrink: 0;
  }
  .fm-date-badge .day-num { font-size: 13px; font-weight: 800; white-space: nowrap; }
  .fm-date-badge .season-line { font-size: 11px; color: rgba(255,255,255,0.7); }

  /* Petite barre de recherche arrondie, toujours visible a cote de la date. */
  .fm-quick-search { position: relative; flex-shrink: 0; }
  .fm-quick-search-input {
    width: 158px; max-width: 26vw; background: rgba(0,0,0,0.28); border: 1px solid rgba(255,255,255,0.16);
    border-radius: 999px; color: #fff; font-size: 12.5px; font-family: inherit;
    padding: 8px 14px 8px 30px; outline: none; transition: width 0.15s ease, background 0.15s ease, border-color 0.15s ease;
  }
  .fm-quick-search-input::placeholder { color: rgba(255,255,255,0.55); }
  .fm-quick-search-input:focus { background: rgba(0,0,0,0.42); border-color: rgba(255,255,255,0.34); width: 208px; }
  .fm-quick-search-icon {
    position: absolute; left: 11px; top: 50%; transform: translateY(-50%); font-size: 12px;
    color: rgba(255,255,255,0.6); pointer-events: none;
  }
  .fm-quick-search .fm-search-dropdown { left: auto; right: 0; }
  @media (max-width: 720px) {
    .fm-quick-search-input { width: 34px; padding-left: 30px; color: transparent; cursor: pointer; }
    .fm-quick-search-input::placeholder { color: transparent; }
    .fm-quick-search-input:focus { width: 168px; color: #fff; padding-right: 12px; }
    .fm-quick-search-input:focus::placeholder { color: rgba(255,255,255,0.55); }
  }

  .fm-comp-tag {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; font-weight: 700;
    background: rgba(255,255,255,0.12); color: #fff; border: 1px solid rgba(255,255,255,0.3);
    border-radius: 999px; padding: 5px 12px; flex-shrink: 0; white-space: nowrap;
  }

  .fm-body { flex: 1; display: flex; align-items: stretch; min-height: 0; }

  .fm-sidebar {
    width: 220px; flex-shrink: 0; background: var(--panel); border-right: 1px solid var(--border);
    overflow-y: auto; padding: 10px 0;
  }
  .fm-nav-item {
    display: flex; align-items: center; gap: 12px; padding: 12px 20px; font-size: 13.5px;
    color: var(--text-dim); cursor: pointer; border-left: 3px solid transparent; user-select: none;
  }
  .fm-nav-item:hover { background: rgba(255,255,255,0.03); color: var(--text); }
  .fm-nav-item.active {
    background: rgba(251,191,36,0.08); color: var(--gold); border-left-color: var(--gold); font-weight: 700;
  }
  .fm-nav-icon { width: 18px; text-align: center; flex-shrink: 0; }

  .fm-content-wrap {
    flex: 1; min-width: 0; min-height: 0; overflow: hidden; padding: 16px 24px;
    display: flex; flex-direction: column;
  }
  /* Mode "page defilante" : active uniquement pour les championnats, pour
     pouvoir afficher le classement en entier (plus de mini-scroll interne).
     Le reste de la page defile normalement a la place. */
  .fm-content-wrap.fm-scrollable { overflow-y: auto; overflow-x: hidden; }

  .fm-view-tabs { display: flex; gap: 8px; flex: 0 0 auto; margin-bottom: 14px; }
  .fm-view-tab {
    background: #14171d; border: 1px solid var(--border); color: var(--text-dim);
    font-size: 12px; font-weight: 700; padding: 8px 16px; border-radius: 999px;
  }
  .fm-view-tab:hover { color: var(--text); }
  .fm-view-tab.active { background: rgba(251,191,36,0.14); color: var(--gold); border-color: #7a5c0f; }

  .fm-view-body { flex: 1; min-height: 0; }
  .fm-content-wrap.fm-scrollable .fm-view-body { min-height: auto; }
  .fm-view-body #fmContent.hidden, .fm-view-body #fmHistoryPanel.hidden { display: none; }

  .fm-content {
    width: 100%; height: 100%; display: grid;
    grid-template-columns: 60% 40%; gap: 18px; align-items: stretch;
  }
  /* Championnat : le classement grandit avec son contenu (plus de scroll
     interne) et la page entiere defile a la place si besoin. */
  .fm-content.fm-scrollable-grid { height: auto; min-height: 100%; align-items: start; }
  .fm-content.fm-scrollable-grid .fm-col { height: auto; }
  .fm-content.fm-scrollable-grid .fm-col .card { flex: none; }
  .fm-content.fm-scrollable-grid .fm-col .card .fm-scroll-area {
    flex: none; overflow: visible; min-height: auto; max-height: none;
  }

  /* "Prochains matchs" deplace et reduit (championnat) : meme carte, juste
     plus compacte visuellement pour laisser toute la place au classement. */
  .card.compact-card { padding: 13px 16px; }
  .card.compact-card .fm-card-title { font-size: 11px; margin-bottom: 8px; }
  .card.compact-card .fm-comp-match-row { padding: 6px 0; font-size: 11.5px; gap: 10px; }
  .card.compact-card .fm-comp-match-date { width: 42px; }
  .card.compact-card .fm-comp-match-date .day { font-size: 11.5px; }

  .fm-bracket-btn {
    background: rgba(251,191,36,0.12); border: 1px solid #7a5c0f; color: var(--gold);
    font-size: 10.5px; font-weight: 700; padding: 5px 10px; border-radius: 999px; flex-shrink: 0;
  }
  .fm-bracket-btn:hover { background: rgba(251,191,36,0.22); }

  /* ---- Popup bracket complet (coupe nationale) ---- */
  .fm-modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.62); display: flex;
    align-items: center; justify-content: center; z-index: 500; padding: 24px;
  }
  .fm-modal-backdrop.hidden { display: none !important; }
  .fm-modal-panel {
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    width: min(94vw, 1320px); max-height: 88vh; display: flex; flex-direction: column; overflow: hidden;
  }
  .fm-modal-header {
    display: flex; justify-content: space-between; align-items: center; padding: 14px 18px;
    border-bottom: 1px solid var(--border); font-weight: 800; font-size: 14px; color: var(--gold); flex: 0 0 auto;
  }
  .fm-modal-close {
    background: rgba(255,255,255,0.08); border: none; color: #fff; width: 28px; height: 28px;
    border-radius: 8px; font-size: 13px; line-height: 1;
  }
  .fm-modal-close:hover { background: rgba(255,255,255,0.2); }
  .fm-modal-body { padding: 20px; overflow: auto; flex: 1; min-height: 0; }

  .fm-bracket-titles { display: flex; min-width: max-content; margin-bottom: 10px; }
  .fm-bracket-col-title {
    font-size: 10.5px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em;
    color: var(--gold); text-align: center; flex: 0 0 auto;
  }
  .fm-bracket-wrap { position: relative; display: flex; min-width: max-content; }
  .fm-bracket-svg { position: absolute; top: 0; left: 0; z-index: 0; overflow: visible; }
  .fm-bracket-link { fill: none; stroke: var(--border); stroke-width: 1.5; }
  .fm-bracket-link.mine { stroke: var(--gold); stroke-width: 2.25; }
  .fm-bracket-col-body { position: relative; z-index: 1; flex: 0 0 auto; }
  .fm-bracket-match {
    position: absolute; left: 0; width: 100%; box-sizing: border-box;
    background: #14171d; border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px;
  }
  .fm-bracket-match.mine { border-color: var(--gold); box-shadow: 0 0 0 1px rgba(251,191,36,0.35); }
  .fm-bracket-match .bside { display: flex; align-items: center; gap: 6px; padding: 3px 0; font-size: 11.5px; cursor: pointer; }
  .fm-bracket-match .bside:hover { color: var(--gold); }
  .fm-bracket-match .bside img { width: 14px; height: 14px; object-fit: contain; border-radius: 3px; flex-shrink: 0; }
  .fm-bracket-match .bside .bname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
  .fm-bracket-match .bside .bscore { font-weight: 700; color: var(--text-dim); flex-shrink: 0; }
  .fm-bracket-match .bside.win .bname { color: var(--accent); font-weight: 700; }
  .fm-bracket-match .bside.win .bscore { color: var(--accent); }

  /* ---- Historique / palmares ---- */
  .fm-history-panel { height: 100%; }
  .fm-history-panel .card { height: 100%; }
  .fm-history-row {
    display: flex; align-items: center; gap: 14px; padding: 12px 4px;
    border-bottom: 1px solid rgba(255,255,255,0.04); font-size: 13px;
  }
  .fm-history-row:last-child { border-bottom: none; }
  .fm-history-season { width: 82px; flex-shrink: 0; font-weight: 800; color: var(--text-dim); font-size: 12px; }
  .fm-history-winner {
    flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; font-weight: 700; cursor: pointer;
  }
  .fm-history-winner:hover { color: var(--gold); text-decoration: underline; }
  .fm-history-winner img { width: 20px; height: 20px; object-fit: contain; border-radius: 4px; flex-shrink: 0; }
  .fm-history-meta {
    display: flex; flex-direction: column; gap: 2px; font-size: 11px; color: var(--text-dim);
    flex-shrink: 0; text-align: right; min-width: 170px;
  }
  .fm-col { display: flex; flex-direction: column; gap: 16px; min-width: 0; height: 100%; min-height: 0; }
  .fm-col .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 18px 20px; flex: 1; min-height: 0; display: flex; flex-direction: column;
  }
  .fm-card-title {
    flex: 0 0 auto; display: flex; justify-content: space-between; align-items: center;
    font-size: 12.5px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--gold); margin-bottom: 14px;
  }
  .fm-card-title .comp-name { color: var(--text); font-weight: 800; text-transform: none; letter-spacing: 0; font-size: 13.5px; }
  .fm-scroll-area { flex: 1; min-height: 0; overflow-y: auto; }
  .fm-empty { color: var(--text-dim); font-size: 13px; padding: 20px 0; text-align: center; }

  /* Colonne de gauche (championnat) : le classement doit toujours etre
     affiche en entier (jamais de mini-scroll), il recoit donc la plus
     grande part de hauteur disponible de la colonne ; la carte "Resultats"
     se contente du reste et garde son propre mini-scroll si une journee a
     beaucoup de matchs. La densite des lignes du classement (police +
     espacement, via --fm-row-py/--fm-row-font) est recalculee en JS pour
     que toutes les equipes tiennent, sans jamais faire defiler la page
     entiere. */
  #cardStandings { flex: 1 1 0; min-height: 0; }
  #cardNextMatches { flex: 0 0 clamp(120px, 20vh, 190px); min-height: 0; }
  #compStandings { overflow: hidden; }

  /* Fleches de navigation entre journees (carte "Resultats"), masquees par
     defaut (coupe nationale n'en a pas besoin) et activees en JS pour un
     championnat. */
  .fm-journee-nav { display: inline-flex; align-items: center; gap: 8px; }
  .fm-journee-arrow {
    display: none; align-items: center; justify-content: center;
    width: 20px; height: 20px; padding: 0; line-height: 1; font-size: 10.5px;
    background: rgba(255,255,255,0.08); border: 1px solid var(--border); color: var(--text);
  }
  .fm-journee-arrow.visible { display: inline-flex; }
  .fm-journee-arrow:hover:not(:disabled) { background: rgba(251,191,36,0.18); color: var(--gold); }
  .fm-journee-arrow:disabled { opacity: 0.3; cursor: default; }
  .fm-comp-match-teams .vs.score { color: var(--text); font-weight: 800; font-size: 13px; }

  .fm-table { width: 100%; border-collapse: collapse; font-size: var(--fm-row-font, 13px); }
  .fm-table th {
    position: sticky; top: 0; background: var(--panel);
    text-align: left; color: var(--text-dim); font-weight: 600; font-size: 10.5px;
    text-transform: uppercase; letter-spacing: 0.03em;
    padding: var(--fm-row-py, 8px) 9px; border-bottom: 1px solid var(--border);
  }
  .fm-table td { padding: var(--fm-row-py, 9px) 9px; border-bottom: 1px solid rgba(255,255,255,0.04); }
  .fm-table tr:last-child td { border-bottom: none; }
  .fm-table tr.me td { background: rgba(251,191,36,0.1); }
  .fm-table td.clt { color: var(--text-dim); width: 26px; }
  .fm-table td.num { color: var(--text-dim); text-align: center; width: 30px; }
  .fm-table td.pts { font-weight: 700; text-align: center; width: 34px; }
  .fm-club-link { cursor: pointer; font-weight: 600; display: inline-flex; align-items: center; gap: 7px; }
  .fm-club-link:hover { color: var(--gold); text-decoration: underline; }
  .fm-club-logo { width: 18px; height: 18px; object-fit: contain; flex-shrink: 0; border-radius: 3px; }

  /* Zones de qualification europeenne / relegation : liseret colore a
     gauche de la ligne + tres legere teinte de fond, une couleur par
     competition europeenne (alignee sur les couleurs UEFA habituelles)
     et une couleur dediee pour la releguation. */
  .fm-table tr.zone-euro-1 td:first-child { border-left: 3px solid #3b82f6; }
  .fm-table tr.zone-euro-1 td { background: rgba(59,130,246,0.07); }
  .fm-table tr.zone-euro-2 td:first-child { border-left: 3px solid #f97316; }
  .fm-table tr.zone-euro-2 td { background: rgba(249,115,22,0.07); }
  .fm-table tr.zone-euro-3 td:first-child { border-left: 3px solid #22c55e; }
  .fm-table tr.zone-euro-3 td { background: rgba(34,197,94,0.07); }
  .fm-table tr.zone-releg td:first-child { border-left: 3px solid var(--danger); }
  .fm-table tr.zone-releg td { background: rgba(239,68,68,0.07); }
  .fm-table tr.me.zone-euro-1 td, .fm-table tr.me.zone-euro-2 td,
  .fm-table tr.me.zone-euro-3 td, .fm-table tr.me.zone-releg td { background: rgba(251,191,36,0.12); }

  .fm-standings-legend {
    display: flex; flex-wrap: wrap; gap: 12px; padding: 10px 2px 2px;
    font-size: 11px; color: var(--text-dim); flex: 0 0 auto;
  }
  .fm-standings-legend .legend-item { display: flex; align-items: center; gap: 6px; }
  .fm-standings-legend .legend-dot { width: 9px; height: 9px; border-radius: 2px; flex-shrink: 0; }

  /* ---- Prochains matchs (memes codes couleurs que sur le dashboard) ---- */
  .fm-comp-match-row {
    display: flex; align-items: center; gap: 14px; padding: 10px 0;
    border-bottom: 1px solid rgba(255,255,255,0.04); font-size: 12.5px;
  }
  .fm-comp-match-row:last-child { border-bottom: none; }
  .fm-comp-match-date { width: 60px; flex-shrink: 0; color: var(--text-dim); line-height: 1.3; text-transform: capitalize; }
  .fm-comp-match-date .day { font-weight: 700; color: var(--text); font-size: 13px; display: block; }
  .fm-comp-match-teams { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .fm-comp-match-teams .home, .fm-comp-match-teams .away {
    flex: 1; min-width: 0; display: flex; cursor: pointer;
  }
  .fm-comp-match-teams .home { justify-content: flex-end; }
  .fm-comp-match-teams .away { justify-content: flex-start; }
  /* Le logo est toujours colle immediatement a gauche du nom du club (ordre
     logo -> nom, meme cote domicile qu'exterieur), avec un espacement net
     entre les deux pour ne pas coller le texte contre l'image. */
  .fm-comp-match-teams .club {
    display: inline-flex; align-items: center; gap: 7px; min-width: 0; max-width: 100%;
    font-weight: 600; overflow: hidden;
  }
  .fm-comp-match-teams .club .club-name-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fm-comp-match-teams .club img.fm-club-logo { flex-shrink: 0; }
  .fm-comp-match-teams span.club:hover { color: var(--gold); text-decoration: underline; }
  .fm-comp-match-teams .vs { color: var(--text-dim); font-size: 11px; flex-shrink: 0; }

  /* ---- Coupe nationale : lignes de tableau (tour en cours / historique)
     et lignes de "parcours" du club (memes codes que sur le dashboard). ---- */
  .fm-coupe-fixture-row {
    display: flex; align-items: center; gap: 10px; padding: 8px 0;
    border-bottom: 1px solid rgba(255,255,255,0.04); font-size: 12.5px;
  }
  .fm-coupe-fixture-row:last-child { border-bottom: none; }
  .fm-coupe-fixture-row .teams { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; gap: 8px; }
  /* Meme principe que pour "Prochains matchs" : le logo reste toujours
     immediatement a gauche du nom du club (jamais apres), avec un espace
     net entre logo et texte, cote domicile comme exterieur. */
  .fm-coupe-fixture-row .teams .club {
    flex: 1; min-width: 0; font-weight: 600; cursor: pointer;
    display: inline-flex; align-items: center; gap: 7px;
  }
  .fm-coupe-fixture-row .teams .club .club-name-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fm-coupe-fixture-row .teams .club img.fm-club-logo { flex-shrink: 0; }
  .fm-coupe-fixture-row .teams .club.home { justify-content: flex-end; text-align: right; }
  .fm-coupe-fixture-row .teams .club.away { justify-content: flex-start; }
  .fm-coupe-fixture-row .teams .club:hover { color: var(--gold); text-decoration: underline; }
  .fm-coupe-fixture-row .teams .club.winner { color: var(--accent); }
  .fm-coupe-fixture-row .score {
    flex-shrink: 0; font-weight: 700; font-size: 12px; min-width: 46px; text-align: center;
    color: var(--text-dim);
  }
  .fm-coupe-round-header {

// ===================== Badge de date (jour/saison), identique aux autres

function computeRealDate(dateDebut, jourActuel) {
  if (!dateDebut) return null;
  const base = new Date(`${dateDebut}T00:00:00`);
  if (isNaN(base.getTime())) return null;
  const jours = Number(jourActuel);
  base.setDate(base.getDate() + (Number.isFinite(jours) ? jours : 0));
  return base;
}
function formatRealDate(date) {
  if (!date) return null;
  return new Intl.DateTimeFormat("fr-FR", { day: "2-digit", month: "long", year: "numeric" })
    .format(date).toUpperCase();
}
async function loadDateBadge() {

// ===================== Sidebar (memes onglets que le dashboard) =====================

// ===================== COULEUR DE LA TOPBAR SELON LE CLUB =====================

async function fmFetchClubColor(gameClubId) {

function fmApplyTopbarColor(color) {

  }
  const h = Math.round(color.h);
  const s = Math.round(color.s ?? 70);
  const l = Math.round(color.l ?? 40);
  const dark = Math.max(l - 24, 8);
  const bright = Math.min(l + 16, 60);
  header.style.background =
    `linear-gradient(120deg, hsl(${h}, ${s}%, ${dark}%), hsl(${h}, ${s}%, ${l}%) 55%, hsl(${h}, ${Math.max(s - 8, 0)}%, ${bright}%))`;
}

// ===================== MOTEUR DE RECHERCHE APPROXIMATIVE =====================
// Recherche insensible aux accents, aux abreviations et aux surnoms de clubs
// courants ("man city" -> Manchester City, "munich" -> Bayern Munchen, "psg"
// -> Paris Saint-Germain...). Utilise par runGlobalSearch ci-dessous.
function fmNormSearch(s) {
  return (s || "")
    .toString()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .toLowerCase()
    .replace(/[^a-z0-9]+/g, " ")
    .trim();
}

// Paires de termes equivalents (surnoms, traductions, abreviations). Chaque
// paire est bidirectionnelle : chercher l'un des deux termes retrouve aussi
// les noms contenant l'autre.
const FM_SEARCH_ALIASES = [
  ["psg", "paris saint germain"], ["om", "marseille"], ["ol", "lyon"],
  ["asse", "saint etienne"], ["losc", "lille"], ["ogcn", "nice"],
  ["man city", "manchester city"], ["mancity", "manchester city"],
  ["man utd", "manchester united"], ["man u", "manchester united"], ["manu", "manchester united"],
  ["real", "real madrid"], ["atleti", "atletico madrid"], ["atletico", "atletico madrid"],
  ["barca", "barcelone"], ["barca", "barcelona"],
  ["juve", "juventus"], ["inter", "internazionale"], ["milan", "ac milan"],
  ["munich", "munchen"], ["munich", "muenchen"], ["bayern", "bayern munchen"],
  ["psv", "psv eindhoven"], ["dortmund", "borussia dortmund"], ["bvb", "borussia dortmund"],
  ["leverkusen", "bayer leverkusen"], ["spurs", "tottenham"],
];

function fmSearchVariants(q) {
  const base = fmNormSearch(q);
  const variants = new Set([base]);
  FM_SEARCH_ALIASES.forEach(([a, b]) => {
    if (base.includes(a)) variants.add(base.split(a).join(b));
    if (base.includes(b)) variants.add(base.split(b).join(a));
  });
  return [...variants];
}

// Score de correspondance entre un nom (club/competition/joueur) et une
// requete : prefixe de chaque mot dans n'importe quel ordre (gere "man city"
// -> "Manchester City"), acronyme (gere "psg" -> "Paris Saint-Germain"), puis
// repli en sous-chaine simple. 0 = pas de correspondance.
function fmMatchScore(name, query) {
  const normName = fmNormSearch(name);
  if (!normName) return 0;
  const nameWords = normName.split(" ").filter(Boolean);
  const flatName = nameWords.join("");
  const initials = nameWords.map(w => w[0]).join("");
  let best = 0;
  fmSearchVariants(query).forEach(variant => {
    const qWords = variant.split(" ").filter(Boolean);
    if (!qWords.length) return;
    // Acronyme (ex : "psg" -> Paris Saint-Germain).
    if (qWords.length === 1 && qWords[0].length >= 2 && qWords[0] === initials) {
      best = Math.max(best, 90);
    }
    // Chaque mot de la requete doit apparaitre comme sous-chaine dans au
    // moins un mot du nom, peu importe l'ordre : equivalent (en mieux, avec
    // accents/surnoms geres) au filtre ilike mot-par-mot d'origine.
    const allMatch = qWords.every(qw => nameWords.some(nw => nw.includes(qw)));
    if (allMatch) {
      const exact = qWords.every(qw => nameWords.includes(qw));
      const allPrefix = qWords.every(qw => nameWords.some(nw => nw.startsWith(qw)));
      best = Math.max(best, exact ? 100 : (allPrefix ? 85 : 70));
    }
    // Repli : la requete entiere (mots colles) est une sous-chaine du nom
    // complet (mots colles) -- utile si la coupure en mots ne correspond pas
    // exactement (tirets, apostrophes...).
    if (flatName.includes(variant.replace(/\s+/g, ""))) {
      best = Math.max(best, 60);
    }
  });
  return best;
}

// ===================== RECHERCHE GLOBALE =====================
// Meme moteur que sur dashboard.html / squad.html / club.html / fiche.html :
// le titre de la topbar et la petite barre arrondie a cote de la date
// partagent runGlobalSearch, avec redirection au clic sur un resultat.
let searchDebounceTimer = null;
let headerSearchDocListenerAttached = false;

function initHeaderSearch() {
  wireSearchField("fmSearchInput", "fmSearchDropdown", "fmSearchWrap");
  wireSearchField("fmQuickSearchInput", "fmQuickSearchDropdown", "fmQuickSearchWrap");
}

function wireSearchField(inputId, dropdownId, wrapId) {
  const input = document.getElementById(inputId);
  const dropdown = document.getElementById(dropdownId);
  if (!input || !dropdown) return;

  input.addEventListener("input", () => {
    clearTimeout(searchDebounceTimer);
    const q = input.value.trim();
    if (q.length < 2) {
      dropdown.classList.add("hidden");
      dropdown.innerHTML = "";
      return;
    }
    searchDebounceTimer = setTimeout(() => runGlobalSearch(q, dropdown), 250);
  });

  input.addEventListener("focus", () => {
    if (input.value.trim().length >= 2 && dropdown.innerHTML) dropdown.classList.remove("hidden");
  });

  input.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      input.value = "";
      dropdown.classList.add("hidden");
      dropdown.innerHTML = "";
      input.blur();
    }
  });

  if (!headerSearchDocListenerAttached) {
    document.addEventListener("click", (e) => {
      ["fmSearchWrap", "fmQuickSearchWrap"].forEach(wid => {
        const wrap = document.getElementById(wid);
        const dd = wrap ? wrap.querySelector(".fm-search-dropdown") : null;
        if (wrap && dd && !wrap.contains(e.target)) dd.classList.add("hidden");
      });
    });
    headerSearchDocListenerAttached = true;
  }
}

async function runGlobalSearch(q, dropdown) {
  // Recherche approximative : insensible aux accents et aux abreviations
  // courantes (voir fmMatchScore plus haut). Clubs, competitions et joueurs
  // sont tous filtres cote serveur d'abord (l'API tronque silencieusement
  // au-dela d'un certain nombre de lignes, donc on ne peut pas tout
  // rapatrier pour une table volumineuse), puis reclasses cote client par
  // pertinence + notoriete.
  const words = q.trim().split(/\s+/).filter(Boolean);

  let playerQuery = supabaseClient
    .from("game_players")
    .select("id, nom, poste_brut, game_club_id, reputation_mondiale")
    .eq("game_id", gameId);
  words.forEach(w => { playerQuery = playerQuery.ilike("nom", `%${w}%`); });

  // Un jeu peut compter des dizaines de milliers de clubs (toutes divisions,
  // toutes nations confondues) : impossible de tous les rapatrier pour
  // filtrer cote client, l'API tronque silencieusement au-dela d'un certain
  // nombre de lignes et des clubs pourtant existants (ex: Paris Saint-Germain,
  // Montpellier) pouvaient alors ne jamais apparaitre. On filtre donc cote
  // serveur mot par mot (comme pour les joueurs), avec une requete par
  // variante de recherche (accents/surnoms geres par fmSearchVariants : "psg"
  // lance aussi une recherche sur "paris saint germain", etc.), puis on
  // fusionne et on classe cote client par pertinence + notoriete.
  const clubVariants = fmSearchVariants(q).slice(0, 4);
  const clubQueries = clubVariants.map(variant => {
    const vWords = variant.split(" ").filter(Boolean);
    let query = supabaseClient.from("game_clubs").select("id, nom, club_ref").eq("game_id", gameId);
    vWords.forEach(w => { query = query.ilike("nom", `%${w}%`); });
    return query.limit(40);
  });

  const [
    clubResults,
    { data: allCompetitions, error: competitionsError },
    { data: players, error: playersError },
  ] = await Promise.all([
    Promise.all(clubQueries),
    supabaseClient.from("competitions").select("id, nom, nation, division, tier"), // pas de game_id : table globale (referentiel de competitions), pas clonee par partie
    playerQuery.order("reputation_mondiale", { ascending: false, nullsFirst: false }).limit(20),
  ]);
  clubResults.forEach(r => { if (r.error) console.error(r.error); });
  if (competitionsError) console.error(competitionsError);
  if (playersError) console.error(playersError);

  const clubCandidates = new Map();
  clubResults.forEach(r => { (r.data || []).forEach(c => clubCandidates.set(c.id, c)); });

  const clubsMatched = [...clubCandidates.values()]
    .map(c => ({ ...c, _score: fmMatchScore(c.nom, q) }))
    .filter(c => c._score > 0)
    .sort((a, b) => b._score - a._score || a.nom.localeCompare(b.nom))
    .slice(0, 40);

  let clubReputationByRef = {};
  if (clubsMatched.length > 0) {
    const refs = [...new Set(clubsMatched.map(c => c.club_ref).filter(Boolean))];
    if (refs.length > 0) {
      const { data: repRows } = await supabaseClient.from("clubs").select("id, reputation").in("id", refs);
      (repRows || []).forEach(r => { clubReputationByRef[r.id] = r.reputation; });
    }
  }
  const clubs = clubsMatched
    .sort((a, b) => (b._score - a._score)
      || ((clubReputationByRef[b.club_ref] ?? 0) - (clubReputationByRef[a.club_ref] ?? 0))
      || a.nom.localeCompare(b.nom))
    .slice(0, 6);

  const competitions = (allCompetitions || [])
    .map(c => ({ ...c, _score: fmMatchScore(c.nom, q) }))
    .filter(c => c._score > 0)
    .sort((a, b) => b._score - a._score || ((a.tier ?? 999) - (b.tier ?? 999)) || a.nom.localeCompare(b.nom))
    .slice(0, 6);

  const rankedPlayers = (players || [])
    .map(p => ({ ...p, _score: fmMatchScore(p.nom, q) }))
    .sort((a, b) => (b._score - a._score) || ((b.reputation_mondiale ?? 0) - (a.reputation_mondiale ?? 0)))
    .slice(0, 8);

  // Noms de club recuperes a part (plutot qu'une jointure imbriquee
  // club:game_clubs(nom)) : cette jointure est fragile si la relation FK
  // n'est pas explicite cote Supabase et faisait echouer silencieusement
  // toute la recherche joueurs (aucun resultat, meme pour un nom existant).
  let clubNameById = {};
  if (rankedPlayers.length > 0) {
    const clubIds = [...new Set(rankedPlayers.map(p => p.game_club_id).filter(Boolean))];
    if (clubIds.length > 0) {
      const { data: clubRows } = await supabaseClient
        .from("game_clubs")
        .select("id, nom")
        .in("id", clubIds);
      (clubRows || []).forEach(c => { clubNameById[c.id] = c.nom; });
    }
  }

  const hasClubs = clubs.length > 0;
  const hasCompetitions = competitions.length > 0;
  const hasPlayers = rankedPlayers.length > 0;

  if (!hasClubs && !hasCompetitions && !hasPlayers) {
    dropdown.innerHTML = `<div class="search-empty">Aucun résultat pour "${escapeHtml(q)}"</div>`;
    dropdown.classList.remove("hidden");
    return;
  }

  let html = "";
  if (hasClubs) {
    html += `<div class="search-group-label">Clubs</div>`;
    html += clubs.map(c => `
      <div class="search-result-item" data-type="club" data-id="${c.id}">
        <span class="search-result-icon">🛡️</span>
        <span>${escapeHtml(c.nom)}</span>
      </div>
    `).join("");
  }
  if (hasCompetitions) {
    html += `<div class="search-group-label">Compétitions</div>`;
    html += competitions.map(comp => `
      <div class="search-result-item" data-type="competition" data-id="${comp.id}">
        <span class="search-result-icon">🏆</span>
        <span>
          <div>${escapeHtml(comp.nom)}</div>
          <div class="search-result-sub">${escapeHtml(comp.nation || "-")}${comp.division ? " · " + escapeHtml(comp.division) : ""}</div>
        </span>
      </div>
    `).join("");
  }
  if (hasPlayers) {
    html += `<div class="search-group-label">Joueurs</div>`;
    html += rankedPlayers.map(p => `
      <div class="search-result-item" data-type="player" data-id="${p.id}" data-club="${p.game_club_id ?? ""}">
        <span class="search-result-icon">🧍</span>
        <span>
          <div>${escapeHtml(p.nom)}</div>
          <div class="search-result-sub">${escapeHtml(p.poste_brut || "-")}${clubNameById[p.game_club_id] ? " · " + escapeHtml(clubNameById[p.game_club_id]) : ""}</div>
        </span>
      </div>
    `).join("");
  }

  dropdown.innerHTML = html;
  dropdown.classList.remove("hidden");

  dropdown.querySelectorAll(".search-result-item").forEach(item => {
    item.addEventListener("click", () => {
      const type = item.getAttribute("data-type");
      const id = item.getAttribute("data-id");
      if (type === "club") {
        window.location.href = `club.html?game=${encodeURIComponent(gameId)}&club=${encodeURIComponent(id)}`;
      } else if (type === "competition") {
        window.location.href = `competition.html?game=${encodeURIComponent(gameId)}&competition=${encodeURIComponent(id)}&club=${encodeURIComponent(myClubId || "")}`;
      } else {
        const clubId = item.getAttribute("data-club");
        window.location.href = `fiche.html?game=${encodeURIComponent(gameId)}&club=${encodeURIComponent(clubId)}&player=${encodeURIComponent(id)}`;
      }
    });
  });
}
