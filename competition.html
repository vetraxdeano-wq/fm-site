<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FM Web — Compétition</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #262a33;
    --text: #e8eaed;
    --text-dim: #8b909c;
    --accent: #4ade80;
    --accent-dim: #1f6b42;
    --danger: #ef4444;
    --gold: #fbbf24;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    overflow: hidden;
  }
  button { font-family: inherit; cursor: pointer; border-radius: 8px; font-weight: 600; }

  /* Utilitaire de scroll "natif" : le scroll fonctionne normalement mais la
     barre est fine et discrete plutot que la grosse barre blanche par defaut. */
  .scroll-hide {
    scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.14) transparent;
  }
  .scroll-hide::-webkit-scrollbar { width: 6px; height: 6px; }
  .scroll-hide::-webkit-scrollbar-track { background: transparent; }
  .scroll-hide::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.14); border-radius: 999px; }
  .scroll-hide::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.26); }

  /* ============================================================
     Coquille plein ecran, identique au dashboard : une topbar (fm-header)
     + une sidebar laterale collee au bord + le contenu qui occupe le reste.
     ============================================================ */
  #app { position: fixed; inset: 0; display: flex; flex-direction: column; background: var(--bg); }

  .fm-header {
    display: flex; justify-content: space-between; align-items: center; flex-wrap: nowrap;
    gap: 14px; padding: 12px 22px; flex: 0 0 auto;
    background: linear-gradient(120deg, #4c1116, #7a1620 55%, #9c2430);
    border-bottom: 1px solid rgba(0,0,0,0.3);
  }
  .fm-header .title-block { display: flex; align-items: center; gap: 16px; min-width: 0; }
  .fm-header .back-link {
    color: rgba(255,255,255,0.75); text-decoration: none; font-size: 13px;
    flex-shrink: 0; padding-right: 14px; border-right: 1px solid rgba(255,255,255,0.2);
  }
  .fm-header .back-link:hover { color: #fff; }
  .fm-header .title-block .page-title {
    font-size: 18px; font-weight: 800; letter-spacing: 0.02em; color: #fff; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; max-width: 44vw;
  }
  .fm-header .title-block .manager-line {
    font-size: 12px; color: rgba(255,255,255,0.78); margin-top: 2px; white-space: nowrap;
  }
  .fm-header .right-block { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }

  /* Titre de la topbar transforme en champ de recherche globale
     (clubs + competitions + joueurs) avec suggestions en dessous, comme sur
     dashboard.html / squad.html / club.html / fiche.html. */
  .page-title-wrap { position: relative; min-width: 0; }
  .page-title-input {
    background: transparent; border: none; outline: none; color: #fff;
    font-size: 18px; font-weight: 800; letter-spacing: 0.02em; padding: 2px 0;
    width: 230px; max-width: 40vw; font-family: inherit;
  }
  .page-title-input::placeholder { color: rgba(255,255,255,0.92); font-weight: 800; opacity: 1; }
  .fm-search-dropdown {
    position: absolute; top: calc(100% + 8px); left: 0; min-width: 300px; max-width: 380px;
    background: #14171d; border: 1px solid var(--border); border-radius: 10px;
    box-shadow: 0 12px 32px rgba(0,0,0,0.5); z-index: 200; max-height: 380px; overflow-y: auto;
  }
  .fm-search-dropdown.hidden { display: none !important; }
  .search-group-label {
    padding: 8px 12px 4px; font-size: 10px; text-transform: uppercase;
    letter-spacing: 0.05em; color: var(--text-dim);
  }
  .search-result-item {
    display: flex; align-items: center; gap: 10px; padding: 8px 12px; font-size: 13px;
    color: var(--text); cursor: pointer;
  }
  .search-result-item:hover { background: rgba(251,191,36,0.1); color: var(--gold); }
  .search-result-icon { flex-shrink: 0; font-size: 13px; }
  .search-result-sub { font-size: 11px; color: var(--text-dim); margin-top: 1px; }
  .search-empty { padding: 14px 12px; font-size: 12px; color: var(--text-dim); text-align: center; }

  /* Badge de date (jour/saison), identique aux autres pages. */
  .fm-date-badge {
    background: rgba(0,0,0,0.28); border-radius: 8px; padding: 7px 14px;
    text-align: right; line-height: 1.35; color: #fff; flex-shrink: 0;
  }
  .fm-date-badge .day-num { font-size: 13px; font-weight: 800; white-space: nowrap; }
  .fm-date-badge .season-line { font-size: 11px; color: rgba(255,255,255,0.7); }

  /* Petite barre de recherche arrondie, toujours visible a cote de la date. */
  .fm-quick-search { position: relative; flex-shrink: 0; }
  .fm-quick-search-input {
    width: 158px; max-width: 26vw; background: rgba(0,0,0,0.28); border: 1px solid rgba(255,255,255,0.16);
    border-radius: 999px; color: #fff; font-size: 12.5px; font-family: inherit;
    padding: 8px 14px 8px 30px; outline: none; transition: width 0.15s ease, background 0.15s ease, border-color 0.15s ease;
  }
  .fm-quick-search-input::placeholder { color: rgba(255,255,255,0.55); }
  .fm-quick-search-input:focus { background: rgba(0,0,0,0.42); border-color: rgba(255,255,255,0.34); width: 208px; }
  .fm-quick-search-icon {
    position: absolute; left: 11px; top: 50%; transform: translateY(-50%); font-size: 12px;
    color: rgba(255,255,255,0.6); pointer-events: none;
  }
  .fm-quick-search .fm-search-dropdown { left: auto; right: 0; }
  @media (max-width: 720px) {
    .fm-quick-search-input { width: 34px; padding-left: 30px; color: transparent; cursor: pointer; }
    .fm-quick-search-input::placeholder { color: transparent; }
    .fm-quick-search-input:focus { width: 168px; color: #fff; padding-right: 12px; }
    .fm-quick-search-input:focus::placeholder { color: rgba(255,255,255,0.55); }
  }

  .fm-comp-tag {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; font-weight: 700;
    background: rgba(255,255,255,0.12); color: #fff; border: 1px solid rgba(255,255,255,0.3);
    border-radius: 999px; padding: 5px 12px; flex-shrink: 0; white-space: nowrap;
  }

  .fm-body { flex: 1; display: flex; align-items: stretch; min-height: 0; }

  .fm-sidebar {
    width: 220px; flex-shrink: 0; background: var(--panel); border-right: 1px solid var(--border);
    overflow-y: auto; padding: 10px 0;
  }
  .fm-nav-item {
    display: flex; align-items: center; gap: 12px; padding: 12px 20px; font-size: 13.5px;
    color: var(--text-dim); cursor: pointer; border-left: 3px solid transparent; user-select: none;
  }
  .fm-nav-item:hover { background: rgba(255,255,255,0.03); color: var(--text); }
  .fm-nav-item.active {
    background: rgba(251,191,36,0.08); color: var(--gold); border-left-color: var(--gold); font-weight: 700;
  }
  .fm-nav-icon { width: 18px; text-align: center; flex-shrink: 0; }

  .fm-content-wrap { flex: 1; min-width: 0; min-height: 0; overflow: hidden; padding: 16px 24px; }
  .fm-content {
    width: 100%; height: 100%; display: grid;
    grid-template-columns: 62% 38%; gap: 16px; align-items: stretch;
  }
  .fm-col { display: flex; flex-direction: column; gap: 14px; min-width: 0; height: 100%; min-height: 0; }
  .fm-col .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 16px 18px; flex: 1; min-height: 0; display: flex; flex-direction: column;
  }
  .fm-card-title {
    flex: 0 0 auto; display: flex; justify-content: space-between; align-items: center;
    font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--gold); margin-bottom: 12px;
  }
  .fm-card-title .comp-name { color: var(--text); font-weight: 800; text-transform: none; letter-spacing: 0; font-size: 13.5px; }
  .fm-scroll-area { flex: 1; min-height: 0; overflow-y: auto; }
  .fm-empty { color: var(--text-dim); font-size: 13px; padding: 20px 0; text-align: center; }

  .fm-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .fm-table th {
    position: sticky; top: 0; background: var(--panel);
    text-align: left; color: var(--text-dim); font-weight: 600; font-size: 10.5px;
    text-transform: uppercase; letter-spacing: 0.03em; padding: 6px 7px; border-bottom: 1px solid var(--border);
  }
  .fm-table td { padding: 7px; border-bottom: 1px solid rgba(255,255,255,0.04); }
  .fm-table tr:last-child td { border-bottom: none; }
  .fm-table tr.me td { background: rgba(251,191,36,0.1); }
  .fm-table td.clt { color: var(--text-dim); width: 26px; }
  .fm-table td.num { color: var(--text-dim); text-align: center; width: 30px; }
  .fm-table td.pts { font-weight: 700; text-align: center; width: 34px; }
  .fm-club-link { cursor: pointer; font-weight: 600; display: inline-flex; align-items: center; gap: 7px; }
  .fm-club-link:hover { color: var(--gold); text-decoration: underline; }
  .fm-club-logo { width: 18px; height: 18px; object-fit: contain; flex-shrink: 0; border-radius: 3px; }

  /* Zones de qualification europeenne / relegation : liseret colore a
     gauche de la ligne + tres legere teinte de fond, une couleur par
     competition europeenne (alignee sur les couleurs UEFA habituelles)
     et une couleur dediee pour la releguation. */
  .fm-table tr.zone-euro-1 td:first-child { border-left: 3px solid #3b82f6; }
  .fm-table tr.zone-euro-1 td { background: rgba(59,130,246,0.07); }
  .fm-table tr.zone-euro-2 td:first-child { border-left: 3px solid #f97316; }
  .fm-table tr.zone-euro-2 td { background: rgba(249,115,22,0.07); }
  .fm-table tr.zone-euro-3 td:first-child { border-left: 3px solid #22c55e; }
  .fm-table tr.zone-euro-3 td { background: rgba(34,197,94,0.07); }
  .fm-table tr.zone-releg td:first-child { border-left: 3px solid var(--danger); }
  .fm-table tr.zone-releg td { background: rgba(239,68,68,0.07); }
  .fm-table tr.me.zone-euro-1 td, .fm-table tr.me.zone-euro-2 td,
  .fm-table tr.me.zone-euro-3 td, .fm-table tr.me.zone-releg td { background: rgba(251,191,36,0.12); }

  .fm-standings-legend {
    display: flex; flex-wrap: wrap; gap: 12px; padding: 10px 2px 2px;
    font-size: 11px; color: var(--text-dim); flex: 0 0 auto;
  }
  .fm-standings-legend .legend-item { display: flex; align-items: center; gap: 6px; }
  .fm-standings-legend .legend-dot { width: 9px; height: 9px; border-radius: 2px; flex-shrink: 0; }

  /* ---- Prochains matchs (memes codes couleurs que sur le dashboard) ---- */
  .fm-comp-match-row {
    display: flex; align-items: center; gap: 14px; padding: 10px 0;
    border-bottom: 1px solid rgba(255,255,255,0.04); font-size: 12.5px;
  }
  .fm-comp-match-row:last-child { border-bottom: none; }
  .fm-comp-match-date { width: 60px; flex-shrink: 0; color: var(--text-dim); line-height: 1.3; text-transform: capitalize; }
  .fm-comp-match-date .day { font-weight: 700; color: var(--text); font-size: 13px; display: block; }
  .fm-comp-match-teams { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .fm-comp-match-teams .home, .fm-comp-match-teams .away {
    flex: 1; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer;
  }
  .fm-comp-match-teams .home { text-align: right; }
  .fm-comp-match-teams span.club:hover { color: var(--gold); text-decoration: underline; }
  .fm-comp-match-teams .vs { color: var(--text-dim); font-size: 11px; flex-shrink: 0; }

  /* ---- Coupe nationale : lignes de tableau (tour en cours / historique)
     et lignes de "parcours" du club (memes codes que sur le dashboard). ---- */
  .fm-coupe-fixture-row {
    display: flex; align-items: center; gap: 10px; padding: 8px 0;
    border-bottom: 1px solid rgba(255,255,255,0.04); font-size: 12.5px;
  }
  .fm-coupe-fixture-row:last-child { border-bottom: none; }
  .fm-coupe-fixture-row .teams { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .fm-coupe-fixture-row .teams .club {
    flex: 1; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer;
  }
  .fm-coupe-fixture-row .teams .club.home { text-align: right; }
  .fm-coupe-fixture-row .teams .club:hover { color: var(--gold); text-decoration: underline; }
  .fm-coupe-fixture-row .teams .club.winner { color: var(--accent); }
  .fm-coupe-fixture-row .score {
    flex-shrink: 0; font-weight: 700; font-size: 12px; min-width: 46px; text-align: center;
    color: var(--text-dim);
  }
  .fm-coupe-round-header {
    font-size: 10.5px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em;
    color: var(--gold); padding: 10px 0 4px; border-bottom: 1px solid var(--border); margin-bottom: 2px;
  }
  .fm-coupe-round-header:first-child { padding-top: 0; }
  .fm-coupe-parcours-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.04); font-size: 12.5px; }
  .fm-coupe-parcours-row:last-child { border-bottom: none; }
  .fm-coupe-parcours-row .rnd {
    flex-shrink: 0; width: 46px; font-size: 10px; text-align: center; color: var(--text-dim);
    background: #14171d; border: 1px solid var(--border); border-radius: 5px; padding: 3px 0;
  }
  .fm-coupe-parcours-row .opp { flex: 1; min-width: 0; display: flex; align-items: center; gap: 7px; font-weight: 600; cursor: pointer; }
  .fm-coupe-parcours-row .opp .opp-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fm-coupe-parcours-row .opp:hover { color: var(--gold); text-decoration: underline; }
  .fm-coupe-parcours-row .res {
    flex-shrink: 0; font-size: 10.5px; font-weight: 700; padding: 3px 9px; border-radius: 999px;
    border: 1px solid var(--border); background: #14171d; color: var(--text);
  }
  .fm-coupe-parcours-row .res.win { color: var(--accent); border-color: #2f6b45; background: rgba(74,222,128,0.1); }
  .fm-coupe-parcours-row .res.lose { color: #f87171; border-color: #7a2f2f; background: rgba(248,113,113,0.1); }
  .fm-coupe-parcours-row .res.next { color: var(--gold); border-color: #7a5c0f; background: rgba(251,191,36,0.1); }

  /* ---- Meilleurs buteurs / passeurs ---- */
  .player-row {
    display: flex; align-items: center; gap: 10px; padding: 8px 0;
    border-bottom: 1px solid rgba(255,255,255,0.04); font-size: 13px;
  }
  .player-row:last-child { border-bottom: none; }
  .player-rank { width: 18px; color: var(--text-dim); font-size: 12px; flex-shrink: 0; }
  .player-name { flex: 1; min-width: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .player-club {
    font-size: 11px; color: var(--text-dim); flex-shrink: 0; max-width: 120px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .player-value { font-weight: 700; color: var(--gold); flex-shrink: 0; width: 24px; text-align: right; }

  @media (max-width: 900px) {
    html, body { overflow: auto; }
    #app { position: static; min-height: 100vh; }
    .fm-header { padding: 10px 14px; }
    .fm-header .back-link { display: none; }
    .fm-header .title-block .page-title { max-width: 60vw; }
    .fm-body { flex-direction: column; }
    .fm-sidebar {
      width: 100%; height: auto; flex-shrink: 0; display: flex; overflow-x: auto;
      overflow-y: hidden; padding: 4px; border-right: none; border-bottom: 1px solid var(--border);
    }
    .fm-nav-item { border-left: none; border-bottom: 3px solid transparent; white-space: nowrap; }
    .fm-nav-item.active { border-left-color: transparent; border-bottom-color: var(--gold); }
    .fm-content-wrap { padding: 14px; overflow-y: auto; }
    .fm-content { height: auto; grid-template-columns: 1fr; }
    .fm-col { height: auto; }
    .fm-col .card { flex: none; max-height: 60vh; }
  }
</style>
</head>
<body>

<div id="app">
  <div class="fm-header" id="fmHeader">
    <div class="title-block">
      <a href="#" id="backLink" class="back-link">← Retour au club</a>
      <div class="page-title-wrap" id="fmSearchWrap">
        <input type="text" class="page-title-input" id="fmSearchInput" placeholder="Chargement..." autocomplete="off">
        <div class="fm-search-dropdown hidden" id="fmSearchDropdown"></div>
        <div class="manager-line" id="compSub"></div>
      </div>
    </div>
    <div class="right-block">
      <span class="fm-comp-tag" id="compTag"></span>
      <div class="fm-date-badge" id="fmDateBadge" style="display:none;">
        <div class="day-num" id="fmDateLabel">-</div>
        <div class="season-line" id="fmSeasonLabel">Saison -</div>
      </div>
      <div class="fm-quick-search" id="fmQuickSearchWrap">
        <span class="fm-quick-search-icon">🔎</span>
        <input type="text" class="fm-quick-search-input" id="fmQuickSearchInput" placeholder="Rechercher..." autocomplete="off">
        <div class="fm-search-dropdown hidden" id="fmQuickSearchDropdown"></div>
      </div>
    </div>
  </div>

  <div class="fm-body">
    <div class="fm-sidebar" id="fmSidebar"></div>

    <div class="fm-content-wrap">
      <div class="fm-content">
        <div class="fm-col">
          <div class="card">
            <div class="fm-card-title"><span id="compCard1Title">Classement</span></div>
            <div class="fm-scroll-area scroll-hide" id="compStandings">
              <div class="fm-empty">Chargement...</div>
            </div>
            <div class="fm-standings-legend" id="compStandingsLegend"></div>
          </div>
          <div class="card">
            <div class="fm-card-title"><span id="compCard2Title">Prochains matchs</span> <span class="comp-name" id="compNextJournee"></span></div>
            <div class="fm-scroll-area scroll-hide" id="compNextMatches">
              <div class="fm-empty">Chargement...</div>
            </div>
          </div>
        </div>

        <div class="fm-col">
          <div class="card">
            <div class="fm-card-title"><span id="compCard3Title">Meilleurs buteurs</span></div>
            <div class="fm-scroll-area scroll-hide" id="compTopScorers">
              <div class="fm-empty">Chargement...</div>
            </div>
          </div>
          <div class="card">
            <div class="fm-card-title"><span id="compCard4Title">Meilleurs passeurs</span></div>
            <div class="fm-scroll-area scroll-hide" id="compTopAssists">
              <div class="fm-empty">Chargement...</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://occesdpptttbwwjyuaja.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9jY2VzZHBwdHR0Ynd3anl1YWphIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI5MjQ1MTAsImV4cCI6MjA5ODUwMDUxMH0.iQxZFp1wIs9TzCqC7j-DjEUuxPBqK0Hgp6N_9aq7wss";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const params = new URLSearchParams(window.location.search);
const gameId = params.get("game");
const competitionId = params.get("competition");
const myClubId = params.get("club") ? Number(params.get("club")) : null;

document.getElementById("backLink").href = myClubId
  ? `dashboard.html?game=${encodeURIComponent(gameId)}&club=${encodeURIComponent(myClubId)}&view=competitions`
  : `dashboard.html?game=${encodeURIComponent(gameId)}`;

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str ?? "";
  return div.innerHTML;
}

function goToClub(clubId) {
  window.location.href = `club.html?game=${encodeURIComponent(gameId)}&club=${encodeURIComponent(clubId)}`;
}

// ===================== Badge de date (jour/saison), identique aux autres
// pages : cette page ne chargeait pas encore la partie elle-meme. =====================
function computeRealDate(dateDebut, jourActuel) {
  if (!dateDebut) return null;
  const base = new Date(`${dateDebut}T00:00:00`);
  if (isNaN(base.getTime())) return null;
  const jours = Number(jourActuel);
  base.setDate(base.getDate() + (Number.isFinite(jours) ? jours : 0));
  return base;
}
function formatRealDate(date) {
  if (!date) return null;
  return new Intl.DateTimeFormat("fr-FR", { day: "2-digit", month: "long", year: "numeric" })
    .format(date).toUpperCase();
}
async function loadDateBadge() {
  if (!gameId) return;
  const { data: game } = await supabaseClient
    .from("games")
    .select("date_debut, jour_actuel, saison")
    .eq("id", gameId)
    .single();
  if (!game) return;
  const realDate = computeRealDate(game.date_debut, game.jour_actuel);
  const dateLabel = formatRealDate(realDate) || `Jour ${game.jour_actuel ?? "-"}`;
  document.getElementById("fmDateLabel").textContent = dateLabel;
  document.getElementById("fmSeasonLabel").textContent = `Saison ${game.saison ?? "-"}`;
  document.getElementById("fmDateBadge").style.display = "";
}

// ===================== Sidebar (memes onglets que le dashboard) =====================
// Cette page n'est pas la coquille du dashboard elle-meme : les onglets qui
// ont un sous-ecran dedie sur le dashboard renvoient donc vers
// dashboard.html avec le bon `?view=`, ceux qui ont leur propre page (Effectif,
// Infos club) y renvoient directement. "Compétitions" reste actif ici.

// page (effectif/infos club consultes) ou club du manager connecte (pages
// sans club unique affiche, ex: dashboard, competitions).
async function fmFetchClubColor(gameClubId) {
  if (!gameClubId) return null;
  try {
    const { data } = await supabaseClient
      .from("game_clubs")
      .select("clubs(couleur_dominante)")
      .eq("id", gameClubId)
      .single();
    return data?.clubs?.couleur_dominante || null;
  } catch (e) {
    console.error(e);
    return null;
  }

function fmApplyTopbarColor(color) {
  const header = document.getElementById("fmHeader");
  if (!header) return;
  if (!color || color.h == null) {
    header.style.background = "";
    return;
  }
  const h = Math.round(color.h);
  const s = Math.round(color.s ?? 70);
  const l = Math.round(color.l ?? 40);
  const dark = Math.max(l - 24, 8);
  const bright = Math.min(l + 16, 60);
  header.style.background =
    `linear-gradient(120deg, hsl(${h}, ${s}%, ${dark}%), hsl(${h}, ${s}%, ${l}%) 55%, hsl(${h}, ${Math.max(s - 8, 0)}%, ${bright}%))`;
}

// ===================== MOTEUR DE RECHERCHE APPROXIMATIVE =====================
// Recherche insensible aux accents, aux abreviations et aux surnoms de clubs
// courants ("man city" -> Manchester City, "munich" -> Bayern Munchen, "psg"
// -> Paris Saint-Germain...). Utilise par runGlobalSearch ci-dessous.
function fmNormSearch(s) {
  return (s || "")
    .toString()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .toLowerCase()
    .replace(/[^a-z0-9]+/g, " ")
    .trim();
}

// Paires de termes equivalents (surnoms, traductions, abreviations). Chaque
// paire est bidirectionnelle : chercher l'un des deux termes retrouve aussi
// les noms contenant l'autre.
const FM_SEARCH_ALIASES = [
  ["psg", "paris saint germain"], ["om", "marseille"], ["ol", "lyon"],
  ["asse", "saint etienne"], ["losc", "lille"], ["ogcn", "nice"],
  ["man city", "manchester city"], ["mancity", "manchester city"],
  ["man utd", "manchester united"], ["man u", "manchester united"], ["manu", "manchester united"],
  ["real", "real madrid"], ["atleti", "atletico madrid"], ["atletico", "atletico madrid"],
  ["barca", "barcelone"], ["barca", "barcelona"],
  ["juve", "juventus"], ["inter", "internazionale"], ["milan", "ac milan"],
  ["munich", "munchen"], ["munich", "muenchen"], ["bayern", "bayern munchen"],
  ["psv", "psv eindhoven"], ["dortmund", "borussia dortmund"], ["bvb", "borussia dortmund"],
  ["leverkusen", "bayer leverkusen"], ["spurs", "tottenham"],
];

function fmSearchVariants(q) {
  const base = fmNormSearch(q);
  const variants = new Set([base]);
  FM_SEARCH_ALIASES.forEach(([a, b]) => {
    if (base.includes(a)) variants.add(base.split(a).join(b));
    if (base.includes(b)) variants.add(base.split(b).join(a));
  });
  return [...variants];
}

// Score de correspondance entre un nom (club/competition/joueur) et une
// requete : prefixe de chaque mot dans n'importe quel ordre (gere "man city"
// -> "Manchester City"), acronyme (gere "psg" -> "Paris Saint-Germain"), puis
// repli en sous-chaine simple. 0 = pas de correspondance.
function fmMatchScore(name, query) {
  const normName = fmNormSearch(name);
  if (!normName) return 0;
  const nameWords = normName.split(" ").filter(Boolean);
  const flatName = nameWords.join("");
  const initials = nameWords.map(w => w[0]).join("");
  let best = 0;
  fmSearchVariants(query).forEach(variant => {
    const qWords = variant.split(" ").filter(Boolean);
    if (!qWords.length) return;
    // Acronyme (ex : "psg" -> Paris Saint-Germain).
    if (qWords.length === 1 && qWords[0].length >= 2 && qWords[0] === initials) {
      best = Math.max(best, 90);
    }
    // Chaque mot de la requete doit apparaitre comme sous-chaine dans au
    // moins un mot du nom, peu importe l'ordre : equivalent (en mieux, avec
    // accents/surnoms geres) au filtre ilike mot-par-mot d'origine.
    const allMatch = qWords.every(qw => nameWords.some(nw => nw.includes(qw)));
    if (allMatch) {
      const exact = qWords.every(qw => nameWords.includes(qw));
      const allPrefix = qWords.every(qw => nameWords.some(nw => nw.startsWith(qw)));
      best = Math.max(best, exact ? 100 : (allPrefix ? 85 : 70));
    }
    // Repli : la requete entiere (mots colles) est une sous-chaine du nom
    // complet (mots colles) -- utile si la coupure en mots ne correspond pas
    // exactement (tirets, apostrophes...).
    if (flatName.includes(variant.replace(/\s+/g, ""))) {
      best = Math.max(best, 60);
    }
  });
  return best;
}

// ===================== RECHERCHE GLOBALE =====================
// Meme moteur que sur dashboard.html / squad.html / club.html / fiche.html :
// le titre de la topbar et la petite barre arrondie a cote de la date
// partagent runGlobalSearch, avec redirection au clic sur un resultat.
let searchDebounceTimer = null;
let headerSearchDocListenerAttached = false;

function initHeaderSearch() {
  wireSearchField("fmSearchInput", "fmSearchDropdown", "fmSearchWrap");
  wireSearchField("fmQuickSearchInput", "fmQuickSearchDropdown", "fmQuickSearchWrap");
}

function wireSearchField(inputId, dropdownId, wrapId) {
  const input = document.getElementById(inputId);
  const dropdown = document.getElementById(dropdownId);
  if (!input || !dropdown) return;

  input.addEventListener("input", () => {
    clearTimeout(searchDebounceTimer);
    const q = input.value.trim();
    if (q.length < 2) {
      dropdown.classList.add("hidden");
      dropdown.innerHTML = "";
      return;
    }
    searchDebounceTimer = setTimeout(() => runGlobalSearch(q, dropdown), 250);
  });

  input.addEventListener("focus", () => {
    if (input.value.trim().length >= 2 && dropdown.innerHTML) dropdown.classList.remove("hidden");
  });

  input.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      input.value = "";
      dropdown.classList.add("hidden");
      dropdown.innerHTML = "";
      input.blur();
    }
  });

  if (!headerSearchDocListenerAttached) {
    document.addEventListener("click", (e) => {
      ["fmSearchWrap", "fmQuickSearchWrap"].forEach(wid => {
        const wrap = document.getElementById(wid);
        const dd = wrap ? wrap.querySelector(".fm-search-dropdown") : null;
        if (wrap && dd && !wrap.contains(e.target)) dd.classList.add("hidden");
      });
    });
    headerSearchDocListenerAttached = true;
  }
}

async function runGlobalSearch(q, dropdown) {
  // Recherche approximative : insensible aux accents et aux abreviations
  // courantes (voir fmMatchScore plus haut). Clubs, competitions et joueurs
  // sont tous filtres cote serveur d'abord (l'API tronque silencieusement
  // au-dela d'un certain nombre de lignes, donc on ne peut pas tout
  // rapatrier pour une table volumineuse), puis reclasses cote client par
  // pertinence + notoriete.
  const words = q.trim().split(/\s+/).filter(Boolean);

  let playerQuery = supabaseClient
    .from("game_players")
    .select("id, nom, poste_brut, game_club_id, reputation_mondiale")
    .eq("game_id", gameId);
  words.forEach(w => { playerQuery = playerQuery.ilike("nom", `%${w}%`); });

  // Un jeu peut compter des dizaines de milliers de clubs (toutes divisions,
  // toutes nations confondues) : impossible de tous les rapatrier pour
  // filtrer cote client, l'API tronque silencieusement au-dela d'un certain
  // nombre de lignes et des clubs pourtant existants (ex: Paris Saint-Germain,
  // Montpellier) pouvaient alors ne jamais apparaitre. On filtre donc cote
  // serveur mot par mot (comme pour les joueurs), avec une requete par
  // variante de recherche (accents/surnoms geres par fmSearchVariants : "psg"
  // lance aussi une recherche sur "paris saint germain", etc.), puis on
  // fusionne et on classe cote client par pertinence + notoriete.
  const clubVariants = fmSearchVariants(q).slice(0, 4);
  const clubQueries = clubVariants.map(variant => {
    const vWords = variant.split(" ").filter(Boolean);
    let query = supabaseClient.from("game_clubs").select("id, nom, club_ref").eq("game_id", gameId);
    vWords.forEach(w => { query = query.ilike("nom", `%${w}%`); });
    return query.limit(40);
  });

  const [
    clubResults,
    { data: allCompetitions, error: competitionsError },
    { data: players, error: playersError },
  ] = await Promise.all([
    Promise.all(clubQueries),
    supabaseClient.from("competitions").select("id, nom, nation, division, tier"), // pas de game_id : table globale (referentiel de competitions), pas clonee par partie
    playerQuery.order("reputation_mondiale", { ascending: false, nullsFirst: false }).limit(20),
  ]);
  clubResults.forEach(r => { if (r.error) console.error(r.error); });
  if (competitionsError) console.error(competitionsError);
  if (playersError) console.error(playersError);

  const clubCandidates = new Map();
  clubResults.forEach(r => { (r.data || []).forEach(c => clubCandidates.set(c.id, c)); });

  const clubsMatched = [...clubCandidates.values()]
    .map(c => ({ ...c, _score: fmMatchScore(c.nom, q) }))
    .filter(c => c._score > 0)
    .sort((a, b) => b._score - a._score || a.nom.localeCompare(b.nom))
    .slice(0, 40);

  let clubReputationByRef = {};
  if (clubsMatched.length > 0) {
    const refs = [...new Set(clubsMatched.map(c => c.club_ref).filter(Boolean))];
    if (refs.length > 0) {
      const { data: repRows } = await supabaseClient.from("clubs").select("id, reputation").in("id", refs);
      (repRows || []).forEach(r => { clubReputationByRef[r.id] = r.reputation; });
    }
  }
  const clubs = clubsMatched
    .sort((a, b) => (b._score - a._score)
      || ((clubReputationByRef[b.club_ref] ?? 0) - (clubReputationByRef[a.club_ref] ?? 0))
      || a.nom.localeCompare(b.nom))
    .slice(0, 6);

  const competitions = (allCompetitions || [])
    .map(c => ({ ...c, _score: fmMatchScore(c.nom, q) }))
    .filter(c => c._score > 0)
    .sort((a, b) => b._score - a._score || ((a.tier ?? 999) - (b.tier ?? 999)) || a.nom.localeCompare(b.nom))
    .slice(0, 6);

  const rankedPlayers = (players || [])
    .map(p => ({ ...p, _score: fmMatchScore(p.nom, q) }))
    .sort((a, b) => (b._score - a._score) || ((b.reputation_mondiale ?? 0) - (a.reputation_mondiale ?? 0)))
    .slice(0, 8);

  // Noms de club recuperes a part (plutot qu'une jointure imbriquee
  // club:game_clubs(nom)) : cette jointure est fragile si la relation FK
  // n'est pas explicite cote Supabase et faisait echouer silencieusement
  // toute la recherche joueurs (aucun resultat, meme pour un nom existant).
  let clubNameById = {};
  if (rankedPlayers.length > 0) {
    const clubIds = [...new Set(rankedPlayers.map(p => p.game_club_id).filter(Boolean))];
    if (clubIds.length > 0) {
      const { data: clubRows } = await supabaseClient
        .from("game_clubs")
        .select("id, nom")
        .in("id", clubIds);
      (clubRows || []).forEach(c => { clubNameById[c.id] = c.nom; });
    }
  }

  const hasClubs = clubs.length > 0;
  const hasCompetitions = competitions.length > 0;
  const hasPlayers = rankedPlayers.length > 0;

  if (!hasClubs && !hasCompetitions && !hasPlayers) {
    dropdown.innerHTML = `<div class="search-empty">Aucun résultat pour "${escapeHtml(q)}"</div>`;
    dropdown.classList.remove("hidden");
    return;
  }

  let html = "";
  if (hasClubs) {
    html += `<div class="search-group-label">Clubs</div>`;
    html += clubs.map(c => `
      <div class="search-result-item" data-type="club" data-id="${c.id}">
        <span class="search-result-icon">🛡️</span>
        <span>${escapeHtml(c.nom)}</span>
      </div>
    `).join("");
  }
  if (hasCompetitions) {
    html += `<div class="search-group-label">Compétitions</div>`;
    html += competitions.map(comp => `
      <div class="search-result-item" data-type="competition" data-id="${comp.id}">
        <span class="search-result-icon">🏆</span>
        <span>
          <div>${escapeHtml(comp.nom)}</div>
          <div class="search-result-sub">${escapeHtml(comp.nation || "-")}${comp.division ? " · " + escapeHtml(comp.division) : ""}</div>
        </span>
      </div>
    `).join("");
  }
  if (hasPlayers) {
    html += `<div class="search-group-label">Joueurs</div>`;
    html += rankedPlayers.map(p => `
      <div class="search-result-item" data-type="player" data-id="${p.id}" data-club="${p.game_club_id ?? ""}">
        <span class="search-result-icon">🧍</span>
        <span>
          <div>${escapeHtml(p.nom)}</div>
          <div class="search-result-sub">${escapeHtml(p.poste_brut || "-")}${clubNameById[p.game_club_id] ? " · " + escapeHtml(clubNameById[p.game_club_id]) : ""}</div>
        </span>
      </div>
    `).join("");
  }

  dropdown.innerHTML = html;
  dropdown.classList.remove("hidden");

  dropdown.querySelectorAll(".search-result-item").forEach(item => {
    item.addEventListener("click", () => {
      const type = item.getAttribute("data-type");
      const id = item.getAttribute("data-id");
      if (type === "club") {
        window.location.href = `club.html?game=${encodeURIComponent(gameId)}&club=${encodeURIComponent(id)}`;
      } else if (type === "competition") {
        window.location.href = `competition.html?game=${encodeURIComponent(gameId)}&competition=${encodeURIComponent(id)}&club=${encodeURIComponent(myClubId || "")}`;
      } else {
        const clubId = item.getAttribute("data-club");
        window.location.href = `fiche.html?game=${encodeURIComponent(gameId)}&club=${encodeURIComponent(clubId)}&player=${encodeURIComponent(id)}`;
      }
    });
  });
}

// ===================== Coupe nationale : pas de classement (elimination
// directe), on affiche a la place le tableau du tour en cours, le prochain
// match du club suivi, son parcours et l'historique des tours precedents. =====================
function isRowPlayed(r) { return r.statut === "termine"; }

function coupeRoundLabelPage(tour, nbTours) {
  if (!nbTours) return `Tour ${tour}`;
  const NAMES = { 0: "Finale", 1: "Demi-finale", 2: "Quart de finale", 3: "8e de finale", 4: "16e de finale", 5: "32e de finale", 6: "64e de finale", 7: "128e de finale" };
  return NAMES[nbTours - tour] || `Tour ${tour}`;
}
function coupeRoundShortPage(tour, nbTours) {
  if (!nbTours) return `T${tour}`;
  const SHORT = { 0: "Finale", 1: "1/2", 2: "1/4", 3: "1/8", 4: "1/16", 5: "1/32", 6: "1/64", 7: "1/128" };
  return SHORT[nbTours - tour] || `T${tour}`;
}

function fixtureRowHtml(r, nameById, logoById, opts = {}) {
  const homeName = nameById[r.game_club_id_1] || "?";
  const awayName = nameById[r.game_club_id_2] || "?";
  const homeLogo = logoById[r.game_club_id_1];
  const awayLogo = logoById[r.game_club_id_2];
  const played = isRowPlayed(r);
  let scoreHtml;
  if (played) {
    let scoreText = `${r.score_1 ?? "-"}-${r.score_2 ?? "-"}`;
    if (r.tab_penalty_1 != null) scoreText += ` (tab ${r.tab_penalty_1}-${r.tab_penalty_2})`;
    scoreHtml = scoreText;
  } else {
    const d = r.date_match ? new Date(r.date_match) : null;
    scoreHtml = d ? d.toLocaleDateString("fr-FR", { day: "2-digit", month: "2-digit" }) : "à venir";
  }
  const homeWin = played && r.game_club_vainqueur_id === r.game_club_id_1;
  const awayWin = played && r.game_club_vainqueur_id === r.game_club_id_2;
  return `
    <div class="fm-coupe-fixture-row">
      ${opts.label ? `<div class="fm-comp-match-date">${escapeHtml(opts.label)}</div>` : ""}
      <div class="teams">
        <span class="club home ${homeWin ? "winner" : ""}" data-club-id="${r.game_club_id_1}">
          ${homeLogo ? `<img class="fm-club-logo" src="${escapeHtml(homeLogo)}" alt="">` : ""}${escapeHtml(homeName)}
        </span>
        <span class="score">${scoreHtml}</span>
        <span class="club away ${awayWin ? "winner" : ""}" data-club-id="${r.game_club_id_2}">
          ${escapeHtml(awayName)}${awayLogo ? `<img class="fm-club-logo" src="${escapeHtml(awayLogo)}" alt="">` : ""}
        </span>
      </div>
    </div>
  `;
}
function bindFixtureClicks(container) {
  container.querySelectorAll(".club[data-club-id]").forEach(el => {
    el.addEventListener("click", () => goToClub(el.getAttribute("data-club-id")));
  });
}

function parcoursRowHtml(r, clubIdNum, nameById, logoById, nbTours) {
  const isSide1 = r.game_club_id_1 === clubIdNum;
  const oppId = isSide1 ? r.game_club_id_2 : r.game_club_id_1;
  const oppLogo = logoById[oppId];
  const played = isRowPlayed(r);
  let resHtml;
  if (!played) {
    resHtml = `<span class="res next">à venir</span>`;
  } else {
    const won = r.game_club_vainqueur_id === clubIdNum;
    const myScore = isSide1 ? r.score_1 : r.score_2;
    const oppScore = isSide1 ? r.score_2 : r.score_1;
    let scoreText = `${myScore}-${oppScore}`;
    const myPen = isSide1 ? r.tab_penalty_1 : r.tab_penalty_2;
    const oppPen = isSide1 ? r.tab_penalty_2 : r.tab_penalty_1;
    if (myPen != null) scoreText += ` (tab ${myPen}-${oppPen})`;
    resHtml = `<span class="res ${won ? "win" : "lose"}">${scoreText}</span>`;
  }
  return `
    <div class="fm-coupe-parcours-row">
      <span class="rnd" title="${escapeHtml(coupeRoundLabelPage(r.tour, nbTours))}">${escapeHtml(coupeRoundShortPage(r.tour, nbTours))}</span>
      <span class="opp" data-club-id="${oppId}">
        ${oppLogo ? `<img class="fm-club-logo" src="${escapeHtml(oppLogo)}" alt="">` : ""}
        <span class="opp-name">${escapeHtml(nameById[oppId] || "?")}</span>
      </span>
      ${resHtml}
    </div>
  `;
}
function bindParcoursClicks(container) {
  container.querySelectorAll(".opp[data-club-id]").forEach(el => {
    el.addEventListener("click", () => goToClub(el.getAttribute("data-club-id")));
  });
}

async function loadCoupeNationale(comp) {
  // On s'appuie sur la saison en cours de la partie (table games) plutot
  // que sur la saison la plus "haute" de la table de config : celle-ci
  // contient aussi des tirages d'autres saisons (passees ou de test) avec
  // des dates sans rapport avec la partie en cours (ex. saison "gabarit"
  // tres loin dans le futur), qui fausseraient tout l'affichage.
  const { data: gameRow } = await supabaseClient
    .from("games")
    .select("saison")
    .eq("id", gameId)
    .maybeSingle();
  const currentSaison = gameRow?.saison ?? null;

  let configQuery = supabaseClient
    .from("game_coupe_nationale_config")
    .select("saison, nb_tours")
    .eq("game_id", gameId)
    .eq("competition_ref", comp.id);
  configQuery = currentSaison != null
    ? configQuery.eq("saison", currentSaison)
    : configQuery.order("saison", { ascending: false }).limit(1);
  const { data: config } = await configQuery.maybeSingle();
  const nbTours = config?.nb_tours || null;
  const saison = config?.saison ?? currentSaison;

  let rowsQuery = supabaseClient
    .from("game_coupe_nationale_tours")
    .select("id, tour, game_club_id_1, game_club_id_2, date_match, score_1, score_2, tab_penalty_1, tab_penalty_2, game_club_vainqueur_id, statut")
    .eq("game_id", gameId)
    .eq("competition_ref", comp.id)
    .order("tour", { ascending: true });
  if (saison != null) rowsQuery = rowsQuery.eq("saison", saison);
  const { data: rows } = await rowsQuery;
  const allRows = rows || [];

  document.getElementById("compStandingsLegend").innerHTML = "";
  document.getElementById("compNextJournee").textContent = "";

  if (allRows.length === 0) {
    document.getElementById("compCard1Title").textContent = "Tableau";
    document.getElementById("compStandings").innerHTML = `<div class="fm-empty">Le tirage n'a pas encore eu lieu.</div>`;
    document.getElementById("compCard2Title").textContent = "Prochain match";
    document.getElementById("compNextMatches").innerHTML = `<div class="fm-empty">Aucun match programmé.</div>`;
    document.getElementById("compCard3Title").textContent = "Votre parcours";
    document.getElementById("compTopScorers").innerHTML = `<div class="fm-empty">Pas encore entré en lice dans la compétition.</div>`;
    document.getElementById("compCard4Title").textContent = "Tours précédents";
    document.getElementById("compTopAssists").innerHTML = `<div class="fm-empty">Aucun résultat pour l'instant.</div>`;
    return;
  }

  // Ecarte les "byes" (qualification d'office, game_club_id_1 = game_club_id_2)
  // de l'affichage : ce n'est pas un vrai match.
  const realRows = allRows.filter(r => r.game_club_id_1 !== r.game_club_id_2);
  const clubIds = [...new Set(realRows.flatMap(r => [r.game_club_id_1, r.game_club_id_2]))];
  const { data: clubsData } = await supabaseClient
    .from("game_clubs")
    .select("id, nom, clubs(logo_url)")
    .in("id", clubIds.length ? clubIds : [0]);
  const nameById = {};
  const logoById = {};
  (clubsData || []).forEach(c => { nameById[c.id] = c.nom; logoById[c.id] = c.clubs?.logo_url || null; });

  document.getElementById("compSub").textContent = `${comp.nation}${nbTours ? ` · ${nbTours} tours` : ""}`;

  const currentTour = Math.max(...allRows.map(r => r.tour));
  const currentTourRows = realRows.filter(r => r.tour === currentTour);

  // ---- Tableau du tour en cours (remplace le classement, sans objet en
  // coupe puisque c'est de l'élimination directe) ----
  document.getElementById("compCard1Title").textContent = `Tableau — ${coupeRoundLabelPage(currentTour, nbTours)}`;
  document.getElementById("compStandings").innerHTML = currentTourRows.length
    ? currentTourRows.map(r => fixtureRowHtml(r, nameById, logoById)).join("")
    : `<div class="fm-empty">Aucune affiche pour ce tour.</div>`;
  bindFixtureClicks(document.getElementById("compStandings"));

  // ---- Prochain match : celui du club suivi si on en a un, sinon les
  // affiches restantes du tour en cours ----
  document.getElementById("compCard2Title").textContent = "Prochain match";
  if (myClubId) {
    const myUpcoming = realRows.find(r => !isRowPlayed(r) && (r.game_club_id_1 === myClubId || r.game_club_id_2 === myClubId));
    document.getElementById("compNextMatches").innerHTML = myUpcoming
      ? fixtureRowHtml(myUpcoming, nameById, logoById, { label: coupeRoundLabelPage(myUpcoming.tour, nbTours) })
      : `<div class="fm-empty">Aucun match à venir pour ce club.</div>`;
  } else {
    const anyUpcoming = currentTourRows.filter(r => !isRowPlayed(r));
    document.getElementById("compNextMatches").innerHTML = anyUpcoming.length
      ? anyUpcoming.map(r => fixtureRowHtml(r, nameById, logoById)).join("")
      : `<div class="fm-empty">Aucun match à venir programmé.</div>`;
  }
  bindFixtureClicks(document.getElementById("compNextMatches"));

  // ---- Parcours du club suivi (round par round), ou a defaut les
  // derniers resultats de la competition ----
  if (myClubId) {
    document.getElementById("compCard3Title").textContent = "Votre parcours";
    const myRows = realRows.filter(r => r.game_club_id_1 === myClubId || r.game_club_id_2 === myClubId).sort((a, b) => a.tour - b.tour);
    document.getElementById("compTopScorers").innerHTML = myRows.length
      ? myRows.map(r => parcoursRowHtml(r, myClubId, nameById, logoById, nbTours)).join("")
      : `<div class="fm-empty">Ce club ne participe pas à la compétition cette saison.</div>`;
    bindParcoursClicks(document.getElementById("compTopScorers"));
  } else {
    document.getElementById("compCard3Title").textContent = "Derniers résultats";
    const played = realRows.filter(isRowPlayed).sort((a, b) => b.tour - a.tour);
    document.getElementById("compTopScorers").innerHTML = played.length
      ? played.slice(0, 30).map(r => fixtureRowHtml(r, nameById, logoById)).join("")
      : `<div class="fm-empty">Aucun résultat pour l'instant.</div>`;
    bindFixtureClicks(document.getElementById("compTopScorers"));
  }

  // ---- Historique des tours precedents (bracket-lite : un en-tete par
  // tour, du plus recent au plus ancien) ----
  document.getElementById("compCard4Title").textContent = "Tours précédents";
  const previousTours = [...new Set(realRows.filter(r => r.tour !== currentTour).map(r => r.tour))].sort((a, b) => b - a);
  document.getElementById("compTopAssists").innerHTML = previousTours.length
    ? previousTours.map(t => `
        <div class="fm-coupe-round-header">${escapeHtml(coupeRoundLabelPage(t, nbTours))}</div>
        ${realRows.filter(r => r.tour === t).map(r => fixtureRowHtml(r, nameById, logoById)).join("")}
      `).join("")
    : `<div class="fm-empty">Pas encore de tour précédent.</div>`;
  bindFixtureClicks(document.getElementById("compTopAssists"));
}

async function loadCompetition() {
  if (!gameId || !competitionId) {
    document.getElementById("fmSearchInput").placeholder = "Compétition introuvable";
    return;
  }

  const { data: comp, error: compError } = await supabaseClient
    .from("competitions")
    .select("id, nom, nation, division, tier, nb_clubs, type")
    .eq("id", competitionId)
    .single();

  if (compError || !comp) {
    document.getElementById("fmSearchInput").placeholder = "Compétition introuvable";
    return;
  }

  document.getElementById("fmSearchInput").placeholder = comp.nom;
  document.getElementById("compTag").textContent = comp.type === "championnat" ? "Championnat" : comp.type === "coupe_nationale" ? "Coupe nationale" : comp.type;
  document.title = `FM Web — ${comp.nom}`;

  if (comp.type === "coupe_nationale") {
    document.getElementById("compSub").textContent = comp.nation;
    await loadCoupeNationale(comp);
    return;
  }

  document.getElementById("compSub").textContent = `${comp.nation} · ${comp.division}`;

  // Clubs de la division (nom + classement/points via la vue, stats detaillees via game_clubs)
  const { data: overview, error: overviewError } = await supabaseClient
    .from("game_club_overview")
    .select("game_club_id, nom, classement")
    .eq("game_id", gameId)
    .eq("nation", comp.nation)
    .eq("division", comp.division);

  if (overviewError || !overview || overview.length === 0) {
    document.getElementById("compStandings").innerHTML = `<div class="fm-empty">Impossible de charger le classement.</div>`;
    document.getElementById("compNextMatches").innerHTML = "";
    document.getElementById("compTopScorers").innerHTML = "";
    document.getElementById("compTopAssists").innerHTML = "";
    return;
  }

  const clubIds = overview.map(c => c.game_club_id);
  const nameById = {};
  overview.forEach(c => { nameById[c.game_club_id] = c.nom; });

  const { data: fullStats } = await supabaseClient
    .from("game_clubs")
    .select("id, classement, points, victoires, nuls, defaites, buts_pour, buts_contre, clubs(logo_url)")
    .in("id", clubIds);

  const statsById = {};
  const logoById = {};
  (fullStats || []).forEach(c => {
    statsById[c.id] = c;
    logoById[c.id] = c.clubs?.logo_url || null;
  });

  const sorted = clubIds.slice().sort((a, b) => {
    const sa = statsById[a] || {};
    const sb = statsById[b] || {};
    if (sa.classement != null && sb.classement != null) return sa.classement - sb.classement;
    if ((sb.points ?? 0) !== (sa.points ?? 0)) return (sb.points ?? 0) - (sa.points ?? 0);
    const diffA = (sa.buts_pour ?? 0) - (sa.buts_contre ?? 0);
    const diffB = (sb.buts_pour ?? 0) - (sb.buts_contre ?? 0);
    if (diffB !== diffA) return diffB - diffA;
    return (sb.buts_pour ?? 0) - (sa.buts_pour ?? 0);
  });

  // Zones qualificatives europeennes (une seule par competition europeenne,
  // couleur alignee UEFA) : seule l'elite (tier 1) de chaque nation qualifie
  // pour l'Europe. On s'appuie d'abord sur les places evolutives propres a
  // la partie (game_places_europeennes), sinon sur la baseline reelle
  // (classement_uefa_places) tant que le coefficient evolutif n'est pas
  // encore simule pour cette nation.
  let euroZones = [];
  if (comp.tier === 1) {
    let placesRows = [];
    const { data: gamePlaces } = await supabaseClient
      .from("game_places_europeennes")
      .select("coupe_europe_ref, phase, nb_places, saison")
      .eq("game_id", gameId)
      .eq("nation", comp.nation);
    if (gamePlaces && gamePlaces.length > 0) {
      const derniereSaison = Math.max(...gamePlaces.map(r => r.saison));
      placesRows = gamePlaces.filter(r => r.saison === derniereSaison);
    } else {
      const { data: basePlaces } = await supabaseClient
        .from("classement_uefa_places")
        .select("coupe_europe_ref, phase, nb_places")
        .eq("nation", comp.nation);
      placesRows = basePlaces || [];
    }

    if (placesRows.length > 0) {
      const slotsByCoupe = {};
      placesRows.forEach(r => {
        slotsByCoupe[r.coupe_europe_ref] = (slotsByCoupe[r.coupe_europe_ref] || 0) + (r.nb_places || 0);
      });
      const coupeIds = Object.keys(slotsByCoupe);
      const { data: coupes } = await supabaseClient
        .from("competitions")
        .select("id, nom, tier")
        .in("id", coupeIds);
      const EURO_COLORS = { 1: "zone-euro-1", 2: "zone-euro-2", 3: "zone-euro-3" };
      const ordered = (coupes || []).slice().sort((a, b) => a.tier - b.tier);
      let cursor = 1;
      euroZones = ordered.map(c => {
        const nb = slotsByCoupe[c.id] || 0;
        const zone = { startRank: cursor, endRank: cursor + nb - 1, colorClass: EURO_COLORS[c.tier] || "zone-euro-3", label: c.nom };
        cursor += nb;
        return zone;
      }).filter(z => z.endRank >= z.startRank);
    }
  }

  // Zone de relegation : les nb_relegation derniers du classement.
  const nbRelegation = comp.nb_relegation || 0;
  const releguable = nbRelegation > 0
    ? { startRank: sorted.length - nbRelegation + 1, endRank: sorted.length }
    : null;

  const zoneClassForRank = (rank) => {
    const euro = euroZones.find(z => rank >= z.startRank && rank <= z.endRank);
    if (euro) return euro.colorClass;
    if (releguable && rank >= releguable.startRank && rank <= releguable.endRank) return "zone-releg";
    return "";
  };

  document.getElementById("compStandings").innerHTML = `
    <table class="fm-table">
      <thead>
        <tr>
          <th>Clt</th><th>Club</th><th>J</th><th>V</th><th>N</th><th>D</th>
          <th>BP</th><th>BC</th><th>Diff</th><th>Pts</th>
        </tr>
      </thead>
      <tbody>
        ${sorted.map((id, i) => {
          const s = statsById[id] || {};
          const rank = s.classement ?? (i + 1);
          const joues = (s.victoires ?? 0) + (s.nuls ?? 0) + (s.defaites ?? 0);
          const diff = (s.buts_pour ?? 0) - (s.buts_contre ?? 0);
          const logo = logoById[id];
          const rowClasses = [id === myClubId ? "me" : "", zoneClassForRank(rank)].filter(Boolean).join(" ");
          return `
            <tr class="${rowClasses}">
              <td class="clt">${rank}e</td>
              <td>
                <span class="fm-club-link" data-club-id="${id}">
                  ${logo ? `<img class="fm-club-logo" src="${escapeHtml(logo)}" alt="">` : ""}
                  ${escapeHtml(nameById[id])}
                </span>
              </td>
              <td class="num">${joues}</td>
              <td class="num">${s.victoires ?? 0}</td>
              <td class="num">${s.nuls ?? 0}</td>
              <td class="num">${s.defaites ?? 0}</td>
              <td class="num">${s.buts_pour ?? 0}</td>
              <td class="num">${s.buts_contre ?? 0}</td>
              <td class="num">${diff >= 0 ? "+" : ""}${diff}</td>
              <td class="pts">${s.points ?? 0}</td>
            </tr>
          `;
        }).join("")}
      </tbody>
    </table>
  `;
  document.querySelectorAll("#compStandings .fm-club-link").forEach(el => {
    el.addEventListener("click", () => goToClub(el.getAttribute("data-club-id")));
  });

  const legendItems = euroZones.map(z => `
    <span class="legend-item"><span class="legend-dot" style="background:${
      z.colorClass === "zone-euro-1" ? "#3b82f6" : z.colorClass === "zone-euro-2" ? "#f97316" : "#22c55e"
    };"></span>${escapeHtml(z.label)}</span>
  `);
  if (releguable) {
    legendItems.push(`<span class="legend-item"><span class="legend-dot" style="background:var(--danger);"></span>Relégation</span>`);
  }
  document.getElementById("compStandingsLegend").innerHTML = legendItems.join("");

  // Prochains matchs : la prochaine journee non jouee de la competition
  const { data: upcoming } = await supabaseClient
    .from("calendrier")
    .select("id, date_match, journee, club_domicile_id, club_exterieur_id")
    .eq("game_id", gameId)
    .eq("nation", comp.nation)
    .eq("division", comp.division)
    .eq("statut", "a_jouer")
    .order("date_match", { ascending: true })
    .order("journee", { ascending: true });

  const nextMatchesEl = document.getElementById("compNextMatches");
  if (!upcoming || upcoming.length === 0) {
    document.getElementById("compNextJournee").textContent = "";
    nextMatchesEl.innerHTML = `<div class="fm-empty">Aucun match à venir programmé.</div>`;
  } else {
    const nextJournee = upcoming[0].journee;
    document.getElementById("compNextJournee").textContent = `Journée ${nextJournee}`;
    const journeeMatches = upcoming.filter(m => m.journee === nextJournee);
    nextMatchesEl.innerHTML = journeeMatches.map(m => {
      const d = m.date_match ? new Date(m.date_match) : null;
      const dateLabel = d ? d.toLocaleDateString("fr-FR", { weekday: "short", day: "2-digit", month: "2-digit" }).replace(".", "") : "-";
      return `
        <div class="fm-comp-match-row">
          <div class="fm-comp-match-date">${dateLabel}</div>
          <div class="fm-comp-match-teams">
            <span class="home"><span class="club" data-club-id="${m.club_domicile_id}">${escapeHtml(nameById[m.club_domicile_id] || "?")}</span></span>
            <span class="vs">vs</span>
            <span class="away"><span class="club" data-club-id="${m.club_exterieur_id}">${escapeHtml(nameById[m.club_exterieur_id] || "?")}</span></span>
          </div>
        </div>
      `;
    }).join("");
    nextMatchesEl.querySelectorAll(".club").forEach(el => {
      el.addEventListener("click", () => goToClub(el.getAttribute("data-club-id")));
    });
  }

  // Meilleurs buteurs / passeurs de la competition
  const { data: players } = await supabaseClient
    .from("game_players")
    .select("id, nom, game_club_id, buts_saison, passes_decisives_saison, poste_brut")
    .eq("game_id", gameId)
    .in("game_club_id", clubIds);

  const topScorersEl = document.getElementById("compTopScorers");
  const topAssistsEl = document.getElementById("compTopAssists");

  if (!players || players.length === 0) {
    topScorersEl.innerHTML = `<div class="fm-empty">Pas encore de données.</div>`;
    topAssistsEl.innerHTML = `<div class="fm-empty">Pas encore de données.</div>`;
    return;
  }

  const topScorers = players.slice().sort((a, b) => (b.buts_saison ?? 0) - (a.buts_saison ?? 0)).slice(0, 15);
  const topAssists = players.slice().sort((a, b) => (b.passes_decisives_saison ?? 0) - (a.passes_decisives_saison ?? 0)).slice(0, 15);

  const renderPlayerList = (list, valueKey) => list.map((p, i) => `
    <div class="player-row">
      <span class="player-rank">${i + 1}</span>
      <span class="player-name">${escapeHtml(p.nom)}</span>
      <span class="player-club">${escapeHtml(nameById[p.game_club_id] || "")}</span>
      <span class="player-value">${p[valueKey] ?? 0}</span>
    </div>
  `).join("");

  topScorersEl.innerHTML = topScorers.every(p => !p.buts_saison)
    ? `<div class="fm-empty">Aucun but marqué pour l'instant.</div>`
    : renderPlayerList(topScorers, "buts_saison");

  topAssistsEl.innerHTML = topAssists.every(p => !p.passes_decisives_saison)
    ? `<div class="fm-empty">Aucune passe décisive pour l'instant.</div>`
    : renderPlayerList(topAssists, "passes_decisives_saison");
}

loadCompetition();
</script>
