// ===================== Popup "bracket complet" (coupe nationale) =====================
function closeBracketModal() { document.getElementById("fmBracketModal").classList.add("hidden"); }
document.getElementById("fmBracketClose").addEventListener("click", closeBracketModal);
document.getElementById("fmBracketModal").addEventListener("click", (e) => {
  if (e.target.id === "fmBracketModal") closeBracketModal();
});

function openBracketModal(realRows, nbTours, nameById, logoById) {
  const body = document.getElementById("fmBracketBody");

  if (!realRows.length) {
    body.innerHTML = `<div class="fm-empty">Le tirage n'a pas encore eu lieu.</div>`;
    document.getElementById("fmBracketModal").classList.remove("hidden");
    return;
  }

  const CARD_H = 52, CARD_VGAP = 16, COL_W = 204, COL_GAP = 68;

  const tours = [...new Set(realRows.map(r => r.tour))].sort((a, b) => a - b);
  const rowsByTour = {};
  tours.forEach(t => { rowsByTour[t] = realRows.filter(r => r.tour === t); });

  // Retrouve, pour un club et un tour donnes, le match reel le plus recent
  // (a un tour strictement anterieur) ou ce club apparait deja - gagnant ou
  // simple participant. Permet de retomber sur ses pieds meme quand un ou
  // plusieurs tours ont ete "sautes" via une qualification d'office (bye).
  function findSource(clubId, beforeTour) {
    for (let i = tours.length - 1; i >= 0; i--) {
      const t = tours[i];
      if (t >= beforeTour) continue;
      const match = rowsByTour[t].find(r => r.game_club_id_1 === clubId || r.game_club_id_2 === clubId);
      if (match) return match;
    }
    return null;
  }

  // Pour chaque match, ses deux matches "source" (dont le vainqueur alimente
  // l'une de ses deux places).
  realRows.forEach(r => {
    r._src1 = findSource(r.game_club_id_1, r.tour);
    r._src2 = findSource(r.game_club_id_2, r.tour);
  });

  // Ordre visuel de chaque tour, calcule en partant de la finale pour
  // regrouper cote a cote les matches qui s'affrontent ensuite au tour
  // suivant (comme un vrai tableau a elimination directe).
  const orderByTour = {};
  for (let i = tours.length - 1; i >= 0; i--) {
    const t = tours[i];
    if (i === tours.length - 1) {
      orderByTour[t] = [...rowsByTour[t]].sort((a, b) => a.id - b.id);
      continue;
    }
    const parentOrder = orderByTour[tours[i + 1]];
    const placed = new Set();
    const order = [];
    parentOrder.forEach(p => {
      [p._src1, p._src2].forEach(src => {
        if (src && src.tour === t && !placed.has(src.id)) { order.push(src); placed.add(src.id); }
      });
    });
    rowsByTour[t].forEach(r => { if (!placed.has(r.id)) { order.push(r); placed.add(r.id); } });
    orderByTour[t] = order;
  }

  // Position verticale (centre, en px) de chaque match : premier tour espace
  // regulierement, tours suivants centres sur la moyenne de leurs sources.
  const centerY = {};
  const colIndexByTour = {};
  tours.forEach((t, c) => { colIndexByTour[t] = c; });

  tours.forEach((t, c) => {
    const order = orderByTour[t];
    if (c === 0) {
      order.forEach((r, i) => { centerY[r.id] = i * (CARD_H + CARD_VGAP) + CARD_H / 2; });
      return;
    }
    let fallbackCursor = 0;
    const raw = order.map(r => {
      const ys = [r._src1, r._src2].filter(s => s && centerY[s.id] !== undefined).map(s => centerY[s.id]);
      let y;
      if (ys.length) { y = ys.reduce((a, b) => a + b, 0) / ys.length; }
      else { y = fallbackCursor; fallbackCursor += (CARD_H + CARD_VGAP); }
      return { r, y };
    });
    raw.sort((a, b) => a.y - b.y);
    for (let i = 1; i < raw.length; i++) {
      const minY = raw[i - 1].y + CARD_H + CARD_VGAP;
      if (raw[i].y < minY) raw[i].y = minY;
    }
    raw.forEach(({ r, y }) => { centerY[r.id] = y; });
  });

  const colHeight = Math.max(...Object.values(centerY)) + CARD_H / 2 + 8;
  const totalWidth = tours.length * COL_W + (tours.length - 1) * COL_GAP;

  const bsideHtml = (clubId, score, isWin) => `
    <div class="bside ${isWin ? "win" : ""}" data-club-id="${clubId}">
      ${logoById[clubId] ? `<img src="${escapeHtml(logoById[clubId])}" alt="">` : ""}
      <span class="bname">${escapeHtml(nameById[clubId] || "?")}</span>
      <span class="bscore">${score}</span>
    </div>
  `;

  const isMineRow = r => !!(myClubId && (r.game_club_id_1 === myClubId || r.game_club_id_2 === myClubId));

  const titlesHtml = tours.map(t => `<div class="fm-bracket-col-title" style="width:${COL_W}px;">${escapeHtml(coupeRoundLabelPage(t, nbTours))}</div>`).join("");

  const colsHtml = tours.map(t => {
    const matchesHtml = orderByTour[t].map(r => {
      const played = isRowPlayed(r);
      const homeWin = played && r.game_club_vainqueur_id === r.game_club_id_1;
      const awayWin = played && r.game_club_vainqueur_id === r.game_club_id_2;
      const s1 = played ? (r.score_1 ?? "-") : "-";
      const s2 = played ? (r.score_2 ?? "-") : "-";
      const top = centerY[r.id] - CARD_H / 2;
      return `<div class="fm-bracket-match ${isMineRow(r) ? "mine" : ""}" style="top:${top}px; height:${CARD_H}px;">${bsideHtml(r.game_club_id_1, s1, homeWin)}${bsideHtml(r.game_club_id_2, s2, awayWin)}</div>`;
    }).join("");
    return `<div class="fm-bracket-col-body" style="width:${COL_W}px; height:${colHeight}px;">${matchesHtml}</div>`;
  }).join("");

  let linesHtml = "";
  realRows.forEach(r => {
    [r._src1, r._src2].forEach(src => {
      if (!src || centerY[src.id] === undefined || centerY[r.id] === undefined) return;
      const x1 = colIndexByTour[src.tour] * (COL_W + COL_GAP) + COL_W;
      const y1 = centerY[src.id];
      const x2 = colIndexByTour[r.tour] * (COL_W + COL_GAP);
      const y2 = centerY[r.id];
      const midX = (x1 + x2) / 2;
      const mine = myClubId && (
        src.game_club_vainqueur_id === myClubId ||
        (!isRowPlayed(src) && isMineRow(src))
      );
      linesHtml += `<path d="M${x1},${y1} H${midX} V${y2} H${x2}" class="fm-bracket-link ${mine ? "mine" : ""}" />`;
    });
  });

  body.innerHTML = `
    <div class="fm-bracket-titles" style="gap:${COL_GAP}px;">${titlesHtml}</div>
    <div class="fm-bracket-wrap" style="gap:${COL_GAP}px; height:${colHeight}px;">
      <svg class="fm-bracket-svg" width="${totalWidth}" height="${colHeight}">${linesHtml}</svg>
      ${colsHtml}
    </div>
  `;
  body.querySelectorAll(".bside[data-club-id]").forEach(el => {
    el.addEventListener("click", () => goToClub(el.getAttribute("data-club-id")));
  });
  document.getElementById("fmBracketModal").classList.remove("hidden");
}

// ===================== Historique / palmarès =====================
// S'appuie sur game_saison_bilan (une ligne par saison + competition_ref
// deja jouee jusqu'au bout, remplie en fin de saison in-game) : vainqueur,
// meilleur buteur et meilleur passeur de la saison pour cette competition.
async function loadHistorique(comp) {
  const el = document.getElementById("fmHistoryList");
  el.innerHTML = `<div class="fm-empty">Chargement...</div>`;

  const { data, error } = await supabaseClient
    .from("game_saison_bilan")
    .select("saison, champion_game_club_id, meilleur_buteur_game_player_id, buts_meilleur_buteur, meilleur_passeur_game_player_id, passes_meilleur_passeur")
    .eq("game_id", gameId)
    .eq("competition_ref", comp.id)
    .order("saison", { ascending: false });
  if (error) console.error(error);

  const seasons = (data || []).filter(r => r.champion_game_club_id != null);

  if (seasons.length === 0) {
    el.innerHTML = `<div class="fm-empty">Aucun historique enregistré pour cette compétition pour l'instant (disponible à partir de la fin de la première saison jouée).</div>`;
    return;
  }

  const clubIds = [...new Set(seasons.map(s => s.champion_game_club_id))];
  const playerIds = [...new Set(
    seasons.flatMap(s => [s.meilleur_buteur_game_player_id, s.meilleur_passeur_game_player_id]).filter(Boolean)
  )];

  const [clubRes, playerRes] = await Promise.all([
    supabaseClient.from("game_clubs").select("id, nom, clubs(logo_url)").in("id", clubIds),
    playerIds.length
      ? supabaseClient.from("game_players").select("id, nom").in("id", playerIds)
      : Promise.resolve({ data: [] }),
  ]);
  const clubCache = {};
  (clubRes.data || []).forEach(c => { clubCache[c.id] = { nom: c.nom, logo: c.clubs?.logo_url || null }; });
  const playerCache = {};
  (playerRes.data || []).forEach(p => { playerCache[p.id] = p.nom; });

  el.innerHTML = seasons.map(s => {
    const club = clubCache[s.champion_game_club_id];
    const buteur = s.meilleur_buteur_game_player_id ? playerCache[s.meilleur_buteur_game_player_id] : null;
    const passeur = s.meilleur_passeur_game_player_id ? playerCache[s.meilleur_passeur_game_player_id] : null;
    return `
      <div class="fm-history-row">
        <span class="fm-history-season">Saison ${escapeHtml(String(s.saison))}</span>
        <span class="fm-history-winner" data-club-id="${s.champion_game_club_id}">
          ${club?.logo ? `<img src="${escapeHtml(club.logo)}" alt="">` : "🏆"}
          ${escapeHtml(club?.nom || "?")}
        </span>
        <span class="fm-history-meta">
          <span>Meilleur buteur : ${buteur ? `${escapeHtml(buteur)} (${s.buts_meilleur_buteur ?? 0})` : "—"}</span>
          <span>Meilleur passeur : ${passeur ? `${escapeHtml(passeur)} (${s.passes_meilleur_passeur ?? 0})` : "—"}</span>
        </span>
      </div>
    `;
  }).join("");
  el.querySelectorAll(".fm-history-winner[data-club-id]").forEach(elm => {
    elm.addEventListener("click", () => goToClub(elm.getAttribute("data-club-id")));
  });
}

// ===================== Coupe nationale : pas de classement (elimination
// directe), on affiche a la place le tableau du tour en cours, le prochain
// match du club suivi, son parcours et l'historique des tours precedents. =====================
// Recalcule la densite des lignes du tableau de classement (police +
// espacement vertical) pour que toutes les equipes tiennent exactement
// dans la hauteur disponible de la carte, sans jamais faire apparaitre de
// scroll interne ni faire defiler la page entiere. Passe 1 : estimation a
// partir du nombre de lignes. Passe 2 : mesure reelle du rendu (scrollHeight)
// et correction iterative, car la formule theorique ne colle jamais
// parfaitement au rendu du navigateur (line-height, bordures...).
let fmLastStandingsRowCount = 0;
function fitStandingsTable(rowCount) {
  if (rowCount) fmLastStandingsRowCount = rowCount;
  const box = document.getElementById("compStandings");
  if (!box || !fmLastStandingsRowCount || !box.querySelector("table")) return;
  const available = box.clientHeight;
  if (!available) return;

  const totalRows = fmLastStandingsRowCount + 1; // + ligne d'en-tete
  let rowH = Math.max(9, Math.min(34, available / totalRows));
  let font = Math.max(6.5, Math.min(13, rowH * 0.42));
  let py = Math.max(0.3, Math.min(9, (rowH - font * 1.3 - 1) / 2));
  box.style.setProperty("--fm-row-font", font.toFixed(1) + "px");
  box.style.setProperty("--fm-row-py", py.toFixed(1) + "px");

  for (let i = 0; i < 6; i++) {
    const real = box.scrollHeight;
    if (real <= available || font <= 6.5) break;
    const scale = Math.max(0.82, (available / real) - 0.015);
    font = Math.max(6.5, font * scale);
    py = Math.max(0.2, py * scale);
    box.style.setProperty("--fm-row-font", font.toFixed(1) + "px");
    box.style.setProperty("--fm-row-py", py.toFixed(1) + "px");
  }
}
let fmFitResizeTimer = null;
window.addEventListener("resize", () => {
  clearTimeout(fmFitResizeTimer);
  fmFitResizeTimer = setTimeout(() => fitStandingsTable(), 120);
});

function isRowPlayed(r) { return r.statut === "termine"; }

function coupeRoundLabelPage(tour, nbTours) {
  if (!nbTours) return `Tour ${tour}`;
  const NAMES = { 0: "Finale", 1: "Demi-finale", 2: "Quart de finale", 3: "8e de finale", 4: "16e de finale", 5: "32e de finale", 6: "64e de finale", 7: "128e de finale" };
  return NAMES[nbTours - tour] || `Tour ${tour}`;
}
function coupeRoundShortPage(tour, nbTours) {
  if (!nbTours) return `T${tour}`;
  const SHORT = { 0: "Finale", 1: "1/2", 2: "1/4", 3: "1/8", 4: "1/16", 5: "1/32", 6: "1/64", 7: "1/128" };
  return SHORT[nbTours - tour] || `T${tour}`;
}

function fixtureRowHtml(r, nameById, logoById, opts = {}) {
  const homeName = nameById[r.game_club_id_1] || "?";
  const awayName = nameById[r.game_club_id_2] || "?";
  const homeLogo = logoById[r.game_club_id_1];
  const awayLogo = logoById[r.game_club_id_2];
  const played = isRowPlayed(r);
  let scoreHtml;
  if (played) {
    let scoreText = `${r.score_1 ?? "-"}-${r.score_2 ?? "-"}`;
    if (r.tab_penalty_1 != null) scoreText += ` (tab ${r.tab_penalty_1}-${r.tab_penalty_2})`;
    scoreHtml = scoreText;
  } else {
    const d = r.date_match ? new Date(r.date_match) : null;
    scoreHtml = d ? d.toLocaleDateString("fr-FR", { day: "2-digit", month: "2-digit" }) : "à venir";
  }
  const homeWin = played && r.game_club_vainqueur_id === r.game_club_id_1;
  const awayWin = played && r.game_club_vainqueur_id === r.game_club_id_2;
  return `
    <div class="fm-coupe-fixture-row">
      ${opts.label ? `<div class="fm-comp-match-date">${escapeHtml(opts.label)}</div>` : ""}
      <div class="teams">
        <span class="club home ${homeWin ? "winner" : ""}" data-club-id="${r.game_club_id_1}">
          ${homeLogo ? `<img class="fm-club-logo" src="${escapeHtml(homeLogo)}" alt="">` : ""}<span class="club-name-text">${escapeHtml(homeName)}</span>
        </span>
        <span class="score">${scoreHtml}</span>
        <span class="club away ${awayWin ? "winner" : ""}" data-club-id="${r.game_club_id_2}">
          ${awayLogo ? `<img class="fm-club-logo" src="${escapeHtml(awayLogo)}" alt="">` : ""}<span class="club-name-text">${escapeHtml(awayName)}</span>
        </span>
      </div>
    </div>
  `;
}
function bindFixtureClicks(container) {
  container.querySelectorAll(".club[data-club-id]").forEach(el => {
    el.addEventListener("click", () => goToClub(el.getAttribute("data-club-id")));
  });
}

function parcoursRowHtml(r, clubIdNum, nameById, logoById, nbTours) {
  const isSide1 = r.game_club_id_1 === clubIdNum;
  const oppId = isSide1 ? r.game_club_id_2 : r.game_club_id_1;
  const oppLogo = logoById[oppId];
  const played = isRowPlayed(r);
  let resHtml;
  if (!played) {
    resHtml = `<span class="res next">à venir</span>`;
  } else {
    const won = r.game_club_vainqueur_id === clubIdNum;
    const myScore = isSide1 ? r.score_1 : r.score_2;
    const oppScore = isSide1 ? r.score_2 : r.score_1;
    let scoreText = `${myScore}-${oppScore}`;
    const myPen = isSide1 ? r.tab_penalty_1 : r.tab_penalty_2;
    const oppPen = isSide1 ? r.tab_penalty_2 : r.tab_penalty_1;
    if (myPen != null) scoreText += ` (tab ${myPen}-${oppPen})`;
    resHtml = `<span class="res ${won ? "win" : "lose"}">${scoreText}</span>`;
  }
  return `
    <div class="fm-coupe-parcours-row">
      <span class="rnd" title="${escapeHtml(coupeRoundLabelPage(r.tour, nbTours))}">${escapeHtml(coupeRoundShortPage(r.tour, nbTours))}</span>
      <span class="opp" data-club-id="${oppId}">
        ${oppLogo ? `<img class="fm-club-logo" src="${escapeHtml(oppLogo)}" alt="">` : ""}
        <span class="opp-name">${escapeHtml(nameById[oppId] || "?")}</span>
      </span>
      ${resHtml}
    </div>
  `;
}
function bindParcoursClicks(container) {
  container.querySelectorAll(".opp[data-club-id]").forEach(el => {
    el.addEventListener("click", () => goToClub(el.getAttribute("data-club-id")));
  });
}

async function loadCoupeNationale(comp) {
  // On s'appuie sur la saison en cours de la partie (table games) plutot
  // que sur la saison la plus "haute" de la table de config : celle-ci
  // contient aussi des tirages d'autres saisons (passees ou de test) avec
  // des dates sans rapport avec la partie en cours (ex. saison "gabarit"
  // tres loin dans le futur), qui fausseraient tout l'affichage.
  const { data: gameRow } = await supabaseClient
    .from("games")
    .select("saison")
    .eq("id", gameId)
    .maybeSingle();
  const currentSaison = gameRow?.saison ?? null;

  let configQuery = supabaseClient
    .from("game_coupe_nationale_config")
    .select("saison, nb_tours")
    .eq("game_id", gameId)
    .eq("competition_ref", comp.id);
  configQuery = currentSaison != null
    ? configQuery.eq("saison", currentSaison)
    : configQuery.order("saison", { ascending: false }).limit(1);
  const { data: config } = await configQuery.maybeSingle();
  const nbTours = config?.nb_tours || null;
  const saison = config?.saison ?? currentSaison;

  let rowsQuery = supabaseClient
    .from("game_coupe_nationale_tours")
    .select("id, tour, game_club_id_1, game_club_id_2, date_match, score_1, score_2, tab_penalty_1, tab_penalty_2, game_club_vainqueur_id, statut")
    .eq("game_id", gameId)
    .eq("competition_ref", comp.id)
    .order("tour", { ascending: true });
  if (saison != null) rowsQuery = rowsQuery.eq("saison", saison);
  const { data: rows } = await rowsQuery;
  const allRows = rows || [];

  document.getElementById("compStandingsLegend").innerHTML = "";
  document.getElementById("compNextJournee").textContent = "";

  document.getElementById("fmBracketBtn").style.display = "none";
  document.getElementById("cardNextMatches").style.display = "";

  if (allRows.length === 0) {
    document.getElementById("compCard1Title").textContent = "Tableau";
    document.getElementById("compStandings").innerHTML = `<div class="fm-empty">Le tirage n'a pas encore eu lieu.</div>`;
    document.getElementById("compCard2Title").textContent = "Prochain match";
    document.getElementById("compNextMatches").innerHTML = `<div class="fm-empty">Aucun match programmé.</div>`;
    document.getElementById("compCard3Title").textContent = "Votre parcours";
    document.getElementById("compTopScorers").innerHTML = `<div class="fm-empty">Pas encore entré en lice dans la compétition.</div>`;
    document.getElementById("compCard4Title").textContent = "Tours précédents";
    document.getElementById("compTopAssists").innerHTML = `<div class="fm-empty">Aucun résultat pour l'instant.</div>`;
    return;
  }

  // Ecarte les "byes" (qualification d'office, game_club_id_1 = game_club_id_2)
  // de l'affichage : ce n'est pas un vrai match.
  const realRows = allRows.filter(r => r.game_club_id_1 !== r.game_club_id_2);
  const clubIds = [...new Set(realRows.flatMap(r => [r.game_club_id_1, r.game_club_id_2]))];
  const { data: clubsData } = await supabaseClient
    .from("game_clubs")
    .select("id, nom, clubs(logo_url)")
    .in("id", clubIds.length ? clubIds : [0]);
  const nameById = {};
  const logoById = {};
  (clubsData || []).forEach(c => { nameById[c.id] = c.nom; logoById[c.id] = c.clubs?.logo_url || null; });

  document.getElementById("compSub").textContent = `${comp.nation}${nbTours ? ` · ${nbTours} tours` : ""}`;

  const bracketBtn = document.getElementById("fmBracketBtn");
  bracketBtn.style.display = "";
  bracketBtn.onclick = () => openBracketModal(realRows, nbTours, nameById, logoById);

  const currentTour = Math.max(...allRows.map(r => r.tour));
  const currentTourRows = realRows.filter(r => r.tour === currentTour);

  // ---- Tableau du tour en cours (remplace le classement, sans objet en
  // coupe puisque c'est de l'élimination directe) ----
  document.getElementById("compCard1Title").textContent = `Tableau — ${coupeRoundLabelPage(currentTour, nbTours)}`;
  document.getElementById("compStandings").innerHTML = currentTourRows.length
    ? currentTourRows.map(r => fixtureRowHtml(r, nameById, logoById)).join("")
    : `<div class="fm-empty">Aucune affiche pour ce tour.</div>`;
  bindFixtureClicks(document.getElementById("compStandings"));

  // ---- Prochain match : celui du club suivi si on en a un, sinon les
  // affiches restantes du tour en cours. Si le club suivi ne participe pas
  // du tout a cette coupe (ex : on consulte la coupe d'un autre pays), le
  // module entier est retire plutot que d'afficher un message vide. ----
  document.getElementById("compCard2Title").textContent = "Prochain match";
  const myClubRows = myClubId ? realRows.filter(r => r.game_club_id_1 === myClubId || r.game_club_id_2 === myClubId) : [];
  const cardNextMatchesEl = document.getElementById("cardNextMatches");
  if (myClubId) {
    if (myClubRows.length === 0) {
      cardNextMatchesEl.style.display = "none";
    } else {
      cardNextMatchesEl.style.display = "";
      const myUpcoming = myClubRows.find(r => !isRowPlayed(r));
      document.getElementById("compNextMatches").innerHTML = myUpcoming
        ? fixtureRowHtml(myUpcoming, nameById, logoById, { label: coupeRoundLabelPage(myUpcoming.tour, nbTours) })
        : `<div class="fm-empty">Aucun match à venir pour ce club.</div>`;
      bindFixtureClicks(document.getElementById("compNextMatches"));
    }
  } else {
    cardNextMatchesEl.style.display = "";
    const anyUpcoming = currentTourRows.filter(r => !isRowPlayed(r));
    document.getElementById("compNextMatches").innerHTML = anyUpcoming.length
      ? anyUpcoming.map(r => fixtureRowHtml(r, nameById, logoById)).join("")
      : `<div class="fm-empty">Aucun match à venir programmé.</div>`;
    bindFixtureClicks(document.getElementById("compNextMatches"));
  }

  // ---- Parcours du club suivi (round par round), ou a defaut les
  // derniers resultats de la competition ----
  if (myClubId) {
    document.getElementById("compCard3Title").textContent = "Votre parcours";
    const myRows = myClubRows.slice().sort((a, b) => a.tour - b.tour);
    document.getElementById("compTopScorers").innerHTML = myRows.length
      ? myRows.map(r => parcoursRowHtml(r, myClubId, nameById, logoById, nbTours)).join("")
      : `<div class="fm-empty">Ce club ne participe pas à la compétition cette saison.</div>`;
    bindParcoursClicks(document.getElementById("compTopScorers"));
  } else {
    document.getElementById("compCard3Title").textContent = "Derniers résultats";
    const played = realRows.filter(isRowPlayed).sort((a, b) => b.tour - a.tour);
    document.getElementById("compTopScorers").innerHTML = played.length
      ? played.slice(0, 30).map(r => fixtureRowHtml(r, nameById, logoById)).join("")
      : `<div class="fm-empty">Aucun résultat pour l'instant.</div>`;
    bindFixtureClicks(document.getElementById("compTopScorers"));
  }

  // ---- Historique des tours precedents (bracket-lite : un en-tete par
  // tour, du plus recent au plus ancien) ----
  document.getElementById("compCard4Title").textContent = "Tours précédents";
  const previousTours = [...new Set(realRows.filter(r => r.tour !== currentTour).map(r => r.tour))].sort((a, b) => b - a);
  document.getElementById("compTopAssists").innerHTML = previousTours.length
    ? previousTours.map(t => `
        <div class="fm-coupe-round-header">${escapeHtml(coupeRoundLabelPage(t, nbTours))}</div>
        ${realRows.filter(r => r.tour === t).map(r => fixtureRowHtml(r, nameById, logoById)).join("")}
      `).join("")
    : `<div class="fm-empty">Pas encore de tour précédent.</div>`;
  bindFixtureClicks(document.getElementById("compTopAssists"));

  loadHistorique(comp);
}

// ===================== Navigation entre divisions (fleches verticales) =====================
// Permet de passer d'une division a l'autre au sein d'une meme nation (ex:
// Ligue 1 <-> Ligue 2) via les fleches haut/bas de la topbar.
async function loadDivisionNav(comp) {
  const nav = document.getElementById("fmDivisionNav");
  const upBtn = document.getElementById("fmDivUp");
  const downBtn = document.getElementById("fmDivDown");
  if (comp.tier == null) { nav.style.display = "none"; return; }

  const { data: siblings } = await supabaseClient
    .from("competitions")
    .select("id, tier")
    .eq("type", "championnat")
    .eq("nation", comp.nation)
    .order("tier", { ascending: true });

  const list = siblings || [];
  const upComp = list.filter(c => c.tier < comp.tier).sort((a, b) => b.tier - a.tier)[0];
  const downComp = list.filter(c => c.tier > comp.tier).sort((a, b) => a.tier - b.tier)[0];

  if (!upComp && !downComp) { nav.style.display = "none"; return; }
  nav.style.display = "";

  const goToComp = (id) => {
    const qs = new URLSearchParams({ game: gameId, competition: id, club: myClubId || "" });
    window.location.href = `competition.html?${qs.toString()}`;
  };

  upBtn.disabled = !upComp;
  downBtn.disabled = !downComp;
  upBtn.onclick = () => upComp && goToComp(upComp.id);
  downBtn.onclick = () => downComp && goToComp(downComp.id);
}

// ===================== Stats clubs agregees =====================
// Calculees a partir des stats jsonb stockees sur chaque match joue
// (calendrier.stats), remplies par le moteur de simulation instantanee :
// tirs, tirs cadres, possession, corners, centres, fautes, hors-jeu, passes
// reussies, occasions franches, arrets, cartons, clean sheets.
function emptyClubAgg() {
  return {
    matchs: 0, possessionSum: 0, tirsPourSum: 0, tirsContreSum: 0, tirsCadresSum: 0,
    cornersSum: 0, centresSum: 0, fautesSum: 0, horsJeuSum: 0, passesReussiesSum: 0,
    occasionsFranchesSum: 0, arretsSum: 0, cartonsJaunes: 0, cartonsRouges: 0, cleanSheets: 0,
  };
}
async function computeClubMatchStats(comp) {
  const { data: rows } = await supabaseClient
    .from("calendrier")
    .select("club_domicile_id, club_exterieur_id, score_domicile, score_exterieur, stats")
    .eq("game_id", gameId)
    .eq("nation", comp.nation)
    .eq("division", comp.division)
    .eq("statut", "joue");

  const agg = {};
  const ensure = (id) => { if (!agg[id]) agg[id] = emptyClubAgg(); return agg[id]; };

  (rows || []).forEach(r => {
    const s = r.stats;
    const homeId = r.club_domicile_id, awayId = r.club_exterieur_id;
    const h = ensure(homeId), a = ensure(awayId);
    h.matchs++; a.matchs++;
    if ((r.score_exterieur ?? 0) === 0) h.cleanSheets++;
    if ((r.score_domicile ?? 0) === 0) a.cleanSheets++;
    if (!s) return;
    if (s.possession) { h.possessionSum += (s.possession.domicile ?? 0); a.possessionSum += (s.possession.exterieur ?? 0); }
    if (s.tirs) {
      h.tirsPourSum += (s.tirs.domicile ?? 0); h.tirsContreSum += (s.tirs.exterieur ?? 0);
      a.tirsPourSum += (s.tirs.exterieur ?? 0); a.tirsContreSum += (s.tirs.domicile ?? 0);
    }
    if (s.tirs_cadres) { h.tirsCadresSum += (s.tirs_cadres.domicile ?? 0); a.tirsCadresSum += (s.tirs_cadres.exterieur ?? 0); }
    if (s.corners) { h.cornersSum += (s.corners.domicile ?? 0); a.cornersSum += (s.corners.exterieur ?? 0); }
    if (s.centres) { h.centresSum += (s.centres.domicile ?? 0); a.centresSum += (s.centres.exterieur ?? 0); }
    if (s.fautes) { h.fautesSum += (s.fautes.domicile ?? 0); a.fautesSum += (s.fautes.exterieur ?? 0); }
    if (s.hors_jeu) { h.horsJeuSum += (s.hors_jeu.domicile ?? 0); a.horsJeuSum += (s.hors_jeu.exterieur ?? 0); }
    if (s.passes_reussies) { h.passesReussiesSum += (s.passes_reussies.domicile ?? 0); a.passesReussiesSum += (s.passes_reussies.exterieur ?? 0); }
    if (s.occasions_franches) { h.occasionsFranchesSum += (s.occasions_franches.domicile ?? 0); a.occasionsFranchesSum += (s.occasions_franches.exterieur ?? 0); }
    if (s.arrets) { h.arretsSum += (s.arrets.domicile ?? 0); a.arretsSum += (s.arrets.exterieur ?? 0); }
    (s.cartons || []).forEach(c => {
      const target = c.game_club_id === homeId ? h : (c.game_club_id === awayId ? a : null);
      if (!target) return;
      if (c.type === "jaune") target.cartonsJaunes++;
      else if (c.type === "rouge_direct" || c.type === "rouge_2j") target.cartonsRouges++;
    });
  });
  return agg;
}

async function loadCompetition() {
  if (!gameId || !competitionId) {
    document.getElementById("fmSearchInput").placeholder = "Compétition introuvable";
    return;
  }

  const { data: comp, error: compError } = await supabaseClient
    .from("competitions")
    .select("id, nom, nation, division, tier, nb_clubs, type, nb_promotion, nb_relegation")
    .eq("id", competitionId)
    .single();

  if (compError || !comp) {
    document.getElementById("fmSearchInput").placeholder = "Compétition introuvable";
    return;
  }

  document.getElementById("fmSearchInput").placeholder = comp.nom;
  document.getElementById("compTag").textContent = comp.type === "championnat" ? "Championnat" : comp.type === "coupe_nationale" ? "Coupe nationale" : comp.type;
  document.title = `FM Web — ${comp.nom}`;

  if (comp.type === "championnat") {
    loadDivisionNav(comp);
  }

  if (comp.type === "coupe_nationale") {
    document.getElementById("compSub").textContent = comp.nation;
    await loadCoupeNationale(comp);
    return;
  }

  document.getElementById("compSub").textContent = `${comp.nation} · ${comp.division}`;

  loadHistorique(comp);

  // Clubs de la division (nom + classement/points via la vue, stats detaillees via game_clubs)
  const { data: overview, error: overviewError } = await supabaseClient
    .from("game_club_overview")
    .select("game_club_id, nom, classement")
    .eq("game_id", gameId)
    .eq("nation", comp.nation)
    .eq("division", comp.division);

  if (overviewError || !overview || overview.length === 0) {
    document.getElementById("compStandings").innerHTML = `<div class="fm-empty">Impossible de charger le classement.</div>`;
    document.getElementById("compNextMatches").innerHTML = "";
    document.getElementById("compTopScorers").innerHTML = "";
    document.getElementById("compTopAssists").innerHTML = "";
    return;
  }

  const clubIds = overview.map(c => c.game_club_id);
  const nameById = {};
  overview.forEach(c => { nameById[c.game_club_id] = c.nom; });

  const { data: fullStats } = await supabaseClient
    .from("game_clubs")
    .select("id, classement, points, victoires, nuls, defaites, buts_pour, buts_contre, clubs(logo_url)")
    .in("id", clubIds);

  const statsById = {};
  const logoById = {};
  (fullStats || []).forEach(c => {
    statsById[c.id] = c;
    logoById[c.id] = c.clubs?.logo_url || null;
  });

  const matchStats = await computeClubMatchStats(comp);

  const sorted = clubIds.slice().sort((a, b) => {
    const sa = statsById[a] || {};
    const sb = statsById[b] || {};
    if (sa.classement != null && sb.classement != null) return sa.classement - sb.classement;
    if ((sb.points ?? 0) !== (sa.points ?? 0)) return (sb.points ?? 0) - (sa.points ?? 0);
    const diffA = (sa.buts_pour ?? 0) - (sa.buts_contre ?? 0);
    const diffB = (sb.buts_pour ?? 0) - (sb.buts_contre ?? 0);
    if (diffB !== diffA) return diffB - diffA;
    return (sb.buts_pour ?? 0) - (sa.buts_pour ?? 0);
  });

  // Zones qualificatives europeennes (une seule par competition europeenne,
  // couleur alignee UEFA) : seule l'elite (tier 1) de chaque nation qualifie
  // pour l'Europe. On s'appuie d'abord sur les places evolutives propres a
  // la partie (game_places_europeennes), sinon sur la baseline reelle
  // (classement_uefa_places) tant que le coefficient evolutif n'est pas
  // encore simule pour cette nation.
  let euroZones = [];
  if (comp.tier === 1) {
    let placesRows = [];
    const { data: gamePlaces } = await supabaseClient
      .from("game_places_europeennes")
      .select("coupe_europe_ref, phase, nb_places, saison")
      .eq("game_id", gameId)
      .eq("nation", comp.nation);
    if (gamePlaces && gamePlaces.length > 0) {
      const derniereSaison = Math.max(...gamePlaces.map(r => r.saison));
      placesRows = gamePlaces.filter(r => r.saison === derniereSaison);
    } else {
      const { data: basePlaces } = await supabaseClient
        .from("classement_uefa_places")
        .select("coupe_europe_ref, phase, nb_places")
        .eq("nation", comp.nation);
      placesRows = basePlaces || [];
    }

    if (placesRows.length > 0) {
      const slotsByCoupe = {};
      placesRows.forEach(r => {
        slotsByCoupe[r.coupe_europe_ref] = (slotsByCoupe[r.coupe_europe_ref] || 0) + (r.nb_places || 0);
      });
      const coupeIds = Object.keys(slotsByCoupe);
      const { data: coupes } = await supabaseClient
        .from("competitions")
        .select("id, nom, tier")
        .in("id", coupeIds);
      const EURO_COLORS = { 1: "zone-euro-1", 2: "zone-euro-2", 3: "zone-euro-3" };
      const ordered = (coupes || []).slice().sort((a, b) => a.tier - b.tier);
      let cursor = 1;
      euroZones = ordered.map(c => {
        const nb = slotsByCoupe[c.id] || 0;
        const zone = { startRank: cursor, endRank: cursor + nb - 1, colorClass: EURO_COLORS[c.tier] || "zone-euro-3", label: c.nom };
        cursor += nb;
        return zone;
      }).filter(z => z.endRank >= z.startRank);
    }
  }

  // Zone de relegation : les nb_relegation derniers du classement.
  const nbRelegation = comp.nb_relegation || 0;
  const releguable = nbRelegation > 0
    ? { startRank: sorted.length - nbRelegation + 1, endRank: sorted.length }
    : null;

  // Zone de promotion : les nb_promotion premiers, pour toute division qui
  // n'est pas l'elite (tier 1 n'a jamais de promotion, uniquement les zones
  // europeennes calculees plus haut). Le 1er de la division reste en vert
  // ("champion"), distinct du bleu de la zone de promotion.
  const isElite = comp.tier === 1;
  const nbPromotion = !isElite ? (comp.nb_promotion || 0) : 0;
  const hasChampion = !isElite;
  const promouvable = nbPromotion > 1 ? { startRank: 2, endRank: nbPromotion } : null;

  const zoneClassForRank = (rank) => {
    const euro = euroZones.find(z => rank >= z.startRank && rank <= z.endRank);
    if (euro) return euro.colorClass;
    if (hasChampion && rank === 1) return "zone-champion";
    if (promouvable && rank >= promouvable.startRank && rank <= promouvable.endRank) return "zone-promo";
    if (releguable && rank >= releguable.startRank && rank <= releguable.endRank) return "zone-releg";
    return "";
  };

  document.getElementById("compStandings").innerHTML = `
    <table class="fm-table">
      <thead>
        <tr>
          <th>Clt</th><th>Club</th><th>J</th><th>V</th><th>N</th><th>D</th>
          <th>BP</th><th>BC</th><th>Diff</th><th>Pts</th>
        </tr>
      </thead>
      <tbody>
        ${sorted.map((id, i) => {
          const s = statsById[id] || {};
          const rank = s.classement ?? (i + 1);
          const joues = (s.victoires ?? 0) + (s.nuls ?? 0) + (s.defaites ?? 0);
          const diff = (s.buts_pour ?? 0) - (s.buts_contre ?? 0);
          const logo = logoById[id];
          const rowClasses = [id === myClubId ? "me" : "", zoneClassForRank(rank)].filter(Boolean).join(" ");
          return `
            <tr class="${rowClasses}">
              <td class="clt">${rank}e</td>
              <td>
                <span class="fm-club-link" data-club-id="${id}">
                  ${logo ? `<img class="fm-club-logo" src="${escapeHtml(logo)}" alt="">` : ""}
                  ${escapeHtml(nameById[id])}
                </span>
              </td>
              <td class="num">${joues}</td>
              <td class="num">${s.victoires ?? 0}</td>
              <td class="num">${s.nuls ?? 0}</td>
              <td class="num">${s.defaites ?? 0}</td>
              <td class="num">${s.buts_pour ?? 0}</td>
              <td class="num">${s.buts_contre ?? 0}</td>
              <td class="num">${diff >= 0 ? "+" : ""}${diff}</td>
              <td class="pts">${s.points ?? 0}</td>
            </tr>
          `;
        }).join("")}
      </tbody>
    </table>
  `;
  document.querySelectorAll("#compStandings .fm-club-link").forEach(el => {
    el.addEventListener("click", () => goToClub(el.getAttribute("data-club-id")));
  });

  const legendItems = euroZones.map(z => `
    <span class="legend-item"><span class="legend-dot" style="background:${
      z.colorClass === "zone-euro-1" ? "#3b82f6" : z.colorClass === "zone-euro-2" ? "#f97316" : "#22c55e"
    };"></span>${escapeHtml(z.label)}</span>
  `);
  if (hasChampion) {
    legendItems.push(`<span class="legend-item"><span class="legend-dot" style="background:#22c55e;"></span>Champion</span>`);
  }
  if (promouvable) {
    legendItems.push(`<span class="legend-item"><span class="legend-dot" style="background:#3b82f6;"></span>Promotion</span>`);
  }
  if (releguable) {
    legendItems.push(`<span class="legend-item"><span class="legend-dot" style="background:var(--danger);"></span>Relégation</span>`);
  }
  document.getElementById("compStandingsLegend").innerHTML = legendItems.join("");
  fitStandingsTable(sorted.length);

  // ---- Resultats : carte navigable par journee (fleches). Par defaut on
  // affiche la prochaine journee non jouee ("prochains matchs"), et les
  // fleches permettent de remonter vers les journees deja jouees (scores
  // affiches a la place de "vs") ou d'avancer vers les journees futures. ----
  document.getElementById("compCard2Title").textContent = "Résultats";
  const journeePrevBtn = document.getElementById("compJourneePrev");
  const journeeNextBtn = document.getElementById("compJourneeNext");
  journeePrevBtn.classList.add("visible");
  journeeNextBtn.classList.add("visible");

  const { data: allMatches } = await supabaseClient
    .from("calendrier")
    .select("id, date_match, journee, club_domicile_id, club_exterieur_id, score_domicile, score_exterieur, statut")
    .eq("game_id", gameId)
    .eq("nation", comp.nation)
    .eq("division", comp.division)
    .order("journee", { ascending: true })
    .order("date_match", { ascending: true });

  const nextMatchesEl = document.getElementById("compNextMatches");
  const journeeLabelEl = document.getElementById("compNextJournee");

  if (!allMatches || allMatches.length === 0) {
    journeeLabelEl.textContent = "";
    nextMatchesEl.innerHTML = `<div class="fm-empty">Aucun match programmé.</div>`;
    journeePrevBtn.disabled = true;
    journeeNextBtn.disabled = true;
  } else {
    const journeeNums = [...new Set(allMatches.map(m => m.journee))].sort((a, b) => a - b);
    const byJournee = {};
    journeeNums.forEach(j => { byJournee[j] = allMatches.filter(m => m.journee === j); });

    const firstUnplayed = journeeNums.find(j => byJournee[j].some(m => m.statut !== "joue"));
    let currentIdx = firstUnplayed != null ? journeeNums.indexOf(firstUnplayed) : journeeNums.length - 1;

    const renderJournee = (idx) => {
      const journee = journeeNums[idx];
      const matches = byJournee[journee];
      journeeLabelEl.textContent = `Journée ${journee}`;
      nextMatchesEl.innerHTML = matches.map(m => {
        const played = m.statut === "joue";
        const d = m.date_match ? new Date(m.date_match) : null;
        const dateLabel = d ? d.toLocaleDateString("fr-FR", { weekday: "short", day: "2-digit", month: "2-digit" }).replace(".", "") : "-";
        const homeLogo = logoById[m.club_domicile_id];
        const awayLogo = logoById[m.club_exterieur_id];
        return `
          <div class="fm-comp-match-row">
            <div class="fm-comp-match-date">${dateLabel}</div>
            <div class="fm-comp-match-teams">
              <span class="home"><span class="club" data-club-id="${m.club_domicile_id}">
                ${homeLogo ? `<img class="fm-club-logo" src="${escapeHtml(homeLogo)}" alt="">` : ""}<span class="club-name-text">${escapeHtml(nameById[m.club_domicile_id] || "?")}</span>
              </span></span>
              <span class="vs${played ? " score" : ""}">${played ? `${m.score_domicile ?? 0} - ${m.score_exterieur ?? 0}` : "vs"}</span>
              <span class="away"><span class="club" data-club-id="${m.club_exterieur_id}">
                ${awayLogo ? `<img class="fm-club-logo" src="${escapeHtml(awayLogo)}" alt="">` : ""}<span class="club-name-text">${escapeHtml(nameById[m.club_exterieur_id] || "?")}</span>
              </span></span>
            </div>
          </div>
        `;
      }).join("");
      nextMatchesEl.querySelectorAll(".club").forEach(el => {
        el.addEventListener("click", () => goToClub(el.getAttribute("data-club-id")));
      });
      journeePrevBtn.disabled = idx <= 0;
      journeeNextBtn.disabled = idx >= journeeNums.length - 1;
    };

    journeePrevBtn.onclick = () => { if (currentIdx > 0) { currentIdx--; renderJournee(currentIdx); } };
    journeeNextBtn.onclick = () => { if (currentIdx < journeeNums.length - 1) { currentIdx++; renderJournee(currentIdx); } };

    renderJournee(currentIdx);
  }

  // ---- Chips "meilleure attaque / défense / possession / tirs" ----
  const leadersEl = document.getElementById("compClubLeaders");
  const clubsWithMatches = clubIds.filter(id => (matchStats[id]?.matchs || 0) > 0);
  if (clubsWithMatches.length > 0) {
    const bestAttack = clubIds.slice().sort((a, b) => (statsById[b]?.buts_pour ?? 0) - (statsById[a]?.buts_pour ?? 0))[0];
    const bestDefense = clubIds.slice().sort((a, b) => (statsById[a]?.buts_contre ?? 0) - (statsById[b]?.buts_contre ?? 0))[0];
    const bestPossession = clubsWithMatches.slice().sort((a, b) =>
      (matchStats[b].possessionSum / matchStats[b].matchs) - (matchStats[a].possessionSum / matchStats[a].matchs))[0];
    const bestShots = clubsWithMatches.slice().sort((a, b) =>
      (matchStats[b].tirsPourSum / matchStats[b].matchs) - (matchStats[a].tirsPourSum / matchStats[a].matchs))[0];

    const chip = (label, clubId, valueText) => `
      <div class="fm-stat-leader-chip" data-club-id="${clubId}">
        <div class="lbl">${escapeHtml(label)}</div>
        <div class="val">
          ${logoById[clubId] ? `<img class="fm-club-logo" src="${escapeHtml(logoById[clubId])}" alt="">` : ""}
          <span class="club-name">${escapeHtml(nameById[clubId] || "?")}</span>
          <span class="num">${valueText}</span>
        </div>
      </div>
    `;
    leadersEl.innerHTML = [
      chip("Meilleure attaque", bestAttack, `${statsById[bestAttack]?.buts_pour ?? 0} buts`),
      chip("Meilleure défense", bestDefense, `${statsById[bestDefense]?.buts_contre ?? 0} enc.`),
      chip("Possession moy.", bestPossession, `${(matchStats[bestPossession].possessionSum / matchStats[bestPossession].matchs).toFixed(0)}%`),
      chip("Tirs/match", bestShots, `${(matchStats[bestShots].tirsPourSum / matchStats[bestShots].matchs).toFixed(1)}`),
    ].join("");
    leadersEl.style.display = "";
    leadersEl.querySelectorAll(".fm-stat-leader-chip").forEach(el => {
      el.addEventListener("click", () => goToClub(el.getAttribute("data-club-id")));
    });
  } else {
    leadersEl.style.display = "none";
  }

  // ---- Carte "Stats clubs" : classements filtrables par categorie, comme
  // pour les joueurs. Chaque onglet classe tous les clubs de la division
  // sur une metrique (calculee sur les matchs deja joues) + une metrique
  // secondaire de contexte. ----
  const clubStatsEl = document.getElementById("compTopAssists");
  const clubStatsSubEl = document.getElementById("fmClubStatsSub");
  const clubsPlayed = clubIds.filter(id => (matchStats[id]?.matchs || 0) > 0);

  const clubRow = (id, i, mainLabel, mainVal, subLabel, subVal) => `
    <div class="player-row club-stat-row">
      <span class="player-rank">${i + 1}</span>
      <span class="fm-club-link player-name" data-club-id="${id}" style="display:flex; align-items:center; gap:8px;">
        ${logoById[id] ? `<img class="fm-club-logo" src="${escapeHtml(logoById[id])}" alt="">` : ""}
        ${escapeHtml(nameById[id] || "?")}
      </span>
      <span class="club-value-sub" title="${escapeHtml(subLabel)}">${subVal}</span>
      <span class="club-value-main" title="${escapeHtml(mainLabel)}">${mainVal}</span>
    </div>
  `;

  const clubStatsTabs = {
    attaque: {
      sub: "Classement par buts marqués, tirs et occasions par match.",
      render: () => sorted.map((id, i) => {
        const s = statsById[id] || {};
        const m = matchStats[id];
        const tirsP = m && m.matchs ? (m.tirsPourSum / m.matchs).toFixed(1) : "-";
        return { id, main: `${s.buts_pour ?? 0} buts`, sub: `${tirsP} tirs/m` };
      }).sort((a, b) => (statsById[b.id]?.buts_pour ?? 0) - (statsById[a.id]?.buts_pour ?? 0))
        .map((r, i) => clubRow(r.id, i, "Buts marqués", r.main, "Tirs par match", r.sub)).join(""),
    },
    defense: {
      sub: "Classement par buts encaissés (le moins possible en tête) et clean sheets.",
      render: () => sorted.map(id => {
        const s = statsById[id] || {};
        const m = matchStats[id];
        return { id, buts: s.buts_contre ?? 0, cs: m ? m.cleanSheets : 0 };
      }).sort((a, b) => a.buts - b.buts)
        .map((r, i) => clubRow(r.id, i, "Buts encaissés", `${r.buts} enc.`, "Clean sheets", `${r.cs} CS`)).join(""),
    },
    possession: {
      sub: clubsPlayed.length ? "Classement par possession moyenne et passes réussies par match." : "Aucun match joué pour l'instant.",
      render: () => clubsPlayed.map(id => {
        const m = matchStats[id];
        return { id, poss: m.possessionSum / m.matchs, passes: m.passesReussiesSum / m.matchs };
      }).sort((a, b) => b.poss - a.poss)
        .map((r, i) => clubRow(r.id, i, "Possession moyenne", `${r.poss.toFixed(0)}%`, "Passes réussies/m", r.passes.toFixed(0))).join(""),
    },
    discipline: {
      sub: clubsPlayed.length ? "Classement par cartons cumulés (le moins possible en tête) et fautes par match." : "Aucun match joué pour l'instant.",
      render: () => clubsPlayed.map(id => {
        const m = matchStats[id];
        return { id, cartons: m.cartonsJaunes + m.cartonsRouges * 2, jaunes: m.cartonsJaunes, rouges: m.cartonsRouges, fautes: m.fautesSum / m.matchs };
      }).sort((a, b) => a.cartons - b.cartons)
        .map((r, i) => clubRow(r.id, i, "Cartons (pondérés)", `${r.jaunes}🟨 ${r.rouges}🟥`, "Fautes/match", r.fautes.toFixed(1))).join(""),
    },
    gardiens: {
      sub: clubsPlayed.length ? "Classement par arrêts moyens par match et clean sheets." : "Aucun match joué pour l'instant.",
      render: () => clubsPlayed.map(id => {
        const m = matchStats[id];
        return { id, arrets: m.arretsSum / m.matchs, cs: m.cleanSheets };
      }).sort((a, b) => b.arrets - a.arrets)
        .map((r, i) => clubRow(r.id, i, "Arrêts/match", r.arrets.toFixed(1), "Clean sheets", `${r.cs} CS`)).join(""),
    },
  };

  function renderClubStatsTab(tab) {
    const cfg = clubStatsTabs[tab];
    clubStatsSubEl.textContent = cfg.sub;
    const html = cfg.render();
    clubStatsEl.innerHTML = html || `<div class="fm-empty">Aucune donnée disponible.</div>`;
    clubStatsEl.querySelectorAll(".fm-club-link").forEach(el => {
      el.addEventListener("click", () => goToClub(el.getAttribute("data-club-id")));
    });
  }

  document.getElementById("fmClubStatsTabs").classList.add("visible");
  document.querySelectorAll("#fmClubStatsTabs .fm-tab").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll("#fmClubStatsTabs .fm-tab").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      renderClubStatsTab(btn.getAttribute("data-tab"));
    });
  });
  renderClubStatsTab("attaque");

  // ---- Meilleurs joueurs (buteurs / passeurs / notes), avec photo + club ----
  const { data: players } = await supabaseClient
    .from("game_players")
    .select("id, nom, game_club_id, buts_saison, passes_decisives_saison, note_moyenne_saison, matchs_joues_saison, poste_brut, players(photo_url)")
    .eq("game_id", gameId)
    .in("game_club_id", clubIds);

  const topScorersEl = document.getElementById("compTopScorers");

  if (!players || players.length === 0) {
    topScorersEl.innerHTML = `<div class="fm-empty">Pas encore de données.</div>`;
    return;
  }

  const renderPlayerList = (list, valueKey, emptyLabel, formatVal) => list.length === 0
    ? `<div class="fm-empty">${escapeHtml(emptyLabel)}</div>`
    : list.map((p, i) => `
      <div class="player-row">
        <span class="player-rank">${i + 1}</span>
        ${p.players?.photo_url
          ? `<img class="player-photo" src="${escapeHtml(p.players.photo_url)}" alt="">`
          : `<span class="player-photo-placeholder">🧍</span>`}
        <span class="player-name" data-club-id="${p.game_club_id}">${escapeHtml(p.nom)}</span>
        <span class="player-club player-club-wrap">
          ${logoById[p.game_club_id] ? `<img class="player-club-logo" src="${escapeHtml(logoById[p.game_club_id])}" alt="">` : ""}
          ${escapeHtml(nameById[p.game_club_id] || "")}
        </span>
        <span class="player-value">${formatVal ? formatVal(p[valueKey]) : (p[valueKey] ?? 0)}</span>
      </div>
    `).join("");

  const playerTabs = {
    buteurs: () => renderPlayerList(
      players.slice().filter(p => (p.buts_saison ?? 0) > 0).sort((a, b) => (b.buts_saison ?? 0) - (a.buts_saison ?? 0)).slice(0, 15),
      "buts_saison", "Aucun but marqué pour l'instant."
    ),
    passeurs: () => renderPlayerList(
      players.slice().filter(p => (p.passes_decisives_saison ?? 0) > 0).sort((a, b) => (b.passes_decisives_saison ?? 0) - (a.passes_decisives_saison ?? 0)).slice(0, 15),
      "passes_decisives_saison", "Aucune passe décisive pour l'instant."
    ),
    notes: () => renderPlayerList(
      players.slice().filter(p => (p.matchs_joues_saison ?? 0) > 0 && p.note_moyenne_saison != null)
        .sort((a, b) => (b.note_moyenne_saison ?? 0) - (a.note_moyenne_saison ?? 0)).slice(0, 15),
      "note_moyenne_saison", "Pas encore de note disponible.", (v) => (v != null ? Number(v).toFixed(2) : "-")
    ),
  };

  function renderPlayerTab(tab) {
    topScorersEl.innerHTML = playerTabs[tab]();
    topScorersEl.querySelectorAll(".player-name[data-club-id]").forEach(el => {
      el.style.cursor = "pointer";
      el.addEventListener("click", () => goToClub(el.getAttribute("data-club-id")));
    });
  }

  document.getElementById("fmPlayerTabs").classList.add("visible");
  document.querySelectorAll("#fmPlayerTabs .fm-tab").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll("#fmPlayerTabs .fm-tab").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      renderPlayerTab(btn.getAttribute("data-tab"));
    });
  });

  renderPlayerTab("buteurs");

  // Calcul final de la densite des lignes du classement : fait en tout
  // dernier, une fois que tous les elements pouvant modifier la hauteur
  // disponible de la colonne (chips "meilleure attaque" etc., carte
  // Resultats) sont bien en place dans le DOM.
  requestAnimationFrame(() => fitStandingsTable());
}

loadCompetition();
</script>
</body>
</html>
