<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FM Web — Gameflow</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="moteur_match.js"></script>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #262a33;
    --text: #e8eaed;
    --text-dim: #8b909c;
    --accent: #4ade80;
    --accent-dim: #1f6b42;
    --danger: #ef4444;
    --gold: #fbbf24;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; min-height: 100%;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .topbar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 20px; border-bottom: 1px solid var(--border); background: var(--panel);
  }
  .topbar-left { display: flex; align-items: center; gap: 14px; }
  .back-link { color: var(--text-dim); text-decoration: none; font-size: 13px; }
  .back-link:hover { color: var(--text); }
  .game-name { font-weight: 700; font-size: 16px; }
  .game-meta { font-size: 12px; color: var(--text-dim); }
  .badge {
    font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em;
    padding: 3px 9px; border-radius: 999px; border: 1px solid var(--border); color: var(--text-dim);
  }
  .badge.host { color: var(--gold); border-color: var(--gold); }

  .wrap { max-width: 760px; margin: 0 auto; padding: 24px 20px 80px; }
  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; padding: 20px; margin-bottom: 16px;
  }
  .card h2 {
    font-size: 12.5px; margin: 0 0 14px; color: var(--text-dim);
    text-transform: uppercase; letter-spacing: 0.05em;
  }

  /* Etat de la partie */
  .state-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .state-item { text-align: center; }
  .state-value { font-size: 22px; font-weight: 800; }
  .state-value.date { font-size: 15px; }
  .state-label { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.04em; margin-top: 4px; }

  /* Game master (toujours visible en haut) */
  #gameMasterCard {
    position: sticky; top: 12px; z-index: 30;
    box-shadow: 0 8px 24px rgba(0,0,0,0.45);
  }

  /* Bouton continuer */
  .continue-panel { text-align: center; padding: 8px 0 4px; }
  #continueBtn {
    background: var(--gold); color: #3a2a00; border: none;
    padding: 16px 44px; border-radius: 999px; font-weight: 800;
    font-size: 16px; cursor: pointer; box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    transition: filter 0.15s, transform 0.1s;
  }
  #continueBtn:hover { filter: brightness(1.08); }
  #continueBtn:active { transform: scale(0.98); }
  #continueBtn:disabled { opacity: 0.45; cursor: default; filter: none; }
  .continue-hint { margin-top: 10px; font-size: 12px; color: var(--text-dim); }
  .not-host-hint {
    text-align: center; font-size: 13px; color: var(--text-dim);
    padding: 14px; border: 1px dashed var(--border); border-radius: 10px;
  }

  /* Simuler jusqu'à une date */
  .simulate-panel {
    margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap;
  }
  .simulate-panel input[type="date"] {
    background: #14171d; border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; padding: 9px 10px; font-size: 13px; font-family: inherit;
  }
  #simulateBtn {
    background: transparent; color: var(--text); border: 1px solid var(--border);
    padding: 9px 18px; border-radius: 999px; font-weight: 700; font-size: 13px;
    cursor: pointer; transition: border-color 0.15s, color 0.15s;
  }
  #simulateBtn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  #simulateBtn:disabled { opacity: 0.45; cursor: default; }
  .simulate-progress { width: 100%; text-align: center; font-size: 12px; color: var(--accent); margin-top: 8px; min-height: 16px; }

  /* Matchs du jour / journal */
  .match-row {
    display: flex; align-items: center; gap: 10px; padding: 8px 4px;
    font-size: 13px; border-bottom: 1px solid var(--border);
  }
  .match-row:last-child { border-bottom: none; }
  .match-comp { font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.03em; width: 70px; flex-shrink: 0; }
  .match-teams { flex: 1; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .match-teams .home { text-align: right; flex: 1; }
  .match-teams .away { text-align: left; flex: 1; }
  .match-score {
    font-weight: 700; font-variant-numeric: tabular-nums; background: #14171d;
    border: 1px solid var(--border); border-radius: 6px; padding: 2px 10px; flex-shrink: 0;
  }
  .match-score.pending { color: var(--text-dim); font-weight: 600; }
  .empty-hint { color: var(--text-dim); font-size: 13px; text-align: center; padding: 10px 0; }

  .log-entry { padding: 10px 0; border-bottom: 1px solid var(--border); }
  .log-entry:last-child { border-bottom: none; }
  .log-date { font-size: 12.5px; font-weight: 700; color: var(--gold); margin-bottom: 4px; }
  .log-event { font-size: 12.5px; color: var(--text-dim); margin: 2px 0; }
  .log-match { font-size: 12.5px; margin: 2px 0; }

  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--panel); border: 1px solid var(--border); padding: 10px 18px;
    border-radius: 8px; font-size: 13px; opacity: 0; pointer-events: none; transition: opacity 0.2s;
    z-index: 100;
  }
  .toast.show { opacity: 1; }
  .toast.error { border-color: var(--danger); color: var(--danger); }
  .hidden { display: none !important; }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <a class="back-link" id="backLink" href="dashboard.html">← Retour</a>
    <div>
      <div class="game-name" id="gameName">Chargement...</div>
      <div class="game-meta" id="gameMeta"></div>
    </div>
  </div>
  <span class="badge" id="hostBadge"></span>
</div>

<div class="wrap">

  <div class="card" id="gameMasterCard">
    <h2>Game master</h2>
    <div class="continue-panel">
      <button id="continueBtn" disabled>Continuer</button>
      <div class="continue-hint" id="continueHint">Chargement...</div>
    </div>
    <div class="simulate-panel" id="simulatePanel">
      <input type="date" id="simulateDateInput">
      <button id="simulateBtn" disabled>Simuler jusqu'à cette date</button>
      <div class="simulate-progress" id="simulateProgress"></div>
    </div>
    <div id="unlockPanel" style="display:none; margin-top:10px;">
      <div style="color:#c0392b; font-size:0.9em; margin-bottom:6px;">
        Le verrou de simulation semble bloqué (session précédente non terminée proprement).
      </div>
      <button id="unlockBtn">Débloquer la simulation</button>
    </div>
  </div>

  <div class="card">
    <h2>État de la partie</h2>
    <div class="state-grid">
      <div class="state-item">
        <div class="state-value" id="stateJour">—</div>
        <div class="state-label">Jour</div>
      </div>
      <div class="state-item">
        <div class="state-value date" id="stateDate">—</div>
        <div class="state-label">Date</div>
      </div>
      <div class="state-item">
        <div class="state-value" id="stateSaison">—</div>
        <div class="state-label">Saison</div>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>Aujourd'hui</h2>
    <div id="todayMatches"><div class="empty-hint">Chargement...</div></div>
  </div>

  <div class="card" id="logCard">
    <h2>Journal de la session</h2>
    <div id="logList"><div class="empty-hint">Les jours avancés pendant cette session apparaîtront ici.</div></div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = "https://occesdpptttbwwjyuaja.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9jY2VzZHBwdHR0Ynd3anl1YWphIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI5MjQ1MTAsImV4cCI6MjA5ODUwMDUxMH0.iQxZFp1wIs9TzCqC7j-DjEUuxPBqK0Hgp6N_9aq7wss";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const params = new URLSearchParams(window.location.search);
const gameId = params.get("game");

let userId = null;
let currentGame = null;
let isHost = false;

// Reessaie un appel PostgREST (select/rpc, retourne {data, error}) en cas
// d'erreur transitoire (503 pool de connexions sature, 57014 statement
// timeout, 55P03 lock timeout). chargerDonneesClub declenche 10 requetes en
// parallele par match (5 tables x domicile/exterieur) ; sur ce projet
// (max_connections=60, compute reduit), un rattrapage de plusieurs matchs de
// coupe en retard peut momentanement saturer le pool -> 503, ou faire
// collisionner deux ecritures RPC sur les memes lignes -> 55P03. Backoff
// court (150ms, 400ms) car l'erreur est generalement resolue en quelques
// centaines de ms (le pool se libere / le lock se relache des que la
// requete en cours se termine).
async function withRetry(fn, tentatives = 3) {
  let derniereErreur;
  for (let i = 0; i < tentatives; i++) {
    const result = await fn();
    if (!result.error) return result;
    const status = result.error.status || result.error.code;
    const transitoire = status === 503 || status === "503" || result.error.code === "57014" || result.error.code === "55P03";
    if (!transitoire || i === tentatives - 1) return result;
    derniereErreur = result.error;
    await new Promise((r) => setTimeout(r, 150 * Math.pow(2, i)));
  }
  return { data: null, error: derniereErreur };
}

function toast(msg, isError = false) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.className = "toast show" + (isError ? " error" : "");
  setTimeout(() => { el.className = "toast"; }, 2500);
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str ?? "";
  return div.innerHTML;
}

function computeRealDate(dateDebut, jourActuel) {
  if (!dateDebut) return null;
  const base = new Date(`${dateDebut}T00:00:00`);
  if (isNaN(base.getTime())) return null;
  const jours = Number(jourActuel);
  base.setDate(base.getDate() + (Number.isFinite(jours) ? jours : 0));
  return base;
}
function formatRealDate(date) {
  if (!date) return null;
  return new Intl.DateTimeFormat("fr-FR", { day: "2-digit", month: "long", year: "numeric" }).format(date);
}
function toISODate(date) {
  if (!date) return null;
  // Volontairement PAS date.toISOString() : ça convertit en UTC et decale
  // d'un jour en heure d'ete francaise (UTC+2), faisant chercher les matchs
  // du mauvais jour. On reste en composants de date locale.
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, "0");
  const d = String(date.getDate()).padStart(2, "0");
  return `${y}-${m}-${d}`;
}

async function init() {
  document.getElementById("backLink").href = `dashboard.html?game=${encodeURIComponent(gameId || "")}`;

  if (!gameId) {
    document.getElementById("gameName").textContent = "Aucune partie spécifiée";
    return;
  }

  const { data: { session } } = await supabaseClient.auth.getSession();
  if (!session?.user) {
    window.location.href = "index.html";
    return;
  }
  userId = session.user.id;

  await loadState();
  document.getElementById("continueBtn").addEventListener("click", onContinue);
  document.getElementById("simulateBtn").addEventListener("click", onSimulerJusque);
  document.getElementById("unlockBtn").addEventListener("click", onDebloquerSimulation);
}

// Force la liberation du verrou de simulation quand il reste bloque suite a
// une session precedente qui n'a pas pu passer par le "finally" de
// avancerUnJour (onglet ferme, ordi eteint, etc.). terminer_simulation_jour
// se contente de lever le verrou sans toucher aux donnees de la partie, donc
// c'est sans risque meme si aucune simulation n'est reellement en cours.
async function onDebloquerSimulation() {
  const unlockBtn = document.getElementById("unlockBtn");
  unlockBtn.disabled = true;
  unlockBtn.textContent = "Déblocage...";
  try {
    const { error } = await supabaseClient.rpc("terminer_simulation_jour", { p_game_id: gameId });
    if (error) throw error;
    document.getElementById("unlockPanel").style.display = "none";
    toast("Verrou débloqué, tu peux réessayer.");
  } catch (e) {
    console.error(e);
    toast("Erreur lors du déblocage : " + e.message, true);
  } finally {
    unlockBtn.disabled = false;
    unlockBtn.textContent = "Débloquer la simulation";
  }
}

async function loadState() {
  const { data: game, error } = await supabaseClient.from("games").select().eq("id", gameId).single();
  if (error || !game) {
    document.getElementById("gameName").textContent = "Partie introuvable";
    toast("Impossible de charger cette partie", true);
    return;
  }
  currentGame = game;
  isHost = game.created_by === userId;

  document.getElementById("gameName").textContent = game.nom;
  const realDate = computeRealDate(game.date_debut, game.jour_actuel);
  document.getElementById("gameMeta").textContent = `Saison ${game.saison} · ${game.statut}`;

  const hostBadge = document.getElementById("hostBadge");
  hostBadge.textContent = isHost ? "Game master" : "Lecture seule";
  hostBadge.className = "badge" + (isHost ? " host" : "");

  document.getElementById("stateJour").textContent = game.jour_actuel ?? "—";
  document.getElementById("stateDate").textContent = formatRealDate(realDate) || "—";
  document.getElementById("stateSaison").textContent = game.saison ?? "—";

  const btn = document.getElementById("continueBtn");
  const hint = document.getElementById("continueHint");
  const simPanel = document.getElementById("simulatePanel");
  const simBtn = document.getElementById("simulateBtn");
  const simInput = document.getElementById("simulateDateInput");

  if (!isHost) {
    btn.classList.add("hidden");
    hint.textContent = "Seul le créateur de la partie peut faire avancer le jeu.";
    simPanel.classList.add("hidden");
  } else if (game.statut === "lobby") {
    btn.classList.remove("hidden");
    btn.disabled = true;
    hint.textContent = "La partie doit être démarrée (depuis le dashboard) avant de pouvoir avancer les jours.";
    simPanel.classList.remove("hidden");
    simBtn.disabled = true;
  } else if (game.statut === "terminee") {
    btn.classList.remove("hidden");
    btn.disabled = true;
    hint.textContent = "Cette partie est terminée.";
    simPanel.classList.remove("hidden");
    simBtn.disabled = true;
  } else {
    btn.classList.remove("hidden");
    btn.disabled = false;
    hint.textContent = "Fait avancer la partie d'un jour : simule les matchs programmés, met à jour les classements, gère les fins de saison.";
    simPanel.classList.remove("hidden");
    simBtn.disabled = false;
  }

  // La date cible ne peut être qu'après la date actuelle de la partie
  if (realDate) {
    const minIso = toISODate(new Date(realDate.getTime() + 86400000));
    simInput.min = minIso;
    if (!simInput.value || simInput.value < minIso) simInput.value = minIso;
  }

  await loadTodayMatches(realDate);
}

async function loadTodayMatches(realDate) {
  const el = document.getElementById("todayMatches");
  const iso = toISODate(realDate);
  if (!iso) { el.innerHTML = `<div class="empty-hint">Date indisponible.</div>`; return; }

  const { data: matches, error } = await supabaseClient
    .from("calendrier")
    .select("id, competition_ref, statut, score_domicile, score_exterieur, club_domicile_id, club_exterieur_id")
    .eq("game_id", gameId)
    .eq("date_match", iso);

  if (error || !matches || matches.length === 0) {
    el.innerHTML = `<div class="empty-hint">Aucun match de championnat programmé aujourd'hui.</div>`;
    return;
  }

  const clubIds = [...new Set(matches.flatMap(m => [m.club_domicile_id, m.club_exterieur_id]))];
  const { data: clubs } = await supabaseClient.from("game_clubs").select("id, nom").in("id", clubIds);
  const clubNom = Object.fromEntries((clubs || []).map(c => [c.id, c.nom]));

  el.innerHTML = matches.map(m => matchRowHtml(m, clubNom)).join("");

  await loadTodayCoupeMatches(realDate);
}

// Affiche, sous les matchs de championnat du jour, les matchs de coupe
// nationale programmes a cette date (game_coupe_nationale_tours). Un bloc
// dedie car ces matchs n'appartiennent a aucune division/nation geree par
// `calendrier` (competition_ref pointe vers FRA_COUPE, ENG_COUPE, etc.).
async function loadTodayCoupeMatches(realDate) {
  const el = document.getElementById("todayMatches");
  const iso = toISODate(realDate);
  if (!iso) return;

  const { data: matches, error } = await supabaseClient
    .from("game_coupe_nationale_tours")
    .select("id, competition_ref, tour, statut, score_1, score_2, game_club_id_1, game_club_id_2")
    .eq("game_id", gameId)
    .eq("date_match", iso);

  if (error || !matches || matches.length === 0) return;

  const clubIds = [...new Set(matches.flatMap(m => [m.game_club_id_1, m.game_club_id_2]))];
  const { data: clubs } = await supabaseClient.from("game_clubs").select("id, nom").in("id", clubIds);
  const clubNom = Object.fromEntries((clubs || []).map(c => [c.id, c.nom]));

  const html = matches.map(m => matchRowHtmlCoupe(m, clubNom)).join("");
  if (el.querySelector(".empty-hint")) el.innerHTML = "";
  el.insertAdjacentHTML("beforeend", html);
}

function matchRowHtmlCoupe(m, clubNom) {
  const scoreHtml = m.statut === "termine"
    ? `<span class="match-score">${m.score_1} - ${m.score_2}</span>`
    : `<span class="match-score pending">à jouer</span>`;
  return `
    <div class="match-row">
      <span class="match-comp">${escapeHtml(m.competition_ref || "")} · T${m.tour}</span>
      <div class="match-teams">
        <span class="home">${escapeHtml(clubNom[m.game_club_id_1] || "?")}</span>
        ${scoreHtml}
        <span class="away">${escapeHtml(clubNom[m.game_club_id_2] || "?")}</span>
      </div>
    </div>
  `;
}

function matchRowHtml(m, clubNom) {
  const scoreHtml = m.statut === "joue"
    ? `<span class="match-score">${m.score_domicile} - ${m.score_exterieur}</span>`
    : `<span class="match-score pending">à jouer</span>`;
  return `
    <div class="match-row">
      <span class="match-comp">${escapeHtml(m.competition_ref || "")}</span>
      <div class="match-teams">
        <span class="home">${escapeHtml(clubNom[m.club_domicile_id] || "?")}</span>
        ${scoreHtml}
        <span class="away">${escapeHtml(clubNom[m.club_exterieur_id] || "?")}</span>
      </div>
    </div>
  `;
}

// Charge tout ce qu'il faut pour simuler un club (effectif complet equipe_a,
// tactique, coach, club, dynamique de groupe) depuis Supabase. Plusieurs
// attributs utilises par le moteur vivent sur des tables statiques (players,
// staff) et pas sur leur equivalent "en partie" (game_players, game_staff) :
// on les recupere via une jointure PostgREST (player_ref / staff_ref).
async function chargerDonneesClub(gameClubId) {
  let [{ data: gc, error: gcErr }, { data: joueursBruts, error: jErr }, { data: tactiqueRows, error: tErr }, { data: staffBruts, error: sErr }, { data: groupeRows, error: grErr }] = await Promise.all([
    withRetry(() => supabaseClient.from("game_clubs").select("id, nom, club_ref, clubs(reputation, niveau_pct, capacite_stade, affluence_moyenne)").eq("id", gameClubId).single()),
    withRetry(() => supabaseClient.from("game_players").select("*, players(regularite, tendance_blessure)").eq("game_club_id", gameClubId).eq("categorie", "equipe_a")),
    withRetry(() => supabaseClient.from("tactiques").select("*").eq("game_club_id", gameClubId)),
    withRetry(() => supabaseClient.from("game_staff").select("*, staff(niveau_tactique, niveau_attaque, niveau_defense, adaptabilite)").eq("game_club_id", gameClubId).eq("equipe_assignee", "equipe_a")),
    withRetry(() => supabaseClient.from("dynamique_groupe").select("note_globale").eq("game_club_id", gameClubId)),
  ]);
  if (gcErr) throw gcErr;
  if (jErr) throw jErr;
  if (tErr) throw tErr;
  if (sErr) throw sErr;
  if (grErr) throw grErr;

  // Aplatit players(regularite, tendance_blessure) directement sur chaque joueur
  let joueurs = (joueursBruts || []).map(({ players: statique, ...j }) => ({
    ...j,
    regularite: statique?.regularite,
    tendance_blessure: statique?.tendance_blessure,
  }));

  // Club sans effectif genere (typiquement un club amateur pioche au 1er tour
  // de la coupe nationale, cf. assembler_pool_amateurs_coupe_nationale) : le
  // moteur ne peut rien simuler sur un effectif vide. On genere ici un
  // effectif rapide, calibre sur la reputation/niveau_pct du club statique,
  // pour que ce match utilise EXACTEMENT le meme moteur (simulerMatch) que le
  // championnat, avec de vraies stats. La generation est idempotente cote
  // serveur (assurer_effectif_amateur_coupe) : une fois cree, l'effectif ne
  // change plus, donc reste le meme pour toute la duree de la coupe.
  if (joueurs.length === 0) {
    const { error: genErr } = await withRetry(() => supabaseClient
      .rpc("assurer_effectif_amateur_coupe", { p_game_id: gameId, p_game_club_id: gameClubId }));
    if (genErr) throw genErr;

    const { data: joueursGeneres, error: jGenErr } = await withRetry(() => supabaseClient
      .from("game_players").select("*, players(regularite, tendance_blessure)")
      .eq("game_club_id", gameClubId).eq("categorie", "equipe_a"));
    if (jGenErr) throw jGenErr;

    joueurs = (joueursGeneres || []).map(({ players: statique, ...j }) => ({
      ...j,
      regularite: statique?.regularite,
      tendance_blessure: statique?.tendance_blessure,
    }));

    // La tactique par defaut vient d'etre creee cote serveur (assurer_tactique_par_defaut,
    // appelee par assurer_effectif_amateur_coupe) : on la recharge pour ne pas
    // repartir sur composition_par_defaut() avec un effectif encore vide en cache.
    const { data: tactiqueGeneree, error: tGenErr } = await withRetry(() => supabaseClient
      .from("tactiques").select("*").eq("game_club_id", gameClubId));
    if (tGenErr) throw tGenErr;
    tactiqueRows = tactiqueGeneree;
  }

  // Filet de sécurité : un joueur sans nom (notamment un effectif amateur
  // généré à la volée pour un club "random" de coupe nationale) reçoit un
  // faux nom stable (seedé sur son id, donc identique à chaque relecture)
  // au lieu de tomber sur "?" partout (compo, stats, tirs au but...).
  joueurs = joueurs.map((j) => (j.nom ? j : { ...j, nom: genererNomAleatoire(j.id) }));

  let tactique = (tactiqueRows && tactiqueRows[0]) || null;
  if (!tactique || !tactique.compositions || tactique.compositions.length === 0) {
    const { data: compoDefaut, error: compoErr } = await withRetry(() => supabaseClient
      .rpc("composition_par_defaut", { p_game_club_id: gameClubId }));
    if (compoErr) throw compoErr;
    tactique = { compositions: compoDefaut || [], connaissance_tactique: 10 };
  }

  // composition_par_defaut() ne fournit pas player_nom/side/fit_score/slot_id : on complete
  const joueursParId = new Map(joueurs.map((j) => [j.id, j]));
  const compositionsDesignees = (tactique.compositions || []).map((slot, i) => ({
    fit_score: 2,
    side: "C",
    slot_id: `s${i}`,
    ...slot,
    player_nom: slot.player_nom || joueursParId.get(slot.player_id)?.nom || "?",
  }));

  // Compo du jour : le coach part de la compo désignée par la tactique mais
  // sort systématiquement un titulaire blessé, et peut préférer un remplaçant
  // au même poste si sa forme/note récente est nettement meilleure. La
  // tactique elle-même (formation, mentalité, style...) n'est jamais touchée.
  const { compositions, changements: changementsCompo } = choisirCompositionDuJour(compositionsDesignees, joueurs);

  // coach principal (non adjoint en priorite) assigne a l'equipe A, aplati avec ses attributs staff
  const coachBrut = (staffBruts || []).slice().sort(
    (a, b) => (a.est_adjoint ? 1 : 0) - (b.est_adjoint ? 1 : 0)
  )[0] || null;
  const coach = coachBrut
    ? { ...coachBrut, ...(coachBrut.staff || {}) }
    : null;

  return {
    nom: gc?.nom || "?",
    joueurs,
    tactique: { ...tactique, compositions },
    changementsCompo,
    coach,
    club: gc?.clubs || {},
    groupe: (groupeRows && groupeRows[0]) || null,
  };
}

async function simulerEtRecuperer(gameClubIdDom, nomDom, gameClubIdExt, nomExt, enjeu) {
  const [dom, ext] = await Promise.all([
    chargerDonneesClub(gameClubIdDom),
    chargerDonneesClub(gameClubIdExt),
  ]);
  return simulerMatch({
    domicile: { gameClubId: gameClubIdDom, nom: nomDom || dom.nom, joueurs: dom.joueurs, tactique: dom.tactique, coach: dom.coach, club: dom.club, groupe: dom.groupe },
    exterieur: { gameClubId: gameClubIdExt, nom: nomExt || ext.nom, joueurs: ext.joueurs, tactique: ext.tactique, coach: ext.coach, club: ext.club, groupe: ext.groupe },
    contexte: { enjeu, meteo: "normale" },
  });
}

// Simule et enregistre tous les matchs de championnat programmes a une date
// donnee (statut = 'a_jouer').
async function simulerMatchsDuJour(dateIso, onProgress) {
  const { data: matches, error } = await withRetry(() => supabaseClient
    .from("calendrier")
    .select("id, club_domicile_id, club_exterieur_id")
    .eq("game_id", gameId)
    .eq("date_match", dateIso)
    .eq("statut", "a_jouer"));
  if (error) throw error;
  if (!matches || matches.length === 0) return 0;

  for (let i = 0; i < matches.length; i++) {
    const m = matches[i];
    if (onProgress) onProgress("championnat", i + 1, matches.length);

    const resultat = await simulerEtRecuperer(m.club_domicile_id, null, m.club_exterieur_id, null, 0.3);

    // tentatives=6 (au lieu de 3) : ce RPC ecrit sur des lignes potentiellement
    // partagees (classement/groupe) et peut entrer en collision avec un autre
    // enregistrement du meme jour -> 55P03 (lock timeout). Le backoff
    // exponentiel (150ms..2400ms) laisse largement le temps au verrou de se
    // liberer avant d'abandonner.
    const { error: rpcErr } = await withRetry(() => supabaseClient.rpc("enregistrer_resultat_match", {
      p_match_id: m.id,
      p_score_domicile: resultat.score_domicile,
      p_score_exterieur: resultat.score_exterieur,
      p_stats: resultat.stats,
    }), 6);
    if (rpcErr) throw rpcErr;
  }

  return matches.length;
}

// Simule et enregistre les manches de barrage promotion/relegation programmees
// a une date donnee (aller : domicile = club_sup ; retour : domicile = club_inf,
// meme convention que l'ancien simuler_match(sup,inf) / simuler_match(inf,sup)).
// Enjeu plus eleve qu'un match de championnat classique (barrage = decisif).
async function simulerBarragesDuJour(dateIso, onProgress) {
  const { data: barrages, error } = await withRetry(() => supabaseClient
    .from("game_barrages_promotion")
    .select("id, game_club_sup_id, game_club_inf_id, date_match_aller, date_match_retour, score_aller_sup, score_aller_inf, score_retour_sup, statut")
    .eq("game_id", gameId)
    .neq("statut", "termine"));
  if (error) throw error;

  const aTraiter = (barrages || []).filter(b =>
    (b.date_match_aller === dateIso && b.score_aller_sup == null) ||
    (b.date_match_retour === dateIso && b.score_retour_sup == null)
  );
  if (aTraiter.length === 0) return 0;

  for (let i = 0; i < aTraiter.length; i++) {
    const b = aTraiter[i];
    if (onProgress) onProgress("barrage", i + 1, aTraiter.length);

    const manche = (b.date_match_aller === dateIso && b.score_aller_sup == null) ? "aller" : "retour";

    if (manche === "aller") {
      const resultat = await simulerEtRecuperer(b.game_club_sup_id, null, b.game_club_inf_id, null, 0.7);
      const { error: rpcErr } = await withRetry(() => supabaseClient.rpc("enregistrer_resultat_barrage", {
        p_barrage_id: b.id,
        p_manche: "aller",
        p_score_domicile: resultat.score_domicile,
        p_score_exterieur: resultat.score_exterieur,
        p_stats: resultat.stats,
      }), 6);
      if (rpcErr) throw rpcErr;
      continue;
    }

    // Match retour : domicile = club "inf" (cf convention documentee plus
    // haut). On charge les clubs nous-memes (plutot que via
    // simulerEtRecuperer) pour garder les onze sous la main : necessaires
    // si egalite au cumul et tirs au but a jouer juste apres.
    const [dom, ext] = await Promise.all([
      chargerDonneesClub(b.game_club_inf_id),
      chargerDonneesClub(b.game_club_sup_id),
    ]);
    const resultat = simulerMatch({
      domicile: { gameClubId: b.game_club_inf_id, nom: dom.nom, joueurs: dom.joueurs, tactique: dom.tactique, coach: dom.coach, club: dom.club, groupe: dom.groupe },
      exterieur: { gameClubId: b.game_club_sup_id, nom: ext.nom, joueurs: ext.joueurs, tactique: ext.tactique, coach: ext.coach, club: ext.club, groupe: ext.groupe },
      contexte: { enjeu: 0.7, meteo: "normale" },
    });

    // Cumul sur les deux manches (score_aller_sup/inf deja enregistres) :
    // egalite -> tirs au but avec de vrais tireurs/gardien (meme moteur que
    // la coupe, cf simulerTirsAuBut), stockes dans stats.seance_tab et
    // transmis a enregistrer_resultat_barrage. Remplace le tirage au sort
    // (random() < 0.5) qu'avancer_jour utilisait jusqu'ici en repli : ce
    // repli reste en place cote SQL pour les tres rares cas ou ce RPC
    // echouerait avant d'ecrire les scores de tirs au but, mais ne devrait
    // plus jamais se declencher en pratique.
    const aggSup = (b.score_aller_sup || 0) + resultat.score_exterieur;
    const aggInf = (b.score_aller_inf || 0) + resultat.score_domicile;
    let tabPenaltySup = null, tabPenaltyInf = null;
    if (aggSup === aggInf) {
      const tab = simulerTirsAuBut(resultat, b.game_club_inf_id, dom.joueurs, b.game_club_sup_id, ext.joueurs);
      tabPenaltyInf = tab.scoreDom;
      tabPenaltySup = tab.scoreExt;
      resultat.stats.seance_tab = tab.detail;
    }

    const { error: rpcErr } = await withRetry(() => supabaseClient.rpc("enregistrer_resultat_barrage", {
      p_barrage_id: b.id,
      p_manche: "retour",
      p_score_domicile: resultat.score_domicile,
      p_score_exterieur: resultat.score_exterieur,
      p_stats: resultat.stats,
      p_tab_penalty_sup: tabPenaltySup,
      p_tab_penalty_inf: tabPenaltyInf,
    }), 6);
    if (rpcErr) throw rpcErr;
  }

  return aTraiter.length;
}

// Tirs au but (match de coupe nul) : delegue a simulerSeanceTirsAuBut
// (moteur_match.js), qui designe de vrais tireurs/gardien (onze reellement
// sur le terrain en fin de match, jamais un joueur remplace ou expulse) et
// renvoie le detail tir par tir. Le moteur (simulerMatch) ne gere pas les
// tirs au but lui-meme (propre a la coupe, jamais de match sec en
// championnat) : geres ici, cote client, comme le reste de l'orchestration
// de la coupe. `resultat` est celui renvoye par simulerMatch (score nul) :
// on y lit stats.composition_finale pour recuperer l'onze de chaque equipe.
function simulerTirsAuBut(resultat, gameClubIdDom, joueursDom, gameClubIdExt, joueursExt) {
  return simulerSeanceTirsAuBut({
    domicile: { gameClubId: gameClubIdDom, joueurs: joueursDom, onze: resultat.stats.composition_finale.domicile },
    exterieur: { gameClubId: gameClubIdExt, joueurs: joueursExt, onze: resultat.stats.composition_finale.exterieur },
  });
}

// Simule et enregistre les matchs de coupe nationale programmes a une date
// donnee OU EN RETARD (date_match <= dateIso). Le rattrapage est necessaire
// car les tours preliminaires (amateurs, D2) sont espaces de 3 semaines et
// peuvent tomber a une date deja depassee si la coupe est (re)generee en
// cours de saison. Match sec : tirs au but si egalite. Les byes sont deja
// 'termine' a la generation du tour, donc jamais retournes ici.
async function simulerCoupeDuJour(dateIso, onProgress) {
  const { data: matches, error } = await withRetry(() => supabaseClient
    .from("game_coupe_nationale_tours")
    .select("id, game_club_id_1, game_club_id_2")
    .eq("game_id", gameId)
    .lte("date_match", dateIso)
    .eq("statut", "a_jouer"));
  if (error) throw error;
  if (!matches || matches.length === 0) return 0;

  for (let i = 0; i < matches.length; i++) {
    const m = matches[i];
    if (onProgress) onProgress("coupe", i + 1, matches.length);

    const [dom, ext] = await Promise.all([
      chargerDonneesClub(m.game_club_id_1),
      chargerDonneesClub(m.game_club_id_2),
    ]);
    const resultat = simulerMatch({
      domicile: { gameClubId: m.game_club_id_1, nom: dom.nom, joueurs: dom.joueurs, tactique: dom.tactique, coach: dom.coach, club: dom.club, groupe: dom.groupe },
      exterieur: { gameClubId: m.game_club_id_2, nom: ext.nom, joueurs: ext.joueurs, tactique: ext.tactique, coach: ext.coach, club: ext.club, groupe: ext.groupe },
      contexte: { enjeu: 0.65, meteo: "normale" },
    });

    let tabDom = null, tabExt = null;
    if (resultat.score_domicile === resultat.score_exterieur) {
      const tab = simulerTirsAuBut(resultat, m.game_club_id_1, dom.joueurs, m.game_club_id_2, ext.joueurs);
      tabDom = tab.scoreDom;
      tabExt = tab.scoreExt;
      // Detail tir par tir (tireur, gardien adverse, reussi/type d'echec) :
      // embarque dans p_stats (deja un jsonb generique transmis tel quel),
      // exploitable par une fiche match sans toucher a la signature de l'RPC.
      resultat.stats.seance_tab = tab.detail;
    }

    const { error: rpcErr } = await withRetry(() => supabaseClient.rpc("enregistrer_resultat_match_coupe", {
      p_match_id: m.id,
      p_score_domicile: resultat.score_domicile,
      p_score_exterieur: resultat.score_exterieur,
      p_tab_penalty_domicile: tabDom,
      p_tab_penalty_exterieur: tabExt,
      p_stats: resultat.stats,
    }), 6);
    if (rpcErr) throw rpcErr;
  }

  return matches.length;
}

// Fait avancer la partie d'exactement un jour (simulation client des matchs/
// barrages/coupe du jour a venir, puis RPC avancer_jour). Factorisee pour
// etre appelee soit une fois (bouton Continuer), soit en boucle (Simuler
// jusqu'a une date). onProgress(type, fait, total) est optionnel.
// ---- Coupes d'Europe : tours qualificatifs (aller-retour, taux reduit) ----
// N'appelle PAS de resolution/avancement de tour ici : traiter_tours_qualificatifs_europe_du_jour
// (cote serveur, dans finaliser_journee) s'en charge une fois la date_match_retour atteinte.
async function simulerTourQualifEuropeDuJour(dateIso, onProgress) {
  const { data: allerDus, error: e1 } = await withRetry(() => supabaseClient
    .from("game_tours_qualificatifs_europe")
    .select("id, game_club_id_1, game_club_id_2")
    .eq("game_id", gameId).lte("date_match_aller", dateIso).eq("statut", "a_jouer"));
  if (e1) throw e1;

  const { data: retoursDus, error: e2 } = await withRetry(() => supabaseClient
    .from("game_tours_qualificatifs_europe")
    .select("id, game_club_id_1, game_club_id_2, score_aller_1, score_aller_2")
    .eq("game_id", gameId).lte("date_match_retour", dateIso).eq("statut", "aller_joue"));
  if (e2) throw e2;

  const matches = [...(allerDus || []).map(m => ({ ...m, leg: "aller" })), ...(retoursDus || []).map(m => ({ ...m, leg: "retour" }))];
  if (!matches.length) return 0;

  for (let i = 0; i < matches.length; i++) {
    const m = matches[i];
    if (onProgress) onProgress("europe", i + 1, matches.length);

    // club_1 recoit l'aller, club_2 recoit le retour
    const recoitAller = m.leg === "aller";
    const idDom = recoitAller ? m.game_club_id_1 : m.game_club_id_2;
    const idExt = recoitAller ? m.game_club_id_2 : m.game_club_id_1;
    const resultat = await simulerEtRecuperer(idDom, null, idExt, null, 0.7);

    const score1 = recoitAller ? resultat.score_domicile : resultat.score_exterieur;
    const score2 = recoitAller ? resultat.score_exterieur : resultat.score_domicile;

    let tab1 = null, tab2 = null;
    if (m.leg === "retour") {
      const totalAller1 = m.score_aller_1 ?? 0, totalAller2 = m.score_aller_2 ?? 0;
      if (totalAller1 + score1 === totalAller2 + score2) {
        const [j1, j2] = await Promise.all([chargerDonneesClub(m.game_club_id_1), chargerDonneesClub(m.game_club_id_2)]);
        // idDom/idExt : le club qui recevait ce match retour (cf. calcul de
        // score1/score2 ci-dessus) — l'onze final de `resultat` correspond a
        // domicile=idDom / exterieur=idExt, pas forcement club_id_1/2.
        const tab = simulerTirsAuBut(resultat, idDom, idDom === m.game_club_id_1 ? j1.joueurs : j2.joueurs, idExt, idExt === m.game_club_id_1 ? j1.joueurs : j2.joueurs);
        tab1 = idDom === m.game_club_id_1 ? tab.scoreDom : tab.scoreExt;
        tab2 = idDom === m.game_club_id_1 ? tab.scoreExt : tab.scoreDom;
        resultat.stats.seance_tab = tab.detail;
      }
    }

    const { error: rpcErr } = await withRetry(() => supabaseClient.rpc("enregistrer_resultat_match_qualif_europe", {
      p_match_id: m.id, p_leg: m.leg, p_score_1: score1, p_score_2: score2,
      p_tab_penalty_1: tab1, p_tab_penalty_2: tab2, p_stats: resultat.stats,
    }), 6);
    if (rpcErr) throw rpcErr;
  }
  return matches.length;
}

// ---- Coupes d'Europe : barrage KO / 8e / quarts / demies (aller-retour) + finale (match sec, terrain NEUTRE) ----
async function simulerPhaseFinaleEuropeDuJour(dateIso, onProgress) {
  const { data: allerDus, error: e1 } = await withRetry(() => supabaseClient
    .from("game_phase_finale_europe")
    .select("id, phase, game_club_id_1, game_club_id_2")
    .eq("game_id", gameId).lte("date_match_aller", dateIso).eq("statut", "a_jouer"));
  if (e1) throw e1;

  const { data: retoursDus, error: e2 } = await withRetry(() => supabaseClient
    .from("game_phase_finale_europe")
    .select("id, phase, game_club_id_1, game_club_id_2, score_aller_1, score_aller_2")
    .eq("game_id", gameId).lte("date_match_retour", dateIso).eq("statut", "aller_joue"));
  if (e2) throw e2;

  const matches = [...(allerDus || []).map(m => ({ ...m, leg: "aller" })), ...(retoursDus || []).map(m => ({ ...m, leg: "retour" }))];
  if (!matches.length) return 0;

  for (let i = 0; i < matches.length; i++) {
    const m = matches[i];
    if (onProgress) onProgress("europe", i + 1, matches.length);

    const estFinale = m.phase === "finale";
    const recoitAller = m.leg === "aller";
    let resultat, score1, score2;

    if (estFinale) {
      // Terrain neutre : aucun bonus/malus domicile-exterieur pour aucun des deux clubs.
      const [c1, c2] = await Promise.all([chargerDonneesClub(m.game_club_id_1), chargerDonneesClub(m.game_club_id_2)]);
      resultat = simulerMatch({
        domicile: { gameClubId: m.game_club_id_1, nom: c1.nom, joueurs: c1.joueurs, tactique: c1.tactique, coach: c1.coach, club: c1.club, groupe: c1.groupe },
        exterieur: { gameClubId: m.game_club_id_2, nom: c2.nom, joueurs: c2.joueurs, tactique: c2.tactique, coach: c2.coach, club: c2.club, groupe: c2.groupe },
        contexte: { enjeu: 0.9, meteo: "normale", neutre: true },
      });
      score1 = resultat.score_domicile; score2 = resultat.score_exterieur;
    } else {
      const idDom = recoitAller ? m.game_club_id_1 : m.game_club_id_2;
      const idExt = recoitAller ? m.game_club_id_2 : m.game_club_id_1;
      resultat = await simulerEtRecuperer(idDom, null, idExt, null, 0.8);
      score1 = recoitAller ? resultat.score_domicile : resultat.score_exterieur;
      score2 = recoitAller ? resultat.score_exterieur : resultat.score_domicile;
    }

    let tab1 = null, tab2 = null;
    const estDecisif = estFinale || m.leg === "retour";
    if (estDecisif) {
      const totalAller1 = estFinale ? 0 : (m.score_aller_1 ?? 0);
      const totalAller2 = estFinale ? 0 : (m.score_aller_2 ?? 0);
      if (totalAller1 + score1 === totalAller2 + score2) {
        const [j1, j2] = await Promise.all([chargerDonneesClub(m.game_club_id_1), chargerDonneesClub(m.game_club_id_2)]);
        const tab = simulerTirsAuBut(j1.joueurs, j2.joueurs);
        tab1 = tab.scoreDom; tab2 = tab.scoreExt;
      }
    }

    const { error: rpcErr } = await withRetry(() => supabaseClient.rpc("enregistrer_resultat_match_europe_finale", {
      p_match_id: m.id, p_leg: m.leg, p_score_1: score1, p_score_2: score2,
      p_tab_penalty_1: tab1, p_tab_penalty_2: tab2, p_stats: resultat.stats,
    }), 6);
    if (rpcErr) throw rpcErr;
  }
  return matches.length;
}

async function avancerUnJour(onProgress) {
  const prochainJour = (Number(currentGame?.jour_actuel) || 0) + 1;
  const prochaineDate = computeRealDate(currentGame?.date_debut, prochainJour);
  const prochaineDateIso = toISODate(prochaineDate);

  // Reserve la partie pour toute la duree du traitement du jour (matchs +
  // avancer_jour + finaliser_journee). Empeche une deuxieme session
  // concurrente sur la MEME partie (deuxieme onglet, page rechargee en plein
  // "Simuler jusqu'a"...) d'ecrire en parallele sur les memes lignes
  // (classement/calendrier via enregistrer_resultat_match, puis games via
  // avancer_jour/finaliser_journee), ce qui provoquait des 55P03 (lock
  // timeout) au lieu d'un message clair. Liberee dans le "finally" ci-dessous
  // quoi qu'il arrive ; expire aussi automatiquement cote serveur au bout de
  // 2 minutes en cas d'echec anormal (onglet ferme brutalement, etc.).
  // Retente demarrer_simulation_jour en cas d'echec transitoire :
  // - P0001 = verrou deja pris par une simulation precedente (onglet ferme
  //   brutalement, double-clic...) ; le serveur dit lui-meme "reessaie dans
  //   quelques secondes", donc on retente avec un backoff plus long.
  // - 57014/55P03 = timeout/lock passager, comme pour avancer_jour plus bas.
  let demarrerErr;
  for (let tentative = 0; tentative < 5; tentative++) {
    ({ error: demarrerErr } = await supabaseClient.rpc("demarrer_simulation_jour", { p_game_id: gameId }));
    if (!demarrerErr) break;
    const retryable = demarrerErr.code === "P0001" || demarrerErr.code === "57014" || demarrerErr.code === "55P03";
    if (!retryable || tentative === 4) break;
    const delai = demarrerErr.code === "P0001" ? 2000 * (tentative + 1) : 300 * Math.pow(2, tentative);
    if (onProgress) onProgress("finalisation", 0, 1);
    await new Promise((r) => setTimeout(r, delai));
  }
  if (demarrerErr) throw demarrerErr;

  try {
    if (prochaineDateIso) {
      const nbMatchs = await simulerMatchsDuJour(prochaineDateIso, onProgress);
      const nbBarrages = await simulerBarragesDuJour(prochaineDateIso, onProgress);
      const nbCoupe = await simulerCoupeDuJour(prochaineDateIso, onProgress);
      const nbQualifEurope = await simulerTourQualifEuropeDuJour(prochaineDateIso, onProgress);
      const nbLigueEurope = await simulerPhaseLigueEuropeDuJour(prochaineDateIso, onProgress);
      const nbFinaleEurope = await simulerPhaseFinaleEuropeDuJour(prochaineDateIso, onProgress);
      if (onProgress && (nbMatchs > 0 || nbBarrages > 0 || nbCoupe > 0 || nbQualifEurope > 0 || nbLigueEurope > 0 || nbFinaleEurope > 0)) onProgress("finalisation", 1, 1);
    }

    // avancer_jour est transactionnel (select ... for update + tout le reste
    // dans la meme fonction) : un timeout annule tout, rien n'est applique
    // partiellement. On peut donc retenter sans risque de double-avancement,
    // ce qui absorbe les pics de charge passagers sur la base.
    // IMPORTANT : on retente aussi bien 57014 (statement_timeout) que 55P03
    // (lock_timeout, 8s au niveau du role authenticated) -- le SELECT ... FOR
    // UPDATE sur games peut se heurter a un verrou momentanement tenu par un
    // appel precedent, et sans retry sur 55P03 l'erreur brute remontait direct
    // au client juste apres la simulation des matchs.
    let data, error;
    for (let tentative = 0; tentative < 4; tentative++) {
      ({ data, error } = await supabaseClient.rpc("avancer_jour", { p_game_id: gameId }));
      if (!error || (error.code !== "57014" && error.code !== "55P03")) break;
      if (tentative < 3) await new Promise((r) => setTimeout(r, 300 * Math.pow(2, tentative)));
    }
    if (error) throw error;

    // finaliser_journee applique le bonus de forme "repos" aux joueurs geres
    // qui n'ont pas joue ce jour-la, fait progresser les coupes nationales,
    // et gere la fin de saison / barrages / calendrier suivant. Doit etre
    // appelee avec la date du jour qu'on vient de simuler (prochaineDateIso),
    // une fois que tous les matchs/barrages/coupe de ce jour sont enregistres.
    if (prochaineDateIso) {
      let finError;
      for (let tentative = 0; tentative < 4; tentative++) {
        ({ error: finError } = await supabaseClient.rpc("finaliser_journee", {
          p_game_id: gameId,
          p_date: prochaineDateIso,
        }));
        if (!finError || (finError.code !== "57014" && finError.code !== "55P03")) break;
        if (tentative < 3) await new Promise((r) => setTimeout(r, 300 * Math.pow(2, tentative)));
      }
      if (finError) throw finError;
    }

    return data;
  } finally {
    const { error: terminerErr } = await supabaseClient.rpc("terminer_simulation_jour", { p_game_id: gameId });
    if (terminerErr) console.error("Impossible de liberer le verrou de simulation :", terminerErr);
  }
}

async function onContinue() {
  const btn = document.getElementById("continueBtn");
  const simBtn = document.getElementById("simulateBtn");
  const hint = document.getElementById("continueHint");
  btn.disabled = true;
  simBtn.disabled = true;
  try {
    btn.textContent = "Simulation...";
    const onProgress = (type, fait, total) => {
      const label = type === "barrage" ? "des barrages" : type === "coupe" ? "des matchs de coupe" : type === "finalisation" ? null : "des matchs";
      hint.textContent = label ? `Simulation ${label} : ${fait}/${total}...` : "Finalisation...";
    };
    const data = await avancerUnJour(onProgress);
    btn.textContent = "...";
    appendLogEntry(data);
    await loadState();
    toast(`Jour ${data.jour_actuel} — ${formatRealDate(new Date(data.date + "T00:00:00"))}`);
  } catch (e) {
    console.error(e);
    toast("Erreur : " + e.message, true);
    if (e.code === "P0001") document.getElementById("unlockPanel").style.display = "block";
  } finally {
    btn.textContent = "Continuer";
    btn.disabled = !isHost || currentGame?.statut === "lobby" || currentGame?.statut === "terminee";
    simBtn.disabled = btn.disabled;
  }
}

// Enchaine avancerUnJour() automatiquement, jour apres jour, jusqu'a
// atteindre (ou depasser) la date choisie dans le champ, sans que l'hote
// ait besoin de recliquer manuellement sur Continuer a chaque fois.
async function onSimulerJusque() {
  const continueBtn = document.getElementById("continueBtn");
  const simBtn = document.getElementById("simulateBtn");
  const simInput = document.getElementById("simulateDateInput");
  const hint = document.getElementById("continueHint");
  const progressEl = document.getElementById("simulateProgress");

  const targetIso = simInput.value;
  if (!targetIso) { toast("Choisis une date cible", true); return; }
  const targetDate = new Date(`${targetIso}T00:00:00`);
  if (isNaN(targetDate.getTime())) { toast("Date invalide", true); return; }

  const currentRealDate = computeRealDate(currentGame?.date_debut, currentGame?.jour_actuel);
  if (currentRealDate && targetDate <= currentRealDate) {
    toast("La date cible doit être après la date actuelle", true);
    return;
  }

  continueBtn.disabled = true;
  simBtn.disabled = true;
  simInput.disabled = true;
  let joursSimules = 0;
  const MAX_JOURS = 730; // garde-fou anti-boucle infinie (~2 saisons)

  try {
    while (joursSimules < MAX_JOURS) {
      const realDate = computeRealDate(currentGame?.date_debut, currentGame?.jour_actuel);
      if (!realDate || realDate >= targetDate) break;
      if (currentGame?.statut === "terminee") { toast("La partie est terminée."); break; }

      joursSimules++;
      progressEl.textContent = `Simulation en cours : jour ${joursSimules} (avant le ${formatRealDate(targetDate)})...`;
      const onProgress = (type, fait, total) => {
        const label = type === "barrage" ? "des barrages" : type === "coupe" ? "des matchs de coupe" : type === "finalisation" ? null : "des matchs";
        if (label) hint.textContent = `Jour ${joursSimules} — simulation ${label} : ${fait}/${total}...`;
      };

      const data = await avancerUnJour(onProgress);
      appendLogEntry(data);
      await loadState();

      if (currentGame?.statut === "terminee") {
        toast("Fin de saison atteinte pendant la simulation.");
        break;
      }
    }

    progressEl.textContent = "";
    if (joursSimules >= MAX_JOURS) {
      toast("Limite de sécurité atteinte (730 jours simulés).", true);
    } else if (joursSimules > 0) {
      toast(`${joursSimules} jour(s) simulé(s) jusqu'au ${formatRealDate(targetDate)}`);
    } else {
      toast("Rien à simuler, la partie est déjà à cette date ou après.");
    }
  } catch (e) {
    console.error(e);
    progressEl.textContent = "";
    toast("Erreur pendant la simulation : " + e.message, true);
    if (e.code === "P0001") document.getElementById("unlockPanel").style.display = "block";
  } finally {
    simInput.disabled = false;
    continueBtn.disabled = !isHost || currentGame?.statut === "lobby" || currentGame?.statut === "terminee";
    simBtn.disabled = continueBtn.disabled;
  }
}

function appendLogEntry(data) {
  const list = document.getElementById("logList");
  if (list.querySelector(".empty-hint")) list.innerHTML = "";

  const dateLabel = formatRealDate(new Date(data.date + "T00:00:00"));
  const matchsHtml = (data.matchs || []).map(m =>
    `<div class="log-match">${escapeHtml(m.domicile)} <strong>${m.score_domicile} - ${m.score_exterieur}</strong> ${escapeHtml(m.exterieur)}</div>`
  ).join("");
  const eventsHtml = (data.evenements || []).map(e => `<div class="log-event">${escapeHtml(e)}</div>`).join("");

  const entry = document.createElement("div");
  entry.className = "log-entry";
  entry.innerHTML = `
    <div class="log-date">Jour ${data.jour_actuel} — ${dateLabel}</div>
    ${eventsHtml}
    ${matchsHtml || (eventsHtml ? "" : `<div class="log-event">Rien de particulier.</div>`)}
  `;
  list.prepend(entry);
}

init();
</script>
