<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FM Web — Effectif</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-2: #1c2029;
    --border: #262a33;
    --text: #e8eaed;
    --text-dim: #8b909c;
    --accent: #4ade80;
    --gold: #fbbf24;
    --danger: #ef4444;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    min-height: 100vh;
  }
  .topbar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 20px; border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  .topbar-left { display: flex; align-items: center; gap: 14px; }
  .back-link { color: var(--text-dim); text-decoration: none; font-size: 13px; }
  .back-link:hover { color: var(--text); }
  .club-name { font-weight: 700; font-size: 16px; }
  .club-meta { font-size: 12px; color: var(--text-dim); }

  .wrap { max-width: 1180px; margin: 0 auto; padding: 24px 20px; }

  .empty-state {
    text-align: center; color: var(--text-dim); font-size: 14px;
    padding: 60px 20px;
  }
  .hidden { display: none !important; }

  table.squad-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .squad-table thead th {
    text-align: left; color: var(--text-dim); font-weight: 500; font-size: 11px;
    text-transform: uppercase; letter-spacing: 0.04em; padding: 10px 12px;
    border-bottom: 1px solid var(--border); white-space: nowrap;
    position: sticky; top: 0; background: var(--panel-2);
  }
  .squad-table tbody td {
    padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: middle;
    white-space: nowrap;
  }
  .squad-table tbody tr:hover { background: rgba(255,255,255,0.02); }
  .squad-table tbody tr:last-child td { border-bottom: none; }

  .table-wrap {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; overflow: hidden;
  }
  .table-scroll { max-height: 74vh; overflow: auto; }

  .player-name { font-weight: 600; color: var(--text); }
  .nat-chip {
    display: inline-flex; align-items: center; justify-content: center;
    background: #14171d; border: 1px solid var(--border);
    padding: 3px 6px; border-radius: 5px; min-width: 28px; min-height: 18px;
  }
  .flag-icon { width: 20px; height: auto; display: block; border-radius: 2px; }
  .status-chip {
    display: inline-block; background: rgba(251,191,36,0.12); border: 1px solid rgba(251,191,36,0.35);
    color: var(--gold); font-size: 11px; padding: 2px 7px; border-radius: 5px; font-weight: 600;
  }
  .postes-cell { color: var(--text-dim); }

  .stars { position: relative; display: inline-block; font-size: 14px; letter-spacing: 2px; line-height: 1; }
  .stars-bg { color: var(--border); }
  .stars-fg {
    position: absolute; top: 0; left: 0; overflow: hidden; white-space: nowrap; color: var(--gold);
  }

  .contract-soon { color: var(--danger); }

  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--panel); border: 1px solid var(--border); padding: 10px 18px;
    border-radius: 8px; font-size: 13px; opacity: 0; pointer-events: none; transition: opacity 0.2s;
    z-index: 100;
  }
  .toast.show { opacity: 1; }
  .toast.error { border-color: var(--danger); color: var(--danger); }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <a href="#" id="backLink" class="back-link">← Retour</a>
    <div>
      <div class="club-name" id="clubName">Chargement...</div>
      <div class="club-meta" id="clubMeta"></div>
    </div>
  </div>
</div>

<div class="wrap">
  <div class="table-wrap">
    <div class="table-scroll">
      <table class="squad-table">
        <thead>
          <tr>
            <th>Statut</th>
            <th>Nat.</th>
            <th>Âge</th>
            <th>Nom</th>
            <th>Postes</th>
            <th>Salaire</th>
            <th>Fin de contrat</th>
            <th>Valeur estimée</th>
            <th>Réputation</th>
          </tr>
        </thead>
        <tbody id="squadBody"></tbody>
      </table>
    </div>
  </div>
  <div id="squadEmpty" class="empty-state hidden">Aucun joueur trouvé pour ce club.</div>
</div>

<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = "https://occesdpptttbwwjyuaja.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9jY2VzZHBwdHR0Ynd3anl1YWphIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI5MjQ1MTAsImV4cCI6MjA5ODUwMDUxMH0.iQxZFp1wIs9TzCqC7j-DjEUuxPBqK0Hgp6N_9aq7wss";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const params = new URLSearchParams(window.location.search);
const gameId = params.get("game");
const gameClubId = params.get("club");

document.getElementById("backLink").href = `dashboard.html?game=${encodeURIComponent(gameId || "")}`;

function toast(msg, isError = false) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.className = "toast show" + (isError ? " error" : "");
  setTimeout(() => { el.className = "toast"; }, 2500);
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str ?? "";
  return div.innerHTML;
}

// Drapeaux : Angleterre / Ecosse / Pays de Galles utilisent les codes de subdivision
// geres par flagcdn.com (gb-eng, gb-sct, gb-wls), pas de code ISO propre.
const GB_SUBCODES = { ENG: "gb-eng", SCO: "gb-sct", WAL: "gb-wls" };

// Codes a 3 lettres (style FIFA) -> code ISO 3166-1 alpha-2
const NAT_CODE_TO_ISO2 = {
  FRA: "fr", GER: "de", ALL: "de", ESP: "es", ITA: "it", POR: "pt", NED: "nl",
  HOL: "nl", BEL: "be", NIR: "gb", IRL: "ie", SUI: "ch", AUT: "at", TUR: "tr",
  GRE: "gr", RUS: "ru", UKR: "ua", POL: "pl", CZE: "cz", CRO: "hr", SRB: "rs",
  ROU: "ro", BUL: "bg", HUN: "hu", DEN: "dk", SWE: "se", NOR: "no", FIN: "fi",
  ISL: "is", BRA: "br", ARG: "ar", URU: "uy", CHI: "cl", COL: "co", PER: "pe",
  ECU: "ec", PAR: "py", BOL: "bo", VEN: "ve", MEX: "mx", USA: "us", CAN: "ca",
  JPN: "jp", KOR: "kr", AUS: "au", MAR: "ma", ALG: "dz", TUN: "tn", SEN: "sn",
  CIV: "ci", CMR: "cm", NGA: "ng", GHA: "gh", EGY: "eg", KSA: "sa", QAT: "qa",
  CHN: "cn", BIH: "ba", SVK: "sk", SVN: "si", ALB: "al", MKD: "mk", MNE: "me",
  ISR: "il", GEO: "ge", ARM: "am", AZE: "az", KAZ: "kz", LUX: "lu", CYP: "cy",
  MLT: "mt", LTU: "lt", LVA: "lv", EST: "ee", BLR: "by", MDA: "md", FRO: "fo",
  AND: "ad", SMR: "sm", LIE: "li", GIB: "gb", GNB: "gw", GAM: "gm", MLI: "ml",
  BFA: "bf", GAB: "ga", COD: "cd", RSA: "za", ANG: "ao", MOZ: "mz", ZIM: "zw",
  KEN: "ke", ETH: "et", TAN: "tz", UGA: "ug", CPV: "cv", GUI: "gn", GNE: "gq",
  TOG: "tg", BEN: "bj", NIG: "ne", TCH: "td", CTA: "cf", CGO: "cg", RWA: "rw",
  ZAM: "zm", MWI: "mw", NAM: "na", BOT: "bw", SWZ: "sz", LES: "ls", MDG: "mg",
  IND: "in", PAK: "pk", THA: "th", VIE: "vn", IDN: "id", MAS: "my",
  SIN: "sg", PHI: "ph", IRN: "ir", IRQ: "iq", SYR: "sy", LIB: "lb", JOR: "jo",
  UAE: "ae", OMA: "om", KUW: "kw", BHR: "bh", YEM: "ye", AFG: "af", UZB: "uz",
  KGZ: "kg", TJK: "tj", TKM: "tm", MNG: "mn", NZL: "nz", FIJ: "fj", HAI: "ht",
  JAM: "jm", TRI: "tt", CRC: "cr", PAN: "pa", HON: "hn", GUA: "gt", NCA: "ni",
  SLV: "sv", CUB: "cu", DOM: "do", PUR: "pr",
};

function flagCodeForNat(code) {
  if (!code) return null;
  const c = code.trim().toUpperCase();
  if (GB_SUBCODES[c]) return GB_SUBCODES[c];
  if (NAT_CODE_TO_ISO2[c]) return NAT_CODE_TO_ISO2[c];
  if (/^[A-Z]{2}$/.test(c)) return c.toLowerCase(); // deja un code ISO2
  return null; // inconnu : on retombera sur le texte brut
}

function flagImg(code, label) {
  const flagCode = flagCodeForNat(code);
  if (!flagCode) return escapeHtml(label || code || "-");
  return `<img class="flag-icon" src="https://flagcdn.com/${flagCode}.svg" alt="${escapeHtml(code)}" loading="lazy">`;
}

function formatMoneyShort(n) {
  if (n === null || n === undefined) return "-";
  if (Math.abs(n) >= 1000000) return (n / 1000000).toLocaleString("fr-FR", { maximumFractionDigits: 1 }) + " M€";
  if (Math.abs(n) >= 1000) return (n / 1000).toLocaleString("fr-FR", { maximumFractionDigits: 0 }) + " k€";
  return new Intl.NumberFormat("fr-FR").format(n) + " €";
}

// Jamais la valeur exacte : on arrondit à un palier "propre" selon l'ordre de grandeur,
// puis on affiche une fourchette autour de la valeur estimée (+/- ~15%).
function roundStep(n) {
  if (n < 500000) return 50000;
  if (n < 2000000) return 100000;
  if (n < 10000000) return 500000;
  if (n < 50000000) return 1000000;
  if (n < 150000000) return 5000000;
  return 10000000;
}

function valueRange(v) {
  if (v === null || v === undefined) return "-";
  const step = roundStep(v);
  const low = Math.max(0, Math.round((v * 0.85) / step) * step);
  const high = Math.round((v * 1.15) / step) * step;
  if (low === high) return formatMoneyShort(low);
  return `${formatMoneyShort(low)} - ${formatMoneyShort(high)}`;
}

// Barème étoiles calé sur la distribution réelle de reputation_mondiale (5 à 10000)
const STAR_BANDS = [
  [500, 1], [1000, 1.5], [1750, 2], [2750, 2.5],
  [4250, 3], [5800, 3.5], [7500, 4], [9000, 4.5], [Infinity, 5]
];
function starsFromReputation(rep) {
  if (rep === null || rep === undefined) return 0.5;
  for (const [max, stars] of STAR_BANDS) {
    if (rep < max) return stars;
  }
  return 5;
}
function starsHtml(rating) {
  const pct = (rating / 5) * 100;
  return `<span class="stars" title="${rating}/5">
    <span class="stars-bg">★★★★★</span>
    <span class="stars-fg" style="width:${pct}%">★★★★★</span>
  </span>`;
}

function formatDate(d) {
  if (!d) return "-";
  const date = new Date(d);
  return date.toLocaleDateString("fr-FR", { month: "short", year: "numeric" });
}

let gameCurrentDate = null; // date en jeu, calculee a partir de date_debut + jour_actuel

function isContractSoon(d) {
  if (!d || !gameCurrentDate) return false;
  const months = (new Date(d) - gameCurrentDate) / (1000 * 60 * 60 * 24 * 30);
  return months < 6;
}

async function loadSquad() {
  if (!gameId || !gameClubId) {
    document.getElementById("clubName").textContent = "Club introuvable";
    return;
  }

  const { data: { session } } = await supabaseClient.auth.getSession();
  if (!session?.user) {
    window.location.href = "index.html";
    return;
  }

  const { data: game, error: gameErr } = await supabaseClient
    .from("games")
    .select("date_debut, jour_actuel")
    .eq("id", gameId)
    .single();

  if (!gameErr && game) {
    gameCurrentDate = new Date(game.date_debut);
    gameCurrentDate.setDate(gameCurrentDate.getDate() + (game.jour_actuel || 0));
  }

  const { data: club, error: clubErr } = await supabaseClient
    .from("game_clubs")
    .select("nom")
    .eq("id", gameClubId)
    .eq("game_id", gameId)
    .single();

  if (clubErr || !club) {
    document.getElementById("clubName").textContent = "Club introuvable";
    toast("Impossible de charger ce club", true);
    return;
  }

  document.getElementById("clubName").textContent = club.nom;

  const { data: players, error } = await supabaseClient
    .from("game_players")
    .select("id, nom, age, nationalite, poste_brut, statut_special, salaire_actuel, contrat_expire, valeur_marchande_actuelle, reputation_mondiale")
    .eq("game_id", gameId)
    .eq("game_club_id", gameClubId)
    .order("reputation_mondiale", { ascending: false, nullsFirst: false });

  if (error) {
    toast("Erreur chargement effectif : " + error.message, true);
    return;
  }

  document.getElementById("clubMeta").textContent = `${(players || []).length} joueurs`;

  const body = document.getElementById("squadBody");
  const emptyEl = document.getElementById("squadEmpty");

  if (!players || players.length === 0) {
    document.querySelector(".table-wrap").style.display = "none";
    emptyEl.classList.remove("hidden");
    return;
  }

  body.innerHTML = players.map(p => `
    <tr class="player-row" data-player-id="${p.id}" style="cursor:pointer">
      <td>${p.statut_special ? `<span class="status-chip">${escapeHtml(p.statut_special)}</span>` : ""}</td>
      <td><span class="nat-chip" title="${escapeHtml(p.nationalite || '')}">${flagImg(p.nationalite)}</span></td>
      <td>${p.age ?? "-"}</td>
      <td class="player-name">${escapeHtml(p.nom)}</td>
      <td class="postes-cell">${escapeHtml(p.poste_brut || "-")}</td>
      <td>${formatMoneyShort(p.salaire_actuel)}${p.salaire_actuel ? " / mois" : ""}</td>
      <td class="${isContractSoon(p.contrat_expire) ? "contract-soon" : ""}">${formatDate(p.contrat_expire)}</td>
      <td>${valueRange(p.valeur_marchande_actuelle)}</td>
      <td>${starsHtml(starsFromReputation(p.reputation_mondiale))}</td>
    </tr>
  `).join("");

  body.querySelectorAll(".player-row").forEach(row => {
    row.addEventListener("click", () => {
      const pid = row.getAttribute("data-player-id");
      window.location.href = `fiche.html?game=${encodeURIComponent(gameId)}&club=${encodeURIComponent(gameClubId)}&player=${encodeURIComponent(pid)}`;
    });
  });
}

loadSquad();
</script>
</body>
</html>
