<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FM Web — Infos club</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-2: #1c2029;
    --border: #262a33;
    --text: #e8eaed;
    --text-dim: #8b909c;
    --accent: #4ade80;
    --gold: #fbbf24;
    --danger: #ef4444;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    min-height: 100vh;
  }
  .hidden { display: none !important; }

  .empty-state {
    text-align: center; color: var(--text-dim); font-size: 14px;
    padding: 60px 20px;
  }

  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--panel); border: 1px solid var(--border); padding: 10px 18px;
    border-radius: 8px; font-size: 13px; opacity: 0; pointer-events: none; transition: opacity 0.2s;
    z-index: 100;
  }
  .toast.show { opacity: 1; }
  .toast.error { border-color: var(--danger); color: var(--danger); }

  /* ============================================================
     VUE PRINCIPALE (meme esprit que dashboard.html / squad.html :
     topbar rouge, sidebar de navigation a gauche, plein ecran)
     ============================================================ */
  #clubView {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    background: var(--bg); z-index: 5;
  }

  .fm-header {
    display: flex; justify-content: space-between; align-items: center; flex-wrap: nowrap;
    gap: 14px; padding: 12px 22px; flex: 0 0 auto;
    background: linear-gradient(120deg, #4c1116, #7a1620 55%, #9c2430);
    border-bottom: 1px solid rgba(0,0,0,0.3);
  }
  .fm-header .title-block { display: flex; align-items: center; gap: 16px; min-width: 0; }
  .fm-header .back-link {
    color: rgba(255,255,255,0.75); text-decoration: none; font-size: 13px;
    flex-shrink: 0; padding-right: 14px; border-right: 1px solid rgba(255,255,255,0.2);
  }
  .fm-header .back-link:hover { color: #fff; }
  .fm-header .right-block { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  .fm-date-badge {
    background: rgba(0,0,0,0.28); border-radius: 8px; padding: 7px 14px;
    text-align: right; line-height: 1.35; color: #fff;
  }
  .fm-date-badge .day-num { font-size: 13px; font-weight: 800; white-space: nowrap; }
  .fm-date-badge .season-line { font-size: 11px; color: rgba(255,255,255,0.7); }

  .page-title-wrap { position: relative; }
  .page-title-input {
    background: transparent; border: none; outline: none; color: #fff;
    font-size: 18px; font-weight: 800; letter-spacing: 0.02em; padding: 2px 0;
    width: 230px; max-width: 40vw; font-family: inherit;
  }
  .page-title-input::placeholder {
    color: rgba(255,255,255,0.92); font-weight: 800; opacity: 1;
  }
  .manager-line {
    font-size: 12px; color: rgba(255,255,255,0.78); margin-top: 2px; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }
  .fm-search-dropdown {
    position: absolute; top: calc(100% + 8px); left: 0; min-width: 300px; max-width: 380px;
    background: #14171d; border: 1px solid var(--border); border-radius: 10px;
    box-shadow: 0 12px 32px rgba(0,0,0,0.5); z-index: 200; max-height: 380px; overflow-y: auto;
  }
  .fm-search-dropdown.hidden { display: none !important; }
  .search-group-label {
    padding: 8px 12px 4px; font-size: 10px; text-transform: uppercase;
    letter-spacing: 0.05em; color: var(--text-dim);
  }
  .search-result-item {
    display: flex; align-items: center; gap: 10px; padding: 8px 12px; font-size: 13px;
    color: var(--text); cursor: pointer;
  }
  .search-result-item:hover { background: rgba(251,191,36,0.1); color: var(--gold); }
  .search-result-icon { flex-shrink: 0; font-size: 13px; }
  .search-result-sub { font-size: 11px; color: var(--text-dim); margin-top: 1px; }
  .search-empty { padding: 14px 12px; font-size: 12px; color: var(--text-dim); text-align: center; }

  .fm-body { flex: 1; display: flex; align-items: stretch; min-height: 0; }

  .fm-sidebar {
    width: 220px; flex-shrink: 0; background: var(--panel); border-right: 1px solid var(--border);
    overflow-y: auto; padding: 10px 0;
  }
  .fm-nav-item {
    display: flex; align-items: center; gap: 12px; padding: 12px 20px; font-size: 13.5px;
    color: var(--text-dim); cursor: pointer; border-left: 3px solid transparent; user-select: none;
  }
  .fm-nav-item:hover { background: rgba(255,255,255,0.03); color: var(--text); }
  .fm-nav-item.active {
    background: rgba(251,191,36,0.08); color: var(--gold); border-left-color: var(--gold); font-weight: 700;
  }
  .fm-nav-icon { width: 18px; text-align: center; flex-shrink: 0; }

  .fm-content-col { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }

  /* Sous-onglets de la page club (Infos club / Effectif) */
  .fm-subtabs {
    display: flex; gap: 4px; padding: 10px 24px 0; background: var(--panel);
    border-bottom: 1px solid var(--border); flex: 0 0 auto;
  }
  .fm-subtab {
    display: flex; align-items: center; gap: 8px; padding: 10px 16px; font-size: 13px;
    font-weight: 700; color: var(--text-dim); cursor: pointer; border-bottom: 3px solid transparent;
    user-select: none;
  }
  .fm-subtab:hover { color: var(--text); }
  .fm-subtab.active { color: var(--gold); border-bottom-color: var(--gold); }
  .fm-subtab-icon { width: 18px; text-align: center; flex-shrink: 0; }

  .fm-content-wrap { flex: 1; min-width: 0; min-height: 0; overflow-y: auto; padding: 20px 24px; }

  .club-hero {
    display: flex; align-items: center; gap: 18px; background: var(--panel);
    border: 1px solid var(--border); border-radius: 12px; padding: 18px 22px; margin-bottom: 16px;
  }
  .club-badge {
    width: 96px; height: 138px; border-radius: 16px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 30px; font-weight: 800; color: #1a1300;
    box-shadow: 0 6px 18px rgba(0,0,0,0.4);
  }
  .club-badge img { width: 100%; height: 100%; object-fit: contain; border-radius: 16px; }
  .club-hero-info { flex: 1; min-width: 0; }
  .club-hero-name { font-size: 20px; font-weight: 800; }
  .club-hero-sub {
    display: flex; align-items: center; gap: 8px; margin-top: 4px; font-size: 12.5px; color: var(--text-dim);
    flex-wrap: wrap;
  }
  .flag-icon { width: 18px; height: auto; border-radius: 2px; vertical-align: middle; }
  .chip {
    display: inline-block; background: rgba(251,191,36,0.1); border: 1px solid rgba(251,191,36,0.3);
    color: var(--gold); font-size: 11px; padding: 3px 9px; border-radius: 999px; font-weight: 700;
  }
  .chip.dim { background: rgba(255,255,255,0.05); border-color: var(--border); color: var(--text-dim); }

  .club-grid {
    display: grid; grid-template-columns: 1.15fr 1fr; gap: 16px; align-items: start;
  }
  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; padding: 16px 18px; margin-bottom: 16px;
  }
  .card-title {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--gold); margin-bottom: 14px;
  }
  .fm-empty { color: var(--text-dim); font-size: 13px; padding: 4px 0; line-height: 1.5; }

  .stat-row {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 9px 0; border-bottom: 1px solid rgba(255,255,255,0.04); font-size: 13px;
  }
  .stat-row:last-child { border-bottom: none; }
  .stat-row .label { color: var(--text-dim); }
  .stat-row .value { font-weight: 700; }

  .stars { position: relative; display: inline-block; font-size: 14px; letter-spacing: 2px; line-height: 1; }
  .stars-bg { color: var(--border); }
  .stars-fg {
    position: absolute; top: 0; left: 0; overflow: hidden; white-space: nowrap; color: var(--gold);
  }

  .key-people { display: flex; flex-direction: column; gap: 10px; }
  .key-person {
    display: flex; align-items: center; gap: 10px; padding: 8px 0;
    border-bottom: 1px solid rgba(255,255,255,0.04);
  }
  .key-person:last-child { border-bottom: none; }
  .key-person-icon {
    width: 30px; height: 30px; border-radius: 8px; background: rgba(251,191,36,0.1);
    display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0;
  }
  .key-person-role { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.03em; color: var(--text-dim); }
  .key-person-name { font-size: 13.5px; font-weight: 700; }
  .key-person-name.muted { color: var(--text-dim); font-weight: 500; }

  .palmares-list { display: flex; flex-direction: column; gap: 6px; }
  .palmares-item {
    display: flex; align-items: center; gap: 10px; font-size: 13px; padding: 6px 0;
    border-bottom: 1px solid rgba(255,255,255,0.04);
  }
  .palmares-item:last-child { border-bottom: none; }
  .palmares-item .trophy { font-size: 15px; }
  .palmares-item .count { margin-left: auto; color: var(--gold); font-weight: 800; font-size: 12px; }

  /* Terrain illustre pour la derniere composition */
  .pitch-caption { font-size: 12px; color: var(--text-dim); margin-bottom: 10px; line-height: 1.5; }
  .pitch-wrap { width: 100%; }
  .pitch-svg { width: 100%; height: auto; display: block; }
  .pitch-player-dot { fill: var(--gold); stroke: #3a2a00; stroke-width: 1.5; }
  .pitch-player-label {
    fill: #fff; font-size: 9px; font-weight: 800; text-anchor: middle; pointer-events: none;
  }
  .pitch-name-label {
    fill: var(--text-dim); font-size: 7.5px; text-anchor: middle; pointer-events: none;
  }
  /* Version miniature du terrain, casee en bas de la colonne laterale */
  .pitch-mini .pitch-wrap { max-width: 170px; margin: 0 0 0 auto; }
  .pitch-mini .pitch-caption { text-align: right; }

  /* ---- Compétitions (sous-onglet) : calendrier horizontal en haut (pleine
     largeur, plus d'espace), compétitions du club en dessous ---- */
  .fm-competitions-view { width: 100%; display: flex; flex-direction: column; gap: 16px; }
  .fm-comp-calendar-pane {
    width: 100%; background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; display: flex; flex-direction: column; overflow: hidden;
    height: min(46vh, 460px);
  }
  .fm-comp-calendar-header {
    flex: 0 0 auto; padding: 14px 18px; border-bottom: 1px solid var(--border);
    font-weight: 700; font-size: 14px;
  }
  .fm-comp-calendar-list {
    flex: 1; min-height: 0; overflow-y: auto; position: relative;
    scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.14) transparent;
  }
  .fm-comp-calendar-list::-webkit-scrollbar { width: 6px; }
  .fm-comp-calendar-list::-webkit-scrollbar-track { background: transparent; }
  .fm-comp-calendar-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.14); border-radius: 999px; }
  .fm-comp-calendar-list::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.26); }
  .fm-comp-match-row {
    display: flex; align-items: center; gap: 14px; padding: 12px 18px;
    border-bottom: 1px solid var(--border); font-size: 12.5px;
  }
  .fm-comp-match-row:last-child { border-bottom: none; }
  .fm-comp-match-row.played { opacity: 0.82; }
  .fm-comp-match-row.next {
    background: rgba(251,191,36,0.07); border-left: 3px solid var(--gold);
    padding-left: 15px; opacity: 1;
  }
  .fm-comp-match-row.next .fm-comp-match-tag {
    display: inline-block; margin-left: 8px; font-size: 9.5px; text-transform: uppercase;
    letter-spacing: 0.04em; font-weight: 700; color: var(--gold);
    background: rgba(251,191,36,0.12); border: 1px solid #7a5c0f; border-radius: 999px; padding: 2px 7px;
  }
  .fm-comp-match-date { width: 64px; flex-shrink: 0; color: var(--text-dim); line-height: 1.3; text-transform: capitalize; }
  .fm-comp-match-date .day { font-weight: 700; color: var(--text); font-size: 13px; display: block; }
  .fm-comp-match-journee {
    width: 34px; flex-shrink: 0; font-size: 10.5px; color: var(--text-dim); text-align: center;
    background: #14171d; border: 1px solid var(--border); border-radius: 6px; padding: 3px 0;
  }
  .fm-comp-match-side {
    width: 20px; flex-shrink: 0; font-weight: 700; font-size: 11px; text-align: center;
    border-radius: 5px; padding: 2px 0;
  }
  .fm-comp-match-side.dom { color: var(--accent); }
  .fm-comp-match-side.ext { color: var(--gold); }
  .fm-comp-match-opp { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; cursor: pointer; }
  .fm-comp-match-opp:hover { color: var(--gold); text-decoration: underline; }
  .fm-comp-match-rank {
    flex-shrink: 0; font-size: 11px; color: var(--text-dim); background: #14171d;
    border: 1px solid var(--border); border-radius: 999px; padding: 3px 9px;
  }
  .fm-comp-match-score {
    flex-shrink: 0; font-size: 12.5px; font-weight: 800; border-radius: 999px; padding: 3px 11px;
    border: 1px solid var(--border); background: #14171d; color: var(--text);
  }
  .fm-comp-match-score.victoire { color: var(--accent); border-color: #2f6b45; background: rgba(74,222,128,0.1); }
  .fm-comp-match-score.defaite { color: #f87171; border-color: #7a2f2f; background: rgba(248,113,113,0.1); }
  .fm-comp-match-score.nul { color: var(--text-dim); }
  /* Le pane de droite n'a pas de hauteur de conteneur fixe ici (la page
     scrolle, contrairement au dashboard) : on lui donne donc une hauteur
     explicite (comme le calendrier juste au-dessus) plutot qu'un flex:1,
     pour que la carte carree puisse combler cet espace. */
  .fm-comp-right-pane {
    width: 100%; display: flex; flex-wrap: wrap; align-content: stretch; gap: 14px;
    height: min(50vh, 520px);
  }
  .fm-comp-card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 16px 18px; cursor: pointer; transition: border-color 0.15s;
    display: flex; flex-direction: column; overflow: hidden;
    aspect-ratio: 1 / 1; min-height: 280px; max-height: 520px;
  }
  .fm-comp-card:hover { border-color: var(--gold); }
  .fm-comp-card-head { flex: 0 0 auto; display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 14px; }
  .fm-comp-card-title { font-size: 15px; font-weight: 800; }
  .fm-comp-card-sub { font-size: 11.5px; color: var(--text-dim); margin-top: 2px; }
  .fm-comp-card-tag {
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.04em; font-weight: 700;
    background: rgba(251,191,36,0.12); color: var(--gold); border: 1px solid #7a5c0f;
    border-radius: 999px; padding: 3px 9px; flex-shrink: 0; white-space: nowrap;
  }
  .fm-comp-card-stats { flex: 0 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .fm-comp-stat .label { font-size: 10px; text-transform: uppercase; color: var(--text-dim); letter-spacing: 0.03em; margin-bottom: 3px; }
  .fm-comp-stat .value { font-size: 15px; font-weight: 700; }
  .fm-comp-mini-standings-wrap {
    flex: 1; min-height: 0; overflow-y: auto; margin-top: 14px; padding-top: 12px;
    border-top: 1px solid var(--border);
    scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.14) transparent;
  }
  .fm-comp-mini-standings-wrap::-webkit-scrollbar { width: 6px; }
  .fm-comp-mini-standings-wrap::-webkit-scrollbar-track { background: transparent; }
  .fm-comp-mini-standings-wrap::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.14); border-radius: 999px; }
  .fm-comp-mini-standings-wrap::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.26); }
  .fm-comp-mini-table { width: 100%; border-collapse: collapse; font-size: 11.5px; }
  .fm-comp-mini-table th {
    position: sticky; top: 0; background: var(--panel); text-align: left; font-size: 9.5px;
    text-transform: uppercase; letter-spacing: 0.03em; color: var(--text-dim);
    padding: 4px 6px; border-bottom: 1px solid var(--border);
  }
  .fm-comp-mini-table tbody tr { cursor: pointer; }
  .fm-comp-mini-table tbody tr:hover td { background: rgba(255,255,255,0.03); }
  .fm-comp-mini-table td { padding: 5px 6px; border-bottom: 1px solid rgba(255,255,255,0.04); }
  .fm-comp-mini-table tr:last-child td { border-bottom: none; }
  .fm-comp-mini-table tr.me td { background: rgba(251,191,36,0.1); }
  .fm-comp-mini-table tr.me .clt, .fm-comp-mini-table tr.me .nm { color: var(--gold); font-weight: 800; }
  .fm-comp-mini-table td.clt { color: var(--text-dim); width: 24px; }
  .fm-comp-mini-table td.nm {
    max-width: 0; width: 100%; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; cursor: pointer; font-weight: 600;
  }
  .fm-comp-mini-table td.nm:hover { color: var(--gold); text-decoration: underline; }
  .fm-comp-mini-table td.num { color: var(--text-dim); text-align: center; width: 28px; }
  .fm-comp-mini-table td.pts { font-weight: 700; text-align: center; width: 30px; color: var(--text); }
  .fm-comp-card-footer {
    flex: 0 0 auto; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border);
    font-size: 11.5px; color: var(--text-dim); display: flex; justify-content: space-between; align-items: center;
  }
  .fm-comp-empty { padding: 40px 20px; text-align: center; color: var(--text-dim); font-size: 13px; }
  @media (max-width: 900px) {
    .fm-comp-calendar-pane { height: 56vh; }
    .fm-comp-right-pane { flex-direction: column; flex-wrap: nowrap; height: auto; }
    .fm-comp-card { aspect-ratio: auto; height: 420px; max-height: none; }
    .fm-comp-card-stats { grid-template-columns: repeat(2, 1fr); }
  }

  /* ---- Staff (sous-onglet) : 3 colonnes departement + fiches membres ---- */
  .staff-columns {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; align-items: start;
  }
  .staff-col-title {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--gold); margin-bottom: 12px;
  }
  .staff-col-title .count {
    background: rgba(255,255,255,0.06); color: var(--text-dim); border-radius: 999px;
    padding: 2px 9px; font-size: 11px; font-weight: 700; text-transform: none; letter-spacing: 0;
  }
  .staff-member-card {
    display: flex; align-items: center; gap: 12px; background: var(--panel);
    border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px;
    cursor: pointer; transition: border-color 0.15s, transform 0.1s;
  }
  .staff-member-card:hover { border-color: var(--gold); transform: translateY(-1px); }
  .staff-avatar {
    width: 42px; height: 42px; border-radius: 10px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 800; color: #1a1300;
  }
  .staff-member-info { flex: 1; min-width: 0; }
  .staff-member-name { font-size: 13.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .staff-member-role { font-size: 11px; color: var(--text-dim); margin-top: 1px; }
  .staff-member-meta {
    display: flex; align-items: center; gap: 6px; margin-top: 5px; font-size: 11px; color: var(--text-dim);
    flex-wrap: wrap;
  }
  .staff-member-meta .flag-icon { width: 14px; height: auto; margin-right: 0; }
  .staff-attr-chip {
    display: inline-flex; align-items: center; gap: 3px; background: rgba(255,255,255,0.05);
    border-radius: 6px; padding: 1px 6px; font-size: 10.5px; color: var(--text-dim);
  }
  .staff-attr-chip b { color: var(--text); font-weight: 700; }
  .staff-member-side { text-align: right; flex-shrink: 0; font-size: 11px; color: var(--text-dim); }
  .staff-member-side .salaire { color: var(--text); font-weight: 700; font-size: 12px; }
  .staff-col-empty { color: var(--text-dim); font-size: 12.5px; padding: 6px 0 14px; }

  /* ---- Staff : colonnes-recap cliquables (effectif + comparaison ligue) ---- */
  .staff-column {
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    padding: 14px 16px; cursor: pointer; transition: border-color 0.15s, transform 0.1s;
  }
  .staff-column:hover { border-color: var(--gold); transform: translateY(-1px); }
  .staff-col-recap { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
  .staff-recap-count {
    display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
    font-size: 11.5px; color: var(--text-dim);
  }
  .staff-recap-count b { color: var(--text); font-weight: 800; }
  .staff-recap-rank { font-size: 10.5px; font-weight: 700; white-space: nowrap; color: var(--text-dim); }
  .staff-recap-rank.pos { color: #6bcf7f; }
  .staff-recap-rank.neg { color: #e2725b; }
  .staff-recap-roles { display: flex; flex-wrap: wrap; gap: 5px; }
  .staff-role-mini-chip {

  [500, 1], [1000, 1.5], [1750, 2], [2750, 2.5],
  [4250, 3], [5800, 3.5], [7500, 4], [9000, 4.5], [Infinity, 5]
];
function starsFromReputation(rep) {
  if (rep === null || rep === undefined) return 0;
  for (const [max, stars] of STAR_BANDS) {

  return 5;
}
function starsHtml(rating) {
  if (rating === null || rating === undefined) return "-";
  const pct = Math.max(0, Math.min(100, (rating / 5) * 100));
  return `<span class="stars" title="${rating.toFixed(1)}/5">
    <span class="stars-bg">★★★★★</span>
    <span class="stars-fg" style="width:${pct}%">★★★★★</span>
  </span>`;
}

function computeRealDate(dateDebut, jourActuel) {
  if (!dateDebut) return null;
  const base = new Date(`${dateDebut}T00:00:00`);
  if (isNaN(base.getTime())) return null;
  const jours = Number(jourActuel);
  base.setDate(base.getDate() + (Number.isFinite(jours) ? jours : 0));
  return base;
}
function formatRealDate(date) {

}

// ===================== RECHERCHE GLOBALE (identique a dashboard.html / squad.html,
// sauf que le clic sur un club redirige ici vers sa fiche "Infos club") =====================
let searchDebounceTimer = null;
let headerSearchDocListenerAttached = false;

function initHeaderSearch() {
  const input = document.getElementById("fmSearchInput");
  const dropdown = document.getElementById("fmSearchDropdown");
  if (!input || !dropdown) return;

  input.addEventListener("input", () => {
    clearTimeout(searchDebounceTimer);
    const q = input.value.trim();
    if (q.length < 2) {
      dropdown.classList.add("hidden");
      dropdown.innerHTML = "";
      return;
    }
    searchDebounceTimer = setTimeout(() => runGlobalSearch(q, dropdown), 250);
  });

  input.addEventListener("focus", () => {
    if (input.value.trim().length >= 2 && dropdown.innerHTML) dropdown.classList.remove("hidden");
  });

  input.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      input.value = "";
      dropdown.classList.add("hidden");
      dropdown.innerHTML = "";
      input.blur();
    }
  });

  if (!headerSearchDocListenerAttached) {
    document.addEventListener("click", (e) => {
      const wrap = document.getElementById("fmSearchWrap");
      const dd = document.getElementById("fmSearchDropdown");
      if (wrap && dd && !wrap.contains(e.target)) dd.classList.add("hidden");
    });
    headerSearchDocListenerAttached = true;
  }
}

async function runGlobalSearch(q, dropdown) {
  // Recherche par mots : chaque mot doit apparaitre dans le nom (peu importe
  // l'ordre), ce qui permet de trouver "Adrien Rabiot" meme tape dans un
  // autre ordre, ou "Saka" tout seul. Les joueurs sont classes par reputation
  // mondiale pour faire remonter les plus connus en premier plutot que des
  // correspondances anecdotiques.
  const words = q.trim().split(/\s+/).filter(Boolean);

  let clubQuery = supabaseClient.from("game_clubs").select("id, nom").eq("game_id", gameId);
  words.forEach(w => { clubQuery = clubQuery.ilike("nom", `%${w}%`); });

  let playerQuery = supabaseClient
    .from("game_players")
    .select("id, nom, poste_brut, game_club_id, reputation_mondiale")
    .eq("game_id", gameId);
  words.forEach(w => { playerQuery = playerQuery.ilike("nom", `%${w}%`); });

  const [
    { data: clubs },
    { data: players, error: playersError },
  ] = await Promise.all([
    clubQuery.order("nom", { ascending: true }).limit(6),
    playerQuery.order("reputation_mondiale", { ascending: false, nullsFirst: false }).limit(8),
  ]);
  if (playersError) console.error(playersError);

  // Noms de club recuperes a part (plutot qu'une jointure imbriquee
  // club:game_clubs(nom)) : cette jointure est fragile si la relation FK
  // n'est pas explicite cote Supabase et faisait echouer silencieusement
  // toute la recherche joueurs (aucun resultat, meme pour un nom existant).
  let clubNameById = {};
  if (players && players.length > 0) {
    const clubIds = [...new Set(players.map(p => p.game_club_id).filter(Boolean))];
    if (clubIds.length > 0) {
      const { data: clubRows } = await supabaseClient
        .from("game_clubs")
        .select("id, nom")
        .in("id", clubIds);
      (clubRows || []).forEach(c => { clubNameById[c.id] = c.nom; });
    }
  }

  const hasClubs = clubs && clubs.length > 0;
  const hasPlayers = players && players.length > 0;

  if (!hasClubs && !hasPlayers) {
    dropdown.innerHTML = `<div class="search-empty">Aucun résultat pour "${escapeHtml(q)}"</div>`;
    dropdown.classList.remove("hidden");
    return;
  }

  let html = "";
  if (hasClubs) {
    html += `<div class="search-group-label">Clubs</div>`;
    html += clubs.map(c => `
      <div class="search-result-item" data-type="club" data-id="${c.id}">
        <span class="search-result-icon">🛡️</span>
        <span>${escapeHtml(c.nom)}</span>
      </div>
    `).join("");
  }
  if (hasPlayers) {
    html += `<div class="search-group-label">Joueurs</div>`;
    html += players.map(p => `
      <div class="search-result-item" data-type="player" data-id="${p.id}" data-club="${p.game_club_id ?? ""}">
        <span class="search-result-icon">🧍</span>
        <span>
          <div>${escapeHtml(p.nom)}</div>
          <div class="search-result-sub">${escapeHtml(p.poste_brut || "-")}${clubNameById[p.game_club_id] ? " · " + escapeHtml(clubNameById[p.game_club_id]) : ""}</div>
        </span>
      </div>
    `).join("");
  }

  dropdown.innerHTML = html;
  dropdown.classList.remove("hidden");

  dropdown.querySelectorAll(".search-result-item").forEach(item => {
    item.addEventListener("click", () => {
      const type = item.getAttribute("data-type");
      const id = item.getAttribute("data-id");
      if (type === "club") {
        window.location.href = `club.html?game=${encodeURIComponent(gameId)}&club=${encodeURIComponent(id)}`;
      } else {
        const clubId = item.getAttribute("data-club");
        window.location.href = `fiche.html?game=${encodeURIComponent(gameId)}&club=${encodeURIComponent(clubId)}&player=${encodeURIComponent(id)}`;
      }
    });
  });
}

// Pas encore de veritable logo uploade pour les clubs : on genere un blason
// de substitution a partir des initiales du nom, avec une couleur stable
// (derivee du nom) pour que chaque club garde toujours le meme badge.
function initials(nom) {
  const words = (nom || "").trim().split(/\s+/).filter(Boolean);
  if (words.length === 0) return "?";
  if (words.length === 1) return words[0].slice(0, 2).toUpperCase();
  return (words[0][0] + words[1][0]).toUpperCase();
}
function colorFromName(nom) {
  let hash = 0;
  for (let i = 0; i < (nom || "").length; i++) hash = nom.charCodeAt(i) + ((hash << 5) - hash);
  const hue = Math.abs(hash) % 360;
  return `hsl(${hue}, 62%, 46%)`;
}
function renderClubBadge(club, rawClub) {
  const logoUrl = rawClub?.logo_url || rawClub?.logo || null;
  if (logoUrl) return `<img src="${escapeHtml(logoUrl)}" alt="">`;
  return initials(club.nom);
}

async function fetchFinanceHistory(club) {
  const { data, error } = await supabaseClient
    .from("game_events")
    .select("jour, payload")
    .eq("game_id", gameId)
    .eq("game_club_id", club.game_club_id)
    .eq("type", "finance")
    .order("jour", { ascending: true })
    .order("id", { ascending: true });

  if (error || !data || data.length === 0) return [];

  const deltas = data.map(ev => Number(ev.payload?.montant) || 0);
  const totalDelta = deltas.reduce((a, b) => a + b, 0);
  let running = (club.budget_actuel || 0) - totalDelta;

  return data.map((ev, i) => {
    running += deltas[i];
    return { jour: ev.jour, value: running, delta: deltas[i], motif: ev.payload?.motif || null };
  });
}

function renderFinanceChart(history) {
  const w = 400, h = 90, padY = 8;
  const values = history.map(p => p.value);
  const min = Math.min(...values), max = Math.max(...values);
  const range = Math.max(1, max - min);
  const stepX = history.length > 1 ? w / (history.length - 1) : 0;

  const coords = history.map((pt, i) => {
    const x = history.length > 1 ? i * stepX : w / 2;
    const y = h - padY - ((pt.value - min) / range) * (h - padY * 2);
    return { x, y, pt };
  });

  const linePoints = coords.map(c => `${c.x.toFixed(1)},${c.y.toFixed(1)}`).join(" ");
  const dots = coords.map(c => {
    const color = c.pt.delta >= 0 ? "var(--accent)" : "var(--danger)";
    const label = `J${c.pt.jour}${c.pt.motif ? " — " + c.pt.motif : ""} : ${c.pt.delta >= 0 ? "+" : ""}${formatMoney(c.pt.delta)}`;
    return `<circle cx="${c.x.toFixed(1)}" cy="${c.y.toFixed(1)}" r="2.6" fill="${color}"><title>${label}</title></circle>`;
  }).join("");

  return `
    <svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="width:100%; height:auto; overflow:visible; margin-top:8px;">
      <polyline points="${linePoints}" fill="none" stroke="var(--accent)" stroke-width="2" />
      ${dots}
    </svg>
  `;
}

const STAFF_DEPARTMENTS = {

    postes: [

const STAFF_POSTE_TO_DEPT = {};
Object.entries(STAFF_DEPARTMENTS).forEach(([dept, info]) => {
  info.postes.forEach(p => { STAFF_POSTE_TO_DEPT[p] = dept; });
});
function staffDepartmentFor(poste) {
  return STAFF_POSTE_TO_DEPT[(poste || "").trim().toLowerCase()] || "autres";
}
const STAFF_DEPT_ATTRS = {
  coaching: [
    ["niveau_tactique", "Tactique"], ["niveau_attaque", "Attaque"], ["niveau_defense", "Défense"], ["formation_jeunes", "Formation jeunes"],
  ],

let staffLoadedForClub = null;
let staffMembers = [];
let leagueStaffStatsLoadedFor = null;
let leagueStaffStats = null;
let viewedClubNation = null;
let viewedClubDivision = null;

// Recupere le staff des clubs de la MEME ligue (meme nation + division) que
// le club consulte, et calcule par departement : l'effectif moyen par club
// et la moyenne des attributs pertinents, pour permettre la comparaison
// affichee sur les colonnes. Le classement ne porte que sur cette ligue,
// jamais sur l'ensemble des clubs de la partie (potentiellement plusieurs
// centaines, toutes nations et divisions confondues).
async function fetchLeagueStaffStats(gid, nation, division) {
  if (!nation || !division) {
    console.warn("fetchLeagueStaffStats: nation/division manquantes, classement ignore");
    return { numClubs: 1, depts: {} };
  }

  const { data: clubs, error: clubsErr } = await supabaseClient
    .from("game_club_overview")
    .select("game_club_id")
    .eq("game_id", gid)
    .eq("nation", nation)
    .eq("division", division);
  if (clubsErr) console.error("fetchLeagueStaffStats: erreur chargement des clubs de la ligue", clubsErr);
  const clubIds = [...new Set((clubs || []).map(c => c.game_club_id))];
  const numClubs = clubIds.length || 1;
  if (clubIds.length === 0) return { numClubs, depts: {} };

  const { data: gameStaffRows, error: gsErr } = await supabaseClient
    .from("game_staff")
    .select("id, staff_ref, poste, game_club_id")
    .eq("game_id", gid)
    .in("game_club_id", clubIds);
  if (gsErr) console.error("fetchLeagueStaffStats: erreur chargement game_staff", gsErr);
  if (gsErr || !gameStaffRows) return { numClubs, depts: {} };

  const refs = [...new Set(gameStaffRows.map(r => r.staff_ref).filter(Boolean))];
  let staffByRef = {};
  const chunkSize = 300;
  for (let i = 0; i < refs.length; i += chunkSize) {
    const chunk = refs.slice(i, i + chunkSize);
    const { data: staffRows } = await supabaseClient
      .from("staff")
      .select("id, niveau_tactique, niveau_defense, niveau_attaque, eval_joueurs, eval_potentiel, formation_jeunes, determination, professionnalisme")
      .in("id", chunk);
    (staffRows || []).forEach(s => { staffByRef[s.id] = s; });
  }

  const depts = {};
  gameStaffRows.forEach(r => {
    const dept = staffDepartmentFor(r.poste);
    const attrs = staffByRef[r.staff_ref] || {};
    if (!depts[dept]) depts[dept] = { count: 0, sums: {}, counts: {}, byClub: {} };
    depts[dept].count++;
    const cid = r.game_club_id;
    if (!depts[dept].byClub[cid]) depts[dept].byClub[cid] = { count: 0, sums: {}, counts: {} };
    depts[dept].byClub[cid].count++;
    (STAFF_DEPT_ATTRS[dept] || []).forEach(([key]) => {
      const val = Number(attrs[key]);
      if (Number.isFinite(val)) {
        depts[dept].sums[key] = (depts[dept].sums[key] || 0) + val;
        depts[dept].counts[key] = (depts[dept].counts[key] || 0) + 1;
        depts[dept].byClub[cid].sums[key] = (depts[dept].byClub[cid].sums[key] || 0) + val;
        depts[dept].byClub[cid].counts[key] = (depts[dept].byClub[cid].counts[key] || 0) + 1;
      }
    });
  });
  Object.values(depts).forEach(d => {
    d.avgPerClub = d.count / numClubs;
    d.avgAttrs = {};
    Object.keys(d.sums).forEach(key => { d.avgAttrs[key] = d.sums[key] / d.counts[key]; });

    // Classement des clubs sur ce departement : score = moyenne des moyennes
    // d'attributs cles (a effectif egal, un club avec un staff plus fort
    // remonte dans le classement). Les clubs sans staff evalue dans ce
    // departement sont places en fin de classement (tries par effectif).
    const attrKeys = Object.keys(d.sums);
    const scored = clubIds.map(cid => {
      const cd = d.byClub[cid] || { count: 0, sums: {}, counts: {} };
      let score = null;
      if (attrKeys.length > 0) {
        const avgs = attrKeys.map(k => (cd.counts[k] ? cd.sums[k] / cd.counts[k] : null)).filter(v => v != null);
        if (avgs.length > 0) score = avgs.reduce((a, b) => a + b, 0) / avgs.length;
      }
      return { cid, count: cd.count, score };
    });
    scored.sort((a, b) => {
      if (a.score == null && b.score == null) return b.count - a.count;
      if (a.score == null) return 1;
      if (b.score == null) return -1;
      return b.score - a.score;
    });
    d.rankByClub = {};
    scored.forEach((s, i) => { d.rankByClub[s.cid] = i + 1; });
    d.numClubsRanked = scored.length;
  });

  console.debug("[staff league stats]", { numClubs, clubIds, depts });
  return { numClubs, depts };
}

async function fetchClubStaffMembers(clubId) {
  const { data: gameStaffRows, error: gsErr } = await supabaseClient
    .from("game_staff")
    .select("id, staff_ref, nom, poste, salaire_actuel, contrat_expire")
    .eq("game_id", gameId)
    .eq("game_club_id", clubId);
  if (gsErr) { console.error(gsErr); return []; }
  if (!gameStaffRows || gameStaffRows.length === 0) return [];

  const refs = [...new Set(gameStaffRows.map(r => r.staff_ref).filter(Boolean))];
  let staffByRef = {};
  if (refs.length > 0) {
    const { data: staffRows, error: sErr } = await supabaseClient
      .from("staff")
      .select("id, nationalite, age, personnalite, eval_joueurs, eval_potentiel, formation_jeunes, niveau_tactique, niveau_defense, niveau_attaque, determination, professionnalisme, qualification_preparateur")
      .in("id", refs);
    if (sErr) console.error(sErr);
    (staffRows || []).forEach(s => { staffByRef[s.id] = s; });
  }

  return gameStaffRows.map(r => ({ ...r, ...(staffByRef[r.staff_ref] || {}) }));
}

// Recap affiche sur chaque colonne, dans l'ordre :
// 1) effectif du departement + classement du club sur ce departement (parmi
//    tous les clubs de la ligue, base sur le niveau moyen du secteur) ;
// 2) repartition des effectifs par intitule de poste exact, pour voir d'un
//    coup d'oeil "combien de X, combien de Y" sans ouvrir le detail ;
// 3) moyenne des attributs cles du departement, avec ecart (▲/▼) vs la
//    moyenne de la ligue sur ces memes attributs.
function renderStaffColRecap(dept, members, locked, clubId) {
  const league = leagueStaffStats?.depts?.[dept];
  const rank = league?.rankByClub?.[clubId];
  const totalRanked = league?.numClubsRanked;

  let rankHtml;
  if (rank != null && totalRanked) {
    const tier = rank <= Math.ceil(totalRanked / 3) ? "pos" : (rank > Math.ceil(totalRanked * 2 / 3) ? "neg" : "");
    const ord = rank === 1 ? "ᵉʳ" : "ᵉ";
    rankHtml = `<span class="staff-recap-rank ${tier}">${rank}${ord} / ${totalRanked} clubs de la ligue</span>`;
  } else {
    rankHtml = `<span class="staff-recap-rank">Classement indisponible</span>`;
  }
  const countHtml = `<div class="staff-recap-count"><span>Effectif : <b>${members.length}</b></span>${rankHtml}</div>`;

  const roleCounts = {};
  members.forEach(m => {
    const role = (m.poste || "Autre").trim();
    roleCounts[role] = (roleCounts[role] || 0) + 1;
  });
  const roleNames = Object.keys(roleCounts).sort((a, b) => roleCounts[b] - roleCounts[a] || a.localeCompare(b, "fr"));
  const rolesHtml = roleNames.length > 0
    ? `<div class="staff-recap-roles">${roleNames.map(r => `<span class="staff-role-mini-chip">${escapeHtml(r)}<b>${roleCounts[r]}</b></span>`).join("")}</div>`
    : "";

  if (locked) {
    return `<div class="staff-col-recap">${countHtml}${rolesHtml}<div class="staff-col-empty" style="padding:0;">🔒 Statistiques verrouillées</div></div>`;
  }

  const attrDefs = STAFF_DEPT_ATTRS[dept] || [];
  const attrHtml = attrDefs.map(([key, label]) => {
    const vals = members.map(m => Number(m[key])).filter(Number.isFinite);
    if (vals.length === 0) return "";
    const ownAvg = vals.reduce((a, b) => a + b, 0) / vals.length;
    const leagueAvg = league?.avgAttrs?.[key];
    const diffHtml = leagueAvg != null
      ? `<span class="staff-recap-vs ${ownAvg >= leagueAvg ? "pos" : "neg"}">${ownAvg >= leagueAvg ? "▲" : "▼"} ${Math.abs(ownAvg - leagueAvg).toFixed(1)} vs moy. ligue</span>`
      : "";
    return `<div class="staff-recap-attr"><span>${label}</span><b>${ownAvg.toFixed(1)}/20</b>${diffHtml}</div>`;
  }).join("");

  return `<div class="staff-col-recap">${countHtml}${rolesHtml}${attrHtml}</div>`;
}

// Modal "secteur" : liste des membres d'un departement, chacun cliquable
// pour afficher sa fiche complete (via openStaffModal).
function openStaffSectorModal(dept, locked) {
  const overlay = document.getElementById("staffModalOverlay");
  const content = document.getElementById("staffModalContent");
  content.classList.add("wide");
  const info = STAFF_DEPARTMENTS[dept] || { label: "Autres", icon: "📋" };
  const members = staffMembers.filter(m => staffDepartmentFor(m.poste) === dept);

  // Regroupement par intitule de poste exact (ex: "Preparateur physique"),
  // trie par effectif decroissant puis alphabetique, membres tries par nom
  // au sein de chaque groupe.
  const roleGroups = {};
  members.forEach(m => {
    const role = (m.poste || "Autre").trim();
    (roleGroups[role] = roleGroups[role] || []).push(m);
  });
  const roles = Object.keys(roleGroups).sort((a, b) => {
    const diff = roleGroups[b].length - roleGroups[a].length;
    return diff !== 0 ? diff : a.localeCompare(b, "fr");
  });
  roles.forEach(role => roleGroups[role].sort((a, b) => (a.nom || "").localeCompare(b.nom || "", "fr")));

  const filtersHtml = roles.length > 1 ? `
    <div class="staff-role-filters">
      <button class="staff-role-chip active" data-role="__all__">Tous <span class="count">${members.length}</span></button>
      ${roles.map(role => `<button class="staff-role-chip" data-role="${escapeHtml(role)}">${escapeHtml(role)} <span class="count">${roleGroups[role].length}</span></button>`).join("")}
    </div>
  ` : "";

  const listHtml = roles.map(role => `
    <div class="staff-role-group" data-role-group="${escapeHtml(role)}">
      <div class="staff-role-group-title">${escapeHtml(role)} <span class="count">${roleGroups[role].length}</span></div>
      ${roleGroups[role].map(m => staffMemberCardHtml(m, dept, locked)).join("")}
    </div>
  `).join("");

  content.innerHTML = `
    <div class="staff-modal-header">
      <div>
        <div class="staff-modal-name">${info.icon} ${info.label}</div>
        <div class="staff-modal-sub">${members.length} membre${members.length > 1 ? "s" : ""}</div>
      </div>
      <button class="staff-modal-close" id="staffModalCloseBtn">✕</button>
    </div>
    ${filtersHtml}
    <div class="staff-sector-list">
      ${members.length > 0 ? listHtml : `<div class="staff-col-empty">Aucun membre à ce poste.</div>`}
    </div>
  `;

  content.querySelectorAll(".staff-member-card").forEach(card => {
    card.addEventListener("click", () => {
      const id = card.getAttribute("data-staff-id");
      const member = staffMembers.find(m => String(m.id) === String(id));
      if (member) openStaffModal(member, locked, dept);
    });
  });

  content.querySelectorAll(".staff-role-chip").forEach(chip => {
    chip.addEventListener("click", () => {
      content.querySelectorAll(".staff-role-chip").forEach(c => c.classList.remove("active"));
      chip.classList.add("active");
      const role = chip.getAttribute("data-role");
      content.querySelectorAll(".staff-role-group").forEach(group => {
        group.style.display = (role === "__all__" || group.getAttribute("data-role-group") === role) ? "" : "none";
      });
    });
  });

  overlay.classList.remove("hidden");
  document.getElementById("staffModalCloseBtn").addEventListener("click", closeStaffModal);
}

// ===================== COMPÉTITIONS (sous-onglet) =====================
// Meme logique que le sous-onglet "Compétitions" de dashboard.html, mais
// scopee au club consulte (pas forcement le club du joueur) : calendrier
// complet (matchs joues + a venir, prochain match mis en avant) et carte de
// la compétition du club avec classement approximatif.

async function getDivisionStandings(nation, division) {
  if (!nation || !division) return [];

  const { data: rivals, error } = await supabaseClient
    .from("game_club_overview")
    .select("game_club_id, nom, classement")
    .eq("game_id", gameId)
    .eq("nation", nation)
    .eq("division", division);

  if (error || !rivals || rivals.length === 0) return [];

  // On recupere toujours les stats completes (V/N/D/buts) en plus du rang,
  // pour pouvoir afficher un mini-classement detaille (points, matchs joues,
  // diff de buts) partout ou getDivisionStandings est utilisee.
  const { data: full } = await supabaseClient
    .from("game_clubs")
    .select("id, classement, points, victoires, nuls, defaites, buts_pour, buts_contre")
    .in("id", rivals.map(r => r.game_club_id));

  const nomMap = {};
  rivals.forEach(r => { nomMap[r.game_club_id] = r.nom; });
  const statsMap = {};
  (full || []).forEach(c => { statsMap[c.id] = c; });

  const sorted = rivals.slice().sort((a, b) => {
    const sa = statsMap[a.game_club_id] || {};
    const sb = statsMap[b.game_club_id] || {};
    if (a.classement != null && b.classement != null) return a.classement - b.classement;
    if ((sb.points ?? 0) !== (sa.points ?? 0)) return (sb.points ?? 0) - (sa.points ?? 0);
    const diffA = (sa.buts_pour ?? 0) - (sa.buts_contre ?? 0);
    const diffB = (sb.buts_pour ?? 0) - (sb.buts_contre ?? 0);
    if (diffB !== diffA) return diffB - diffA;
    return (sb.buts_pour ?? 0) - (sa.buts_pour ?? 0);
  });

  return sorted.map((r, i) => {
    const s = statsMap[r.game_club_id] || {};
    const joues = (s.victoires ?? 0) + (s.nuls ?? 0) + (s.defaites ?? 0);
    const diff = (s.buts_pour ?? 0) - (s.buts_contre ?? 0);
    return {
      id: r.game_club_id, nom: nomMap[r.game_club_id] || "?",
      rank: r.classement ?? (i + 1),
      points: s.points ?? 0, joues, diff,
      victoires: s.victoires ?? 0, nuls: s.nuls ?? 0, defaites: s.defaites ?? 0,
    };
  });
}

async function getClubMatches(clubId) {
  // clubId vient des query params (donc une string), alors que
  // club_domicile_id / club_exterieur_id renvoyes par Supabase sont des
  // nombres : sans ce cast, `m.club_domicile_id === clubId` est toujours
  // faux, isHome reste toujours a false et l'adversaire calcule est alors
  // TOUJOURS l'equipe a domicile (le club affiche s'affrontant lui-meme des
  // qu'il jouait a domicile).
  const clubIdNum = Number(clubId);

  const { data: matches, error } = await supabaseClient
    .from("calendrier")
    .select("id, date_match, journee, club_domicile_id, club_exterieur_id, score_domicile, score_exterieur")
    .eq("game_id", gameId)
    .or(`club_domicile_id.eq.${clubIdNum},club_exterieur_id.eq.${clubIdNum}`)
    .order("date_match", { ascending: true });

  if (error || !matches) return [];

  const oppIds = [...new Set(matches.map(m =>
    m.club_domicile_id === clubIdNum ? m.club_exterieur_id : m.club_domicile_id
  ))];
  const { data: oppClubs } = await supabaseClient
    .from("game_clubs")
    .select("id, nom")
    .in("id", oppIds);
  const oppMap = {};
  (oppClubs || []).forEach(c => { oppMap[c.id] = c.nom; });

  return matches.map(m => {
    const isHome = m.club_domicile_id === clubIdNum;
    const oppId = isHome ? m.club_exterieur_id : m.club_domicile_id;
    return {
      ...m,
      isHome,
      oppId,
      oppName: oppMap[oppId] || "?",
      played: m.score_domicile != null && m.score_exterieur != null,
    };
  });
}

function renderMatchRow(m, standingsMap, opts = {}) {
  const d = m.date_match ? new Date(m.date_match) : null;
  const dayLabel = d ? d.toLocaleDateString("fr-FR", { day: "2-digit", month: "2-digit" }) : "-";
  const weekday = d ? d.toLocaleDateString("fr-FR", { weekday: "short" }).replace(".", "") : "";

  let resultHtml;
  let rowClass = "fm-comp-match-row";
  if (m.played) {
    rowClass += " played";
    const myScore = m.isHome ? m.score_domicile : m.score_exterieur;
    const oppScore = m.isHome ? m.score_exterieur : m.score_domicile;
    const outcome = myScore > oppScore ? "victoire" : myScore < oppScore ? "defaite" : "nul";
    resultHtml = `<div class="fm-comp-match-score ${outcome}">${myScore}-${oppScore}</div>`;
  } else {
    const oppRank = standingsMap[m.oppId] ? `${standingsMap[m.oppId]}e` : "—";
    resultHtml = `<div class="fm-comp-match-rank">${oppRank}</div>`;
  }
  if (opts.isNext) rowClass += " next";

  return `
    <div class="${rowClass}" ${opts.isNext ? 'data-next="true"' : ""}>
      <div class="fm-comp-match-date"><span class="day">${dayLabel}</span>${weekday}</div>
      <div class="fm-comp-match-journee">J${m.journee ?? "-"}</div>
      <div class="fm-comp-match-side ${m.isHome ? "dom" : "ext"}">${m.isHome ? "D" : "E"}</div>
      <div class="fm-comp-match-opp" data-club-id="${m.oppId}">${escapeHtml(m.oppName)}${opts.isNext ? `<span class="fm-comp-match-tag">Prochain</span>` : ""}</div>
      ${resultHtml}
    </div>
  `;
}

async function renderCompetitionsTab(viewedClubId) {
  const calEl = document.getElementById("fmCompCalendarList");
  const rightEl = document.getElementById("fmCompRightPane");
  calEl.innerHTML = `<div class="fm-comp-empty">Chargement...</div>`;
  rightEl.innerHTML = `<div class="fm-comp-empty">Chargement...</div>`;

  if (!viewedClubNation || !viewedClubDivision) {
    calEl.innerHTML = `<div class="fm-comp-empty">Division inconnue pour ce club.</div>`;
    rightEl.innerHTML = "";
    return;
  }

  const standingsList = await getDivisionStandings(viewedClubNation, viewedClubDivision);
  const standingsMap = {};
  standingsList.forEach(r => { standingsMap[r.id] = r.rank; });

  const matches = await getClubMatches(viewedClubId);
  if (matches.length === 0) {
    calEl.innerHTML = `<div class="fm-comp-empty">Aucun match programmé.</div>`;
  } else {
    const nextIndex = matches.findIndex(m => !m.played);
    calEl.innerHTML = matches
      .map((m, i) => renderMatchRow(m, standingsMap, { isNext: i === nextIndex }))
      .join("");
    bindMatchRowClicks(calEl);

    requestAnimationFrame(() => {
      const nextRow = calEl.querySelector('[data-next="true"]');
      if (nextRow) calEl.scrollTop = Math.max(0, nextRow.offsetTop - 4);
    });
  }

  const { data: comp, error: compError } = await supabaseClient
    .from("competitions")
    .select("id, nom, tier, nb_clubs")
    .eq("nation", viewedClubNation)
    .eq("division", viewedClubDivision)
    .eq("type", "championnat")
    .maybeSingle();

  if (compError || !comp) {
    rightEl.innerHTML = `<div class="fm-comp-empty">Compétition introuvable pour cette division.</div>`;
    return;
  }

  const { data: clubRow } = await supabaseClient
    .from("game_clubs")
    .select("points, victoires, nuls, defaites, buts_pour, buts_contre")
    .eq("id", viewedClubId)
    .single();

  const rank = standingsMap[viewedClubId];
  const nbClubs = comp.nb_clubs || standingsList.length;
  const diff = (clubRow?.buts_pour ?? 0) - (clubRow?.buts_contre ?? 0);

  // Mini-classement complet (comme l'onglet Classement) : Clt / Club / J /
  // Diff / Pts pour chaque club de la division, avec le club consulte mis
  // en avant. La carte etant carree et remplissant l'espace vertical
  // disponible, la table scrolle en interne si la division est grande.
  const miniStandingsHtml = standingsList.length ? `
    <div class="fm-comp-mini-standings-wrap">
      <table class="fm-comp-mini-table">
        <thead>
          <tr><th>Clt</th><th>Club</th><th>J</th><th>Diff</th><th>Pts</th></tr>
        </thead>
        <tbody>
          ${standingsList.map(r => `
            <tr class="${String(r.id) === String(viewedClubId) ? "me" : ""}" data-club-id="${r.id}">
              <td class="clt">${r.rank}e</td>
              <td class="nm">${escapeHtml(r.nom)}</td>
              <td class="num">${r.joues}</td>
              <td class="num">${r.diff >= 0 ? "+" : ""}${r.diff}</td>
              <td class="pts">${r.points}</td>
            </tr>
          `).join("")}
        </tbody>
      </table>
    </div>
  ` : "";

  rightEl.innerHTML = `
    <div class="fm-comp-card" id="fmCompCard-${comp.id}">
      <div class="fm-comp-card-head">
        <div>
          <div class="fm-comp-card-title">${escapeHtml(comp.nom)}</div>
          <div class="fm-comp-card-sub">${escapeHtml(viewedClubNation)} · ${escapeHtml(viewedClubDivision)}</div>
        </div>
        <span class="fm-comp-card-tag">Championnat</span>
      </div>
      <div class="fm-comp-card-stats">
        <div class="fm-comp-stat"><div class="label">Classement</div><div class="value">${rank ? `${rank}e` : "—"} / ${nbClubs}</div></div>
        <div class="fm-comp-stat"><div class="label">Points</div><div class="value">${clubRow?.points ?? 0}</div></div>
        <div class="fm-comp-stat"><div class="label">Bilan</div><div class="value">${clubRow?.victoires ?? 0}V ${clubRow?.nuls ?? 0}N ${clubRow?.defaites ?? 0}D</div></div>
        <div class="fm-comp-stat"><div class="label">Diff.</div><div class="value">${diff >= 0 ? "+" : ""}${diff}</div></div>
      </div>
      ${miniStandingsHtml}
      <div class="fm-comp-card-footer">
        <span>Classement, stats et prochains matchs de la compétition</span>
        <span>→</span>
      </div>
    </div>
  `;

  document.getElementById(`fmCompCard-${comp.id}`).addEventListener("click", (e) => {
    if (e.target.closest(".fm-comp-mini-table tr")) return;
    window.location.href = `competition.html?game=${encodeURIComponent(gameId)}&competition=${encodeURIComponent(comp.id)}&club=${encodeURIComponent(viewedClubId)}`;
  });
  rightEl.querySelectorAll(".fm-comp-mini-table tr[data-club-id]").forEach(rowEl => {
    rowEl.addEventListener("click", (e) => {
      e.stopPropagation();
      const clubId = rowEl.getAttribute("data-club-id");
      if (clubId) window.location.href = `club.html?game=${encodeURIComponent(gameId)}&club=${encodeURIComponent(clubId)}`;
    });
  });
}

// ===================== EN-TETE DE LA FICHE CLUB =====================
function renderClubHero(club, rawClub) {
  const el = document.getElementById("clubHero");
  el.innerHTML = `
    <div class="club-badge" style="background:${club.logoUrl ? "transparent" : colorFromName(club.nom)};">
      ${renderClubBadge(club, rawClub)}
    </div>
    <div class="club-hero-info">
      <div class="club-hero-name">${escapeHtml(club.nom)}</div>
      <div class="club-hero-sub">
        ${club.nation ? `${nationFlagImg(club.nation)} ${escapeHtml(club.nation)}` : ""}
        ${club.division ? `<span class="chip dim">${escapeHtml(club.division)}</span>` : ""}
        ${club.classement ? `<span class="chip">Classement pronostiqué : ${club.classement}e</span>` : ""}
        ${club.statut ? `<span class="chip dim">${escapeHtml(club.statut)}</span>` : ""}
      </div>
    </div>
  `;
}

// ===================== CHARGEMENT =====================
async function loadClub() {
  if (!gameId || !gameClubId) {
    showFatalError("Club introuvable.");
    return;
  }

  const { data: { session } } = await supabaseClient.auth.getSession();
  if (!session?.user) {
    window.location.href = "index.html";
    return;
  }
  const userId = session.user.id;

  const { data: game } = await supabaseClient
    .from("games")
    .select("date_debut, jour_actuel, saison, statut")
    .eq("id", gameId)
    .single();
  currentGame = game || null;

  const { data: participants } = await supabaseClient
    .from("game_participants")
    .select("pseudo, user_id, game_club_id")
    .eq("game_id", gameId);
  const me = (participants || []).find(p => p.user_id === userId);

  if (!me?.game_club_id) {
    showFatalError("Choisis d'abord un club depuis la page d'accueil pour consulter les fiches club.");
    return;
  }

  const myClubId = me.game_club_id;
  const isOwnClub = String(myClubId) === String(gameClubId);
  isOwnClubView = isOwnClub;

  const { data: club, error: clubErr } = await supabaseClient
    .from("game_club_overview")
    .select(`
      game_club_id, nom, budget_actuel, classement, statut, nation, division,
      niveau_entrainement, centre_formation, capacite_stade, affluence_moyenne,
      nb_joueurs, meilleur_joueur_nom
    `)
    .eq("game_id", gameId)
    .eq("game_club_id", gameClubId)
    .single();

  if (clubErr || !club) {
    showFatalError("Impossible de charger ce club.");
    return;
  }
  viewedClubNation = club.nation;
  viewedClubDivision = club.division;

  // Requete complementaire "large" (select *) pour recuperer sans risque
  // d'erreur d'eventuels champs pas encore utilises ailleurs (logo, palmares...).
  let rawClub = null;
  try {
    const { data: raw } = await supabaseClient
      .from("game_clubs")
      .select("*")
      .eq("id", gameClubId)
      .eq("game_id", gameId)
      .single();
    rawClub = raw || null;
  } catch (e) {
    rawClub = null;
  }

  const { data: players } = await supabaseClient
    .from("game_players")
    .select(`
      id, nom, age, nationalite, poste_brut, statut_special, salaire_actuel,
      contrat_expire, valeur_marchande_actuelle, reputation_mondiale,
      niveau_actuel, potentiel, buts_saison, passes_decisives_saison,
      matchs_joues_saison, note_moyenne_saison
    `)
    .eq("game_id", gameId)
    .eq("game_club_id", gameClubId)
    .order("reputation_mondiale", { ascending: false, nullsFirst: false });

  // Le bandeau identifie desormais le club affiche sur CETTE page (utile
  // pour se reperer quand on consulte la fiche d'un autre club que le
  // sien), et non plus systematiquement le club du manager.
  const headerClubName = club.nom;

  document.getElementById("clubHero").classList.remove("hidden");
  document.getElementById("clubGrid").style.display = "";

  renderFmHeader(me.pseudo, headerClubName);
  renderFmSidebar(myClubId);
  renderFmSubtabs(gameClubId);
  renderClubHero(club, rawClub);
  renderPitch();
  renderFinances(club);
  renderReputation(club, players || []);
  renderKeyPeople(club, players || []);
  renderPalmares(rawClub);
}

function showFatalError(message) {
  document.getElementById("clubHero").classList.add("hidden");
  document.getElementById("clubGrid").style.display = "none";
  const el = document.getElementById("clubError");
  el.classList.remove("hidden");
  el.innerHTML = `${escapeHtml(message)}<br><br><a href="dashboard.html?game=${encodeURIComponent(gameId || "")}" style="color:var(--gold);">← Retour à l'accueil</a>`;
}

loadClub();
</script>
