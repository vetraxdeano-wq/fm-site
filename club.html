<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FM Web — Infos club</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-2: #1c2029;
    --border: #262a33;
    --text: #e8eaed;
    --text-dim: #8b909c;
    --accent: #4ade80;
    --gold: #fbbf24;
    --danger: #ef4444;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    min-height: 100vh;
  }
  .hidden { display: none !important; }

  .empty-state {
    text-align: center; color: var(--text-dim); font-size: 14px;
    padding: 60px 20px;
  }

  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--panel); border: 1px solid var(--border); padding: 10px 18px;
    border-radius: 8px; font-size: 13px; opacity: 0; pointer-events: none; transition: opacity 0.2s;
    z-index: 100;
  }
  .toast.show { opacity: 1; }
  .toast.error { border-color: var(--danger); color: var(--danger); }

  /* ============================================================
     VUE PRINCIPALE (meme esprit que dashboard.html / squad.html :
     topbar rouge, sidebar de navigation a gauche, plein ecran)
     ============================================================ */
  #clubView {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    background: var(--bg); z-index: 5;
  }

  .fm-header {
    display: flex; justify-content: space-between; align-items: center; flex-wrap: nowrap;
    gap: 14px; padding: 12px 22px; flex: 0 0 auto;
    background: linear-gradient(120deg, #4c1116, #7a1620 55%, #9c2430);
    border-bottom: 1px solid rgba(0,0,0,0.3);
  }
  .fm-header .title-block { display: flex; align-items: center; gap: 16px; min-width: 0; }
  .fm-header .back-link {
    color: rgba(255,255,255,0.75); text-decoration: none; font-size: 13px;
    flex-shrink: 0; padding-right: 14px; border-right: 1px solid rgba(255,255,255,0.2);
  }
  .fm-header .back-link:hover { color: #fff; }
  .fm-header .right-block { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  .fm-date-badge {
    background: rgba(0,0,0,0.28); border-radius: 8px; padding: 7px 14px;
    text-align: right; line-height: 1.35; color: #fff;
  }
  .fm-date-badge .day-num { font-size: 13px; font-weight: 800; white-space: nowrap; }
  .fm-date-badge .season-line { font-size: 11px; color: rgba(255,255,255,0.7); }

  .page-title-wrap { position: relative; }
  .page-title-input {
    background: transparent; border: none; outline: none; color: #fff;
    font-size: 18px; font-weight: 800; letter-spacing: 0.02em; padding: 2px 0;
    width: 230px; max-width: 40vw; font-family: inherit;
  }
  .page-title-input::placeholder {
    color: rgba(255,255,255,0.92); font-weight: 800; opacity: 1;
  }
  .manager-line {
    font-size: 12px; color: rgba(255,255,255,0.78); margin-top: 2px; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }
  .fm-search-dropdown {
    position: absolute; top: calc(100% + 8px); left: 0; min-width: 300px; max-width: 380px;
    background: #14171d; border: 1px solid var(--border); border-radius: 10px;
    box-shadow: 0 12px 32px rgba(0,0,0,0.5); z-index: 200; max-height: 380px; overflow-y: auto;
  }
  .fm-search-dropdown.hidden { display: none !important; }

  /* Petite barre de recherche arrondie, toujours visible a cote de la date,
     en plus du titre-champ de recherche (meme moteur, meme dropdown). */
  .fm-quick-search { position: relative; flex-shrink: 0; }
  .fm-quick-search-input {
    width: 158px; max-width: 26vw; background: rgba(0,0,0,0.28); border: 1px solid rgba(255,255,255,0.16);
    border-radius: 999px; color: #fff; font-size: 12.5px; font-family: inherit;
    padding: 8px 14px 8px 30px; outline: none; transition: width 0.15s ease, background 0.15s ease, border-color 0.15s ease;
  }
  .fm-quick-search-input::placeholder { color: rgba(255,255,255,0.55); }
  .fm-quick-search-input:focus { background: rgba(0,0,0,0.42); border-color: rgba(255,255,255,0.34); width: 208px; }
  .fm-quick-search-icon {
    position: absolute; left: 11px; top: 50%; transform: translateY(-50%); font-size: 12px;
    color: rgba(255,255,255,0.6); pointer-events: none;
  }
  .fm-quick-search .fm-search-dropdown { left: auto; right: 0; }
  @media (max-width: 720px) {
    .fm-quick-search-input { width: 34px; padding-left: 30px; color: transparent; cursor: pointer; }
    .fm-quick-search-input::placeholder { color: transparent; }
    .fm-quick-search-input:focus { width: 168px; color: #fff; padding-right: 12px; }
    .fm-quick-search-input:focus::placeholder { color: rgba(255,255,255,0.55); }
  }
  .search-group-label {
    padding: 8px 12px 4px; font-size: 10px; text-transform: uppercase;
    letter-spacing: 0.05em; color: var(--text-dim);
  }
  .search-result-item {
    display: flex; align-items: center; gap: 10px; padding: 8px 12px; font-size: 13px;
    color: var(--text); cursor: pointer;
  }
  .search-result-item:hover { background: rgba(251,191,36,0.1); color: var(--gold); }
  .search-result-icon { flex-shrink: 0; font-size: 13px; }
  .search-result-sub { font-size: 11px; color: var(--text-dim); margin-top: 1px; }
  .search-empty { padding: 14px 12px; font-size: 12px; color: var(--text-dim); text-align: center; }

  .fm-body { flex: 1; display: flex; align-items: stretch; min-height: 0; }

  .fm-sidebar {
    width: 220px; flex-shrink: 0; background: var(--panel); border-right: 1px solid var(--border);
    overflow-y: auto; padding: 0; display: flex; flex-direction: column;
  }
  /* Blason du club consulte sur cette fiche : logo seul, sans nom ni cadre
     autour, au-dessus des onglets de navigation. */
  .fm-sidebar-crest { flex-shrink: 0; display: flex; justify-content: center; padding: 22px 16px 14px; }
  .fm-sidebar-crest-img, .fm-sidebar-crest-fallback {
    width: 84px; height: 84px; object-fit: contain;
  }
  .fm-sidebar-crest-fallback {
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 26px; font-weight: 800; color: #0b0d12;
  }
  .fm-sidebar-nav { flex: 1; overflow-y: auto; padding: 10px 0; }
  .fm-nav-item {
    display: flex; align-items: center; gap: 12px; padding: 12px 20px; font-size: 13.5px;
    color: var(--text-dim); cursor: pointer; border-left: 3px solid transparent; user-select: none;
  }
  .fm-nav-item:hover { background: rgba(255,255,255,0.03); color: var(--text); }
  .fm-nav-item.active {
    background: rgba(251,191,36,0.08); color: var(--gold); border-left-color: var(--gold); font-weight: 700;
  }
  .fm-nav-icon { width: 18px; text-align: center; flex-shrink: 0; }

  .fm-content-col { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }

  /* Sous-onglets de la page club (Infos club / Effectif) */
  .fm-subtabs {
    display: flex; gap: 4px; padding: 10px 24px 0; background: var(--panel);
    border-bottom: 1px solid var(--border); flex: 0 0 auto;
  }
  .fm-subtab {
    display: flex; align-items: center; gap: 8px; padding: 10px 16px; font-size: 13px;
    font-weight: 700; color: var(--text-dim); cursor: pointer; border-bottom: 3px solid transparent;
    user-select: none;
  }
  .fm-subtab:hover { color: var(--text); }
  .fm-subtab.active { color: var(--gold); border-bottom-color: var(--gold); }
  .fm-subtab-icon { width: 18px; text-align: center; flex-shrink: 0; }

  .fm-content-wrap { flex: 1; min-width: 0; min-height: 0; overflow-y: auto; padding: 20px 24px; }

  .club-hero {
    display: flex; align-items: center; gap: 18px; background: var(--panel);
    border: 1px solid var(--border); border-radius: 12px; padding: 18px 22px; margin-bottom: 16px;
  }
  .club-badge {
    width: 96px; height: 138px; border-radius: 16px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 18px rgba(0,0,0,0.4);
  }
  .club-badge img { width: 100%; height: 100%; object-fit: contain; border-radius: 16px; }
  .club-hero-info { flex: 1; min-width: 0; }
  .club-hero-name { font-size: 20px; font-weight: 800; }
  .club-hero-sub {
    display: flex; align-items: center; gap: 8px; margin-top: 4px; font-size: 12.5px; color: var(--text-dim);
    flex-wrap: wrap;
  }
  .flag-icon { width: 18px; height: auto; border-radius: 2px; vertical-align: middle; }
  .chip {
    display: inline-block; background: rgba(251,191,36,0.1); border: 1px solid rgba(251,191,36,0.3);
    color: var(--gold); font-size: 11px; padding: 3px 9px; border-radius: 999px; font-weight: 700;
  }
  .chip.dim { background: rgba(255,255,255,0.05); border-color: var(--border); color: var(--text-dim); }

  .club-grid {
    display: grid; grid-template-columns: 1.15fr 1fr; gap: 16px; align-items: start;
  }
  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; padding: 16px 18px; margin-bottom: 16px;
  }
  .card-title {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--gold); margin-bottom: 14px;
  }
  .fm-empty { color: var(--text-dim); font-size: 13px; padding: 4px 0; line-height: 1.5; }

  .stat-row {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 9px 0; border-bottom: 1px solid rgba(255,255,255,0.04); font-size: 13px;
  }
  .stat-row:last-child { border-bottom: none; }
  .stat-row .label { color: var(--text-dim); }
  .stat-row .value { font-weight: 700; }

  .stars { position: relative; display: inline-block; font-size: 14px; letter-spacing: 2px; line-height: 1; }
  .stars-bg { color: var(--border); }
  .stars-fg {
    position: absolute; top: 0; left: 0; overflow: hidden; white-space: nowrap; color: var(--gold);
  }

  .key-people { display: flex; flex-direction: column; gap: 10px; }
  .key-person {
    display: flex; align-items: center; gap: 10px; padding: 8px 0;
    border-bottom: 1px solid rgba(255,255,255,0.04);
  }
  .key-person:last-child { border-bottom: none; }
  .key-person-icon {
    width: 30px; height: 30px; border-radius: 8px; background: rgba(251,191,36,0.1);
    display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0;
  }
  .key-person-role { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.03em; color: var(--text-dim); }
  .key-person-name { font-size: 13.5px; font-weight: 700; }
  .key-person-name.muted { color: var(--text-dim); font-weight: 500; }
  .key-person-link { color: inherit; text-decoration: none; }
  .key-person-link:hover { color: var(--gold); text-decoration: underline; }

  .palmares-list { display: flex; flex-direction: column; gap: 6px; }
  .palmares-item {
    display: flex; align-items: center; gap: 10px; font-size: 13px; padding: 6px 0;
    border-bottom: 1px solid rgba(255,255,255,0.04);
  }
  .palmares-item:last-child { border-bottom: none; }
  .palmares-item .trophy { font-size: 15px; }
  .palmares-item .count { margin-left: auto; color: var(--gold); font-weight: 800; font-size: 12px; }

  /* Terrain illustre pour la derniere composition */
  .pitch-caption { font-size: 12px; color: var(--text-dim); margin-bottom: 10px; line-height: 1.5; }
  .pitch-wrap { width: 100%; }
  .pitch-svg { width: 100%; height: auto; display: block; }
  .pitch-player-dot { fill: var(--gold); stroke: #3a2a00; stroke-width: 1.5; }
  .pitch-player-label {
    fill: #fff; font-size: 9px; font-weight: 800; text-anchor: middle; pointer-events: none;
  }
  .pitch-name-label {
    fill: var(--text-dim); font-size: 7.5px; text-anchor: middle; pointer-events: none;
  }
  /* Module "Dernière composition utilisée" : reste dans la colonne latérale,
     sans excès de chrome autour — le terrain est dimensionné par la hauteur
     (et non plus par la largeur de la colonne) pour ne jamais provoquer de
     scroll : sa hauteur est plafonnée à une fraction de la fenêtre. */
  .club-last-lineup { padding: 12px 12px 8px; }
  .club-last-lineup .card-title { margin-bottom: 8px; }
  .club-last-lineup .pitch-wrap { max-width: 100%; margin: 0; text-align: center; }
  .club-last-lineup .pitch-svg { width: auto; height: min(34vh, 300px); max-width: 100%; display: inline-block; }
  .club-last-lineup .pitch-caption { text-align: center; }
  .compo-pitch-face { transition: filter 0.15s ease; }
  .compo-pitch-player:hover .compo-pitch-face { filter: brightness(1.15); }

  /* ---- Compétitions (sous-onglet) : calendrier horizontal en haut (pleine
     largeur, plus d'espace), compétitions du club en dessous ---- */
  .fm-competitions-view { width: 100%; display: flex; flex-direction: column; gap: 16px; }
  .fm-comp-calendar-pane {
    width: 100%; background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; display: flex; flex-direction: column; overflow: hidden;
    height: min(46vh, 460px);
  }
  .fm-comp-calendar-header {
    flex: 0 0 auto; padding: 14px 18px; border-bottom: 1px solid var(--border);
    font-weight: 700; font-size: 14px;
  }
  .fm-comp-calendar-list {
    flex: 1; min-height: 0; overflow-y: auto; position: relative;
    scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.14) transparent;
  }
  .fm-comp-calendar-list::-webkit-scrollbar { width: 6px; }
  .fm-comp-calendar-list::-webkit-scrollbar-track { background: transparent; }
  .fm-comp-calendar-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.14); border-radius: 999px; }
  .fm-comp-calendar-list::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.26); }
  .fm-comp-match-row {
    display: flex; align-items: center; gap: 14px; padding: 12px 18px;
    border-bottom: 1px solid var(--border); font-size: 12.5px;
  }
  .fm-comp-match-row:last-child { border-bottom: none; }
  .fm-comp-match-row.played { opacity: 0.82; }
  .fm-comp-match-row.next {
    background: rgba(251,191,36,0.07); border-left: 3px solid var(--gold);
    padding-left: 15px; opacity: 1;
  }
  .fm-comp-match-row.next .fm-comp-match-tag {
    display: inline-block; margin-left: 8px; font-size: 9.5px; text-transform: uppercase;
    letter-spacing: 0.04em; font-weight: 700; color: var(--gold);
    background: rgba(251,191,36,0.12); border: 1px solid #7a5c0f; border-radius: 999px; padding: 2px 7px;
  }
  .fm-comp-match-date { width: 64px; flex-shrink: 0; color: var(--text-dim); line-height: 1.3; text-transform: capitalize; }
  .fm-comp-match-date .day { font-weight: 700; color: var(--text); font-size: 13px; display: block; }
  .fm-comp-match-journee {
    width: 34px; flex-shrink: 0; font-size: 10.5px; color: var(--text-dim); text-align: center;
    background: #14171d; border: 1px solid var(--border); border-radius: 6px; padding: 3px 0;
  }
  .fm-comp-match-side {
    width: 20px; flex-shrink: 0; font-weight: 700; font-size: 11px; text-align: center;
    border-radius: 5px; padding: 2px 0;
  }
  .fm-comp-match-side.dom { color: var(--accent); }
  .fm-comp-match-side.ext { color: var(--gold); }
  .fm-comp-match-opp {
    flex: 1; min-width: 0; display: flex; align-items: center; gap: 7px;
    font-weight: 600; cursor: pointer;
  }
  .fm-comp-match-opp .opp-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fm-comp-match-opp:hover .opp-name { color: var(--gold); text-decoration: underline; }
  .fm-comp-match-rank {
    flex-shrink: 0; font-size: 11px; color: var(--text-dim); background: #14171d;
    border: 1px solid var(--border); border-radius: 999px; padding: 3px 9px;
  }
  .fm-comp-match-score {
    flex-shrink: 0; font-size: 12.5px; font-weight: 800; border-radius: 999px; padding: 3px 11px;
    border: 1px solid var(--border); background: #14171d; color: var(--text);
  }
  .fm-comp-match-score.victoire { color: var(--accent); border-color: #2f6b45; background: rgba(74,222,128,0.1); }
  .fm-comp-match-score.defaite { color: #f87171; border-color: #7a2f2f; background: rgba(248,113,113,0.1); }
  .fm-comp-match-score.nul { color: var(--text-dim); }
  /* Le pane de droite n'a pas de hauteur de conteneur fixe ici (la page
     scrolle, contrairement au dashboard) : on lui donne donc une hauteur
     explicite (comme le calendrier juste au-dessus) plutot qu'un flex:1,
     pour que la carte carree puisse combler cet espace. */
  .fm-comp-right-pane {
    width: 100%; display: flex; flex-wrap: wrap; align-content: flex-start; gap: 14px;
    height: min(50vh, 520px);
  }
  .fm-comp-card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 18px 20px; cursor: pointer; transition: border-color 0.15s;
    display: flex; flex-direction: column; overflow: hidden;
    aspect-ratio: 1 / 1; flex: 0 1 calc(20% - 11.2px); min-width: 300px; max-width: 440px;
  }
  .fm-comp-card:hover { border-color: var(--gold); }
  .fm-comp-card-head { flex: 0 0 auto; display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 14px; }
  .fm-comp-card-title { font-size: 15px; font-weight: 800; }
  .fm-comp-card-sub { font-size: 11.5px; color: var(--text-dim); margin-top: 2px; }
  .fm-comp-card-tag {
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.04em; font-weight: 700;
    background: rgba(251,191,36,0.12); color: var(--gold); border: 1px solid #7a5c0f;
    border-radius: 999px; padding: 3px 9px; flex-shrink: 0; white-space: nowrap;
  }
  .fm-comp-card-stats { flex: 0 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .fm-comp-stat .label { font-size: 10px; text-transform: uppercase; color: var(--text-dim); letter-spacing: 0.03em; margin-bottom: 3px; }
  .fm-comp-stat .value { font-size: 15px; font-weight: 700; }
  .fm-comp-mini-standings-wrap {
    flex: 1; min-height: 0; overflow-y: auto; margin-top: 14px; padding-top: 12px;
    border-top: 1px solid var(--border);
    scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.14) transparent;
  }
  .fm-comp-mini-standings-wrap::-webkit-scrollbar { width: 6px; }
  .fm-comp-mini-standings-wrap::-webkit-scrollbar-track { background: transparent; }
  .fm-comp-mini-standings-wrap::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.14); border-radius: 999px; }
  .fm-comp-mini-standings-wrap::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.26); }
  .fm-comp-mini-table { width: 100%; border-collapse: collapse; font-size: 11.5px; }
  .fm-comp-mini-table th {
    position: sticky; top: 0; background: var(--panel); text-align: left; font-size: 9.5px;
    text-transform: uppercase; letter-spacing: 0.03em; color: var(--text-dim);
    padding: 4px 6px; border-bottom: 1px solid var(--border);
  }
  .fm-comp-mini-table tbody tr { cursor: pointer; }
  .fm-comp-mini-table tbody tr:hover td { background: rgba(255,255,255,0.03); }
  .fm-comp-mini-table td { padding: 5px 6px; border-bottom: 1px solid rgba(255,255,255,0.04); }
  .fm-comp-mini-table tr:last-child td { border-bottom: none; }
  .fm-comp-mini-table tr.me td { background: rgba(251,191,36,0.1); }
  .fm-comp-mini-table tr.me .clt, .fm-comp-mini-table tr.me .nm { color: var(--gold); font-weight: 800; }
  .fm-comp-mini-table td.clt { color: var(--text-dim); width: 24px; }
  .fm-comp-mini-table td.nm {
    max-width: 0; width: 100%; font-weight: 600;
  }
  .fm-comp-mini-table td.nm:hover { color: var(--gold); text-decoration: underline; }
  .fm-comp-mini-table td.num { color: var(--text-dim); text-align: center; width: 28px; }
  .fm-comp-mini-table td.pts { font-weight: 700; text-align: center; width: 30px; color: var(--text); }
  .fm-club-link { cursor: pointer; }
  .fm-club-link:hover { color: var(--accent); text-decoration: underline; }
  .fm-club-logo { width: 18px; height: 18px; object-fit: contain; flex-shrink: 0; border-radius: 3px; }
  .fm-comp-mini-table .fm-club-link {
    display: inline-flex; align-items: center; gap: 7px; min-width: 0;
  }
  .fm-comp-mini-table .fm-club-link span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* Zones de qualification europeenne / relegation : liseret colore a
     gauche de la ligne + tres legere teinte de fond (memes codes couleur
     que sur la page Competition), une couleur par competition europeenne
     et une couleur dediee pour la releguation. */
  .fm-comp-mini-table tr.zone-euro-1 td:first-child { border-left: 3px solid #3b82f6; }
  .fm-comp-mini-table tr.zone-euro-1 td { background: rgba(59,130,246,0.07); }
  .fm-comp-mini-table tr.zone-euro-2 td:first-child { border-left: 3px solid #f97316; }
  .fm-comp-mini-table tr.zone-euro-2 td { background: rgba(249,115,22,0.07); }
  .fm-comp-mini-table tr.zone-euro-3 td:first-child { border-left: 3px solid #22c55e; }
  .fm-comp-mini-table tr.zone-euro-3 td { background: rgba(34,197,94,0.07); }
  .fm-comp-mini-table tr.zone-releg td:first-child { border-left: 3px solid var(--danger); }
  .fm-comp-mini-table tr.zone-releg td { background: rgba(239,68,68,0.07); }
  .fm-comp-mini-table tr.me.zone-euro-1 td, .fm-comp-mini-table tr.me.zone-euro-2 td,
  .fm-comp-mini-table tr.me.zone-euro-3 td, .fm-comp-mini-table tr.me.zone-releg td { background: rgba(251,191,36,0.12); }

  /* ---- Distinction championnat / coupe nationale sur les lignes de
     calendrier, et carte "coupe" dans le pane de droite (meme gabarit que
     la carte championnat, cf. .fm-comp-card ci-dessus). ---- */
  .fm-comp-match-comp {
    flex-shrink: 0; font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.03em;
    font-weight: 700; border-radius: 5px; padding: 3px 0; width: 46px; text-align: center;
  }
  .fm-comp-match-comp.champ { color: var(--gold); background: rgba(251,191,36,0.1); border: 1px solid #7a5c0f; }
  .fm-comp-match-comp.coupe { color: #60a5fa; background: rgba(59,130,246,0.12); border: 1px solid #1e40af; }
  .fm-comp-card-tag.coupe { background: rgba(59,130,246,0.12); color: #60a5fa; border-color: #1e40af; }
  .fm-comp-coupe-parcours {
    flex: 1; min-height: 0; overflow-y: auto; margin-top: 14px; padding-top: 12px;
    border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 5px;
    scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.14) transparent;
  }
  .fm-comp-coupe-parcours::-webkit-scrollbar { width: 6px; }
  .fm-comp-coupe-parcours::-webkit-scrollbar-track { background: transparent; }
  .fm-comp-coupe-parcours::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.14); border-radius: 999px; }
  .fm-comp-coupe-row { display: flex; align-items: center; gap: 8px; font-size: 11.5px; padding: 3px 0; }
  .fm-comp-coupe-row .rnd {
    flex-shrink: 0; width: 40px; font-size: 9.5px; text-align: center; color: var(--text-dim);
    background: #14171d; border: 1px solid var(--border); border-radius: 5px; padding: 2px 0;
  }
  .fm-comp-coupe-row .opp {
    flex: 1; min-width: 0; display: flex; align-items: center; gap: 7px;
    font-weight: 600; cursor: pointer;
  }
  .fm-comp-coupe-row .opp .opp-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fm-comp-coupe-row .opp:hover { color: var(--gold); text-decoration: underline; }
  .fm-comp-coupe-row .res {
    flex-shrink: 0; font-size: 10.5px; font-weight: 700; padding: 2px 8px; border-radius: 999px;
    border: 1px solid var(--border); background: #14171d; color: var(--text);
  }
  .fm-comp-coupe-row .res.win { color: var(--accent); border-color: #2f6b45; background: rgba(74,222,128,0.1); }
  .fm-comp-coupe-row .res.lose { color: #f87171; border-color: #7a2f2f; background: rgba(248,113,113,0.1); }
  .fm-comp-coupe-row .res.next { color: var(--gold); border-color: #7a5c0f; background: rgba(251,191,36,0.1); }
  .fm-comp-empty-inline { color: var(--text-dim); font-size: 12px; text-align: center; padding: 16px 0; }

  .fm-standings-legend {
    display: flex; flex-wrap: wrap; gap: 10px; padding: 10px 2px 0; font-size: 10.5px; color: var(--text-dim);
  }
  .fm-standings-legend .legend-item { display: flex; align-items: center; gap: 6px; }
  .fm-standings-legend .legend-dot { width: 9px; height: 9px; border-radius: 2px; flex-shrink: 0; }
  .fm-comp-card-footer {
    flex: 0 0 auto; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border);
    font-size: 11.5px; color: var(--text-dim); display: flex; justify-content: space-between; align-items: center;
  }
  .fm-comp-empty { padding: 40px 20px; text-align: center; color: var(--text-dim); font-size: 13px; }
  @media (max-width: 900px) {
    .fm-comp-calendar-pane { height: 56vh; }
    .fm-comp-right-pane { flex-direction: column; flex-wrap: nowrap; height: auto; }
    .fm-comp-card { aspect-ratio: auto; height: 420px; max-height: none; flex-basis: auto; min-width: 0; max-width: none; width: 100%; }
    .fm-comp-card-stats { grid-template-columns: repeat(2, 1fr); }
  }

  /* ---- Staff (sous-onglet) : 3 colonnes departement + fiches membres ---- */
  .staff-columns {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; align-items: start;
  }
  .staff-col-title {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--gold); margin-bottom: 12px;
  }
  .staff-col-title .count {
    background: rgba(255,255,255,0.06); color: var(--text-dim); border-radius: 999px;
    padding: 2px 9px; font-size: 11px; font-weight: 700; text-transform: none; letter-spacing: 0;
  }
  .staff-member-card {
    display: flex; align-items: center; gap: 12px; background: var(--panel);
    border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px;
    cursor: pointer; transition: border-color 0.15s, transform 0.1s;
  }
  .staff-member-card:hover { border-color: var(--gold); transform: translateY(-1px); }
  .staff-avatar {
    width: 42px; height: 42px; border-radius: 10px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 800; color: #1a1300;
  }
  .staff-member-info { flex: 1; min-width: 0; }
  .staff-member-name { font-size: 13.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .staff-member-role { font-size: 11px; color: var(--text-dim); margin-top: 1px; }
  .staff-member-meta {
    display: flex; align-items: center; gap: 6px; margin-top: 5px; font-size: 11px; color: var(--text-dim);
    flex-wrap: wrap;
  }
  .staff-member-meta .flag-icon { width: 14px; height: auto; margin-right: 0; }
  .staff-attr-chip {
    display: inline-flex; align-items: center; gap: 3px; background: rgba(255,255,255,0.05);
    border-radius: 6px; padding: 1px 6px; font-size: 10.5px; color: var(--text-dim);
  }
  .staff-attr-chip b { color: var(--text); font-weight: 700; }
  .staff-member-side { text-align: right; flex-shrink: 0; font-size: 11px; color: var(--text-dim); }
  .staff-member-side .salaire { color: var(--text); font-weight: 700; font-size: 12px; }
  .staff-col-empty { color: var(--text-dim); font-size: 12.5px; padding: 6px 0 14px; }

  /* ---- Staff : colonnes-recap cliquables (effectif + comparaison ligue) ---- */
  .staff-column {
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    padding: 14px 16px; cursor: pointer; transition: border-color 0.15s, transform 0.1s;
  }
  .staff-column:hover { border-color: var(--gold); transform: translateY(-1px); }
  .staff-col-recap { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
  .staff-recap-count {
    display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
    font-size: 11.5px; color: var(--text-dim);
  }
  .staff-recap-count b { color: var(--text); font-weight: 800; }
  .staff-recap-rank { font-size: 10.5px; font-weight: 700; white-space: nowrap; color: var(--text-dim); }
  .staff-recap-rank.pos { color: #6bcf7f; }
  .staff-recap-rank.neg { color: #e2725b; }
  .staff-recap-roles { display: flex; flex-wrap: wrap; gap: 5px; }
  .staff-role-mini-chip {
    background: rgba(255,255,255,0.05); border-radius: 6px; padding: 2px 7px;
    font-size: 10.5px; color: var(--text-dim);
  }
  .staff-role-mini-chip b { color: var(--text); font-weight: 700; margin-left: 3px; }
  .staff-recap-attr {
    display: flex; align-items: baseline; gap: 6px; font-size: 11.5px; color: var(--text-dim);
    flex-wrap: wrap;
  }
  .staff-recap-attr b { color: var(--text); font-size: 12.5px; }
  .staff-recap-vs { font-size: 10.5px; margin-left: auto; white-space: nowrap; }
  .staff-recap-vs.pos { color: #6bcf7f; }
  .staff-recap-vs.neg { color: #e2725b; }
  .staff-col-open-hint {
    font-size: 10.5px; color: var(--text-dim); text-align: right; margin-top: 4px; opacity: 0.7;
  }
  .staff-column:hover .staff-col-open-hint { color: var(--gold); opacity: 1; }
  .staff-sector-list { max-height: 60vh; overflow-y: auto; }
  .staff-role-filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .staff-role-chip {
    background: rgba(255,255,255,0.04); border: 1px solid var(--border); color: var(--text-dim);
    border-radius: 20px; padding: 5px 12px; font-size: 11.5px; cursor: pointer;
    display: flex; align-items: center; gap: 5px; transition: border-color 0.15s, color 0.15s, background 0.15s;
  }
  .staff-role-chip:hover { border-color: var(--gold); color: var(--text); }
  .staff-role-chip.active { background: var(--gold); border-color: var(--gold); color: #1a1300; font-weight: 700; }
  .staff-role-chip .count { opacity: 0.75; }
  .staff-role-group-title {
    font-size: 11px; font-weight: 700; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.03em;
    padding: 10px 0 6px; display: flex; align-items: center; gap: 6px;
  }
  .staff-role-group-title .count { color: var(--gold); font-weight: 800; }
  .staff-modal-back {
    background: none; border: none; color: var(--text-dim); font-size: 18px; cursor: pointer;
    padding: 4px 8px 4px 0; line-height: 1;
  }
  .staff-modal-back:hover { color: var(--gold); }

  .staff-modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 300;
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .staff-modal-overlay.hidden { display: none !important; }
  .staff-modal {
    width: 100%; max-width: 460px; max-height: 86vh; overflow-y: auto;
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 20px 22px;
  }
  .staff-modal.wide { max-width: 620px; }
  .staff-modal-header { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
  .staff-modal-close {
    margin-left: auto; background: none; border: none; color: var(--text-dim); font-size: 18px;
    cursor: pointer; line-height: 1; padding: 4px;
  }
  .staff-modal-close:hover { color: var(--text); }
  .staff-modal-avatar {
    width: 56px; height: 56px; border-radius: 14px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 800; color: #1a1300;
  }
  .staff-modal-name { font-size: 17px; font-weight: 800; }
  .staff-modal-role { font-size: 12.5px; color: var(--gold); font-weight: 700; margin-top: 2px; }
  .staff-modal-sub { font-size: 12px; color: var(--text-dim); margin-top: 4px; display: flex; align-items: center; gap: 6px; }

  @media (max-width: 900px) {
    .fm-header { padding: 10px 14px; }
    .fm-header .back-link { display: none; }
    .fm-body { flex-direction: column; }
    .fm-sidebar {
      width: 100%; height: auto; flex-shrink: 0; display: flex; overflow-x: auto;
      overflow-y: hidden; padding: 0; border-right: none; border-bottom: 1px solid var(--border);
    }
    .fm-sidebar-crest { display: none; }
    .fm-sidebar-nav { display: flex; padding: 4px; overflow-x: auto; overflow-y: hidden; }
    .fm-nav-item { border-left: none; border-bottom: 3px solid transparent; white-space: nowrap; }
    .fm-nav-item.active { border-left-color: transparent; border-bottom-color: var(--gold); }
    .fm-subtabs { padding: 8px 12px 0; overflow-x: auto; }
    .fm-content-wrap { padding: 14px; }
    .club-grid { grid-template-columns: 1fr; }
    .staff-columns { grid-template-columns: 1fr; }
  }

  /* ---- Détails de match (popup, calendrier & compétitions) ---- */
  .mdet-btn {
    background: none; border: 1px solid var(--border); color: var(--text-dim);
    font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px;
    cursor: pointer; margin-left: 8px; white-space: nowrap; flex-shrink: 0;
  }
  .mdet-btn:hover { border-color: var(--gold); color: var(--gold); }

  .mdet-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.55); backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px); z-index: 400;
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .mdet-overlay.hidden { display: none !important; }
  .mdet-modal {
    width: 100%; max-width: 1120px; max-height: 94vh; overflow-y: auto; overflow-x: hidden;
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 18px 24px 22px;
  }
  .mdet-header { display: flex; align-items: center; gap: 16px; margin-bottom: 4px; }
  .mdet-header-teams { flex: 1; display: flex; align-items: center; justify-content: center; gap: 18px; font-size: 17px; font-weight: 800; text-align: center; min-width: 0; }
  .mdet-header-teams .score { color: var(--gold); font-variant-numeric: tabular-nums; margin: 0 4px; font-size: 22px; flex-shrink: 0; }
  .mdet-header-team-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mdet-header-team-name.dom { text-align: right; }
  .mdet-header-team-name.ext { text-align: left; }
  .mdet-close {
    background: none; border: none; color: var(--text-dim); font-size: 18px;
    cursor: pointer; line-height: 1; padding: 4px; flex-shrink: 0;
  }
  .mdet-close:hover { color: var(--text); }
  .mdet-meta { text-align: center; font-size: 11.5px; color: var(--text-dim); margin-bottom: 10px; }

  .mdet-club-logo {
    flex-shrink: 0; object-fit: contain; background: transparent;
  }
  .mdet-club-logo-fallback {
    border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; color: #0b0d12; border: 1px solid var(--border);
  }

  .mdet-section-title {
    font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--text-dim); margin: 12px 0 6px;
  }
  .mdet-section-title:first-of-type { margin-top: 4px; }
  .mdet-stats-grid { display: grid; grid-template-columns: 1fr auto 1fr; gap: 5px 10px; font-size: 12.5px; }
  .mdet-stats-grid .label { grid-column: 2; text-align: center; color: var(--text-dim); font-size: 10.5px; text-transform: uppercase; white-space: nowrap; }
  .mdet-stats-grid .val-dom { text-align: right; font-weight: 700; }
  .mdet-stats-grid .val-ext { text-align: left; font-weight: 700; }

  /* Barres de domination : toutes les stats d'equipe comparees en barres,
     sur 2 colonnes pour limiter la hauteur du popup. */
  .mdet-bars { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 26px; margin-bottom: 4px; }
  .mdet-bar-row { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .mdet-bar-val { font-size: 12px; font-weight: 800; width: 30px; flex-shrink: 0; font-variant-numeric: tabular-nums; }
  .mdet-bar-val.dom { text-align: right; }
  .mdet-bar-val.ext { text-align: left; }
  .mdet-bar-mid { flex: 1; min-width: 0; }
  .mdet-bar-label { text-align: center; font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.03em; color: var(--text-dim); margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mdet-bar-track { display: flex; height: 6px; border-radius: 999px; overflow: hidden; background: #14171d; }
  .mdet-bar-fill { height: 100%; }
  .mdet-bar-fill.dom { background: var(--gold); border-radius: 999px 0 0 999px; margin-left: auto; }
  .mdet-bar-fill.ext { background: var(--accent, #4ade80); border-radius: 0 999px 999px 0; }
  @media (max-width: 640px) {
    .mdet-bars { grid-template-columns: 1fr; }
  }

  /* ---- Faits de match : frise chronologique horizontale ---- */
  .mdet-timeline {
    display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: center;
    gap: 0; row-gap: 22px; padding: 8px 6px 6px; margin: 0 auto;
  }
  .mdet-timeline-item {
    position: relative; flex: 0 0 118px; width: 118px;
    padding-top: 29px; text-align: center;
  }
  .mdet-timeline-item::before {
    content: ""; position: absolute; left: 0; right: 0; top: 13px; height: 2px;
    background: var(--border);
  }
  .mdet-timeline-item:first-child::before { left: 50%; }
  .mdet-timeline-item:last-child::before { right: 50%; }
  .mdet-timeline-dot {
    position: absolute; left: 50%; top: 0; transform: translateX(-50%);
    width: 27px; height: 27px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; font-size: 13px;
    background: #14171d; border: 2px solid var(--border); z-index: 1;
  }
  .mdet-timeline-minute { font-size: 10.5px; color: var(--gold); font-weight: 700; margin-top: 6px; }
  .mdet-timeline-text { font-size: 11.5px; color: var(--text); line-height: 1.35; margin-top: 2px; }
  .mdet-event-detail { color: var(--text-dim); display: block; font-size: 10.5px; margin-top: 1px; }
  .mdet-empty { color: var(--text-dim); font-size: 12.5px; padding: 6px 0; text-align: center; }

  /* ---- Compositions (titulaires + remplacants), 2 colonnes ---- */
  .mdet-roster-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 22px; }
  .mdet-roster-col { min-width: 0; }
  .mdet-roster-team-head { display: flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 700; margin-bottom: 6px; overflow: hidden; }
  .mdet-roster-team-head span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mdet-roster-subhead {
    font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--text-dim); margin: 10px 0 4px;
  }
  .mdet-player-row {
    display: flex; align-items: center; gap: 8px; font-size: 12px; padding: 4px 2px;
    border-bottom: 1px solid var(--border);
  }
  .mdet-player-row:last-child { border-bottom: none; }
  .mdet-player-sub-icon { flex-shrink: 0; font-size: 11px; width: 14px; text-align: center; }
  .mdet-player-name-wrap { flex: 1; min-width: 0; }
  .mdet-player-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); }
  .mdet-player-name.clickable { cursor: pointer; }
  .mdet-player-name.clickable:hover { color: var(--gold); text-decoration: underline; }
  .mdet-player-name.motm { color: var(--gold); }
  .mdet-player-sub-detail { font-size: 10px; color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* Remplacement affiche sur 3 lignes : titulaire sorti / icone verticale / entrant */
  /* ---- Remplacement dans la timeline "Faits de match" : affiche sur 3
     lignes (titulaire sorti / icone de remplacement / entrant) au lieu
     d'une seule ligne "entrant <-> sortant" pouvant retomber sur 2 lignes
     par manque de place. */
  .mdet-timeline-sub { display: flex; flex-direction: column; align-items: center; gap: 1px; margin-top: 2px; }
  .mdet-timeline-sub-name { font-size: 11px; color: var(--text); line-height: 1.25; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mdet-timeline-sub-name.out { color: var(--text-dim); }
  .mdet-timeline-sub-icon { font-size: 10px; line-height: 1; transform: rotate(90deg); margin: 1px 0; }
  .mdet-player-note {
    flex-shrink: 0; font-weight: 800; font-variant-numeric: tabular-nums; font-size: 11px;
    padding: 1px 7px; border-radius: 999px; min-width: 30px; text-align: center;
  }
  .mdet-note-elite { background: rgba(74,222,128,0.18); color: #4ade80; }
  .mdet-note-bon { background: rgba(163,230,53,0.15); color: #a3e635; }
  .mdet-note-moyen { background: rgba(148,163,184,0.15); color: var(--text-dim); }
  .mdet-note-faible { background: rgba(251,191,36,0.15); color: var(--gold); }
  .mdet-note-mauvais { background: rgba(239,68,68,0.18); color: var(--danger); }

  .mdet-motm-banner {
    display: flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 700;
    color: var(--gold); background: rgba(251,191,36,0.1); border: 1px solid rgba(251,191,36,0.3);
    border-radius: 8px; padding: 6px 12px; margin-bottom: 10px;
  }
  @media (max-width: 640px) {
    .mdet-roster-grid { grid-template-columns: 1fr; gap: 14px 0; }
    .mdet-header-teams { font-size: 13px; gap: 8px; }
    .mdet-header-teams .score { font-size: 16px; }
    .mdet-header-teams .mdet-club-logo,
    .mdet-header-teams .mdet-club-logo-fallback { width: 40px !important; height: 40px !important; font-size: 13px !important; }
  }

  /* ---- Plan de terrain (schema de formation, base sur stats.notes_joueurs[].role) ---- */
  .mdet-pitch {
    position: relative; width: 100%; height: 300px; border-radius: 10px; overflow: hidden;
    margin-bottom: 10px; border: 1px solid var(--border);
    background:
      repeating-linear-gradient(0deg, rgba(255,255,255,0.035) 0 34px, transparent 34px 68px),
      linear-gradient(180deg, #1d4a28, #163a20);
  }

  [4250, 3], [5800, 3.5], [7500, 4], [9000, 4.5], [Infinity, 5]

  for (const [max, stars] of STAR_BANDS) {

}
function starsHtml(rating) {
  if (rating === null || rating === undefined) return "-";
  const pct = Math.max(0, Math.min(100, (rating / 5) * 100));
  return `<span class="stars" title="${rating.toFixed(1)}/5">
    <span class="stars-bg">★★★★★</span>
    <span class="stars-fg" style="width:${pct}%">★★★★★</span>
  </span>`;
}

function computeRealDate(dateDebut, jourActuel) {
  if (!dateDebut) return null;
  const base = new Date(`${dateDebut}T00:00:00`);
  if (isNaN(base.getTime())) return null;
  const jours = Number(jourActuel);
  base.setDate(base.getDate() + (Number.isFinite(jours) ? jours : 0));
  return base;
}

function fmApplyTopbarColor(color) {
  const header = document.getElementById("fmHeader");
  if (!header) return;
  if (!color || color.h == null) {
    header.style.background = "";
    return;
  }
  const h = Math.round(color.h);
  const s = Math.round(color.s ?? 70);
  const l = Math.round(color.l ?? 40);
  const dark = Math.max(l - 24, 8);
  const bright = Math.min(l + 16, 60);
  header.style.background =
    `linear-gradient(120deg, hsl(${h}, ${s}%, ${dark}%), hsl(${h}, ${s}%, ${l}%) 55%, hsl(${h}, ${Math.max(s - 8, 0)}%, ${bright}%))`;
}

// ===================== MOTEUR DE RECHERCHE APPROXIMATIVE =====================
// Recherche insensible aux accents, aux abreviations et aux surnoms de clubs
// courants ("man city" -> Manchester City, "munich" -> Bayern Munchen, "psg"
// -> Paris Saint-Germain...). Utilise par runGlobalSearch ci-dessous.
function fmNormSearch(s) {
  return (s || "")
    .toString()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .toLowerCase()
    .replace(/[^a-z0-9]+/g, " ")
    .trim();
}

// Paires de termes equivalents (surnoms, traductions, abreviations). Chaque
// paire est bidirectionnelle : chercher l'un des deux termes retrouve aussi
// les noms contenant l'autre.
const FM_SEARCH_ALIASES = [
  ["psg", "paris saint germain"], ["om", "marseille"], ["ol", "lyon"],
  ["asse", "saint etienne"], ["losc", "lille"], ["ogcn", "nice"],
  ["man city", "manchester city"], ["mancity", "manchester city"],
  ["man utd", "manchester united"], ["man u", "manchester united"], ["manu", "manchester united"],
  ["real", "real madrid"], ["atleti", "atletico madrid"], ["atletico", "atletico madrid"],
  ["barca", "barcelone"], ["barca", "barcelona"],
  ["juve", "juventus"], ["inter", "internazionale"], ["milan", "ac milan"],
  ["munich", "munchen"], ["munich", "muenchen"], ["bayern", "bayern munchen"],
  ["psv", "psv eindhoven"], ["dortmund", "borussia dortmund"], ["bvb", "borussia dortmund"],
  ["leverkusen", "bayer leverkusen"], ["spurs", "tottenham"],
];

function fmSearchVariants(q) {
  const base = fmNormSearch(q);
  const variants = new Set([base]);
  FM_SEARCH_ALIASES.forEach(([a, b]) => {
    if (base.includes(a)) variants.add(base.split(a).join(b));
    if (base.includes(b)) variants.add(base.split(b).join(a));
  });
  return [...variants];
}

// Score de correspondance entre un nom (club/competition/joueur) et une
// requete : prefixe de chaque mot dans n'importe quel ordre (gere "man city"
// -> "Manchester City"), acronyme (gere "psg" -> "Paris Saint-Germain"), puis
// repli en sous-chaine simple. 0 = pas de correspondance.
function fmMatchScore(name, query) {
  const normName = fmNormSearch(name);
  if (!normName) return 0;
  const nameWords = normName.split(" ").filter(Boolean);
  const flatName = nameWords.join("");
  const initials = nameWords.map(w => w[0]).join("");
  let best = 0;
  fmSearchVariants(query).forEach(variant => {
    const qWords = variant.split(" ").filter(Boolean);
    if (!qWords.length) return;
    // Acronyme (ex : "psg" -> Paris Saint-Germain).
    if (qWords.length === 1 && qWords[0].length >= 2 && qWords[0] === initials) {
      best = Math.max(best, 90);
    }
    // Chaque mot de la requete doit apparaitre comme sous-chaine dans au
    // moins un mot du nom, peu importe l'ordre : equivalent (en mieux, avec
    // accents/surnoms geres) au filtre ilike mot-par-mot d'origine.
    const allMatch = qWords.every(qw => nameWords.some(nw => nw.includes(qw)));
    if (allMatch) {
      const exact = qWords.every(qw => nameWords.includes(qw));
      const allPrefix = qWords.every(qw => nameWords.some(nw => nw.startsWith(qw)));
      best = Math.max(best, exact ? 100 : (allPrefix ? 85 : 70));
    }
    // Repli : la requete entiere (mots colles) est une sous-chaine du nom
    // complet (mots colles) -- utile si la coupure en mots ne correspond pas
    // exactement (tirets, apostrophes...).
    if (flatName.includes(variant.replace(/\s+/g, ""))) {
      best = Math.max(best, 60);
    }
  });
  return best;
}

// ===================== RECHERCHE GLOBALE =====================
// Deux points d'entree partagent le meme moteur : le titre de la topbar
// (transforme en champ de recherche) et la petite barre arrondie toujours
// visible a cote de la date. Recherche par mots + moteur approximatif
// (accents, surnoms/abreviations) sur clubs, competitions et joueurs, avec
// redirection vers la bonne page au clic sur un resultat.
let searchDebounceTimer = null;
let headerSearchDocListenerAttached = false;

function initHeaderSearch() {
  wireSearchField("fmSearchInput", "fmSearchDropdown", "fmSearchWrap");
  wireSearchField("fmQuickSearchInput", "fmQuickSearchDropdown", "fmQuickSearchWrap");
}

function wireSearchField(inputId, dropdownId, wrapId) {
  const input = document.getElementById(inputId);
  const dropdown = document.getElementById(dropdownId);
  if (!input || !dropdown) return;

  input.addEventListener("input", () => {
    clearTimeout(searchDebounceTimer);
    const q = input.value.trim();
    if (q.length < 2) {
      dropdown.classList.add("hidden");
      dropdown.innerHTML = "";
      return;
    }
    searchDebounceTimer = setTimeout(() => runGlobalSearch(q, dropdown), 250);
  });

  input.addEventListener("focus", () => {
    if (input.value.trim().length >= 2 && dropdown.innerHTML) dropdown.classList.remove("hidden");
  });

  input.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      input.value = "";
      dropdown.classList.add("hidden");
      dropdown.innerHTML = "";
      input.blur();
    }
  });

  if (!headerSearchDocListenerAttached) {
    document.addEventListener("click", (e) => {
      ["fmSearchWrap", "fmQuickSearchWrap"].forEach(wid => {
        const wrap = document.getElementById(wid);
        const dd = wrap ? wrap.querySelector(".fm-search-dropdown") : null;
        if (wrap && dd && !wrap.contains(e.target)) dd.classList.add("hidden");
      });
    });
    headerSearchDocListenerAttached = true;
  }
}

async function runGlobalSearch(q, dropdown) {
  // Recherche approximative : insensible aux accents et aux abreviations
  // courantes (voir fmMatchScore plus haut). Clubs, competitions et joueurs
  // sont tous filtres cote serveur d'abord (l'API tronque silencieusement
  // au-dela d'un certain nombre de lignes, donc on ne peut pas tout
  // rapatrier pour une table volumineuse), puis reclasses cote client par
  // pertinence + notoriete.
  const words = q.trim().split(/\s+/).filter(Boolean);

  let playerQuery = supabaseClient
    .from("game_players")
    .select("id, nom, poste_brut, game_club_id, reputation_mondiale")
    .eq("game_id", gameId);
  words.forEach(w => { playerQuery = playerQuery.ilike("nom", `%${w}%`); });

  // Un jeu peut compter des dizaines de milliers de clubs (toutes divisions,
  // toutes nations confondues) : impossible de tous les rapatrier pour
  // filtrer cote client, l'API tronque silencieusement au-dela d'un certain
  // nombre de lignes et des clubs pourtant existants (ex: Paris Saint-Germain,
  // Montpellier) pouvaient alors ne jamais apparaitre. On filtre donc cote
  // serveur mot par mot (comme pour les joueurs), avec une requete par
  // variante de recherche (accents/surnoms geres par fmSearchVariants : "psg"
  // lance aussi une recherche sur "paris saint germain", etc.), puis on
  // fusionne et on classe cote client par pertinence + notoriete.
  const clubVariants = fmSearchVariants(q).slice(0, 4);
  const clubQueries = clubVariants.map(variant => {
    const vWords = variant.split(" ").filter(Boolean);
    let query = supabaseClient.from("game_clubs").select("id, nom, club_ref").eq("game_id", gameId);
    vWords.forEach(w => { query = query.ilike("nom", `%${w}%`); });
    return query.limit(40);
  });

  const [
    clubResults,
    { data: allCompetitions, error: competitionsError },
    { data: players, error: playersError },
  ] = await Promise.all([
    Promise.all(clubQueries),
    supabaseClient.from("competitions").select("id, nom, nation, division, tier"), // pas de game_id : table globale (referentiel de competitions), pas clonee par partie
    playerQuery.order("reputation_mondiale", { ascending: false, nullsFirst: false }).limit(20),
  ]);
  clubResults.forEach(r => { if (r.error) console.error(r.error); });
  if (competitionsError) console.error(competitionsError);
  if (playersError) console.error(playersError);

  const clubCandidates = new Map();
  clubResults.forEach(r => { (r.data || []).forEach(c => clubCandidates.set(c.id, c)); });

  const clubsMatched = [...clubCandidates.values()]
    .map(c => ({ ...c, _score: fmMatchScore(c.nom, q) }))
    .filter(c => c._score > 0)
    .sort((a, b) => b._score - a._score || a.nom.localeCompare(b.nom))
    .slice(0, 40);

  let clubReputationByRef = {};
  if (clubsMatched.length > 0) {
    const refs = [...new Set(clubsMatched.map(c => c.club_ref).filter(Boolean))];
    if (refs.length > 0) {
      const { data: repRows } = await supabaseClient.from("clubs").select("id, reputation").in("id", refs);
      (repRows || []).forEach(r => { clubReputationByRef[r.id] = r.reputation; });
    }
  }
  const clubs = clubsMatched
    .sort((a, b) => (b._score - a._score)
      || ((clubReputationByRef[b.club_ref] ?? 0) - (clubReputationByRef[a.club_ref] ?? 0))
      || a.nom.localeCompare(b.nom))
    .slice(0, 6);

  const competitions = (allCompetitions || [])
    .map(c => ({ ...c, _score: fmMatchScore(c.nom, q) }))
    .filter(c => c._score > 0)
    .sort((a, b) => b._score - a._score || ((a.tier ?? 999) - (b.tier ?? 999)) || a.nom.localeCompare(b.nom))
    .slice(0, 6);

  const rankedPlayers = (players || [])
    .map(p => ({ ...p, _score: fmMatchScore(p.nom, q) }))
    .sort((a, b) => (b._score - a._score) || ((b.reputation_mondiale ?? 0) - (a.reputation_mondiale ?? 0)))
    .slice(0, 8);

  // Noms de club recuperes a part (plutot qu'une jointure imbriquee
  // club:game_clubs(nom)) : cette jointure est fragile si la relation FK
  // n'est pas explicite cote Supabase et faisait echouer silencieusement
  // toute la recherche joueurs (aucun resultat, meme pour un nom existant).
  let clubNameById = {};
  if (rankedPlayers.length > 0) {
    const clubIds = [...new Set(rankedPlayers.map(p => p.game_club_id).filter(Boolean))];
    if (clubIds.length > 0) {
      const { data: clubRows } = await supabaseClient
        .from("game_clubs")
        .select("id, nom")
        .in("id", clubIds);
      (clubRows || []).forEach(c => { clubNameById[c.id] = c.nom; });
    }
  }

  const hasClubs = clubs.length > 0;
  const hasCompetitions = competitions.length > 0;
  const hasPlayers = rankedPlayers.length > 0;

  if (!hasClubs && !hasCompetitions && !hasPlayers) {
    dropdown.innerHTML = `<div class="search-empty">Aucun résultat pour "${escapeHtml(q)}"</div>`;
    dropdown.classList.remove("hidden");
    return;
  }

  let html = "";
  if (hasClubs) {
    html += `<div class="search-group-label">Clubs</div>`;
    html += clubs.map(c => `
      <div class="search-result-item" data-type="club" data-id="${c.id}">
        <span class="search-result-icon">🛡️</span>
        <span>${escapeHtml(c.nom)}</span>
      </div>
    `).join("");
  }
  if (hasCompetitions) {
    html += `<div class="search-group-label">Compétitions</div>`;
    html += competitions.map(comp => `
      <div class="search-result-item" data-type="competition" data-id="${comp.id}">
        <span class="search-result-icon">🏆</span>
        <span>
          <div>${escapeHtml(comp.nom)}</div>
          <div class="search-result-sub">${escapeHtml(comp.nation || "-")}${comp.division ? " · " + escapeHtml(comp.division) : ""}</div>
        </span>
      </div>
    `).join("");
  }
  if (hasPlayers) {
    html += `<div class="search-group-label">Joueurs</div>`;
    html += rankedPlayers.map(p => `
      <div class="search-result-item" data-type="player" data-id="${p.id}" data-club="${p.game_club_id ?? ""}">
        <span class="search-result-icon">🧍</span>
        <span>
          <div>${escapeHtml(p.nom)}</div>
          <div class="search-result-sub">${escapeHtml(p.poste_brut || "-")}${clubNameById[p.game_club_id] ? " · " + escapeHtml(clubNameById[p.game_club_id]) : ""}</div>
        </span>
      </div>
    `).join("");
  }

  dropdown.innerHTML = html;
  dropdown.classList.remove("hidden");

  dropdown.querySelectorAll(".search-result-item").forEach(item => {
    item.addEventListener("click", () => {
      const type = item.getAttribute("data-type");
      const id = item.getAttribute("data-id");
      if (type === "club") {
        window.location.href = `club.html?game=${encodeURIComponent(gameId)}&club=${encodeURIComponent(id)}`;
      } else if (type === "competition") {
        window.location.href = `competition.html?game=${encodeURIComponent(gameId)}&competition=${encodeURIComponent(id)}&club=${encodeURIComponent(gameClubId || "")}`;
      } else {
        const clubId = item.getAttribute("data-club");
        window.location.href = `fiche.html?game=${encodeURIComponent(gameId)}&club=${encodeURIComponent(clubId)}&player=${encodeURIComponent(id)}`;
      }
    });
  });
}

// ===================== BADGE / LOGO DU CLUB =====================
// Le vrai logo du club (issu du referentiel public.clubs, colonne logo_url,
// rattache via game_clubs.club_ref) est utilise en priorite. A defaut, on
// genere un blason de substitution a partir des initiales du nom, avec une
// couleur stable (derivee du nom) pour que chaque club garde toujours le
// meme badge de repli.
function initials(nom) {
  const words = (nom || "").trim().split(/\s+/).filter(Boolean);
  if (words.length === 0) return "?";
  if (words.length === 1) return words[0].slice(0, 2).toUpperCase();
  return (words[0][0] + words[1][0]).toUpperCase();
}
function colorFromName(nom) {
  let hash = 0;
  for (let i = 0; i < (nom || "").length; i++) hash = nom.charCodeAt(i) + ((hash << 5) - hash);
  const hue = Math.abs(hash) % 360;
  return `hsl(${hue}, 62%, 46%)`;
}
function getClubLogoUrl(rawClub) {
  return rawClub?.clubs?.logo_url || rawClub?.logo_url || rawClub?.logo || null;
}
function renderClubBadge(club, rawClub) {
  const logoUrl = getClubLogoUrl(rawClub);
  if (logoUrl) return `<img src="${escapeHtml(logoUrl)}" alt="">`;
  return "";
}

// ===================== TERRAIN ILLUSTRE (derniere composition) =====================
// Alimente par calendrier.stats.notes_joueurs (jsonb ecrit par
// moteur_match.js a chaque match simule) : on prend le dernier match joue
// par ce club et on affiche ses 11 titulaires sur le terrain.

function compoPitchRows(titulaires) {
  const bands = { GB: [], DEF: [], MD: [], MO: [], BT: [] };
  titulaires.forEach(p => {
    if (p.role === "GB") bands.GB.push(p);
    else if (p.role === "D" || p.role === "AL") bands.DEF.push(p);
    else if (p.role === "MD") bands.MD.push(p);
    else if (p.role === "MO") bands.MO.push(p);
    else if (p.role === "BT") bands.BT.push(p);
    else bands.MD.push(p);
  });
  // Ligne de defense : arrieres lateraux (AL) aux extremites, defenseurs
  // axiaux (D) au centre (meme logique que mdetPitchRows du dashboard).
  const al = bands.DEF.filter(p => p.role === "AL");
  const d = bands.DEF.filter(p => p.role !== "AL");
  const defOrdered = [];
  if (al[0]) defOrdered.push(al[0]);
  defOrdered.push(...d);
  if (al[1]) defOrdered.push(al[1]);
  if (al.length > 2) defOrdered.push(...al.slice(2));
  return [
    { y: 600, players: bands.GB },
    { y: 483, players: defOrdered },
    { y: 366, players: bands.MD },
    { y: 228, players: bands.MO },
    { y: 90, players: bands.BT },
  ].filter(row => row.players.length);
}

// Photos des titulaires affiches sur ce terrain (referentiel public.players,
// colonne photo_url, reliee via game_players -> players). Meme logique que
// tacFetchPlayerPhotos (onglet Tactique), duplique ici pour ne pas dependre
// de l'ordre de declaration des fonctions dans le fichier.
async function compoFetchPlayerPhotos(playerIds) {
  const ids = [...new Set((playerIds || []).filter(id => id != null))];
  const photos = {};
  if (!ids.length) return photos;
  const { data } = await supabaseClient
    .from("game_players")
    .select("id, players(photo_url)")
    .in("id", ids);
  (data || []).forEach(p => {
    const url = p.players?.photo_url;
    if (url) photos[p.id] = url;
  });
  return photos;
}

function compoPitchSvg(titulaires, photos = {}) {
  const rows = compoPitchRows(titulaires);
  const R = 26;
  const dots = rows.flatMap(row => {
    const n = row.players.length;
    return row.players.map((p, i) => {
      const x = ((i + 1) / (n + 1)) * 360 + 45;
      const nomCourt = (p.player_nom || "?").trim().split(/\s+/).pop();
      const initials = escapeHtml((p.player_nom || "?").trim().split(/\s+/).map(w => w[0]).join("").slice(0, 2).toUpperCase());
      const attrs = p.player_id ? ` class="compo-pitch-player" data-player-id="${escapeHtml(String(p.player_id))}"` : "";
      const photoUrl = p.player_id ? photos[p.player_id] : null;
      const clipId = `compoClip-${p.player_id != null ? p.player_id : `${row.y}-${i}`}`;
      const faceContent = photoUrl
        ? `
          <defs><clipPath id="${clipId}"><circle r="${R - 2}"/></clipPath></defs>
          <image class="compo-pitch-face" href="${escapeHtml(photoUrl)}" x="${-R}" y="${-R}" width="${R * 2}" height="${R * 2}"
            preserveAspectRatio="xMidYMid slice" clip-path="url(#${clipId})"
            onerror="this.remove()"/>
        `
        : `<text text-anchor="middle" dy="6" font-size="15" font-weight="800" fill="#fff">${initials}</text>`;
      return `
        <g${attrs} transform="translate(${x},${row.y})">
          <circle r="${R}" fill="#1c2029" stroke="rgba(255,255,255,0.7)" stroke-width="2"/>
          ${faceContent}
          <circle r="${R}" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
          <text text-anchor="middle" y="${R + 18}" font-size="13" font-weight="700" fill="#fff" stroke="rgba(0,0,0,0.8)" stroke-width="3" paint-order="stroke">${escapeHtml(nomCourt)}</text>
        </g>
      `;
    });
  }).join("");
  return `
    <div class="pitch-wrap">
      <svg class="pitch-svg" viewBox="0 0 450 650" xmlns="http://www.w3.org/2000/svg">
        ${pitchBackground()}
        ${dots}
      </svg>
    </div>
  `;
}

async function renderPitch() {
  const el = document.getElementById("clubPitch");
  el.innerHTML = `<div class="pitch-caption">Chargement...</div>`;

  const clubIdNum = Number(gameClubId);
  const { data: matches, error } = await supabaseClient
    .from("calendrier")
    .select("id, date_match, journee, club_domicile_id, club_exterieur_id, stats")
    .eq("game_id", gameId)
    .or(`club_domicile_id.eq.${clubIdNum},club_exterieur_id.eq.${clubIdNum}`)
    .not("score_domicile", "is", null)
    .order("date_match", { ascending: false })
    .limit(1);

  const m = !error && matches && matches[0];
  const isHome = m ? m.club_domicile_id === clubIdNum : false;
  const notes = m ? (isHome ? m.stats?.notes_joueurs?.domicile : m.stats?.notes_joueurs?.exterieur) : null;
  const titulaires = (notes || []).filter(n => !n.entrant);

  if (!m || !titulaires.length) {
    el.innerHTML = `
      <div class="pitch-caption">Aucune composition enregistrée pour l'instant.</div>
      ${emptyPitchSvg()}
    `;
    return;
  }

  const formation = isHome ? m.stats?.formation?.domicile : m.stats?.formation?.exterieur;
  const oppId = isHome ? m.club_exterieur_id : m.club_domicile_id;
  const { data: oppClub } = await supabaseClient.from("game_clubs").select("nom").eq("id", oppId).single();
  const d = m.date_match ? new Date(m.date_match) : null;
  const dateLabel = d ? d.toLocaleDateString("fr-FR", { day: "2-digit", month: "2-digit" }) : "";
  const captionParts = [];
  if (formation) captionParts.push(formation);
  captionParts.push(`vs ${oppClub?.nom || "?"}${dateLabel ? ` (${dateLabel})` : ""}`);

  const photos = await compoFetchPlayerPhotos(titulaires.map(t => t.player_id));

  el.innerHTML = `
    <div class="pitch-caption">${escapeHtml(captionParts.join(" · "))}</div>
    ${compoPitchSvg(titulaires, photos)}
  `;
  el.querySelectorAll(".compo-pitch-player[data-player-id]").forEach(node => {
    node.addEventListener("click", () => window.mdetGoToPlayer(gameClubId, node.getAttribute("data-player-id")));
  });
}

// ===================== FINANCES (reprend la logique de dashboard.html) =====================
async function fetchFinanceHistory(club) {
  const { data, error } = await supabaseClient
    .from("game_events")
    .select("jour, payload")
    .eq("game_id", gameId)
    .eq("game_club_id", club.game_club_id)
    .eq("type", "finance")
    .order("jour", { ascending: true })
    .order("id", { ascending: true });

  if (error || !data || data.length === 0) return [];

  const deltas = data.map(ev => Number(ev.payload?.montant) || 0);
  const totalDelta = deltas.reduce((a, b) => a + b, 0);
  let running = (club.budget_actuel || 0) - totalDelta;

  return data.map((ev, i) => {
    running += deltas[i];
    return { jour: ev.jour, value: running, delta: deltas[i], motif: ev.payload?.motif || null };
  });
}

function renderFinanceChart(history) {
  const w = 400, h = 90, padY = 8;
  const values = history.map(p => p.value);
  const min = Math.min(...values), max = Math.max(...values);
  const range = Math.max(1, max - min);
  const stepX = history.length > 1 ? w / (history.length - 1) : 0;

  const coords = history.map((pt, i) => {
    const x = history.length > 1 ? i * stepX : w / 2;
    const y = h - padY - ((pt.value - min) / range) * (h - padY * 2);
    return { x, y, pt };
  });

  const linePoints = coords.map(c => `${c.x.toFixed(1)},${c.y.toFixed(1)}`).join(" ");
  const dots = coords.map(c => {
    const color = c.pt.delta >= 0 ? "var(--accent)" : "var(--danger)";
    const label = `J${c.pt.jour}${c.pt.motif ? " — " + c.pt.motif : ""} : ${c.pt.delta >= 0 ? "+" : ""}${formatMoney(c.pt.delta)}`;
    return `<circle cx="${c.x.toFixed(1)}" cy="${c.y.toFixed(1)}" r="2.6" fill="${color}"><title>${label}</title></circle>`;
  }).join("");

  return `
    <svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="width:100%; height:auto; overflow:visible; margin-top:8px;">
      <polyline points="${linePoints}" fill="none" stroke="var(--accent)" stroke-width="2" />
      ${dots}
    </svg>
  `;
}

async function renderFinances(club) {
  const el = document.getElementById("clubFinances");

  el.innerHTML = `

// Recupere le staff des clubs de la MEME ligue (meme nation + division) que
// le club consulte, et calcule par departement : l'effectif moyen par club
// et la moyenne des attributs pertinents, pour permettre la comparaison
// affichee sur les colonnes. Le classement ne porte que sur cette ligue,
// jamais sur l'ensemble des clubs de la partie (potentiellement plusieurs
// centaines, toutes nations et divisions confondues).
async function fetchLeagueStaffStats(gid, nation, division) {
  if (!nation || !division) {
    console.warn("fetchLeagueStaffStats: nation/division manquantes, classement ignore");
    return { numClubs: 1, depts: {} };
  }

  const { data: clubs, error: clubsErr } = await supabaseClient
    .from("game_club_overview")
    .select("game_club_id")
    .eq("game_id", gid)
    .eq("nation", nation)
    .eq("division", division);
  if (clubsErr) console.error("fetchLeagueStaffStats: erreur chargement des clubs de la ligue", clubsErr);
  const clubIds = [...new Set((clubs || []).map(c => c.game_club_id))];
  const numClubs = clubIds.length || 1;
  if (clubIds.length === 0) return { numClubs, depts: {} };

  const { data: gameStaffRows, error: gsErr } = await supabaseClient
    .from("game_staff")
    .select("id, staff_ref, poste, game_club_id")
    .eq("game_id", gid)
    .in("game_club_id", clubIds);
  if (gsErr) console.error("fetchLeagueStaffStats: erreur chargement game_staff", gsErr);
  if (gsErr || !gameStaffRows) return { numClubs, depts: {} };

  const refs = [...new Set(gameStaffRows.map(r => r.staff_ref).filter(Boolean))];
  let staffByRef = {};
  const chunkSize = 300;
  for (let i = 0; i < refs.length; i += chunkSize) {
    const chunk = refs.slice(i, i + chunkSize);
    const { data: staffRows } = await supabaseClient
      .from("staff")
      .select("id, niveau_tactique, niveau_defense, niveau_attaque, eval_joueurs, eval_potentiel, formation_jeunes, determination, professionnalisme")
      .in("id", chunk);
    (staffRows || []).forEach(s => { staffByRef[s.id] = s; });
  }

  const depts = {};
  gameStaffRows.forEach(r => {
    const dept = staffDepartmentFor(r.poste);
    const attrs = staffByRef[r.staff_ref] || {};
    if (!depts[dept]) depts[dept] = { count: 0, sums: {}, counts: {}, byClub: {} };
    depts[dept].count++;
    const cid = r.game_club_id;
    if (!depts[dept].byClub[cid]) depts[dept].byClub[cid] = { count: 0, sums: {}, counts: {} };
    depts[dept].byClub[cid].count++;
    (STAFF_DEPT_ATTRS[dept] || []).forEach(([key]) => {
      const val = Number(attrs[key]);
      if (Number.isFinite(val)) {
        depts[dept].sums[key] = (depts[dept].sums[key] || 0) + val;
        depts[dept].counts[key] = (depts[dept].counts[key] || 0) + 1;
        depts[dept].byClub[cid].sums[key] = (depts[dept].byClub[cid].sums[key] || 0) + val;
        depts[dept].byClub[cid].counts[key] = (depts[dept].byClub[cid].counts[key] || 0) + 1;
      }
    });
  });
  Object.values(depts).forEach(d => {
    d.avgPerClub = d.count / numClubs;
    d.avgAttrs = {};
    Object.keys(d.sums).forEach(key => { d.avgAttrs[key] = d.sums[key] / d.counts[key]; });

    // Classement des clubs sur ce departement : score = moyenne des moyennes
    // d'attributs cles (a effectif egal, un club avec un staff plus fort
    // remonte dans le classement). Les clubs sans staff evalue dans ce
    // departement sont places en fin de classement (tries par effectif).
    const attrKeys = Object.keys(d.sums);
    const scored = clubIds.map(cid => {
      const cd = d.byClub[cid] || { count: 0, sums: {}, counts: {} };
      let score = null;
      if (attrKeys.length > 0) {
        const avgs = attrKeys.map(k => (cd.counts[k] ? cd.sums[k] / cd.counts[k] : null)).filter(v => v != null);
        if (avgs.length > 0) score = avgs.reduce((a, b) => a + b, 0) / avgs.length;
      }
      return { cid, count: cd.count, score };
    });
    scored.sort((a, b) => {
      if (a.score == null && b.score == null) return b.count - a.count;
      if (a.score == null) return 1;
      if (b.score == null) return -1;
      return b.score - a.score;
    });
    d.rankByClub = {};
    scored.forEach((s, i) => { d.rankByClub[s.cid] = i + 1; });
    d.numClubsRanked = scored.length;
  });

  console.debug("[staff league stats]", { numClubs, clubIds, depts });
  return { numClubs, depts };
}

async function fetchClubStaffMembers(clubId) {
  const { data: gameStaffRows, error: gsErr } = await supabaseClient
    .from("game_staff")
    .select("id, staff_ref, nom, poste, salaire_actuel, contrat_expire")
    .eq("game_id", gameId)
    .eq("game_club_id", clubId);
  if (gsErr) { console.error(gsErr); return []; }
  if (!gameStaffRows || gameStaffRows.length === 0) return [];

  const refs = [...new Set(gameStaffRows.map(r => r.staff_ref).filter(Boolean))];
  let staffByRef = {};
  if (refs.length > 0) {
    const { data: staffRows, error: sErr } = await supabaseClient
      .from("staff")
      .select("id, nationalite, age, personnalite, eval_joueurs, eval_potentiel, formation_jeunes, niveau_tactique, niveau_defense, niveau_attaque, determination, professionnalisme, qualification_preparateur")
      .in("id", refs);
    if (sErr) console.error(sErr);
    (staffRows || []).forEach(s => { staffByRef[s.id] = s; });
  }

  return gameStaffRows.map(r => ({ ...r, ...(staffByRef[r.staff_ref] || {}) }));
}

          ${age ? `<span>· ${age}</span>` : ""}
        </div>
        <div class="staff-member-meta">${renderStaffAttrChips(member, dept, locked)}</div>
      </div>
      <div class="staff-member-side">
        <div class="salaire">${member.salaire_actuel != null ? formatMoney(member.salaire_actuel) + " / mois" : "-"}</div>
        <div>${formatContractEnd(member.contrat_expire)}</div>
      </div>
    </div>
  `;
}

function formatContractEnd(dateStr) {
  if (!dateStr) return "-";
  const d = new Date(`${dateStr}T00:00:00`);
  if (isNaN(d.getTime())) return "-";
  return new Intl.DateTimeFormat("fr-FR", { day: "2-digit", month: "short", year: "numeric" }).format(d);
}

// Recap affiche sur chaque colonne, dans l'ordre :
// 1) effectif du departement + classement du club sur ce departement (parmi
//    tous les clubs de la ligue, base sur le niveau moyen du secteur) ;
// 2) repartition des effectifs par intitule de poste exact, pour voir d'un
//    coup d'oeil "combien de X, combien de Y" sans ouvrir le detail ;
// 3) moyenne des attributs cles du departement, avec ecart (▲/▼) vs la
//    moyenne de la ligue sur ces memes attributs.
function renderStaffColRecap(dept, members, locked, clubId) {
  const league = leagueStaffStats?.depts?.[dept];
  const rank = league?.rankByClub?.[clubId];
  const totalRanked = league?.numClubsRanked;

  let rankHtml;
  if (rank != null && totalRanked) {
    const tier = rank <= Math.ceil(totalRanked / 3) ? "pos" : (rank > Math.ceil(totalRanked * 2 / 3) ? "neg" : "");
    const ord = rank === 1 ? "ᵉʳ" : "ᵉ";
    rankHtml = `<span class="staff-recap-rank ${tier}">${rank}${ord} / ${totalRanked} clubs de la ligue</span>`;
  } else {
    rankHtml = `<span class="staff-recap-rank">Classement indisponible</span>`;
  }
  const countHtml = `<div class="staff-recap-count"><span>Effectif : <b>${members.length}</b></span>${rankHtml}</div>`;

  const roleCounts = {};
  members.forEach(m => {
    const role = (m.poste || "Autre").trim();
    roleCounts[role] = (roleCounts[role] || 0) + 1;
  });
  const roleNames = Object.keys(roleCounts).sort((a, b) => roleCounts[b] - roleCounts[a] || a.localeCompare(b, "fr"));
  const rolesHtml = roleNames.length > 0
    ? `<div class="staff-recap-roles">${roleNames.map(r => `<span class="staff-role-mini-chip">${escapeHtml(r)}<b>${roleCounts[r]}</b></span>`).join("")}</div>`
    : "";

  if (locked) {
    return `<div class="staff-col-recap">${countHtml}${rolesHtml}<div class="staff-col-empty" style="padding:0;">🔒 Statistiques verrouillées</div></div>`;
  }

  const attrDefs = STAFF_DEPT_ATTRS[dept] || [];
  const attrHtml = attrDefs.map(([key, label]) => {
    const vals = members.map(m => Number(m[key])).filter(Number.isFinite);
    if (vals.length === 0) return "";
    const ownAvg = vals.reduce((a, b) => a + b, 0) / vals.length;
    const leagueAvg = league?.avgAttrs?.[key];
    const diffHtml = leagueAvg != null
      ? `<span class="staff-recap-vs ${ownAvg >= leagueAvg ? "pos" : "neg"}">${ownAvg >= leagueAvg ? "▲" : "▼"} ${Math.abs(ownAvg - leagueAvg).toFixed(1)} vs moy. ligue</span>`
      : "";
    return `<div class="staff-recap-attr"><span>${label}</span><b>${ownAvg.toFixed(1)}/20</b>${diffHtml}</div>`;
  }).join("");

  return `<div class="staff-col-recap">${countHtml}${rolesHtml}${attrHtml}</div>`;
}

// Modal "secteur" : liste des membres d'un departement, chacun cliquable
// pour afficher sa fiche complete (via openStaffModal).
function openStaffSectorModal(dept, locked) {
  const overlay = document.getElementById("staffModalOverlay");
  const content = document.getElementById("staffModalContent");
  content.classList.add("wide");
  const info = STAFF_DEPARTMENTS[dept] || { label: "Autres", icon: "📋" };
  const members = staffMembers.filter(m => staffDepartmentFor(m.poste) === dept);

  // Regroupement par intitule de poste exact (ex: "Preparateur physique"),
  // trie par effectif decroissant puis alphabetique, membres tries par nom
  // au sein de chaque groupe.
  const roleGroups = {};
  members.forEach(m => {
    const role = (m.poste || "Autre").trim();
    (roleGroups[role] = roleGroups[role] || []).push(m);
  });
  const roles = Object.keys(roleGroups).sort((a, b) => {
    const diff = roleGroups[b].length - roleGroups[a].length;
    return diff !== 0 ? diff : a.localeCompare(b, "fr");
  });
  roles.forEach(role => roleGroups[role].sort((a, b) => (a.nom || "").localeCompare(b.nom || "", "fr")));

  const filtersHtml = roles.length > 1 ? `
    <div class="staff-role-filters">
      <button class="staff-role-chip active" data-role="__all__">Tous <span class="count">${members.length}</span></button>
      ${roles.map(role => `<button class="staff-role-chip" data-role="${escapeHtml(role)}">${escapeHtml(role)} <span class="count">${roleGroups[role].length}</span></button>`).join("")}
    </div>
  ` : "";

  const listHtml = roles.map(role => `
    <div class="staff-role-group" data-role-group="${escapeHtml(role)}">
      <div class="staff-role-group-title">${escapeHtml(role)} <span class="count">${roleGroups[role].length}</span></div>
      ${roleGroups[role].map(m => staffMemberCardHtml(m, dept, locked)).join("")}
    </div>
  `).join("");

  content.innerHTML = `
    <div class="staff-modal-header">
      <div>
        <div class="staff-modal-name">${info.icon} ${info.label}</div>
        <div class="staff-modal-sub">${members.length} membre${members.length > 1 ? "s" : ""}</div>
      </div>
      <button class="staff-modal-close" id="staffModalCloseBtn">✕</button>
    </div>
    ${filtersHtml}
    <div class="staff-sector-list">
      ${members.length > 0 ? listHtml : `<div class="staff-col-empty">Aucun membre à ce poste.</div>`}
    </div>
  `;

  content.querySelectorAll(".staff-member-card").forEach(card => {
    card.addEventListener("click", () => {
      const id = card.getAttribute("data-staff-id");
      const member = staffMembers.find(m => String(m.id) === String(id));
      if (member) openStaffModal(member, locked, dept);
    });
  });

  content.querySelectorAll(".staff-role-chip").forEach(chip => {
    chip.addEventListener("click", () => {
      content.querySelectorAll(".staff-role-chip").forEach(c => c.classList.remove("active"));
      chip.classList.add("active");
      const role = chip.getAttribute("data-role");
      content.querySelectorAll(".staff-role-group").forEach(group => {
        group.style.display = (role === "__all__" || group.getAttribute("data-role-group") === role) ? "" : "none";
      });
    });
  });

  overlay.classList.remove("hidden");
  document.getElementById("staffModalCloseBtn").addEventListener("click", closeStaffModal);
}
