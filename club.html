<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FM Web — Infos club</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-2: #1c2029;
    --border: #262a33;
    --text: #e8eaed;
    --text-dim: #8b909c;
    --accent: #4ade80;
    --gold: #fbbf24;
    --danger: #ef4444;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    min-height: 100vh;
  }
  .hidden { display: none !important; }

  .empty-state {
    text-align: center; color: var(--text-dim); font-size: 14px;
    padding: 60px 20px;
  }

  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--panel); border: 1px solid var(--border); padding: 10px 18px;
    border-radius: 8px; font-size: 13px; opacity: 0; pointer-events: none; transition: opacity 0.2s;
    z-index: 100;
  }
  .toast.show { opacity: 1; }
  .toast.error { border-color: var(--danger); color: var(--danger); }

  /* ============================================================
     VUE PRINCIPALE (meme esprit que dashboard.html / squad.html :
     topbar rouge, sidebar de navigation a gauche, plein ecran)
     ============================================================ */
  #clubView {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    background: var(--bg); z-index: 5;
  }

  .fm-header {
    display: flex; justify-content: space-between; align-items: center; flex-wrap: nowrap;
    gap: 14px; padding: 12px 22px; flex: 0 0 auto;
    background: linear-gradient(120deg, #4c1116, #7a1620 55%, #9c2430);
    border-bottom: 1px solid rgba(0,0,0,0.3);
  }
  .fm-header .title-block { display: flex; align-items: center; gap: 16px; min-width: 0; }
  .fm-header .back-link {
    color: rgba(255,255,255,0.75); text-decoration: none; font-size: 13px;
    flex-shrink: 0; padding-right: 14px; border-right: 1px solid rgba(255,255,255,0.2);
  }
  .fm-header .back-link:hover { color: #fff; }
  .fm-header .right-block { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  .fm-date-badge {
    background: rgba(0,0,0,0.28); border-radius: 8px; padding: 7px 14px;
    text-align: right; line-height: 1.35; color: #fff;
  }
  .fm-date-badge .day-num { font-size: 13px; font-weight: 800; white-space: nowrap; }
  .fm-date-badge .season-line { font-size: 11px; color: rgba(255,255,255,0.7); }

  .page-title-wrap { position: relative; }
  .page-title-input {
    background: transparent; border: none; outline: none; color: #fff;
    font-size: 18px; font-weight: 800; letter-spacing: 0.02em; padding: 2px 0;
    width: 230px; max-width: 40vw; font-family: inherit;
  }
  .page-title-input::placeholder {
    color: rgba(255,255,255,0.92); font-weight: 800; opacity: 1;
  }
  .manager-line {
    font-size: 12px; color: rgba(255,255,255,0.78); margin-top: 2px; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }
  .fm-search-dropdown {
    position: absolute; top: calc(100% + 8px); left: 0; min-width: 300px; max-width: 380px;
    background: #14171d; border: 1px solid var(--border); border-radius: 10px;
    box-shadow: 0 12px 32px rgba(0,0,0,0.5); z-index: 200; max-height: 380px; overflow-y: auto;
  }
  .fm-search-dropdown.hidden { display: none !important; }
  .search-group-label {
    padding: 8px 12px 4px; font-size: 10px; text-transform: uppercase;
    letter-spacing: 0.05em; color: var(--text-dim);
  }
  .search-result-item {
    display: flex; align-items: center; gap: 10px; padding: 8px 12px; font-size: 13px;
    color: var(--text); cursor: pointer;
  }
  .search-result-item:hover { background: rgba(251,191,36,0.1); color: var(--gold); }
  .search-result-icon { flex-shrink: 0; font-size: 13px; }
  .search-result-sub { font-size: 11px; color: var(--text-dim); margin-top: 1px; }
  .search-empty { padding: 14px 12px; font-size: 12px; color: var(--text-dim); text-align: center; }

  .fm-body { flex: 1; display: flex; align-items: stretch; min-height: 0; }

  .fm-sidebar {
    width: 220px; flex-shrink: 0; background: var(--panel); border-right: 1px solid var(--border);
    overflow-y: auto; padding: 10px 0;
  }
  .fm-nav-item {
    display: flex; align-items: center; gap: 12px; padding: 12px 20px; font-size: 13.5px;
    color: var(--text-dim); cursor: pointer; border-left: 3px solid transparent; user-select: none;
  }
  .fm-nav-item:hover { background: rgba(255,255,255,0.03); color: var(--text); }
  .fm-nav-item.active {
    background: rgba(251,191,36,0.08); color: var(--gold); border-left-color: var(--gold); font-weight: 700;
  }
  .fm-nav-icon { width: 18px; text-align: center; flex-shrink: 0; }

  /* Sous-onglets de la page club (Infos club / Effectif) */
  .fm-subtabs {
    display: flex; gap: 4px; padding: 10px 24px 0; background: var(--panel);
    border-bottom: 1px solid var(--border); flex: 0 0 auto;
  }
  .fm-subtab {
    display: flex; align-items: center; gap: 8px; padding: 10px 16px; font-size: 13px;
    font-weight: 700; color: var(--text-dim); cursor: pointer; border-bottom: 3px solid transparent;
    user-select: none;
  }
  .fm-subtab:hover { color: var(--text); }
  .fm-subtab.active { color: var(--gold); border-bottom-color: var(--gold); }

  .fm-content-wrap { flex: 1; min-width: 0; min-height: 0; overflow-y: auto; padding: 20px 24px; }

  .club-hero {
    display: flex; align-items: center; gap: 18px; background: var(--panel);
    border: 1px solid var(--border); border-radius: 12px; padding: 18px 22px; margin-bottom: 16px;
  }
  .club-badge {
    width: 96px; height: 138px; border-radius: 16px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 30px; font-weight: 800; color: #1a1300;
    box-shadow: 0 6px 18px rgba(0,0,0,0.4);
  }
  .club-badge img { width: 100%; height: 100%; object-fit: contain; border-radius: 16px; }
  .club-hero-info { flex: 1; min-width: 0; }
  .club-hero-name { font-size: 20px; font-weight: 800; }
  .club-hero-sub {
    display: flex; align-items: center; gap: 8px; margin-top: 4px; font-size: 12.5px; color: var(--text-dim);
    flex-wrap: wrap;
  }
  .flag-icon { width: 18px; height: auto; border-radius: 2px; vertical-align: middle; }
  .chip {
    display: inline-block; background: rgba(251,191,36,0.1); border: 1px solid rgba(251,191,36,0.3);
    color: var(--gold); font-size: 11px; padding: 3px 9px; border-radius: 999px; font-weight: 700;
  }
  .chip.dim { background: rgba(255,255,255,0.05); border-color: var(--border); color: var(--text-dim); }

  .club-grid {
    display: grid; grid-template-columns: 1.15fr 1fr; gap: 16px; align-items: start;
  }
  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; padding: 16px 18px; margin-bottom: 16px;
  }
  .card-title {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--gold); margin-bottom: 14px;
  }
  .fm-empty { color: var(--text-dim); font-size: 13px; padding: 4px 0; line-height: 1.5; }

  .stat-row {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 9px 0; border-bottom: 1px solid rgba(255,255,255,0.04); font-size: 13px;
  }
  .stat-row:last-child { border-bottom: none; }
  .stat-row .label { color: var(--text-dim); }
  .stat-row .value { font-weight: 700; }

  .stars { position: relative; display: inline-block; font-size: 14px; letter-spacing: 2px; line-height: 1; }
  .stars-bg { color: var(--border); }
  .stars-fg {
    position: absolute; top: 0; left: 0; overflow: hidden; white-space: nowrap; color: var(--gold);
  }

  .key-people { display: flex; flex-direction: column; gap: 10px; }
  .key-person {
    display: flex; align-items: center; gap: 10px; padding: 8px 0;
    border-bottom: 1px solid rgba(255,255,255,0.04);
  }
  .key-person:last-child { border-bottom: none; }
  .key-person-icon {
    width: 30px; height: 30px; border-radius: 8px; background: rgba(251,191,36,0.1);
    display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0;
  }
  .key-person-role { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.03em; color: var(--text-dim); }
  .key-person-name { font-size: 13.5px; font-weight: 700; }
  .key-person-name.muted { color: var(--text-dim); font-weight: 500; }

  .palmares-list { display: flex; flex-direction: column; gap: 6px; }
  .palmares-item {
    display: flex; align-items: center; gap: 10px; font-size: 13px; padding: 6px 0;
    border-bottom: 1px solid rgba(255,255,255,0.04);
  }
  .palmares-item:last-child { border-bottom: none; }
  .palmares-item .trophy { font-size: 15px; }
  .palmares-item .count { margin-left: auto; color: var(--gold); font-weight: 800; font-size: 12px; }

  /* Terrain illustre pour la derniere composition */
  .pitch-caption { font-size: 12px; color: var(--text-dim); margin-bottom: 10px; line-height: 1.5; }
  .pitch-wrap { width: 100%; }
  .pitch-svg { width: 100%; height: auto; display: block; }
  .pitch-player-dot { fill: var(--gold); stroke: #3a2a00; stroke-width: 1.5; }
  .pitch-player-label {
    fill: #fff; font-size: 9px; font-weight: 800; text-anchor: middle; pointer-events: none;
  }
  .pitch-name-label {
    fill: var(--text-dim); font-size: 7.5px; text-anchor: middle; pointer-events: none;
  }
  /* Version miniature du terrain, casee en bas de la colonne laterale */
  .pitch-mini .pitch-wrap { max-width: 170px; margin: 0 0 0 auto; }
  .pitch-mini .pitch-caption { text-align: right; }

  /* ---- Staff (sous-onglet) : 3 colonnes departement + fiches membres ---- */
  .staff-columns {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; align-items: start;
  }
  .staff-col-title {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--gold); margin-bottom: 12px;
  }
  .staff-col-title .count {
    background: rgba(255,255,255,0.06); color: var(--text-dim); border-radius: 999px;
    padding: 2px 9px; font-size: 11px; font-weight: 700; text-transform: none; letter-spacing: 0;
  }
  .staff-member-card {
    display: flex; align-items: center; gap: 12px; background: var(--panel);
    border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px;
    cursor: pointer; transition: border-color 0.15s, transform 0.1s;
  }
  .staff-member-card:hover { border-color: var(--gold); transform: translateY(-1px); }
  .staff-avatar {
    width: 42px; height: 42px; border-radius: 10px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 800; color: #1a1300;
  }
  .staff-member-info { flex: 1; min-width: 0; }
  .staff-member-name { font-size: 13.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .staff-member-role { font-size: 11px; color: var(--text-dim); margin-top: 1px; }
  .staff-member-meta {
    display: flex; align-items: center; gap: 6px; margin-top: 5px; font-size: 11px; color: var(--text-dim);
    flex-wrap: wrap;
  }
  .staff-member-meta .flag-icon { width: 14px; height: auto; margin-right: 0; }
  .staff-attr-chip {
    display: inline-flex; align-items: center; gap: 3px; background: rgba(255,255,255,0.05);
    border-radius: 6px; padding: 1px 6px; font-size: 10.5px; color: var(--text-dim);
  }
  .staff-attr-chip b { color: var(--text); font-weight: 700; }
  .staff-member-side { text-align: right; flex-shrink: 0; font-size: 11px; color: var(--text-dim); }
  .staff-member-side .salaire { color: var(--text); font-weight: 700; font-size: 12px; }
  .staff-col-empty { color: var(--text-dim); font-size: 12.5px; padding: 6px 0 14px; }

  .staff-modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 300;
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .staff-modal-overlay.hidden { display: none !important; }
  .staff-modal {
    width: 100%; max-width: 460px; max-height: 86vh; overflow-y: auto;
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 20px 22px;
  }
  .staff-modal-header { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
  .staff-modal-close {
    margin-left: auto; background: none; border: none; color: var(--text-dim); font-size: 18px;
    cursor: pointer; line-height: 1; padding: 4px;
  }
  .staff-modal-close:hover { color: var(--text); }
  .staff-modal-avatar {
    width: 56px; height: 56px; border-radius: 14px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 800; color: #1a1300;
  }
  .staff-modal-name { font-size: 17px; font-weight: 800; }
  .staff-modal-role { font-size: 12.5px; color: var(--gold); font-weight: 700; margin-top: 2px; }
  .staff-modal-sub { font-size: 12px; color: var(--text-dim); margin-top: 4px; display: flex; align-items: center; gap: 6px; }

  @media (max-width: 900px) {
    .fm-header { padding: 10px 14px; }
    .fm-header .back-link { display: none; }
    .fm-body { flex-direction: column; }
    .fm-sidebar {
      width: 100%; height: auto; flex-shrink: 0; display: flex; overflow-x: auto;
      overflow-y: hidden; padding: 4px; border-right: none; border-bottom: 1px solid var(--border);
    }
    .fm-nav-item { border-left: none; border-bottom: 3px solid transparent; white-space: nowrap; }
    .fm-nav-item.active { border-left-color: transparent; border-bottom-color: var(--gold); }
    .fm-subtabs { padding: 8px 12px 0; overflow-x: auto; }
    .fm-content-wrap { padding: 14px; }
    .club-grid { grid-template-columns: 1fr; }
    .staff-columns { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div id="clubView">
  <div class="fm-header" id="fmHeader"></div>

  <div class="fm-subtabs" id="fmSubtabs"></div>

  <div class="fm-body">
    <div class="fm-sidebar" id="fmSidebar"></div>

    <div class="fm-content-wrap">
      <div class="club-hero" id="clubHero">
        <div class="empty-state">Chargement...</div>
      </div>

      <div class="club-grid" id="clubGrid" style="display:none;">
        <div class="fm-col-main">
          <div class="card">
            <div class="card-title"><span>Finances</span></div>
            <div id="clubFinances" class="fm-empty">Chargement...</div>
          </div>
        </div>
        <div class="fm-col-side">
          <div class="card">
            <div class="card-title"><span>Réputation &amp; infrastructures</span></div>
            <div id="clubReputation" class="fm-empty">Chargement...</div>
          </div>
          <div class="card">
            <div class="card-title"><span>Effectif clé</span></div>
            <div id="clubKeyPeople" class="fm-empty">Chargement...</div>
          </div>
          <div class="card">
            <div class="card-title"><span>Palmarès</span></div>
            <div id="clubPalmares" class="fm-empty">Chargement...</div>
          </div>
          <div class="card pitch-mini">
            <div class="card-title"><span>Dernière composition utilisée</span></div>
            <div id="clubPitch"></div>
          </div>
        </div>
      </div>

      <div class="staff-columns hidden" id="staffColumns"></div>

      <div id="clubError" class="empty-state hidden"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="staff-modal-overlay hidden" id="staffModalOverlay">
  <div class="staff-modal" id="staffModalContent"></div>
</div>

<script>
const SUPABASE_URL = "https://occesdpptttbwwjyuaja.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9jY2VzZHBwdHR0Ynd3anl1YWphIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI5MjQ1MTAsImV4cCI6MjA5ODUwMDUxMH0.iQxZFp1wIs9TzCqC7j-DjEUuxPBqK0Hgp6N_9aq7wss";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const params = new URLSearchParams(window.location.search);
const gameId = params.get("game");
const gameClubId = params.get("club");

let currentGame = null;
let isOwnClubView = true;

function toast(msg, isError = false) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.className = "toast show" + (isError ? " error" : "");
  setTimeout(() => { el.className = "toast"; }, 2500);
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str ?? "";
  return div.innerHTML;
}

// ===================== DRAPEAUX (nom complet de nation, comme dashboard.html) =====================
const GB_SUBCODES_NAT = {
  "angleterre": "gb-eng", "ecosse": "gb-sct", "pays de galles": "gb-wls",
};
const NATION_NAME_TO_ISO2 = {
  "france": "fr", "allemagne": "de", "espagne": "es", "italie": "it",
  "portugal": "pt", "pays-bas": "nl", "belgique": "be", "irlande": "ie",

  "suede": "se", "norvege": "no", "finlande": "fi", "islande": "is",
  "bresil": "br", "argentine": "ar", "uruguay": "uy", "chili": "cl",
  "colombie": "co", "perou": "pe", "equateur": "ec", "paraguay": "py",
  "bolivie": "bo", "venezuela": "ve", "mexique": "mx", "etats-unis": "us",
  "canada": "ca", "japon": "jp", "coree du sud": "kr", "australie": "au",
  "nouvelle-zelande": "nz", "maroc": "ma", "algerie": "dz", "tunisie": "tn",
  "senegal": "sn", "cote d'ivoire": "ci", "cameroun": "cm", "nigeria": "ng",
  "ghana": "gh", "egypte": "eg", "arabie saoudite": "sa", "qatar": "qa",
  "chine": "cn", "bosnie-herzegovine": "ba", "slovaquie": "sk", "slovenie": "si",
  "albanie": "al", "macedoine du nord": "mk", "montenegro": "me", "israel": "il",
  "luxembourg": "lu", "chypre": "cy", "malte": "mt", "lituanie": "lt",
  "lettonie": "lv", "estonie": "ee", "bielorussie": "by", "moldavie": "md",

  "singapour": "sg", "iran": "ir", "irak": "iq", "inde": "in",
};
function normalizeNationKey(name) {
  return (name || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
}
function flagCodeForNation(name) {
  const key = normalizeNationKey(name);
  if (GB_SUBCODES_NAT[key]) return GB_SUBCODES_NAT[key];
  return NATION_NAME_TO_ISO2[key] || null;
}
function nationFlagImg(name) {
  const flagCode = flagCodeForNation(name);
  return flagCode ? `<img class="flag-icon" src="https://flagcdn.com/${flagCode}.svg" alt="" loading="lazy">` : "";
}

// La base stocke les nationalites (joueurs, staff) sous forme de code FM a 3
// lettres (ex: "FRA", "ENG", "GER"...), pas le nom complet. On convertit vers
// le nom francais complet, qui sert ensuite pour le drapeau et l'affichage
// (meme table que dashboard.html).

  AFG: "Afghanistan", AIA: "Anguilla", ALB: "Albanie", ALG: "Algérie",
  AND: "Andorre", ANG: "Angola", ARG: "Argentine", ARM: "Arménie",

  AUS: "Australie", AUT: "Autriche", AZE: "Azerbaïdjan", BAH: "Bahamas",
  BAN: "Bangladesh", BDI: "Burundi", BEL: "Belgique", BEN: "Bénin",
  BER: "Bermudes", BFA: "Burkina Faso", BHU: "Bhoutan",
  BIH: "Bosnie-Herzégovine", BLM: "Saint-Barthélemy", BLR: "Biélorussie",
  BLZ: "Belize", BOE: "Bonaire", BOL: "Bolivie", BRA: "Brésil",
  BRB: "Barbade", BUL: "Bulgarie", CAN: "Canada", CAY: "Îles Caïmans",
  CGO: "Congo", CHA: "Tchad", CHI: "Chili", CHN: "Chine",
  CIV: "Côte d'Ivoire", CMR: "Cameroun", COD: "RD Congo", COL: "Colombie",
  COM: "Comores", CPV: "Cap-Vert", CRC: "Costa Rica", CRO: "Croatie",

function nationDisplayName(value) {
  if (!value) return value;
  const code = value.trim().toUpperCase();
  return FM_NATION_CODE_TO_NAME[code] || value;
}
function flagCodeForNat(code) {
  if (!code) return null;
  return flagCodeForNation(nationDisplayName(code));
}
function nationLabel(code) {
  const fullName = nationDisplayName(code);
  const flagCode = flagCodeForNat(code);
  const img = flagCode
    ? `<img class="flag-icon" src="https://flagcdn.com/${flagCode}.svg" alt="" loading="lazy">`
    : "";
  return `${img}${escapeHtml(fullName)}`;
}

function formatMoney(n) {
  if (n === null || n === undefined) return "-";
  return new Intl.NumberFormat("fr-FR").format(n) + " €";
}
function formatInt(n) {
  if (n === null || n === undefined) return "-";
  return new Intl.NumberFormat("fr-FR").format(n);
}

function starsFromScale(n, maxScale = 20) {
  if (n === null || n === undefined) return 0;
  return (Number(n) / maxScale) * 5;
}
// Bareme etoiles pour la reputation moyenne des joueurs (echelle 5-10000,
// identique a celle de squad.html)
const STAR_BANDS = [
  [500, 1], [1000, 1.5], [1750, 2], [2750, 2.5],
  [4250, 3], [5800, 3.5], [7500, 4], [9000, 4.5], [Infinity, 5]
];
function starsFromReputation(rep) {
  if (rep === null || rep === undefined) return 0;
  for (const [max, stars] of STAR_BANDS) {
    if (rep < max) return stars;
  }
  return 5;
}
function starsHtml(rating) {
  if (rating === null || rating === undefined) return "-";
  const pct = Math.max(0, Math.min(100, (rating / 5) * 100));
  return `<span class="stars" title="${rating.toFixed(1)}/5">
    <span class="stars-bg">★★★★★</span>
    <span class="stars-fg" style="width:${pct}%">★★★★★</span>
  </span>`;
}

function computeRealDate(dateDebut, jourActuel) {
  if (!dateDebut) return null;
  const base = new Date(`${dateDebut}T00:00:00`);
  if (isNaN(base.getTime())) return null;
  const jours = Number(jourActuel);
  base.setDate(base.getDate() + (Number.isFinite(jours) ? jours : 0));
  return base;
}
function formatRealDate(date) {
  if (!date) return null;
  return new Intl.DateTimeFormat("fr-FR", { day: "2-digit", month: "long", year: "numeric" })
    .format(date).toUpperCase();
}

// ===================== RECHERCHE GLOBALE (identique a dashboard.html / squad.html,
// sauf que le clic sur un club redirige ici vers sa fiche "Infos club") =====================
let searchDebounceTimer = null;
let headerSearchDocListenerAttached = false;

function initHeaderSearch() {
  const input = document.getElementById("fmSearchInput");
  const dropdown = document.getElementById("fmSearchDropdown");
  if (!input || !dropdown) return;

  input.addEventListener("input", () => {
    clearTimeout(searchDebounceTimer);
    const q = input.value.trim();
    if (q.length < 2) {
      dropdown.classList.add("hidden");
      dropdown.innerHTML = "";
      return;
    }
    searchDebounceTimer = setTimeout(() => runGlobalSearch(q, dropdown), 250);
  });

  input.addEventListener("focus", () => {
    if (input.value.trim().length >= 2 && dropdown.innerHTML) dropdown.classList.remove("hidden");
  });

  input.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      input.value = "";
      dropdown.classList.add("hidden");
      dropdown.innerHTML = "";
      input.blur();
    }
  });

  if (!headerSearchDocListenerAttached) {
    document.addEventListener("click", (e) => {
      const wrap = document.getElementById("fmSearchWrap");
      const dd = document.getElementById("fmSearchDropdown");
      if (wrap && dd && !wrap.contains(e.target)) dd.classList.add("hidden");
    });
    headerSearchDocListenerAttached = true;
  }
}

async function runGlobalSearch(q, dropdown) {
  // Recherche par mots : chaque mot doit apparaitre dans le nom (peu importe
  // l'ordre), ce qui permet de trouver "Adrien Rabiot" meme tape dans un
  // autre ordre, ou "Saka" tout seul. Les joueurs sont classes par reputation
  // mondiale pour faire remonter les plus connus en premier plutot que des
  // correspondances anecdotiques.
  const words = q.trim().split(/\s+/).filter(Boolean);

  let clubQuery = supabaseClient.from("game_clubs").select("id, nom").eq("game_id", gameId);
  words.forEach(w => { clubQuery = clubQuery.ilike("nom", `%${w}%`); });

  let playerQuery = supabaseClient
    .from("game_players")
    .select("id, nom, poste_brut, game_club_id, reputation_mondiale")
    .eq("game_id", gameId);
  words.forEach(w => { playerQuery = playerQuery.ilike("nom", `%${w}%`); });

  const [
    { data: clubs },
    { data: players, error: playersError },
  ] = await Promise.all([
    clubQuery.order("nom", { ascending: true }).limit(6),
    playerQuery.order("reputation_mondiale", { ascending: false, nullsFirst: false }).limit(8),
  ]);
  if (playersError) console.error(playersError);

  // Noms de club recuperes a part (plutot qu'une jointure imbriquee
  // club:game_clubs(nom)) : cette jointure est fragile si la relation FK
  // n'est pas explicite cote Supabase et faisait echouer silencieusement
  // toute la recherche joueurs (aucun resultat, meme pour un nom existant).
  let clubNameById = {};
  if (players && players.length > 0) {
    const clubIds = [...new Set(players.map(p => p.game_club_id).filter(Boolean))];
    if (clubIds.length > 0) {
      const { data: clubRows } = await supabaseClient
        .from("game_clubs")
        .select("id, nom")
        .in("id", clubIds);
      (clubRows || []).forEach(c => { clubNameById[c.id] = c.nom; });
    }
  }

  const hasClubs = clubs && clubs.length > 0;
  const hasPlayers = players && players.length > 0;

  if (!hasClubs && !hasPlayers) {
    dropdown.innerHTML = `<div class="search-empty">Aucun résultat pour "${escapeHtml(q)}"</div>`;
    dropdown.classList.remove("hidden");
    return;
  }

  let html = "";
  if (hasClubs) {
    html += `<div class="search-group-label">Clubs</div>`;
    html += clubs.map(c => `
      <div class="search-result-item" data-type="club" data-id="${c.id}">
        <span class="search-result-icon">🛡️</span>
        <span>${escapeHtml(c.nom)}</span>
      </div>
    `).join("");
  }
  if (hasPlayers) {
    html += `<div class="search-group-label">Joueurs</div>`;
    html += players.map(p => `
      <div class="search-result-item" data-type="player" data-id="${p.id}" data-club="${p.game_club_id ?? ""}">
        <span class="search-result-icon">🧍</span>
        <span>
          <div>${escapeHtml(p.nom)}</div>
          <div class="search-result-sub">${escapeHtml(p.poste_brut || "-")}${clubNameById[p.game_club_id] ? " · " + escapeHtml(clubNameById[p.game_club_id]) : ""}</div>
        </span>
      </div>
    `).join("");
  }

  dropdown.innerHTML = html;
  dropdown.classList.remove("hidden");

  dropdown.querySelectorAll(".search-result-item").forEach(item => {
    item.addEventListener("click", () => {
      const type = item.getAttribute("data-type");
      const id = item.getAttribute("data-id");
      if (type === "club") {
        window.location.href = `club.html?game=${encodeURIComponent(gameId)}&club=${encodeURIComponent(id)}`;
      } else {
        const clubId = item.getAttribute("data-club");
        window.location.href = `fiche.html?game=${encodeURIComponent(gameId)}&club=${encodeURIComponent(clubId)}&player=${encodeURIComponent(id)}`;
      }
    });
  });
}

// Pas encore de veritable logo uploade pour les clubs : on genere un blason
// de substitution a partir des initiales du nom, avec une couleur stable
// (derivee du nom) pour que chaque club garde toujours le meme badge.
function initials(nom) {
  const words = (nom || "").trim().split(/\s+/).filter(Boolean);
  if (words.length === 0) return "?";
  if (words.length === 1) return words[0].slice(0, 2).toUpperCase();
  return (words[0][0] + words[1][0]).toUpperCase();
}
function colorFromName(nom) {
  let hash = 0;
  for (let i = 0; i < (nom || "").length; i++) hash = nom.charCodeAt(i) + ((hash << 5) - hash);
  const hue = Math.abs(hash) % 360;
  return `hsl(${hue}, 62%, 46%)`;
}
function renderClubBadge(club, rawClub) {
  const logoUrl = rawClub?.logo_url || rawClub?.logo || null;
  if (logoUrl) return `<img src="${escapeHtml(logoUrl)}" alt="">`;
  return initials(club.nom);
}

// ===================== FINANCES (reprend la logique de dashboard.html) =====================
async function fetchFinanceHistory(club) {
  const { data, error } = await supabaseClient
    .from("game_events")
    .select("jour, payload")
    .eq("game_id", gameId)
    .eq("game_club_id", club.game_club_id)
    .eq("type", "finance")
    .order("jour", { ascending: true })
    .order("id", { ascending: true });

  if (error || !data || data.length === 0) return [];

  const deltas = data.map(ev => Number(ev.payload?.montant) || 0);
  const totalDelta = deltas.reduce((a, b) => a + b, 0);
  let running = (club.budget_actuel || 0) - totalDelta;

  return data.map((ev, i) => {
    running += deltas[i];
    return { jour: ev.jour, value: running, delta: deltas[i], motif: ev.payload?.motif || null };
  });
}

function renderFinanceChart(history) {
  const w = 400, h = 90, padY = 8;
  const values = history.map(p => p.value);
  const min = Math.min(...values), max = Math.max(...values);
  const range = Math.max(1, max - min);
  const stepX = history.length > 1 ? w / (history.length - 1) : 0;

  const coords = history.map((pt, i) => {
    const x = history.length > 1 ? i * stepX : w / 2;
    const y = h - padY - ((pt.value - min) / range) * (h - padY * 2);
    return { x, y, pt };
  });

  const linePoints = coords.map(c => `${c.x.toFixed(1)},${c.y.toFixed(1)}`).join(" ");
  const dots = coords.map(c => {
    const color = c.pt.delta >= 0 ? "var(--accent)" : "var(--danger)";
    const label = `J${c.pt.jour}${c.pt.motif ? " — " + c.pt.motif : ""} : ${c.pt.delta >= 0 ? "+" : ""}${formatMoney(c.pt.delta)}`;
    return `<circle cx="${c.x.toFixed(1)}" cy="${c.y.toFixed(1)}" r="2.6" fill="${color}"><title>${label}</title></circle>`;
  }).join("");

  return `
    <svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="width:100%; height:auto; overflow:visible; margin-top:8px;">
      <polyline points="${linePoints}" fill="none" stroke="var(--accent)" stroke-width="2" />
      ${dots}
    </svg>
  `;
}

async function renderFinances(club) {
  const el = document.getElementById("clubFinances");

  el.innerHTML = `

  `;
}

function renderReputation(club, players) {
  const el = document.getElementById("clubReputation");

  const withRep = (players || []).filter(p => p.reputation_mondiale !== null && p.reputation_mondiale !== undefined);
  const avgRep = withRep.length > 0
    ? withRep.reduce((s, p) => s + Number(p.reputation_mondiale), 0) / withRep.length
    : null;
  const repStars = avgRep !== null ? starsFromReputation(avgRep) : null;

  const entrainementStars = club.niveau_entrainement ? starsFromScale(club.niveau_entrainement) : null;
  const formationStars = club.centre_formation && club.centre_formation > 0 ? starsFromScale(club.centre_formation) : null;

  el.innerHTML = `
    <div class="stat-row">
      <span class="label">Réputation du club</span>
      <span class="value">${repStars !== null ? starsHtml(repStars) : "-"}</span>
    </div>
    <div class="stat-row">
      <span class="label">Centre d'entraînement</span>
      <span class="value">${entrainementStars !== null ? starsHtml(entrainementStars) : "-"}</span>
    </div>
    <div class="stat-row">
      <span class="label">Centre de formation</span>
      <span class="value">${formationStars !== null ? starsHtml(formationStars) : "Aucun"}</span>
    </div>

      <span class="label">Stade</span>
      <span class="value">${formatInt(club.capacite_stade)} places</span>
    </div>
    <div class="stat-row">
      <span class="label">Affluence moyenne</span>
      <span class="value">${formatInt(club.affluence_moyenne)}</span>
    </div>
  `;
}

// ===================== EFFECTIF CLE (capitaine / vice-capitaine / meilleur joueur) =====================
// Pas encore de champ dedie "capitaine" en base : on le deduit du statut
// special du joueur (ex: "Capitaine", "Vice-capitaine") quand il est
// renseigne. A defaut, on l'affiche comme non designe plutot que d'inventer
// une info qu'on ne connait pas reellement.
function findByStatut(players, keyword) {
  return (players || []).find(p => (p.statut_special || "").toLowerCase().includes(keyword));
}

function renderKeyPeople(club, players) {
  const el = document.getElementById("clubKeyPeople");
  const capitaine = findByStatut(players, "capitaine") && !findByStatut(players, "vice-capitaine")
    ? findByStatut(players, "capitaine")
    : (players || []).find(p => (p.statut_special || "").toLowerCase() === "capitaine");
  const viceCapitaine = findByStatut(players, "vice");

  el.innerHTML = `
    <div class="key-people">
      <div class="key-person">
        <div class="key-person-icon">©</div>
        <div>
          <div class="key-person-role">Capitaine</div>
          <div class="key-person-name ${capitaine ? "" : "muted"}">${capitaine ? escapeHtml(capitaine.nom) : "Non désigné"}</div>
        </div>
      </div>
      <div class="key-person">
        <div class="key-person-icon">Ⓥ</div>
        <div>
          <div class="key-person-role">Vice-capitaine</div>
          <div class="key-person-name ${viceCapitaine ? "" : "muted"}">${viceCapitaine ? escapeHtml(viceCapitaine.nom) : "Non désigné"}</div>
        </div>
      </div>
      <div class="key-person">
        <div class="key-person-icon">★</div>
        <div>
          <div class="key-person-role">Meilleur joueur</div>
          <div class="key-person-name ${club.meilleur_joueur_nom ? "" : "muted"}">${club.meilleur_joueur_nom ? escapeHtml(club.meilleur_joueur_nom) : "-"}</div>
        </div>
      </div>
    </div>
  `;
}

// ===================== PALMARES =====================
// Pas encore de table de trophees dediee : on tente de lire un champ deja
// present sur la fiche club brute (au cas ou), sinon etat honnete "aucun
// trophee pour l'instant" (coherent avec une partie qui commence en pre-saison).
function renderPalmares(rawClub) {
  const el = document.getElementById("clubPalmares");
  const raw = rawClub?.palmares || rawClub?.titres || rawClub?.trophees;

  let list = null;
  if (Array.isArray(raw)) list = raw;
  else if (raw && typeof raw === "object") list = Object.entries(raw).map(([nom, count]) => ({ nom, count }));

  if (!list || list.length === 0) {
    el.innerHTML = `<div class="fm-empty">Aucun trophée remporté pour l'instant.</div>`;
    return;
  }

  el.innerHTML = `
    <div class="palmares-list">
      ${list.map(item => `
        <div class="palmares-item">
          <span class="trophy">🏆</span>
          <span>${escapeHtml(item.nom || item.titre || String(item))}</span>
          ${item.count ? `<span class="count">×${escapeHtml(String(item.count))}</span>` : ""}
        </div>
      `).join("")}
    </div>
  `;
}

// ===================== STAFF =====================
// Regroupement (approximatif) des intitules de poste staff en 3 departements :
// coaching/preparation, recrutement, medical/sciences du sport. Base sur les
// intitules reellement presents dans la table `staff` (import FM), identique
// au sous-onglet "Staff" de dashboard.html.
const STAFF_DEPARTMENTS = {
  coaching: {
    label: "Équipe de préparateurs", icon: "🧑‍🏫",
    postes: [
      "entraîneur", "entraîneur adjoint", "entraîneur des gardiens",
      "entraîneuse", "entraîneuse adjointe", "entraîneuse des gardiens",
      "préparateur physique", "préparatrice physique",
      "préparateur aux coups de pied arrêtés", "analyste des performances",
      "préparateur", "préparatrice",
    ],
  },
  recrutement: {
    label: "Recrutement", icon: "🔎",
    postes: [
      "recruteur", "recruteuse", "analyste du recrutement", "directeur sportif",
      "directrice sportive", "directeur technique", "directrice technique",
      "responsable de la formation jeunes", "responsable des prêts",
    ],
  },
  medical: {
    label: "Médical", icon: "🩺",
    postes: [
      "kiné", "chercheur en sciences du sport", "chercheuse en sciences du sport",
    ],
  },
};
const STAFF_POSTE_TO_DEPT = {};
Object.entries(STAFF_DEPARTMENTS).forEach(([dept, info]) => {
  info.postes.forEach(p => { STAFF_POSTE_TO_DEPT[p] = dept; });
});
function staffDepartmentFor(poste) {
  return STAFF_POSTE_TO_DEPT[(poste || "").trim().toLowerCase()] || "autres";
}
const STAFF_DEPT_ATTRS = {
  coaching: [
    ["niveau_tactique", "Tactique"], ["niveau_attaque", "Attaque"], ["niveau_defense", "Défense"],
  ],
  recrutement: [
    ["eval_joueurs", "Éval. joueurs"], ["eval_potentiel", "Éval. potentiel"], ["formation_jeunes", "Formation jeunes"],
  ],
  medical: [
    ["determination", "Détermination"], ["professionnalisme", "Professionnalisme"],
  ],
  autres: [
    ["determination", "Détermination"],
  ],
};

let staffLoadedForClub = null;
let staffMembers = [];

async function fetchClubStaffMembers(clubId) {
  const { data: gameStaffRows, error: gsErr } = await supabaseClient
    .from("game_staff")
    .select("id, staff_ref, nom, poste, salaire_actuel, contrat_expire")
    .eq("game_id", gameId)
    .eq("game_club_id", clubId);
  if (gsErr) { console.error(gsErr); return []; }
  if (!gameStaffRows || gameStaffRows.length === 0) return [];

  const refs = [...new Set(gameStaffRows.map(r => r.staff_ref).filter(Boolean))];
  let staffByRef = {};
  if (refs.length > 0) {
    const { data: staffRows, error: sErr } = await supabaseClient
      .from("staff")
      .select("id, nationalite, age, personnalite, eval_joueurs, eval_potentiel, formation_jeunes, niveau_tactique, niveau_defense, niveau_attaque, determination, professionnalisme, qualification_preparateur")
      .in("id", refs);
    if (sErr) console.error(sErr);
    (staffRows || []).forEach(s => { staffByRef[s.id] = s; });
  }

  return gameStaffRows.map(r => ({ ...r, ...(staffByRef[r.staff_ref] || {}) }));
}

function initialsFromName(nom) { return initials(nom); }

function renderStaffAttrChips(member, dept, locked) {
  const attrs = STAFF_DEPT_ATTRS[dept] || [];
  return attrs.map(([key, label]) => {
    const val = member[key];
    if (locked) return `<span class="staff-attr-chip">${label}: 🔒</span>`;
    if (!Number.isFinite(Number(val))) return "";
    return `<span class="staff-attr-chip">${label}: <b>${escapeHtml(String(val))}</b>/20</span>`;
  }).join("");
}

function staffMemberCardHtml(member, dept, locked) {
  const nation = member.nationalite ? nationLabel(member.nationalite) : "";
  const age = Number.isFinite(Number(member.age)) ? `${member.age} ans` : "";
  return `
    <div class="staff-member-card" data-staff-id="${member.id}">
      <div class="staff-avatar" style="background:${colorFromName(member.nom)};">${initialsFromName(member.nom)}</div>
      <div class="staff-member-info">
        <div class="staff-member-name">${escapeHtml(member.nom || "-")}</div>
        <div class="staff-member-role">${escapeHtml(member.poste || "-")}</div>
        <div class="staff-member-meta">
          ${nation ? `<span>${nation}</span>` : ""}
          ${age ? `<span>· ${age}</span>` : ""}
        </div>
        <div class="staff-member-meta">${renderStaffAttrChips(member, dept, locked)}</div>
      </div>
      <div class="staff-member-side">
        <div class="salaire">${member.salaire_actuel != null ? formatMoney(member.salaire_actuel) + " / mois" : "-"}</div>
        <div>${formatContractEnd(member.contrat_expire)}</div>
      </div>
    </div>
  `;
}

function formatContractEnd(dateStr) {
  if (!dateStr) return "-";
  const d = new Date(`${dateStr}T00:00:00`);
  if (isNaN(d.getTime())) return "-";
  return new Intl.DateTimeFormat("fr-FR", { day: "2-digit", month: "short", year: "numeric" }).format(d);
}

function renderStaffColumns(locked) {
  const el = document.getElementById("staffColumns");
  if (!el) return;

  const autresMembers = staffMembers.filter(m => staffDepartmentFor(m.poste) === "autres");
  const depts = { ...STAFF_DEPARTMENTS };
  if (autresMembers.length > 0) depts.autres = { label: "Autres", icon: "📋" };

  el.innerHTML = Object.entries(depts).map(([dept, info]) => {
    const members = staffMembers
      .filter(m => staffDepartmentFor(m.poste) === dept)
      .sort((a, b) => (a.nom || "").localeCompare(b.nom || "", "fr"));
    return `
      <div class="staff-column">
        <div class="staff-col-title">
          <span>${info.icon} ${info.label}</span>
          <span class="count">${members.length}</span>
        </div>
        ${members.length > 0
          ? members.map(m => staffMemberCardHtml(m, dept, locked)).join("")
          : `<div class="staff-col-empty">Aucun membre à ce poste.</div>`}
      </div>
    `;
  }).join("");

  el.querySelectorAll(".staff-member-card").forEach(card => {
    card.addEventListener("click", () => {
      const id = card.getAttribute("data-staff-id");
      const member = staffMembers.find(m => String(m.id) === String(id));
      if (member) openStaffModal(member, locked);
    });
  });
}

function openStaffModal(member, locked) {
  const overlay = document.getElementById("staffModalOverlay");
  const content = document.getElementById("staffModalContent");
  const dept = staffDepartmentFor(member.poste);
  const nation = member.nationalite ? nationLabel(member.nationalite) : "-";
  const attrs = STAFF_DEPT_ATTRS[dept] || [];

  const attrRows = attrs.map(([key, label]) => {
    const val = member[key];
    const display = locked ? "🔒" : (Number.isFinite(Number(val)) ? `${val}/20` : "-");
    return `<div class="stat-row"><span class="label">${label}</span><span class="value">${display}</span></div>`;
  }).join("");

  content.innerHTML = `
    <div class="staff-modal-header">
      <div class="staff-modal-avatar" style="background:${colorFromName(member.nom)};">${initialsFromName(member.nom)}</div>
      <div>
        <div class="staff-modal-name">${escapeHtml(member.nom || "-")}</div>
        <div class="staff-modal-role">${escapeHtml(member.poste || "-")}</div>
        <div class="staff-modal-sub">${nation}${Number.isFinite(Number(member.age)) ? " · " + member.age + " ans" : ""}</div>
      </div>
      <button class="staff-modal-close" id="staffModalCloseBtn">✕</button>
    </div>
    <div class="stat-row"><span class="label">Fin de contrat</span><span class="value">${formatContractEnd(member.contrat_expire)}</span></div>
    <div class="stat-row"><span class="label">Salaire</span><span class="value">${member.salaire_actuel != null ? formatMoney(member.salaire_actuel) + " / mois" : "-"}</span></div>
    ${member.qualification_preparateur && member.qualification_preparateur !== "-" ? `<div class="stat-row"><span class="label">Qualification</span><span class="value">${escapeHtml(member.qualification_preparateur)}</span></div>` : ""}
    ${attrRows}
  `;

  overlay.classList.remove("hidden");
  document.getElementById("staffModalCloseBtn").addEventListener("click", closeStaffModal);
}
function closeStaffModal() {
  document.getElementById("staffModalOverlay").classList.add("hidden");
}
document.getElementById("staffModalOverlay").addEventListener("click", (e) => {
  if (e.target.id === "staffModalOverlay") closeStaffModal();
});

async function showStaffTab(viewedClubId) {
  document.getElementById("clubHero").classList.add("hidden");
  document.getElementById("clubGrid").style.display = "none";
  document.getElementById("clubError").classList.add("hidden");
  document.getElementById("staffColumns").classList.remove("hidden");

  const locked = !isOwnClubView;
  if (staffLoadedForClub !== viewedClubId) {
    document.getElementById("staffColumns").innerHTML = `<div class="fm-empty">Chargement...</div>`;
    staffMembers = await fetchClubStaffMembers(viewedClubId);
    staffLoadedForClub = viewedClubId;
  }
  renderStaffColumns(locked);
}

function showInfosClubTab() {
  document.getElementById("staffColumns").classList.add("hidden");
  document.getElementById("clubHero").classList.remove("hidden");
  document.getElementById("clubGrid").style.display = "";
}

// ===================== EN-TETE DE LA FICHE CLUB =====================
function renderClubHero(club, rawClub) {
  const el = document.getElementById("clubHero");
  el.innerHTML = `
    <div class="club-badge" style="background:${club.logoUrl ? "transparent" : colorFromName(club.nom)};">
      ${renderClubBadge(club, rawClub)}
    </div>
    <div class="club-hero-info">
      <div class="club-hero-name">${escapeHtml(club.nom)}</div>
      <div class="club-hero-sub">
        ${club.nation ? `${nationFlagImg(club.nation)} ${escapeHtml(club.nation)}` : ""}
        ${club.division ? `<span class="chip dim">${escapeHtml(club.division)}</span>` : ""}
        ${club.classement ? `<span class="chip">Classement pronostiqué : ${club.classement}e</span>` : ""}
        ${club.statut ? `<span class="chip dim">${escapeHtml(club.statut)}</span>` : ""}
      </div>
    </div>
  `;
}

// ===================== CHARGEMENT =====================
async function loadClub() {
  if (!gameId || !gameClubId) {
    showFatalError("Club introuvable.");
    return;
  }

  const { data: { session } } = await supabaseClient.auth.getSession();
  if (!session?.user) {
    window.location.href = "index.html";
    return;
  }
  const userId = session.user.id;

  const { data: game } = await supabaseClient
    .from("games")
    .select("date_debut, jour_actuel, saison, statut")
    .eq("id", gameId)
    .single();
  currentGame = game || null;

  const { data: participants } = await supabaseClient
    .from("game_participants")
    .select("pseudo, user_id, game_club_id")
    .eq("game_id", gameId);
  const me = (participants || []).find(p => p.user_id === userId);

  if (!me?.game_club_id) {
    showFatalError("Choisis d'abord un club depuis la page d'accueil pour consulter les fiches club.");
    return;
  }

  const myClubId = me.game_club_id;
  const isOwnClub = String(myClubId) === String(gameClubId);
  isOwnClubView = isOwnClub;

  const { data: club, error: clubErr } = await supabaseClient
    .from("game_club_overview")
    .select(`
      game_club_id, nom, budget_actuel, classement, statut, nation, division,
      niveau_entrainement, centre_formation, capacite_stade, affluence_moyenne,
      nb_joueurs, meilleur_joueur_nom
    `)
    .eq("game_id", gameId)
    .eq("game_club_id", gameClubId)
    .single();

  if (clubErr || !club) {
    showFatalError("Impossible de charger ce club.");
    return;
  }

  // Requete complementaire "large" (select *) pour recuperer sans risque
  // d'erreur d'eventuels champs pas encore utilises ailleurs (logo, palmares...).
  let rawClub = null;
  try {
    const { data: raw } = await supabaseClient
      .from("game_clubs")
      .select("*")
      .eq("id", gameClubId)
      .eq("game_id", gameId)
      .single();
    rawClub = raw || null;
  } catch (e) {
    rawClub = null;
  }

  const { data: players } = await supabaseClient
    .from("game_players")
    .select(`
      id, nom, age, nationalite, poste_brut, statut_special, salaire_actuel,
      contrat_expire, valeur_marchande_actuelle, reputation_mondiale,
      niveau_actuel, potentiel, buts_saison, passes_decisives_saison,
      matchs_joues_saison, note_moyenne_saison
    `)
    .eq("game_id", gameId)
    .eq("game_club_id", gameClubId)
    .order("reputation_mondiale", { ascending: false, nullsFirst: false });

  // Le bandeau identifie toujours le manager et SON club, meme quand la
  // fiche affichee en dessous est celle d'un autre club (comme dans squad.html).
  let headerClubName = club.nom;
  if (!isOwnClub) {
    const { data: myClubRow } = await supabaseClient
      .from("game_clubs")
      .select("nom")
      .eq("id", myClubId)
      .eq("game_id", gameId)
      .single();
    headerClubName = myClubRow?.nom || club.nom;
  }

  document.getElementById("clubHero").classList.remove("hidden");
  document.getElementById("clubGrid").style.display = "";

  renderFmHeader(me.pseudo, headerClubName);
  renderFmSidebar(myClubId);
  renderFmSubtabs(gameClubId);
  renderClubHero(club, rawClub);
  renderPitch();
  renderFinances(club);
  renderReputation(club, players || []);
  renderKeyPeople(club, players || []);
  renderPalmares(rawClub);
}

function showFatalError(message) {
  document.getElementById("clubHero").classList.add("hidden");
  document.getElementById("clubGrid").style.display = "none";
  const el = document.getElementById("clubError");
  el.classList.remove("hidden");
  el.innerHTML = `${escapeHtml(message)}<br><br><a href="dashboard.html?game=${encodeURIComponent(gameId || "")}" style="color:var(--gold);">← Retour à l'accueil</a>`;
}

loadClub();
</script>
