// ===================== COMPÉTITIONS (sous-onglet) =====================
// Meme logique que le sous-onglet "Compétitions" de dashboard.html, mais
// scopee au club consulte (pas forcement le club du joueur) : calendrier
// complet (matchs joues + a venir, prochain match mis en avant) et carte de
// la compétition du club avec classement approximatif.

async function getDivisionStandings(nation, division) {
  if (!nation || !division) return [];

  const { data: rivals, error } = await supabaseClient
    .from("game_club_overview")
    .select("game_club_id, nom, classement")
    .eq("game_id", gameId)
    .eq("nation", nation)
    .eq("division", division);

  if (error || !rivals || rivals.length === 0) return [];

  // On recupere toujours les stats completes (V/N/D/buts) en plus du rang,
  // pour pouvoir afficher un mini-classement detaille (points, matchs joues,
  // diff de buts) partout ou getDivisionStandings est utilisee.
  const { data: full } = await supabaseClient
    .from("game_clubs")
    .select("id, classement, points, victoires, nuls, defaites, buts_pour, buts_contre, clubs(logo_url)")
    .in("id", rivals.map(r => r.game_club_id));

  const nomMap = {};
  rivals.forEach(r => { nomMap[r.game_club_id] = r.nom; });
  const statsMap = {};
  (full || []).forEach(c => { statsMap[c.id] = c; });

  const sorted = rivals.slice().sort((a, b) => {
    const sa = statsMap[a.game_club_id] || {};
    const sb = statsMap[b.game_club_id] || {};
    if (a.classement != null && b.classement != null) return a.classement - b.classement;
    if ((sb.points ?? 0) !== (sa.points ?? 0)) return (sb.points ?? 0) - (sa.points ?? 0);
    const diffA = (sa.buts_pour ?? 0) - (sa.buts_contre ?? 0);
    const diffB = (sb.buts_pour ?? 0) - (sb.buts_contre ?? 0);
    if (diffB !== diffA) return diffB - diffA;
    return (sb.buts_pour ?? 0) - (sa.buts_pour ?? 0);
  });

  return sorted.map((r, i) => {
    const s = statsMap[r.game_club_id] || {};
    const joues = (s.victoires ?? 0) + (s.nuls ?? 0) + (s.defaites ?? 0);
    const diff = (s.buts_pour ?? 0) - (s.buts_contre ?? 0);
    return {
      id: r.game_club_id, nom: nomMap[r.game_club_id] || "?",
      rank: r.classement ?? (i + 1),
      points: s.points ?? 0, joues, diff,
      victoires: s.victoires ?? 0, nuls: s.nuls ?? 0, defaites: s.defaites ?? 0,
      logo: s.clubs?.logo_url || null,
    };
  });
}

// Zones qualificatives europeennes / relegation pour un classement donne,
// calquees sur competition.html (memes couleurs UEFA, meme logique). `comp`
// doit fournir nation, tier et nb_relegation ; `totalClubs` est la taille
// du classement (pour placer la zone de releguation en fin de tableau).
async function getStandingsZones(comp, totalClubs) {
  let euroZones = [];
  if (comp && comp.tier === 1) {
    let placesRows = [];
    const { data: gamePlaces } = await supabaseClient
      .from("game_places_europeennes")
      .select("coupe_europe_ref, phase, nb_places, saison")
      .eq("game_id", gameId)
      .eq("nation", comp.nation);
    if (gamePlaces && gamePlaces.length > 0) {
      const derniereSaison = Math.max(...gamePlaces.map(r => r.saison));
      placesRows = gamePlaces.filter(r => r.saison === derniereSaison);
    } else {
      const { data: basePlaces } = await supabaseClient
        .from("classement_uefa_places")
        .select("coupe_europe_ref, phase, nb_places")
        .eq("nation", comp.nation);
      placesRows = basePlaces || [];
    }

    if (placesRows.length > 0) {
      const slotsByCoupe = {};
      placesRows.forEach(r => {
        slotsByCoupe[r.coupe_europe_ref] = (slotsByCoupe[r.coupe_europe_ref] || 0) + (r.nb_places || 0);
      });
      const coupeIds = Object.keys(slotsByCoupe);
      const { data: coupes } = await supabaseClient
        .from("competitions")
        .select("id, nom, tier")
        .in("id", coupeIds);
      const EURO_COLORS = { 1: "zone-euro-1", 2: "zone-euro-2", 3: "zone-euro-3" };
      const ordered = (coupes || []).slice().sort((a, b) => a.tier - b.tier);
      let cursor = 1;
      euroZones = ordered.map(c => {
        const nb = slotsByCoupe[c.id] || 0;
        const zone = { startRank: cursor, endRank: cursor + nb - 1, colorClass: EURO_COLORS[c.tier] || "zone-euro-3", label: c.nom };
        cursor += nb;
        return zone;
      }).filter(z => z.endRank >= z.startRank);
    }
  }

  const nbRelegation = comp?.nb_relegation || 0;
  const releguable = nbRelegation > 0
    ? { startRank: totalClubs - nbRelegation + 1, endRank: totalClubs }
    : null;

  const zoneClassForRank = (rank) => {
    const euro = euroZones.find(z => rank >= z.startRank && rank <= z.endRank);
    if (euro) return euro.colorClass;
    if (releguable && rank >= releguable.startRank && rank <= releguable.endRank) return "zone-releg";
    return "";
  };

  const legendItems = euroZones.map(z => `
    <span class="legend-item"><span class="legend-dot" style="background:${
      z.colorClass === "zone-euro-1" ? "#3b82f6" : z.colorClass === "zone-euro-2" ? "#f97316" : "#22c55e"
    };"></span>${escapeHtml(z.label)}</span>
  `);
  if (releguable) {
    legendItems.push(`<span class="legend-item"><span class="legend-dot" style="background:var(--danger);"></span>Relégation</span>`);
  }
  const legendHtml = legendItems.length ? `<div class="fm-standings-legend">${legendItems.join("")}</div>` : "";

  return { zoneClassForRank, legendHtml };
}

// ===================== Coupe nationale (compétitions + calendrier) =====================
// Convertit un numero de tour en nom de round lisible, a partir du nb_tours
// total de la competition cette saison (nb_tours - tour = distance a la
// finale : 0 = finale, 1 = demies, etc). Si nb_tours est inconnu on retombe
// sur un libelle generique "Tour X".
function coupeRoundLabel(tour, nbTours) {
  if (!nbTours) return `Tour ${tour}`;
  const NAMES = { 0: "Finale", 1: "Demi-finale", 2: "Quart de finale", 3: "8e de finale", 4: "16e de finale", 5: "32e de finale", 6: "64e de finale", 7: "128e de finale" };
  return NAMES[nbTours - tour] || `Tour ${tour}`;
}
function coupeRoundShort(tour, nbTours) {
  if (!nbTours) return `T${tour}`;
  const SHORT = { 0: "Finale", 1: "1/2", 2: "1/4", 3: "1/8", 4: "1/16", 5: "1/32", 6: "1/64", 7: "1/128" };
  return SHORT[nbTours - tour] || `T${tour}`;
}

// Recupere le parcours du club dans la coupe nationale de sa nation pour la
// partie en cours : competition, nb de tours de l'edition, et la liste de
// ses matchs (les "byes", ou game_club_id_1 = game_club_id_2, sont ecartes
// car il ne s'agit pas d'un vrai match). Retourne null si la nation du club
// n'a pas de coupe nationale geree.
async function getClubCoupeInfo(clubId, clubNation) {
  const { data: comp } = await supabaseClient
    .from("competitions")
    .select("id, nom")
    .eq("nation", clubNation)
    .eq("type", "coupe_nationale")
    .maybeSingle();
  if (!comp) return null;

  const clubIdNum = Number(clubId);
  // On restreint explicitement a la saison en cours de la partie : la table
  // contient aussi des tirages d'autres saisons (passees ou de test) pour
  // ce meme club/competition, avec des dates qui n'ont rien a voir (ex.
  // saison "gabarit" tres loin dans le futur) — sans ce filtre elles
  // se glissent dans le calendrier et faussent le tri chronologique.
  let rowsQuery = supabaseClient
    .from("game_coupe_nationale_tours")
    .select("id, saison, tour, game_club_id_1, game_club_id_2, date_match, score_1, score_2, tab_penalty_1, tab_penalty_2, game_club_vainqueur_id, statut")
    .eq("game_id", gameId)
    .eq("competition_ref", comp.id)
    .or(`game_club_id_1.eq.${clubIdNum},game_club_id_2.eq.${clubIdNum}`)
    .order("tour", { ascending: true });
  if (currentGame?.saison != null) rowsQuery = rowsQuery.eq("saison", currentGame.saison);
  const { data: rows } = await rowsQuery;

  const allRows = rows || [];
  const realRows = allRows.filter(r => r.game_club_id_1 !== r.game_club_id_2);

  let nbTours = null;
  if (allRows.length) {
    const saison = allRows[allRows.length - 1].saison;
    const { data: config } = await supabaseClient
      .from("game_coupe_nationale_config")
      .select("nb_tours")
      .eq("game_id", gameId).eq("competition_ref", comp.id).eq("saison", saison)
      .maybeSingle();
    nbTours = config?.nb_tours || null;
  }

  const oppIds = [...new Set(realRows.map(r => r.game_club_id_1 === clubIdNum ? r.game_club_id_2 : r.game_club_id_1))];
  const oppMap = {};
  const oppLogoMap = {};
  if (oppIds.length) {
    const { data: oppClubs } = await supabaseClient.from("game_clubs").select("id, nom, clubs(logo_url)").in("id", oppIds);
    (oppClubs || []).forEach(c => { oppMap[c.id] = c.nom; oppLogoMap[c.id] = c.clubs?.logo_url || null; });
  }

  const matches = realRows.map(r => {
    const isSide1 = r.game_club_id_1 === clubIdNum;
    const oppId = isSide1 ? r.game_club_id_2 : r.game_club_id_1;
    return {
      id: `coupe-${r.id}`,
      date_match: r.date_match,
      journee: null,
      compType: "coupe",
      compLabel: comp.nom,
      tour: r.tour,
      roundShort: coupeRoundShort(r.tour, nbTours),
      roundLabel: coupeRoundLabel(r.tour, nbTours),
      isHome: isSide1,
      oppId,
      oppName: oppMap[oppId] || "?",
      oppLogo: oppLogoMap[oppId] || null,
      played: r.statut === "termine",
      score_domicile: isSide1 ? r.score_1 : r.score_2,
      score_exterieur: isSide1 ? r.score_2 : r.score_1,
      myPen: isSide1 ? r.tab_penalty_1 : r.tab_penalty_2,
      oppPen: isSide1 ? r.tab_penalty_2 : r.tab_penalty_1,
      isWinner: r.game_club_vainqueur_id === clubIdNum,
    };
  });

  const entryTour = realRows.length ? realRows[0].tour : null;

  return { comp, nbTours, matches, entryTour };
}

// Construit la carte "coupe" du pane de droite (meme gabarit que la carte
// championnat), avec le parcours du club tour par tour et son prochain
// match le cas echeant. Retourne une chaine vide si la nation n'a pas de
// coupe nationale geree par le moteur.
function renderCoupeCardHtml(coupeInfo, gameId, clubId) {
  if (!coupeInfo) return "";
  const { comp, nbTours, matches, entryTour } = coupeInfo;
  const lastMatch = matches[matches.length - 1] || null;

  let statusValue, currentRoundValue, footerText;
  if (!lastMatch) {
    statusValue = "Pas entré en lice";
    currentRoundValue = "—";
    footerText = "Parcours et prochain match de la coupe";
  } else if (!lastMatch.played) {
    statusValue = "À venir";
    currentRoundValue = lastMatch.roundShort;
    footerText = "Parcours et prochain match de la coupe";
  } else if (lastMatch.isWinner) {
    if (lastMatch.tour === nbTours) {
      statusValue = "🏆 Vainqueur";
      currentRoundValue = lastMatch.roundShort;
    } else {
      statusValue = "Qualifié(e)";
      currentRoundValue = lastMatch.roundShort;
    }
    footerText = "Parcours et prochain match de la coupe";
  } else {
    statusValue = "Éliminé(e)";
    currentRoundValue = lastMatch.roundShort;
    footerText = "Parcours et prochain match de la coupe";
  }

  const parcoursHtml = matches.length ? matches.map(m => {
    let resHtml;
    if (!m.played) {
      resHtml = `<span class="res next">à venir</span>`;
    } else {
      const cls = m.isWinner ? "win" : "lose";
      let scoreText = `${m.score_domicile}-${m.score_exterieur}`;
      if (m.myPen != null) scoreText += ` (tab ${m.myPen}-${m.oppPen})`;
      resHtml = `<span class="res ${cls}">${scoreText}</span>`;
    }
    return `
      <div class="fm-comp-coupe-row">
        <span class="rnd">${escapeHtml(m.roundShort)}</span>
        <span class="opp" data-club-id="${m.oppId}">${mdetLogoHtml(m.oppLogo, m.oppName, 16)}<span class="opp-name">${escapeHtml(m.oppName)}</span></span>
        ${resHtml}
      </div>
    `;
  }).join("") : `<div class="fm-comp-empty-inline">${entryTour ? "" : "Pas encore entré en lice dans la compétition."}</div>`;

  return `
    <div class="fm-comp-card fm-comp-card-coupe" id="fmCompCard-${comp.id}">
      <div class="fm-comp-card-head">
        <div>
          <div class="fm-comp-card-title">${escapeHtml(comp.nom)}</div>
          <div class="fm-comp-card-sub">${entryTour ? `Entrée en lice : ${escapeHtml(coupeRoundLabel(entryTour, nbTours))}` : (nbTours ? `${nbTours} tours` : "")}</div>
        </div>
        <span class="fm-comp-card-tag coupe">Coupe</span>
      </div>
      <div class="fm-comp-card-stats" style="grid-template-columns: repeat(2, 1fr);">
        <div class="fm-comp-stat"><div class="label">Statut</div><div class="value">${statusValue}</div></div>
        <div class="fm-comp-stat"><div class="label">Tour</div><div class="value">${currentRoundValue}</div></div>
      </div>
      <div class="fm-comp-coupe-parcours">${parcoursHtml}</div>
      <div class="fm-comp-card-footer">
        <span>${footerText}</span>
        <span>→</span>
      </div>
    </div>
  `;
}

async function getClubMatches(clubId) {
  // clubId vient des query params (donc une string), alors que
  // club_domicile_id / club_exterieur_id renvoyes par Supabase sont des
  // nombres : sans ce cast, `m.club_domicile_id === clubId` est toujours
  // faux, isHome reste toujours a false et l'adversaire calcule est alors
  // TOUJOURS l'equipe a domicile (le club affiche s'affrontant lui-meme des
  // qu'il jouait a domicile).
  const clubIdNum = Number(clubId);

  const { data: matches, error } = await supabaseClient
    .from("calendrier")
    .select("id, date_match, journee, club_domicile_id, club_exterieur_id, score_domicile, score_exterieur")
    .eq("game_id", gameId)
    .or(`club_domicile_id.eq.${clubIdNum},club_exterieur_id.eq.${clubIdNum}`)
    .order("date_match", { ascending: true });

  if (error || !matches) return [];

  const oppIds = [...new Set(matches.map(m =>
    m.club_domicile_id === clubIdNum ? m.club_exterieur_id : m.club_domicile_id
  ))];
  const { data: oppClubs } = await supabaseClient
    .from("game_clubs")
    .select("id, nom")
    .in("id", oppIds);
  const oppMap = {};
  (oppClubs || []).forEach(c => { oppMap[c.id] = c.nom; });

  return matches.map(m => {
    const isHome = m.club_domicile_id === clubIdNum;
    const oppId = isHome ? m.club_exterieur_id : m.club_domicile_id;
    return {
      ...m,
      isHome,
      oppId,
      oppName: oppMap[oppId] || "?",
      played: m.score_domicile != null && m.score_exterieur != null,
      compType: "championnat",
    };
  });
}

function renderMatchRow(m, standingsMap, opts = {}) {
  const isCoupe = m.compType === "coupe";
  const d = m.date_match ? new Date(m.date_match) : null;
  const dayLabel = d ? d.toLocaleDateString("fr-FR", { day: "2-digit", month: "2-digit" }) : "-";
  const weekday = d ? d.toLocaleDateString("fr-FR", { weekday: "short" }).replace(".", "") : "";

  let resultHtml;
  let rowClass = "fm-comp-match-row";
  if (m.played) {
    rowClass += " played";
    const myScore = m.isHome ? m.score_domicile : m.score_exterieur;
    const oppScore = m.isHome ? m.score_exterieur : m.score_domicile;
    const outcome = isCoupe
      ? (m.isWinner ? "victoire" : "defaite")
      : (myScore > oppScore ? "victoire" : myScore < oppScore ? "defaite" : "nul");
    let scoreText = `${myScore}-${oppScore}`;
    if (isCoupe && m.myPen != null) scoreText += ` (tab ${m.myPen}-${m.oppPen})`;
    const detailsBtn = `<button class="mdet-btn" data-match-id="${m.id}" type="button">Détails</button>`;
    resultHtml = `<div class="fm-comp-match-score ${outcome}">${scoreText}</div>${detailsBtn}`;
  } else if (isCoupe) {
    resultHtml = `<div class="fm-comp-match-rank">à venir</div>`;
  } else {
    const oppRank = standingsMap[m.oppId] ? `${standingsMap[m.oppId]}e` : "—";
    resultHtml = `<div class="fm-comp-match-rank">${oppRank}</div>`;
  }
  if (opts.isNext) rowClass += " next";

  const oppLogoUrl = opts.logos ? opts.logos[m.oppId] : null;
  const oppLogoHtml = mdetLogoHtml(oppLogoUrl, m.oppName, 18);

  const compBadge = isCoupe
    ? `<span class="fm-comp-match-comp coupe">Coupe</span>`
    : `<span class="fm-comp-match-comp champ">Champ.</span>`;
  const roundBadge = isCoupe ? escapeHtml(m.roundShort) : `J${m.journee ?? "-"}`;

  return `
    <div class="${rowClass}" ${opts.isNext ? 'data-next="true"' : ""}>
      <div class="fm-comp-match-date"><span class="day">${dayLabel}</span>${weekday}</div>
      ${compBadge}
      <div class="fm-comp-match-journee">${roundBadge}</div>
      <div class="fm-comp-match-side ${m.isHome ? "dom" : "ext"}">${m.isHome ? "D" : "E"}</div>
      <div class="fm-comp-match-opp" data-club-id="${m.oppId}">
        ${oppLogoHtml}
        <span class="opp-name">${escapeHtml(m.oppName)}</span>
        ${opts.isNext ? `<span class="fm-comp-match-tag">Prochain</span>` : ""}
      </div>
      ${resultHtml}
    </div>
  `;
}

function bindMatchRowClicks(container) {
  container.querySelectorAll(".fm-comp-match-opp").forEach(el => {
    el.addEventListener("click", (e) => {
      e.stopPropagation();
      const clubId = el.getAttribute("data-club-id");
      if (clubId) window.location.href = `club.html?game=${encodeURIComponent(gameId)}&club=${encodeURIComponent(clubId)}`;
    });
  });
  container.querySelectorAll(".mdet-btn").forEach(el => {
    el.addEventListener("click", (e) => {
      e.stopPropagation();
      const matchId = el.getAttribute("data-match-id");
      if (matchId) openMatchDetails(matchId);
    });
  });
}

  const i = TAC_MENTALITY_SCALE.indexOf(label);

}

  const dots = TAC_MENTALITY_SCALE.map((_, i) => `<div class="tac-mentality-dot ${i <= mIdx ? "on" : ""}"></div>`).join("");
  const chips = [
    t.style_tactique && t.style_tactique !== "-" ? t.style_tactique : null,
    t.type_pressing ? `Pressing : ${t.type_pressing}` : null,

      ${t.formation_source ? `<div class="tac-row"><span class="tac-label">Origine</span><span class="tac-value"><span class="tac-badge ${escapeHtml(t.formation_source)}">${TAC_SOURCE_LABEL[t.formation_source] || t.formation_source}</span></span></div>` : ""}
      ${t.connaissance_tactique != null ? `<div class="tac-row"><span class="tac-label">Connaissance tactique</span><span class="tac-value">${t.connaissance_tactique}/20</span></div>` : ""}

// Photos des joueurs titulaires (referentiel public.players, colonne
// photo_url, reliee via game_players -> players). Les compositions
// persistees ne stockent que player_id/player_nom : la photo est recuperee
// a part, pour le lot de joueurs affiches sur le terrain.
async function tacFetchPlayerPhotos(playerIds) {
  const ids = [...new Set((playerIds || []).filter(id => id != null))];
  const photos = {};
  if (!ids.length) return photos;
  const { data } = await supabaseClient
    .from("game_players")
    .select("id, players(photo_url)")
    .in("id", ids);
  (data || []).forEach(p => {
    const url = p.players?.photo_url;
    if (url) photos[p.id] = url;
  });
  return photos;
}

function clubTacRenderPitch(compositions, viewedClubId, photos = {}) {
  const el = document.getElementById("clubTacPitch");
  if (!compositions || !compositions.length) {
    el.innerHTML = `<div class="fm-empty">Aucune composition disponible.</div>`;
    return;
  }
  el.innerHTML = compositions.map(c => {
    const cls = !c.player_id ? "empty" : "";
    const initials = c.player_nom ? escapeHtml(c.player_nom.split(" ").map(w => w[0]).join("").slice(0, 3).toUpperCase()) : "?";
    const photoUrl = c.player_id ? photos[c.player_id] : null;
    const dotHtml = photoUrl
      ? `<img src="${escapeHtml(photoUrl)}" alt="" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('span'), {textContent:'${initials}'}))">`
      : initials;
    return `
      <div class="tac-slot ${cls}" style="left:${c.x}%; top:${c.y}%;" title="${c.player_nom ? escapeHtml(c.player_nom) : "Aucun joueur disponible"} — ${escapeHtml(c.label || "")}" ${c.player_id ? `data-player-id="${escapeHtml(String(c.player_id))}"` : ""}>
        <div class="tac-slot-dot">${dotHtml}</div>
        <div class="tac-slot-name">${c.player_nom ? escapeHtml(c.player_nom) : escapeHtml(c.label || "")}</div>
      </div>
    `;
  }).join("");

    slotEl.addEventListener("click", () => window.mdetGoToPlayer(viewedClubId, slotEl.getAttribute("data-player-id")));
  });
}

async function renderCompetitionsTab(viewedClubId) {
  const calEl = document.getElementById("fmCompCalendarList");
  const rightEl = document.getElementById("fmCompRightPane");
  calEl.innerHTML = `<div class="fm-comp-empty">Chargement...</div>`;
  rightEl.innerHTML = `<div class="fm-comp-empty">Chargement...</div>`;

  if (!viewedClubNation || !viewedClubDivision) {
    calEl.innerHTML = `<div class="fm-comp-empty">Division inconnue pour ce club.</div>`;
    rightEl.innerHTML = "";
    return;
  }

  const standingsList = await getDivisionStandings(viewedClubNation, viewedClubDivision);
  const standingsMap = {};
  standingsList.forEach(r => { standingsMap[r.id] = r.rank; });

  const coupeInfo = await getClubCoupeInfo(viewedClubId, viewedClubNation);

  // Calendrier unifie : matchs de championnat + matchs de coupe nationale,
  // tries chronologiquement (chaque ligne precise sa competition, cf.
  // renderMatchRow).
  const matches = [...(await getClubMatches(viewedClubId)), ...(coupeInfo?.matches || [])]
    .sort((a, b) => new Date(a.date_match) - new Date(b.date_match));
  if (matches.length === 0) {
    calEl.innerHTML = `<div class="fm-comp-empty">Aucun match programmé.</div>`;
  } else {
    const nextIndex = matches.findIndex(m => !m.played);
    const logos = await mdetFetchClubLogos(matches.map(m => m.oppId));
    calEl.innerHTML = matches
      .map((m, i) => renderMatchRow(m, standingsMap, { isNext: i === nextIndex, logos }))
      .join("");
    bindMatchRowClicks(calEl);

    requestAnimationFrame(() => {
      const nextRow = calEl.querySelector('[data-next="true"]');
      if (nextRow) calEl.scrollTop = Math.max(0, nextRow.offsetTop - 4);
    });
  }

  const { data: comp, error: compError } = await supabaseClient
    .from("competitions")
    .select("id, nom, tier, nb_clubs, nb_relegation")
    .eq("nation", viewedClubNation)
    .eq("division", viewedClubDivision)
    .eq("type", "championnat")
    .maybeSingle();

  if (compError || !comp) {
    rightEl.innerHTML = `<div class="fm-comp-empty">Compétition introuvable pour cette division.</div>` + renderCoupeCardHtml(coupeInfo, gameId, viewedClubId);
    bindCoupeCardEvents(rightEl, coupeInfo, viewedClubId);
    return;
  }

  const { data: clubRow } = await supabaseClient
    .from("game_clubs")
    .select("points, victoires, nuls, defaites, buts_pour, buts_contre")
    .eq("id", viewedClubId)
    .single();

  const rank = standingsMap[viewedClubId];
  const nbClubs = comp.nb_clubs || standingsList.length;
  const diff = (clubRow?.buts_pour ?? 0) - (clubRow?.buts_contre ?? 0);

  const { zoneClassForRank, legendHtml } = await getStandingsZones(
    { ...comp, nation: viewedClubNation },
    standingsList.length
  );

  // Mini-classement complet (comme l'onglet Classement) : Clt / Club / J /
  // Diff / Pts pour chaque club de la division, avec le club consulte mis
  // en avant, logos de club et zones qualificatives/relégation surlignées
  // (memes codes couleur que la page Competition). La carte etant carree et
  // remplissant l'espace vertical disponible, la table scrolle en interne
  // si la division est grande.
  const miniStandingsHtml = standingsList.length ? `
    <div class="fm-comp-mini-standings-wrap">
      <table class="fm-comp-mini-table">
        <thead>
          <tr><th>Clt</th><th>Club</th><th>J</th><th>Diff</th><th>Pts</th></tr>
        </thead>
        <tbody>
          ${standingsList.map(r => {
            const rowClasses = [String(r.id) === String(viewedClubId) ? "me" : "", zoneClassForRank(r.rank)].filter(Boolean).join(" ");
            return `
            <tr class="${rowClasses}">
              <td class="clt">${r.rank}e</td>
              <td class="nm">
                <span class="fm-club-link" data-club-id="${r.id}">
                  ${r.logo ? `<img class="fm-club-logo" src="${escapeHtml(r.logo)}" alt="">` : ""}
                  <span>${escapeHtml(r.nom)}</span>
                </span>
              </td>
              <td class="num">${r.joues}</td>
              <td class="num">${r.diff >= 0 ? "+" : ""}${r.diff}</td>
              <td class="pts">${r.points}</td>
            </tr>
          `;
          }).join("")}
        </tbody>
      </table>
      ${legendHtml}
    </div>
  ` : "";

  rightEl.innerHTML = `
    <div class="fm-comp-card" id="fmCompCard-${comp.id}">
      <div class="fm-comp-card-head">
        <div>
          <div class="fm-comp-card-title">${escapeHtml(comp.nom)}</div>
          <div class="fm-comp-card-sub">${escapeHtml(viewedClubNation)} · ${escapeHtml(viewedClubDivision)}</div>
        </div>
        <span class="fm-comp-card-tag">Championnat</span>
      </div>
      <div class="fm-comp-card-stats">
        <div class="fm-comp-stat"><div class="label">Classement</div><div class="value">${rank ? `${rank}e` : "—"} / ${nbClubs}</div></div>
        <div class="fm-comp-stat"><div class="label">Points</div><div class="value">${clubRow?.points ?? 0}</div></div>
        <div class="fm-comp-stat"><div class="label">Bilan</div><div class="value">${clubRow?.victoires ?? 0}V ${clubRow?.nuls ?? 0}N ${clubRow?.defaites ?? 0}D</div></div>
        <div class="fm-comp-stat"><div class="label">Diff.</div><div class="value">${diff >= 0 ? "+" : ""}${diff}</div></div>
      </div>
      ${miniStandingsHtml}
      <div class="fm-comp-card-footer">
        <span>Classement, stats et prochains matchs de la compétition</span>
        <span>→</span>
      </div>
    </div>
  ` + renderCoupeCardHtml(coupeInfo, gameId, viewedClubId);

  document.getElementById(`fmCompCard-${comp.id}`).addEventListener("click", (e) => {
    if (e.target.closest(".fm-comp-mini-table .fm-club-link")) return;
    window.location.href = `competition.html?game=${encodeURIComponent(gameId)}&competition=${encodeURIComponent(comp.id)}&club=${encodeURIComponent(viewedClubId)}`;
  });
  rightEl.querySelectorAll(".fm-comp-mini-table .fm-club-link").forEach(linkEl => {
    linkEl.addEventListener("click", (e) => {
      e.stopPropagation();
      const clubId = linkEl.getAttribute("data-club-id");
      if (clubId) window.location.href = `club.html?game=${encodeURIComponent(gameId)}&club=${encodeURIComponent(clubId)}`;
    });
  });
  bindCoupeCardEvents(rightEl, coupeInfo, viewedClubId);
}

// ===================== CHARGEMENT =====================
async function loadClub() {
  if (!gameId || !gameClubId) {
    showFatalError("Club introuvable.");
    return;
  }

  const { data: { session } } = await supabaseClient.auth.getSession();
  if (!session?.user) {
    window.location.href = "index.html";
    return;
  }
  const userId = session.user.id;

  const { data: game } = await supabaseClient
    .from("games")
    .select("date_debut, jour_actuel, saison, statut")
    .eq("id", gameId)
    .single();
  currentGame = game || null;

  const { data: participants } = await supabaseClient
    .from("game_participants")
    .select("pseudo, user_id, game_club_id")
    .eq("game_id", gameId);
  const me = (participants || []).find(p => p.user_id === userId);

  if (!me?.game_club_id) {
    showFatalError("Choisis d'abord un club depuis la page d'accueil pour consulter les fiches club.");
    return;
  }

  const myClubId = me.game_club_id;
  const isOwnClub = String(myClubId) === String(gameClubId);
  isOwnClubView = isOwnClub;

  const { data: club, error: clubErr } = await supabaseClient
    .from("game_club_overview")
    .select(`
      game_club_id, nom, budget_actuel, classement, statut, nation, division,
      niveau_entrainement, centre_formation, capacite_stade, affluence_moyenne,
      nb_joueurs, meilleur_joueur_nom
    `)
    .eq("game_id", gameId)
    .eq("game_club_id", gameClubId)
    .single();

  if (clubErr || !club) {
    showFatalError("Impossible de charger ce club.");
    return;
  }
  viewedClubNation = club.nation;
  viewedClubDivision = club.division;

  // Requete complementaire "large" (select *) pour recuperer sans risque
  // d'erreur d'eventuels champs pas encore utilises ailleurs (logo, palmares...).
  let rawClub = null;
  try {
    const { data: raw } = await supabaseClient
      .from("game_clubs")
      .select("*, clubs(logo_url)")
      .eq("id", gameClubId)
      .eq("game_id", gameId)
      .single();
    rawClub = raw || null;
  } catch (e) {
    rawClub = null;
  }

  const { data: players } = await supabaseClient
    .from("game_players")
    .select(`
      id, nom, age, nationalite, poste_brut, statut_special, salaire_actuel,
      contrat_expire, valeur_marchande_actuelle, reputation_mondiale,
      niveau_actuel, potentiel, buts_saison, passes_decisives_saison,
      matchs_joues_saison, note_moyenne_saison
    `)
    .eq("game_id", gameId)
    .eq("game_club_id", gameClubId)
    .order("reputation_mondiale", { ascending: false, nullsFirst: false });

  // Le bandeau identifie desormais le club affiche sur CETTE page (utile
  // pour se reperer quand on consulte la fiche d'un autre club que le
  // sien), et non plus systematiquement le club du manager.
  const headerClubName = club.nom;

  document.getElementById("clubHero").classList.remove("hidden");
  document.getElementById("clubGrid").style.display = "";

  renderFmHeader(me.pseudo, headerClubName);
  fmFetchClubColor(gameClubId).then(fmApplyTopbarColor);
  renderFmSidebar(myClubId, getClubLogoUrl(rawClub), club.nom);
  renderFmSubtabs(gameClubId);
  renderClubHero(club, rawClub);
  renderPitch();
  renderFinances(club);
  renderReputation(club, players || []);
  renderKeyPeople(club, players || [], rawClub);
  renderPalmares(rawClub);
}

// stats d'equipe, buteurs/passeurs, cartons, blessures, remplacements,

const MDET_ICONES = {
  but: "⚽", jaune: "🟨", deuxieme_jaune: "🟨🟥", rouge_direct: "🟥", blessure: "🩹", remplacement: "🔄",
};

function mdetLigneStat(label, valDom, valExt) {
  if (valDom == null && valExt == null) return "";
  return `
    <div class="val-dom">${valDom ?? "-"}</div>
    <div class="label">${label}</div>
    <div class="val-ext">${valExt ?? "-"}</div>
  `;
}

function mdetNomEquipe(gameClubId, clubDomId, nomDom, nomExt) {
  return gameClubId === clubDomId ? nomDom : nomExt;
}

function mdetRenderEvenements(stats, clubDomId, nomDom, nomExt) {
  const evts = [];

  (stats.buteurs || []).forEach(b => {
    const passeur = (stats.passeurs || []).find(p => p.but_de === b.player_id && p.minute === b.minute);
    evts.push({
      minute: b.minute, icone: MDET_ICONES.but,
      texte: `<strong>${escapeHtml(b.player_nom)}</strong> (${escapeHtml(mdetNomEquipe(b.game_club_id, clubDomId, nomDom, nomExt))})`
        + (passeur ? ` <span class="mdet-event-detail">— passe déc. ${escapeHtml(passeur.player_nom)}</span>` : ""),
    });
  });
  (stats.cartons || []).forEach(c => {
    evts.push({
      minute: c.minute, icone: MDET_ICONES[c.type] || "🟨",
      texte: `${escapeHtml(c.player_nom)} <span class="mdet-event-detail">(${escapeHtml(mdetNomEquipe(c.game_club_id, clubDomId, nomDom, nomExt))})</span>`,
    });
  });
  (stats.blessures || []).forEach(b => {
    evts.push({
      minute: b.minute, icone: MDET_ICONES.blessure,
      texte: `${escapeHtml(b.player_nom)} <span class="mdet-event-detail">(${escapeHtml(mdetNomEquipe(b.game_club_id, clubDomId, nomDom, nomExt))}, blessure ${escapeHtml(b.gravite || "")})</span>`,
    });
  });
  (stats.remplacements || []).forEach(r => {
    evts.push({
      minute: r.minute, icone: MDET_ICONES.remplacement,
      // Affiche le remplacement sur 3 lignes : titulaire sorti, icone de
      // remplacement (verticale), puis entrant.
      texte: `<div class="mdet-timeline-sub">
          <div class="mdet-timeline-sub-name out">${escapeHtml(r.sortant_nom)}</div>
          <div class="mdet-timeline-sub-icon">🔄</div>
          <div class="mdet-timeline-sub-name">${escapeHtml(r.entrant_nom)}</div>
        </div>
        <span class="mdet-event-detail">(${escapeHtml(mdetNomEquipe(r.game_club_id, clubDomId, nomDom, nomExt))})</span>`,
    });
  });

  evts.sort((a, b) => a.minute - b.minute);
  if (!evts.length) return `<div class="mdet-empty">Aucun évènement notable.</div>`;

  return `<div class="mdet-timeline">${evts.map(e => `
    <div class="mdet-timeline-item">
      <div class="mdet-timeline-dot">${e.icone}</div>
      <div class="mdet-timeline-minute">${e.minute}e</div>
      <div class="mdet-timeline-text">${e.texte}</div>
    </div>
  `).join("")}</div>`;
}

function mdetNoteClass(note) {
  const n = Number(note);
  if (!Number.isFinite(n)) return "mdet-note-moyen";
  if (n >= 7.5) return "mdet-note-elite";
  if (n >= 6.5) return "mdet-note-bon";
  if (n >= 5.5) return "mdet-note-moyen";
  if (n >= 4.5) return "mdet-note-faible";
  return "mdet-note-mauvais";
}

        ${sortant ? `<div class="mdet-player-sub-detail">↔ ${escapeHtml(sortant.sortant_nom)}${sortant.minute != null ? ` · ${sortant.minute}e` : ""}</div>` : ""}

function mdetPitchRows(titulaires) {
  const bands = { GB: [], DEF: [], MD: [], MO: [], BT: [] };
  titulaires.forEach(p => {
    if (p.role === "GB") bands.GB.push(p);
    else if (p.role === "D" || p.role === "AL") bands.DEF.push(p);
    else if (p.role === "MD") bands.MD.push(p);
    else if (p.role === "MO") bands.MO.push(p);
    else if (p.role === "BT") bands.BT.push(p);
    else bands.MD.push(p);
  });
  // Ligne de defense : les arrieres lateraux (AL) sont places aux extremites,
  // les defenseurs axiaux (D) au centre, pour ressembler a une vraie ligne.
  const al = bands.DEF.filter(p => p.role === "AL");
  const d = bands.DEF.filter(p => p.role !== "AL");
  const defOrdered = [];
  if (al[0]) defOrdered.push(al[0]);
  defOrdered.push(...d);
  if (al[1]) defOrdered.push(al[1]);
  if (al.length > 2) defOrdered.push(...al.slice(2));
  return [
    { y: 91, players: bands.GB },
    { y: 70, players: defOrdered },
    { y: 48, players: bands.MD },
    { y: 26, players: bands.MO },
    { y: 8, players: bands.BT },
  ].filter(row => row.players.length);
}

function mdetPitchPlayerHtml(p, hommeDuMatch, clubId, xPct, yPct) {
  const isMotm = hommeDuMatch && hommeDuMatch.player_id === p.player_id;
  const clickable = p.player_id ? ` onclick="window.mdetGoToPlayer('${escapeHtml(String(clubId || "")).replace(/'/g, "&#39;")}', '${escapeHtml(String(p.player_id)).replace(/'/g, "&#39;")}')"` : "";
  const nomCourt = (p.player_nom || "?").trim().split(/\s+/).pop();
  return `
    <div class="mdet-pitch-player${isMotm ? " motm" : ""}" style="left:${xPct}%; top:${yPct}%;"${clickable}>
      <div class="mdet-pitch-dot ${mdetNoteClass(p.note)}">${Number(p.note).toFixed(1)}</div>
      <div class="mdet-pitch-name">${isMotm ? "⭐ " : ""}${escapeHtml(nomCourt)}</div>
    </div>
  `;
}

function mdetRenderPitch(titulaires, hommeDuMatch, clubId) {
  const rows = mdetPitchRows(titulaires);
  const dots = rows.flatMap(row => {
    const n = row.players.length;
    return row.players.map((p, i) => mdetPitchPlayerHtml(p, hommeDuMatch, clubId, ((i + 1) / (n + 1)) * 100, row.y));
  }).join("");
  return `<div class="mdet-pitch">${dots}</div>`;
}

function mdetRenderRosterCol(notes, hommeDuMatch, logoHtml, nomEquipe, remplacements, clubId) {
  const titulaires = (notes || []).filter(n => !n.entrant);
  const remplacants = (notes || []).filter(n => n.entrant);
  // Associe chaque entrant a son sortant (par nom), a partir de stats.remplacements.
  const sortantParEntrant = {};
  (remplacements || []).forEach(r => { sortantParEntrant[r.entrant_nom] = r; });
  const aDesPostes = titulaires.some(n => n.role);
  const titulairesHtml = aDesPostes
    ? mdetRenderPitch(titulaires, hommeDuMatch, clubId)
    : (titulaires.length ? titulaires.map(n => mdetPlayerRow(n, hommeDuMatch, sortantParEntrant, clubId)).join("") : `<div class="mdet-empty">Aucun titulaire noté.</div>`);
  return `
    <div class="mdet-roster-col">
      <div class="mdet-roster-team-head">${logoHtml}<span>${escapeHtml(nomEquipe)}</span></div>
      ${titulairesHtml}
      ${remplacants.length ? `<div class="mdet-roster-subhead">Remplacements</div>${remplacants.map(n => mdetPlayerRow(n, hommeDuMatch, sortantParEntrant, clubId)).join("")}` : ""}
    </div>
  `;
}

function mdetRenderNotes(notesJoueurs, hommeDuMatch, logoDomHtml, logoExtHtml, nomDom, nomExt, remplacementsDom, remplacementsExt, clubDomId, clubExtId) {

// Barre de "domination" pour comparer une stat des deux equipes (possession,
// tirs, tirs cadres, corners...). Si isPercent est vrai, valDom/valExt sont
// deja des pourcentages sommant a ~100 ; sinon on calcule la part relative.
// ---- Couleurs des barres de stats (dom/ext), derivees du logo de chaque
// club (couleur dominante moyenne des pixels non transparents/non neutres).
// Repli sur la teinte de substitution du blason (colorFromName) si le logo
// est absent ou si son extraction echoue (ex: image sans en-tetes CORS). Si
// les deux teintes obtenues sont trop proches pour se distinguer (ex: deux
// logos majoritairement rouges), on decale celle de l'equipe exterieure.
function mdetRgbToHsl(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  const max = Math.max(r, g, b), min = Math.min(r, g, b);
  let h, s, l = (max + min) / 2;
  if (max === min) { h = 0; s = 0; }
  else {
    const dlt = max - min;
    s = l > 0.5 ? dlt / (2 - max - min) : dlt / (max + min);
    switch (max) {
      case r: h = (g - b) / dlt + (g < b ? 6 : 0); break;
      case g: h = (b - r) / dlt + 2; break;
      default: h = (r - g) / dlt + 4;
    }
    h *= 60;
  }
  return [h, s * 100, l * 100];
}

function mdetHueFromName(nom) {
  let hash = 0;
  for (let i = 0; i < (nom || "").length; i++) hash = nom.charCodeAt(i) + ((hash << 5) - hash);
  return Math.abs(hash) % 360;
}

async function mdetDominantColorFromLogo(url) {
  if (!url) return null;
  try {
    const img = await new Promise((resolve, reject) => {
      const image = new Image();
      image.crossOrigin = "anonymous";
      image.onload = () => resolve(image);
      image.onerror = () => reject(new Error("load failed"));
      image.src = url;
    });
    const size = 40;
    const canvas = document.createElement("canvas");
    canvas.width = size; canvas.height = size;
    const ctx = canvas.getContext("2d");
    ctx.drawImage(img, 0, 0, size, size);
    const { data } = ctx.getImageData(0, 0, size, size);
    // Regroupe les pixels par couleur RVB quantifiee (et non par teinte
    // seule : un bucket de teinte peut eclater a tort un meme bleu en
    // plusieurs paniers a cause d'un degrade/anti-aliasing, ce qui laissait
    // gagner par erreur un petit element plus uniforme du blason, comme les
    // etoiles dorees). On isole ainsi la couleur LA PLUS FREQUENTE plutot
    // qu'une moyenne de toutes les couleurs presentes (qui melangerait par
    // exemple le bleu dominant et le rouge d'un liseret tricolore en un
    // violet ne ressemblant a aucune des deux couleurs reelles du logo).
    const step = 22;
    const buckets = {};
    for (let i = 0; i < data.length; i += 4) {
      const alpha = data[i + 3];
      if (alpha < 100) continue;
      const rr = data[i], gg = data[i + 1], bb = data[i + 2];
      const max = Math.max(rr, gg, bb), min = Math.min(rr, gg, bb);
      if (max > 240 && min > 225) continue; // quasi blanc (fond) : ignore
      if (max < 25) continue; // quasi noir : ignore
      if (max - min < 20) continue; // quasi gris/neutre : n'identifie aucune teinte
      const key = `${Math.round(rr / step)}-${Math.round(gg / step)}-${Math.round(bb / step)}`;
      if (!buckets[key]) buckets[key] = { count: 0, r: 0, g: 0, b: 0 };
      buckets[key].count++;
      buckets[key].r += rr; buckets[key].g += gg; buckets[key].b += bb;
    }
    let best = null;
    Object.values(buckets).forEach(bk => { if (!best || bk.count > best.count) best = bk; });
    if (!best) return null;
    const [h, s, l] = mdetRgbToHsl(best.r / best.count, best.g / best.count, best.b / best.count);
    // Sature/eclaircit un minimum pour rester lisible sur fond sombre.
    return [h, Math.max(s, 45), Math.min(Math.max(l, 40), 62)];
  } catch (e) {
    return null;
  }
}

function mdetHueDistance(h1, h2) {
  const d = Math.abs(h1 - h2) % 360;
  return d > 180 ? 360 - d : d;
}

// Couleurs des barres a partir de clubs.couleur_dominante (meme source que
// la topbar et dashboard.html), plutot que d'une extraction live depuis le
// logo : garantit que la barre d'un club affiche exactement la meme teinte
// que sa topbar quand on consulte sa page.
async function mdetFetchClubColors(clubIds) {
  const ids = [...new Set(clubIds.filter(Boolean))];
  const colors = {};
  if (!ids.length) return colors;
  try {
    const { data: gameClubs } = await supabaseClient
      .from("game_clubs")
      .select("id, clubs(couleur_dominante)")
      .in("id", ids);
    (gameClubs || []).forEach(g => {
      const c = g?.clubs?.couleur_dominante;
      if (c && c.h != null) colors[g.id] = c;
    });
  } catch (e) {
    console.error(e);
  }
  return colors;
}

function mdetPickBarColors(colorDom, nomDom, colorExt, nomExt) {
  let hDom = colorDom?.h, sDom = colorDom?.s ?? 62, lDom = colorDom?.l ?? 46;
  let hExt = colorExt?.h, sExt = colorExt?.s ?? 62, lExt = colorExt?.l ?? 46;
  if (hDom == null) hDom = mdetHueFromName(nomDom);
  if (hExt == null) hExt = mdetHueFromName(nomExt);

  // On ne touche a la couleur exterieure que si les deux teintes sont
  // quasiment identiques (memes teinte/saturation/luminosite a quelques
  // degres pres) : au-dela, chaque club garde sa vraie couleur, meme si
  // elles restent "de la meme famille" (ex: jaune contre vert).
  if (mdetHueDistance(hDom, hExt) < 12 && Math.abs(sDom - sExt) < 15 && Math.abs(lDom - lExt) < 12) {
    hExt = (hExt + 20) % 360;
    lExt = lExt > 45 ? Math.max(lExt - 14, 22) : Math.min(lExt + 14, 68);
  }
  return {
    dom: `hsl(${Math.round(hDom)}, ${Math.round(sDom)}%, ${Math.round(lDom)}%)`,
    ext: `hsl(${Math.round(hExt)}, ${Math.round(sExt)}%, ${Math.round(lExt)}%)`,
  };
}

function mdetBarStat(label, valDom, valExt, isPercent, domColor, extColor) {
  if (valDom == null && valExt == null) return "";
  const d = parseFloat(valDom) || 0;
  const e = parseFloat(valExt) || 0;
  let pctDom, pctExt;
  if (isPercent) {
    pctDom = d; pctExt = e;
  } else {
    const total = d + e;
    pctDom = total > 0 ? (d / total) * 100 : 50;
    pctExt = total > 0 ? (e / total) * 100 : 50;
  }
  return `
    <div class="mdet-bar-row">
      <div class="mdet-bar-val dom">${valDom ?? "-"}</div>
      <div class="mdet-bar-mid">
        <div class="mdet-bar-label">${label}</div>
        <div class="mdet-bar-track">
          <div class="mdet-bar-fill dom" style="width:${pctDom}%; background:${domColor || "var(--gold)"};"></div>
          <div class="mdet-bar-fill ext" style="width:${pctExt}%; background:${extColor || "var(--accent)"};"></div>
        </div>
      </div>
      <div class="mdet-bar-val ext">${valExt ?? "-"}</div>
    </div>
  `;
}

// Detail d'un match de coupe : contrairement au championnat, la table
// game_coupe_nationale_tours ne stocke pas les stats detaillees du moteur
// (possession, tirs, compositions...), seulement le score et le vainqueur.

    .eq("id", rowId)

  if (error || !m) {

    document.getElementById("mdetCloseBtn").addEventListener("click", closeMatchDetails);

  }

  const [{ data: clubs }, { data: comp }, { data: config }] = await Promise.all([
    supabaseClient.from("game_clubs").select("id, nom").in("id", [m.game_club_id_1, m.game_club_id_2]),
    supabaseClient.from("competitions").select("nom").eq("id", m.competition_ref).maybeSingle(),
    supabaseClient.from("game_coupe_nationale_config").select("nb_tours").eq("game_id", gameId).eq("competition_ref", m.competition_ref).eq("saison", m.saison).maybeSingle(),
  ]);
  const nomClub = Object.fromEntries((clubs || []).map(c => [c.id, c.nom]));
  const nomDom = nomClub[m.game_club_id_1] || "?";
  const nomExt = nomClub[m.game_club_id_2] || "?";
  const d = m.date_match ? new Date(m.date_match) : null;
  const dateLabel = d ? d.toLocaleDateString("fr-FR", { day: "2-digit", month: "long", year: "numeric" }) : "";
  const roundLabel = coupeRoundLabel(m.tour, config?.nb_tours || null);

  const logos = await mdetFetchClubLogos([m.game_club_id_1, m.game_club_id_2]);
  const logoDom = mdetLogoHtml(logos[m.game_club_id_1], nomDom, 64);
  const logoExt = mdetLogoHtml(logos[m.game_club_id_2], nomExt, 64);

  const scoreText = `${m.score_1 ?? "-"} - ${m.score_2 ?? "-"}`;
  const penaltyLine = m.tab_penalty_1 != null
    ? `<div class="mdet-meta">Tirs au but : ${m.tab_penalty_1} - ${m.tab_penalty_2}</div>` : "";

  let winnerBanner = "";
  if (m.statut === "termine") {
    const winnerName = m.game_club_vainqueur_id === m.game_club_id_1 ? nomDom
      : m.game_club_vainqueur_id === m.game_club_id_2 ? nomExt : null;
    if (winnerName) winnerBanner = `<div class="mdet-motm-banner">🏆 ${escapeHtml(winnerName)} se qualifie</div>`;
  }

  content.innerHTML = `
    <div class="mdet-header">
      <div class="mdet-header-teams">
        ${logoDom}
        <div class="mdet-header-team-name dom">${escapeHtml(nomDom)}</div>
        <span class="score">${scoreText}</span>
        <div class="mdet-header-team-name ext">${escapeHtml(nomExt)}</div>
        ${logoExt}
      </div>
      <button class="mdet-close" id="mdetCloseBtn">✕</button>
    </div>
    <div class="mdet-meta">${escapeHtml(comp?.nom || "Coupe nationale")} · ${escapeHtml(roundLabel)}${dateLabel ? ` · ${dateLabel}` : ""}</div>
    ${penaltyLine}
    ${winnerBanner}
    <div class="mdet-empty" style="margin-top: 18px;">Pas de statistiques détaillées disponibles pour les matchs de coupe.</div>
  `;
  document.getElementById("mdetCloseBtn").addEventListener("click", closeMatchDetails);
}

async function openMatchDetails(matchId) {
  const overlay = document.getElementById("mdetOverlay");
  const content = document.getElementById("mdetContent");
  content.innerHTML = `<div class="mdet-empty">Chargement...</div>`;
  overlay.classList.remove("hidden");

  if (String(matchId).startsWith("coupe-")) {
    await mdetRenderCoupeMatch(String(matchId).slice("coupe-".length));
    return;
  }

  const { data: m, error } = await supabaseClient
    .from("calendrier")
    .select("id, date_match, journee, club_domicile_id, club_exterieur_id, score_domicile, score_exterieur, stats")
    .eq("id", matchId)
    .single();

  if (error || !m) {
    content.innerHTML = `<div class="mdet-header"><div class="mdet-header-teams">Match introuvable</div><button class="mdet-close" id="mdetCloseBtn">✕</button></div>`;
    document.getElementById("mdetCloseBtn").addEventListener("click", closeMatchDetails);
    return;
  }

  const { data: clubs } = await supabaseClient.from("game_clubs").select("id, nom").in("id", [m.club_domicile_id, m.club_exterieur_id]);
  const nomClub = Object.fromEntries((clubs || []).map(c => [c.id, c.nom]));
  const nomDom = nomClub[m.club_domicile_id] || "?";
  const nomExt = nomClub[m.club_exterieur_id] || "?";
  const stats = m.stats || {};
  const d = m.date_match ? new Date(m.date_match) : null;
  const dateLabel = d ? d.toLocaleDateString("fr-FR", { day: "2-digit", month: "long", year: "numeric" }) : "";

  const motm = stats.homme_du_match;
  const logos = await mdetFetchClubLogos([m.club_domicile_id, m.club_exterieur_id]);
  const logoDom = mdetLogoHtml(logos[m.club_domicile_id], nomDom, 64);
  const logoExt = mdetLogoHtml(logos[m.club_exterieur_id], nomExt, 64);
  const logoDomSmall = mdetLogoHtml(logos[m.club_domicile_id], nomDom, 30);
  const logoExtSmall = mdetLogoHtml(logos[m.club_exterieur_id], nomExt, 30);
  const remplacementsDom = (stats.remplacements || []).filter(r => r.game_club_id === m.club_domicile_id);
  const remplacementsExt = (stats.remplacements || []).filter(r => r.game_club_id === m.club_exterieur_id);
  const clubColors = await mdetFetchClubColors([m.club_domicile_id, m.club_exterieur_id]);
  const barColors = mdetPickBarColors(clubColors[m.club_domicile_id], nomDom, clubColors[m.club_exterieur_id], nomExt);

  content.innerHTML = `
    <div class="mdet-header">
      <div class="mdet-header-teams">
        ${logoDom}
        <div class="mdet-header-team-name dom">${escapeHtml(nomDom)}</div>
        <span class="score">${m.score_domicile ?? "-"} - ${m.score_exterieur ?? "-"}</span>
        <div class="mdet-header-team-name ext">${escapeHtml(nomExt)}</div>
        ${logoExt}
      </div>
      <button class="mdet-close" id="mdetCloseBtn">✕</button>
    </div>
    <div class="mdet-meta">${dateLabel}${m.journee ? ` · J${m.journee}` : ""}</div>

    ${motm ? `<div class="mdet-motm-banner">⭐ Homme du match : ${escapeHtml(motm.player_nom)} (${Number(motm.note).toFixed(1)})</div>` : ""}

    <div class="mdet-section-title">Statistiques</div>
    <div class="mdet-bars">
      ${mdetBarStat("Possession", stats.possession?.domicile != null ? stats.possession.domicile + "%" : null, stats.possession?.exterieur != null ? stats.possession.exterieur + "%" : null, true, barColors.dom, barColors.ext)}
      ${mdetBarStat("Tirs", stats.tirs?.domicile, stats.tirs?.exterieur, false, barColors.dom, barColors.ext)}
      ${mdetBarStat("Tirs cadrés", stats.tirs_cadres?.domicile, stats.tirs_cadres?.exterieur, false, barColors.dom, barColors.ext)}
      ${mdetBarStat("Occasions franches", stats.occasions_franches?.domicile, stats.occasions_franches?.exterieur, false, barColors.dom, barColors.ext)}
      ${mdetBarStat("Corners", stats.corners?.domicile, stats.corners?.exterieur, false, barColors.dom, barColors.ext)}
      ${mdetBarStat("Hors-jeu", stats.hors_jeu?.domicile, stats.hors_jeu?.exterieur, false, barColors.dom, barColors.ext)}
      ${mdetBarStat("Passes réussies", stats.passes_reussies?.domicile, stats.passes_reussies?.exterieur, false, barColors.dom, barColors.ext)}
      ${mdetBarStat("Centres", stats.centres?.domicile, stats.centres?.exterieur, false, barColors.dom, barColors.ext)}
      ${mdetBarStat("Fautes", stats.fautes?.domicile, stats.fautes?.exterieur, false, barColors.dom, barColors.ext)}
      ${mdetBarStat("Arrêts gardien", stats.arrets?.domicile, stats.arrets?.exterieur, false, barColors.dom, barColors.ext)}
    </div>

    <div class="mdet-section-title">Faits de match</div>
    ${mdetRenderEvenements(stats, m.club_domicile_id, nomDom, nomExt)}

    <div class="mdet-section-title">Compositions</div>
    ${mdetRenderNotes(stats.notes_joueurs, motm, logoDomSmall, logoExtSmall, nomDom, nomExt, remplacementsDom, remplacementsExt, m.club_domicile_id, m.club_exterieur_id) || `<div class="mdet-empty">Pas de détail disponible pour ce match.</div>`}
  `;
  document.getElementById("mdetCloseBtn").addEventListener("click", closeMatchDetails);
}

function closeMatchDetails() {
  document.getElementById("mdetOverlay").classList.add("hidden");
}

document.getElementById("mdetOverlay").addEventListener("click", (e) => {
  if (e.target.id === "mdetOverlay") closeMatchDetails();
});

loadClub();
</script>
</body>
</html>
