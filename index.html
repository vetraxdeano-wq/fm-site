<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FM Web — Test Rooms</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #262a33;
    --text: #e8eaed;
    --text-dim: #8b909c;
    --accent: #4ade80;
    --accent-dim: #1f6b42;
    --danger: #ef4444;
    --gold: #fbbf24;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    min-height: 100vh;
    padding: 24px 16px;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  header { margin-bottom: 32px; }
  h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -0.02em; }
  .sub { color: var(--text-dim); font-size: 14px; }
  .pseudo-box {
    display: flex; align-items: center; gap: 8px;
    margin-top: 12px; font-size: 13px; color: var(--text-dim);
  }
  .pseudo-box input {
    background: var(--panel); border: 1px solid var(--border); color: var(--text);
    padding: 4px 8px; border-radius: 6px; font-size: 13px; width: 140px;
  }
  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; padding: 20px; margin-bottom: 16px;
  }
  .card h2 {
    font-size: 15px; margin: 0 0 14px; color: var(--text-dim);
    text-transform: uppercase; letter-spacing: 0.05em;
  }
  .row { display: flex; gap: 8px; }
  input[type=text] {
    flex: 1; background: #0d0f13; border: 1px solid var(--border); color: var(--text);
    padding: 10px 12px; border-radius: 8px; font-size: 14px;
  }
  input[type=text]:focus { outline: none; border-color: var(--accent); }
  button {
    background: var(--accent); color: #06210f; border: none;
    padding: 10px 16px; border-radius: 8px; font-weight: 600;
    font-size: 14px; cursor: pointer; white-space: nowrap;
  }
  button:hover { filter: brightness(1.08); }
  button:disabled { opacity: 0.5; cursor: default; }
  button.secondary { background: transparent; border: 1px solid var(--border); color: var(--text); }
  button.gold { background: var(--gold); color: #3a2a00; }
  .room-item {
    padding: 12px 14px; background: #0d0f13; border: 1px solid var(--border);
    border-radius: 8px; margin-bottom: 8px;
  }
  .room-item-top { display: flex; justify-content: space-between; align-items: center; }
  .room-item .name { font-weight: 600; font-size: 14px; }
  .room-item .meta { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
  .code-badge {
    font-family: monospace; background: var(--accent-dim); color: var(--accent);
    padding: 3px 8px; border-radius: 6px; font-size: 12px; letter-spacing: 0.05em;
  }
  .host-actions { margin-top: 10px; display: flex; align-items: center; gap: 10px; }
  .participant-count { font-size: 12px; color: var(--text-dim); }
  .empty { color: var(--text-dim); font-size: 13px; text-align: center; padding: 20px 0; }
  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--panel); border: 1px solid var(--border); padding: 10px 18px;
    border-radius: 8px; font-size: 13px; opacity: 0; pointer-events: none; transition: opacity 0.2s;
  }
  .toast.show { opacity: 1; }
  .toast.error { border-color: var(--danger); color: var(--danger); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>FM Web — Test Rooms</h1>
    <div class="sub">Page de test : creation / jonction de rooms</div>
    <div class="pseudo-box">
      Pseudo (affichage local) :
      <input type="text" id="pseudoInput" placeholder="ton pseudo">
      <button class="secondary" id="savePseudoBtn" style="padding:4px 10px;font-size:12px;">OK</button>
    </div>
  </header>

  <div class="card">
    <h2>Creer une room</h2>
    <div class="row">
      <input type="text" id="roomNameInput" placeholder="Nom de la room (ex: Ligue des potes)">
      <button id="createRoomBtn">Creer</button>
    </div>
  </div>

  <div class="card">
    <h2>Rejoindre une room</h2>
    <div class="row">
      <input type="text" id="joinCodeInput" placeholder="Code de la room (ex: A1B2C3)" style="text-transform:uppercase;">
      <button id="joinRoomBtn">Rejoindre</button>
    </div>
  </div>

  <div class="card">
    <h2>Mes rooms</h2>
    <div id="roomsList">
      <div class="empty">Connexion...</div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ============================================================
// CONFIG SUPABASE — remplace avec tes propres valeurs
// ============================================================
const SUPABASE_URL = "https://TON_PROJET.supabase.co";
const SUPABASE_ANON_KEY = "TA_CLE_ANON_PUBLIQUE";

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let userId = null; // rempli apres l'auth anonyme

// ============================================================
// AUTH ANONYME SUPABASE (vrai auth.uid(), pas de mot de passe)
// Le "pseudo" reste juste un nom d'affichage local (pas stocke en base
// pour l'instant, tes tables n'ont pas de colonne pseudo).
// ============================================================
async function ensureAuth() {
  const { data: { session } } = await supabase.auth.getSession();
  if (session?.user) {
    userId = session.user.id;
    return;
  }
  const { data, error } = await supabase.auth.signInAnonymously();
  if (error) {
    console.error(error);
    toast("Erreur d'authentification : " + error.message, true);
    throw error;
  }
  userId = data.user.id;
}

function getPseudo() {
  return localStorage.getItem("fm_pseudo") || "";
}
function setPseudo(p) {
  localStorage.setItem("fm_pseudo", p);
}

// ============================================================
// UI HELPERS
// ============================================================
function toast(msg, isError = false) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.className = "toast show" + (isError ? " error" : "");
  setTimeout(() => { el.className = "toast"; }, 2500);
}

function generateRoomCode() {
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; // sans caracteres ambigus
  let code = "";
  for (let i = 0; i < 6; i++) code += chars[Math.floor(Math.random() * chars.length)];
  return code;
}

// ============================================================
// INIT PSEUDO
// ============================================================
const pseudoInput = document.getElementById("pseudoInput");
pseudoInput.value = getPseudo();
document.getElementById("savePseudoBtn").addEventListener("click", () => {
  const val = pseudoInput.value.trim();
  if (!val) { toast("Entre un pseudo", true); return; }
  setPseudo(val);
  toast("Pseudo enregistre");
});

// ============================================================
// CREER UNE ROOM
// ============================================================
document.getElementById("createRoomBtn").addEventListener("click", async () => {
  const name = document.getElementById("roomNameInput").value.trim();
  if (!name) { toast("Donne un nom a la room", true); return; }

  const btn = document.getElementById("createRoomBtn");
  btn.disabled = true;

  try {
    const code = generateRoomCode();
    const { data: game, error: gameErr } = await supabase
      .from("games")
      .insert({ nom: name, code_invitation: code, created_by: userId })
      .select()
      .single();

    if (gameErr) throw gameErr;

    const { error: memberErr } = await supabase
      .from("game_participants")
      .insert({ game_id: game.id, user_id: userId, is_host: true });

    if (memberErr) throw memberErr;

    toast(`Room creee ! Code : ${code}`);
    document.getElementById("roomNameInput").value = "";
    loadRooms();
  } catch (e) {
    console.error(e);
    toast("Erreur lors de la creation : " + e.message, true);
  } finally {
    btn.disabled = false;
  }
});

// ============================================================
// REJOINDRE UNE ROOM
// ============================================================
document.getElementById("joinRoomBtn").addEventListener("click", async () => {
  const code = document.getElementById("joinCodeInput").value.trim().toUpperCase();
  if (!code) { toast("Entre un code de room", true); return; }

  const btn = document.getElementById("joinRoomBtn");
  btn.disabled = true;

  try {
    const { data: game, error: gameErr } = await supabase
      .from("games")
      .select()
      .eq("code_invitation", code)
      .single();

    if (gameErr || !game) { toast("Room introuvable pour ce code", true); return; }

    if (game.statut !== "lobby") {
      toast("Cette partie a deja demarre, impossible de la rejoindre", true);
      return;
    }

    const { data: existing } = await supabase
      .from("game_participants")
      .select("id")
      .eq("game_id", game.id)
      .eq("user_id", userId)
      .maybeSingle();

    if (!existing) {
      const { error: memberErr } = await supabase
        .from("game_participants")
        .insert({ game_id: game.id, user_id: userId, is_host: false });

      if (memberErr) throw memberErr;
    }

    toast(`Room "${game.nom}" rejointe !`);
    document.getElementById("joinCodeInput").value = "";
    loadRooms();
  } catch (e) {
    console.error(e);
    toast("Erreur en rejoignant : " + e.message, true);
  } finally {
    btn.disabled = false;
  }
});

// ============================================================
// DEMARRER LA PARTIE (host uniquement)
// ============================================================
async function startGame(gameId, btnEl) {
  btnEl.disabled = true;
  try {
    const { count } = await supabase
      .from("game_participants")
      .select("id", { count: "exact", head: true })
      .eq("game_id", gameId);

    if (!count || count < 2) {
      toast("Il faut au moins 2 joueurs pour demarrer", true);
      btnEl.disabled = false;
      return;
    }

    const { error } = await supabase
      .from("games")
      .update({ statut: "mercato" })
      .eq("id", gameId);

    if (error) throw error;

    toast("Partie demarree !");
    loadRooms();
  } catch (e) {
    console.error(e);
    toast("Erreur au demarrage : " + e.message, true);
    btnEl.disabled = false;
  }
}

// ============================================================
// LISTER MES ROOMS
// ============================================================
async function loadRooms() {
  const container = document.getElementById("roomsList");

  try {
    const { data: memberships, error } = await supabase
      .from("game_participants")
      .select("game_id, is_host, games(id, nom, code_invitation, statut, jour_actuel, saison)")
      .eq("user_id", userId);

    if (error) throw error;

    if (!memberships || memberships.length === 0) {
      container.innerHTML = '<div class="empty">Tu n\'as rejoint aucune room pour l\'instant.</div>';
      return;
    }

    const hostGameIds = memberships.filter(m => m.is_host).map(m => m.game_id);
    let countsByGame = {};
    if (hostGameIds.length > 0) {
      const { data: allParticipants } = await supabase
        .from("game_participants")
        .select("game_id")
        .in("game_id", hostGameIds);
      (allParticipants || []).forEach(p => {
        countsByGame[p.game_id] = (countsByGame[p.game_id] || 0) + 1;
      });
    }

    container.innerHTML = "";
    memberships.forEach(m => {
      const g = m.games;
      if (!g) return;

      const div = document.createElement("div");
      div.className = "room-item";

      const count = countsByGame[g.id];
      const canStart = m.is_host && g.statut === "lobby";

      div.innerHTML = `
        <div class="room-item-top">
          <div>
            <div class="name">${escapeHtml(g.nom)} ${m.is_host ? "👑" : ""}</div>
            <div class="meta">Saison ${g.saison} · Jour ${g.jour_actuel} · ${escapeHtml(g.statut)}</div>
          </div>
          <div class="code-badge">${escapeHtml(g.code_invitation)}</div>
        </div>
        ${canStart ? `
          <div class="host-actions">
            <button class="gold" data-start="${g.id}">Demarrer la partie</button>
            <span class="participant-count">${count || 1} joueur(s) inscrit(s)</span>
          </div>
        ` : ""}
      `;

      container.appendChild(div);
    });

    container.querySelectorAll("[data-start]").forEach(btn => {
      btn.addEventListener("click", () => startGame(btn.getAttribute("data-start"), btn));
    });
  } catch (e) {
    console.error(e);
    container.innerHTML = '<div class="empty">Erreur de chargement des rooms.</div>';
  }
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

// ============================================================
// INIT
// ============================================================
(async () => {
  try {
    await ensureAuth();
    loadRooms();
  } catch (e) {
    document.getElementById("roomsList").innerHTML =
      '<div class="empty">Impossible de se connecter a Supabase.</div>';
  }
})();
</script>
</body>
</html>
