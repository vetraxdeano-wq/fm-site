<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FM Web — Test Rooms</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #262a33;
    --text: #e8eaed;
    --text-dim: #8b909c;
    --accent: #4ade80;
    --accent-dim: #1f6b42;
    --danger: #ef4444;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    min-height: 100vh;
    padding: 24px 16px;
  }
  .wrap {
    max-width: 640px;
    margin: 0 auto;
  }
  header {
    margin-bottom: 32px;
  }
  h1 {
    font-size: 22px;
    margin: 0 0 4px;
    letter-spacing: -0.02em;
  }
  .sub {
    color: var(--text-dim);
    font-size: 14px;
  }
  .pseudo-box {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 12px;
    font-size: 13px;
    color: var(--text-dim);
  }
  .pseudo-box input {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 4px 8px;
    border-radius: 6px;
    font-size: 13px;
    width: 140px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .card h2 {
    font-size: 15px;
    margin: 0 0 14px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .row {
    display: flex;
    gap: 8px;
  }
  input[type=text] {
    flex: 1;
    background: #0d0f13;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 14px;
  }
  input[type=text]:focus {
    outline: none;
    border-color: var(--accent);
  }
  button {
    background: var(--accent);
    color: #06210f;
    border: none;
    padding: 10px 16px;
    border-radius: 8px;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    white-space: nowrap;
  }
  button:hover { filter: brightness(1.08); }
  button:disabled { opacity: 0.5; cursor: default; }
  button.secondary {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
  }
  .room-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 14px;
    background: #0d0f13;
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 8px;
  }
  .room-item .name { font-weight: 600; font-size: 14px; }
  .room-item .meta { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
  .code-badge {
    font-family: monospace;
    background: var(--accent-dim);
    color: var(--accent);
    padding: 3px 8px;
    border-radius: 6px;
    font-size: 12px;
    letter-spacing: 0.05em;
  }
  .empty {
    color: var(--text-dim);
    font-size: 13px;
    text-align: center;
    padding: 20px 0;
  }
  .toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
  }
  .toast.show { opacity: 1; }
  .toast.error { border-color: var(--danger); color: var(--danger); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>FM Web — Test Rooms</h1>
    <div class="sub">Page de test : creation / jonction de rooms</div>
    <div class="pseudo-box">
      Pseudo :
      <input type="text" id="pseudoInput" placeholder="ton pseudo">
      <button class="secondary" id="savePseudoBtn" style="padding:4px 10px;font-size:12px;">OK</button>
    </div>
  </header>

  <div class="card">
    <h2>Creer une room</h2>
    <div class="row">
      <input type="text" id="roomNameInput" placeholder="Nom de la room (ex: Ligue des potes)">
      <button id="createRoomBtn">Creer</button>
    </div>
  </div>

  <div class="card">
    <h2>Rejoindre une room</h2>
    <div class="row">
      <input type="text" id="joinCodeInput" placeholder="Code de la room (ex: A1B2C3)" style="text-transform:uppercase;">
      <button id="joinRoomBtn">Rejoindre</button>
    </div>
  </div>

  <div class="card">
    <h2>Mes rooms</h2>
    <div id="roomsList">
      <div class="empty">Chargement...</div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ============================================================
// CONFIG SUPABASE — remplace avec tes propres valeurs
// ============================================================
const SUPABASE_URL = "https://occesdpptttbwwjyuaja.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9jY2VzZHBwdHR0Ynd3anl1YWphIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI5MjQ1MTAsImV4cCI6MjA5ODUwMDUxMH0.iQxZFp1wIs9TzCqC7j-DjEUuxPBqK0Hgp6N_9aq7wss";

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ============================================================
// AUTH PSEUDO (UUID en localStorage, pas de vrai compte)
// ============================================================
function getUserId() {
  let id = localStorage.getItem("fm_user_id");
  if (!id) {
    id = crypto.randomUUID();
    localStorage.setItem("fm_user_id", id);
  }
  return id;
}

function getPseudo() {
  return localStorage.getItem("fm_pseudo") || "";
}

function setPseudo(p) {
  localStorage.setItem("fm_pseudo", p);
}

const userId = getUserId();

// ============================================================
// UI HELPERS
// ============================================================
function toast(msg, isError = false) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.className = "toast show" + (isError ? " error" : "");
  setTimeout(() => { el.className = "toast"; }, 2500);
}

function generateRoomCode() {
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; // sans caracteres ambigus
  let code = "";
  for (let i = 0; i < 6; i++) code += chars[Math.floor(Math.random() * chars.length)];
  return code;
}

// ============================================================
// INIT PSEUDO
// ============================================================
const pseudoInput = document.getElementById("pseudoInput");
pseudoInput.value = getPseudo();
document.getElementById("savePseudoBtn").addEventListener("click", () => {
  const val = pseudoInput.value.trim();
  if (!val) { toast("Entre un pseudo", true); return; }
  setPseudo(val);
  toast("Pseudo enregistre");
});

// ============================================================
// CREER UNE ROOM (table "games")
// ============================================================
document.getElementById("createRoomBtn").addEventListener("click", async () => {
  const name = document.getElementById("roomNameInput").value.trim();
  const pseudo = getPseudo();

  if (!pseudo) { toast("Definis d'abord ton pseudo", true); return; }
  if (!name) { toast("Donne un nom a la room", true); return; }

  const btn = document.getElementById("createRoomBtn");
  btn.disabled = true;

  try {
    const code = generateRoomCode();
    const { data: game, error: gameErr } = await supabase
      .from("games")
      .insert({ nom: name, code_invitation: code, created_by: userId })
      .select()
      .single();

    if (gameErr) throw gameErr;

    const { error: memberErr } = await supabase
      .from("games_participants")
      .insert({ game_id: game.id, user_id: userId, is_host: true });

    if (memberErr) throw memberErr;

    toast(`Room creee ! Code : ${code}`);
    document.getElementById("roomNameInput").value = "";
    loadRooms();
  } catch (e) {
    console.error(e);
    toast("Erreur lors de la creation : " + e.message, true);
  } finally {
    btn.disabled = false;
  }
});

// ============================================================
// REJOINDRE UNE ROOM (table "games")
// ============================================================
document.getElementById("joinRoomBtn").addEventListener("click", async () => {
  const code = document.getElementById("joinCodeInput").value.trim().toUpperCase();
  const pseudo = getPseudo();

  if (!pseudo) { toast("Definis d'abord ton pseudo", true); return; }
  if (!code) { toast("Entre un code de room", true); return; }

  const btn = document.getElementById("joinRoomBtn");
  btn.disabled = true;

  try {
    const { data: game, error: gameErr } = await supabase
      .from("games")
      .select()
      .eq("code_invitation", code)
      .single();

    if (gameErr || !game) { toast("Room introuvable pour ce code", true); return; }

    // Verifie si l'utilisateur est deja participant (pas d'upsert : on ne
    // suppose pas l'existence d'une contrainte unique sur game_id+user_id)
    const { data: existing } = await supabase
      .from("games_participants")
      .select("id")
      .eq("game_id", game.id)
      .eq("user_id", userId)
      .maybeSingle();

    if (!existing) {
      const { error: memberErr } = await supabase
        .from("games_participants")
        .insert({ game_id: game.id, user_id: userId, is_host: false });

      if (memberErr) throw memberErr;
    }

    toast(`Room "${game.nom}" rejointe !`);
    document.getElementById("joinCodeInput").value = "";
    loadRooms();
  } catch (e) {
    console.error(e);
    toast("Erreur en rejoignant : " + e.message, true);
  } finally {
    btn.disabled = false;
  }
});

// ============================================================
// LISTER MES ROOMS (table "games" via "games_participants")
// ============================================================
async function loadRooms() {
  const container = document.getElementById("roomsList");

  try {
    const { data: memberships, error } = await supabase
      .from("games_participants")
      .select("game_id, is_host, games(id, nom, code_invitation, statut, jour_actuel, saison)")
      .eq("user_id", userId);

    if (error) throw error;

    if (!memberships || memberships.length === 0) {
      container.innerHTML = '<div class="empty">Tu n\'as rejoint aucune room pour l\'instant.</div>';
      return;
    }

    container.innerHTML = memberships.map(m => {
      const g = m.games;
      if (!g) return "";
      return `
        <div class="room-item">
          <div>
            <div class="name">${escapeHtml(g.nom)} ${m.is_host ? "👑" : ""}</div>
            <div class="meta">Saison ${g.saison} · Jour ${g.jour_actuel} · ${escapeHtml(g.statut)}</div>
          </div>
          <div class="code-badge">${escapeHtml(g.code_invitation)}</div>
        </div>
      `;
    }).join("");
  } catch (e) {
    console.error(e);
    container.innerHTML = '<div class="empty">Erreur de chargement des rooms.</div>';
  }
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

// ============================================================
// INIT
// ============================================================
loadRooms();
</script>
</body>
</html>
