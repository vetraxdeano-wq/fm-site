<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FM Web — Test Rooms</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #262a33;
    --text: #e8eaed;
    --text-dim: #8b909c;
    --accent: #4ade80;
    --accent-dim: #1f6b42;
    --danger: #ef4444;
    --gold: #fbbf24;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    min-height: 100vh;
    padding: 24px 16px;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  header { margin-bottom: 24px; display: flex; justify-content: space-between; align-items: flex-start; }
  h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -0.02em; }
  .sub { color: var(--text-dim); font-size: 14px; }
  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; padding: 20px; margin-bottom: 16px;
  }
  .card h2 {
    font-size: 15px; margin: 0 0 14px; color: var(--text-dim);
    text-transform: uppercase; letter-spacing: 0.05em;
  }
  .row { display: flex; gap: 8px; }
  .col { display: flex; flex-direction: column; gap: 10px; }
  input[type=text], input[type=password] {
    flex: 1; background: #0d0f13; border: 1px solid var(--border); color: var(--text);
    padding: 10px 12px; border-radius: 8px; font-size: 14px;
  }
  input:focus { outline: none; border-color: var(--accent); }
  button {
    background: var(--accent); color: #06210f; border: none;
    padding: 10px 16px; border-radius: 8px; font-weight: 600;
    font-size: 14px; cursor: pointer; white-space: nowrap;
  }
  button:hover { filter: brightness(1.08); }
  button:disabled { opacity: 0.5; cursor: default; }
  button.secondary { background: transparent; border: 1px solid var(--border); color: var(--text); }
  button.gold { background: var(--gold); color: #3a2a00; }
  button.danger { background: transparent; border: 1px solid var(--danger); color: var(--danger); }
  button.danger:hover { background: var(--danger); color: #fff; }
  .tabs { display: flex; gap: 4px; margin-bottom: 16px; }
  .tab-btn {
    flex: 1; background: #0d0f13; border: 1px solid var(--border); color: var(--text-dim);
    padding: 8px; border-radius: 8px; font-size: 13px; font-weight: 600;
  }
  .tab-btn.active { background: var(--accent-dim); color: var(--accent); border-color: var(--accent); }
  .user-bar {
    display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--text-dim);
  }
  .room-item {
    padding: 12px 14px; background: #0d0f13; border: 1px solid var(--border);
    border-radius: 8px; margin-bottom: 8px;
  }
  .room-item-top { display: flex; justify-content: space-between; align-items: center; }
  .room-item .name { font-weight: 600; font-size: 14px; }
  .room-item .meta { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
  .code-badge {
    font-family: monospace; background: var(--accent-dim); color: var(--accent);
    padding: 3px 8px; border-radius: 6px; font-size: 12px; letter-spacing: 0.05em;
  }
  .host-actions { margin-top: 10px; display: flex; align-items: center; gap: 10px; }
  .participant-count { font-size: 12px; color: var(--text-dim); }
  .pseudo-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .pseudo-chip {
    background: #14171d; border: 1px solid var(--border); color: var(--text-dim);
    padding: 3px 6px 3px 9px; border-radius: 999px; font-size: 12px;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .kick-btn {
    background: transparent; border: none; color: var(--text-dim);
    padding: 0 2px; font-size: 12px; font-weight: 700; line-height: 1;
    cursor: pointer; border-radius: 999px;
  }
  .kick-btn:hover { color: var(--danger); }
  .start-hint { font-size: 11px; color: var(--text-dim); margin-top: 8px; line-height: 1.4; }
  .empty { color: var(--text-dim); font-size: 13px; text-align: center; padding: 20px 0; }
  .hidden { display: none !important; }
  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--panel); border: 1px solid var(--border); padding: 10px 18px;
    border-radius: 8px; font-size: 13px; opacity: 0; pointer-events: none; transition: opacity 0.2s;
    z-index: 100;
  }
  .toast.show { opacity: 1; }
  .toast.error { border-color: var(--danger); color: var(--danger); }
  .error-banner {
    background: #2a1414; border: 1px solid var(--danger); color: #fca5a5;
    padding: 10px 14px; border-radius: 8px; font-size: 12px; margin-bottom: 16px;
    font-family: monospace; white-space: pre-wrap; word-break: break-word;
  }

  /* ============ Modal "Creation du profil president" ============ */
  .pres-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6);
    display: flex; align-items: center; justify-content: center;
    z-index: 200; padding: 16px; overflow-y: auto;
  }
  .pres-overlay.hidden { display: none; }
  .pres-modal {
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    padding: 22px; width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto;
  }
  .pres-modal h2 { font-size: 17px; margin: 0 0 4px; }
  .pres-sub { color: var(--text-dim); font-size: 13px; margin-bottom: 18px; line-height: 1.4; }
  .pres-field { margin-bottom: 14px; }
  .pres-field label {
    display: block; font-size: 11px; color: var(--text-dim); margin-bottom: 6px;
    text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600;
  }
  .pres-field input {
    width: 100%; background: #0d0f13; border: 1px solid var(--border); color: var(--text);
    padding: 10px 12px; border-radius: 8px; font-size: 14px; font-family: inherit;
  }
  .pres-field input:focus { outline: none; border-color: var(--accent); }
  .pres-row2 { display: flex; gap: 10px; }
  .pres-row2 .pres-field { flex: 1; }
  .pres-age-hint { font-size: 12px; color: var(--accent); margin-top: 6px; min-height: 14px; }
  .pres-face-grid {
    display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin-top: 4px;
  }
  .pres-face-item {
    border: 2px solid var(--border); border-radius: 10px; background: #0d0f13; cursor: pointer;
    padding: 3px; display: flex; align-items: center; justify-content: center;
    aspect-ratio: 1; transition: border-color 0.15s, transform 0.1s;
  }
  .pres-face-item img { width: 100%; height: 100%; border-radius: 7px; display: block; }
  .pres-face-item:hover { border-color: var(--text-dim); }
  .pres-face-item.selected { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(74,222,128,0.25); }
  .pres-face-hint { font-size: 11px; color: var(--text-dim); margin-top: 8px; line-height: 1.4; }
  .pres-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
</style>
</head>
<body>
<div class="wrap">

  <div id="errorBanner" class="error-banner hidden"></div>

  <!-- ============ ECRAN AUTH ============ -->
  <div id="authScreen">
    <header>
      <div>
        <h1>FM Web</h1>
        <div class="sub">Connecte-toi pour acceder a tes rooms</div>
      </div>
    </header>

    <div class="tabs">
      <button class="tab-btn active" id="tabLogin">Se connecter</button>
      <button class="tab-btn" id="tabRegister">Creer un compte</button>
    </div>

    <div class="card">
      <div class="col">
        <input type="text" id="authPseudo" placeholder="Pseudo" autocomplete="username">
        <input type="password" id="authPassword" placeholder="Mot de passe" autocomplete="current-password">
        <button id="authSubmitBtn">Se connecter</button>
      </div>
    </div>
  </div>

  <!-- ============ ECRAN PRINCIPAL (une fois connecte) ============ -->
  <div id="mainScreen" class="hidden">
    <header>
      <div>
        <h1>FM Web — Rooms</h1>
        <div class="sub">Cree ou rejoins une partie</div>
      </div>
      <div class="user-bar">
        <span id="userPseudoLabel"></span>
        <button class="secondary" id="logoutBtn" style="padding:6px 10px;font-size:12px;">Deconnexion</button>
      </div>
    </header>

    <div class="card">
      <h2>Creer une room</h2>
      <div class="row">
        <input type="text" id="roomNameInput" placeholder="Nom de la room (ex: Ligue des potes)">
        <button id="createRoomBtn">Creer</button>
      </div>
    </div>

    <div class="card">
      <h2>Rejoindre une room</h2>
      <div class="row">
        <input type="text" id="joinCodeInput" placeholder="Code de la room (ex: A1B2C3)" style="text-transform:uppercase;">
        <button id="joinRoomBtn">Rejoindre</button>
      </div>
    </div>

    <div class="card">
      <h2>Mes rooms</h2>
      <div id="roomsList">
        <div class="empty">Chargement...</div>
      </div>
    </div>
  </div>

</div>

<!-- ============ MODAL CREATION DU PROFIL PRESIDENT ============ -->
<div class="pres-overlay hidden" id="presOverlay">
  <div class="pres-modal">
    <h2 id="presModalTitle">Cree ton president</h2>
    <div class="pres-sub" id="presModalSub">Ce sera le president que tu incarneras dans cette partie.</div>

    <div class="pres-row2">
      <div class="pres-field">
        <label for="presNomInput">Nom</label>
        <input type="text" id="presNomInput" placeholder="Ex : Dupont" autocomplete="off">
      </div>
      <div class="pres-field">
        <label for="presPrenomInput">Prenom</label>
        <input type="text" id="presPrenomInput" placeholder="Ex : Jean" autocomplete="off">
      </div>
    </div>

    <div class="pres-field">
      <label for="presDobInput">Date de naissance</label>
      <input type="date" id="presDobInput">
      <div class="pres-age-hint" id="presAgeHint"></div>
    </div>

    <div class="pres-field">
      <label>Visage</label>
      <div class="pres-face-grid" id="presFaceGrid"></div>
      <div class="pres-face-hint">Tu pourras en changer plus tard depuis l'onglet "Mon profil".</div>
    </div>

    <div class="pres-actions">
      <button class="secondary" id="presCancelBtn" type="button">Annuler</button>
      <button id="presConfirmBtn" type="button">Valider</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ============================================================
// CONFIG SUPABASE — remplace avec tes propres valeurs
// ============================================================
const SUPABASE_URL = "https://occesdpptttbwwjyuaja.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9jY2VzZHBwdHR0Ynd3anl1YWphIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI5MjQ1MTAsImV4cCI6MjA5ODUwMDUxMH0.iQxZFp1wIs9TzCqC7j-DjEUuxPBqK0Hgp6N_9aq7wss";

const EMAIL_DOMAIN = "fmweb.local"; // domaine bidon pour transformer pseudo -> email

let supabaseClient = null;
let userId = null;
let userPseudo = null;

function showFatalError(err) {
  const banner = document.getElementById("errorBanner");
  banner.textContent = "Erreur : " + (err && err.message ? err.message : String(err));
  banner.classList.remove("hidden");
  console.error(err);
}

try {
  if (!window.supabase) {
    throw new Error("La librairie Supabase (CDN) ne s'est pas chargee.");
  }
  supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
} catch (e) {
  showFatalError(e);
}

function pseudoToEmail(pseudo) {
  const clean = pseudo.trim().toLowerCase().replace(/[^a-z0-9_-]/g, "");
  return `${clean}@${EMAIL_DOMAIN}`;
}

function toast(msg, isError = false) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.className = "toast show" + (isError ? " error" : "");
  setTimeout(() => { el.className = "toast"; }, 2500);
}

function generateRoomCode() {
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let code = "";
  for (let i = 0; i < 6; i++) code += chars[Math.floor(Math.random() * chars.length)];
  return code;
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

// ============================================================
// AUTH : bascule entre les onglets Connexion / Creation de compte
// ============================================================
let authMode = "login"; // "login" | "register"

document.getElementById("tabLogin").addEventListener("click", () => {
  authMode = "login";
  document.getElementById("tabLogin").classList.add("active");
  document.getElementById("tabRegister").classList.remove("active");
  document.getElementById("authSubmitBtn").textContent = "Se connecter";
});

document.getElementById("tabRegister").addEventListener("click", () => {
  authMode = "register";
  document.getElementById("tabRegister").classList.add("active");
  document.getElementById("tabLogin").classList.remove("active");
  document.getElementById("authSubmitBtn").textContent = "Creer le compte";
});

document.getElementById("authSubmitBtn").addEventListener("click", async () => {
  const pseudo = document.getElementById("authPseudo").value.trim();
  const password = document.getElementById("authPassword").value;

  if (!pseudo || pseudo.length < 3) { toast("Pseudo trop court (3 caracteres min)", true); return; }
  if (!password || password.length < 6) { toast("Mot de passe trop court (6 caracteres min)", true); return; }

  const email = pseudoToEmail(pseudo);
  const btn = document.getElementById("authSubmitBtn");
  btn.disabled = true;

  try {
    if (authMode === "register") {
      const { data, error } = await supabaseClient.auth.signUp({
        email,
        password,
        options: { data: { pseudo } }
      });
      if (error) {
        if (error.message.toLowerCase().includes("already registered")) {
          toast("Ce pseudo est deja pris", true);
        } else {
          throw error;
        }
        return;
      }
      if (!data.session) {
        // Certains projets Supabase demandent une confirmation email meme
        // avec un faux domaine. Si c'est le cas, previens l'utilisateur.
        toast("Compte cree. Si la confirmation email est activee sur ton projet, desactive-la (Auth > Providers > Email > Confirm email = off).", true);
        return;
      }
      onAuthSuccess(data.user);
    } else {
      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) {
        toast("Pseudo ou mot de passe incorrect", true);
        return;
      }
      onAuthSuccess(data.user);
    }
  } catch (e) {
    console.error(e);
    toast("Erreur : " + e.message, true);
  } finally {
    btn.disabled = false;
  }
});

document.getElementById("logoutBtn").addEventListener("click", async () => {
  await supabaseClient.auth.signOut();
  userId = null;
  userPseudo = null;
  document.getElementById("authScreen").classList.remove("hidden");
  document.getElementById("mainScreen").classList.add("hidden");
});

function onAuthSuccess(user) {
  userId = user.id;
  userPseudo = user.user_metadata?.pseudo || "?";
  document.getElementById("userPseudoLabel").textContent = userPseudo;
  document.getElementById("authScreen").classList.add("hidden");
  document.getElementById("mainScreen").classList.remove("hidden");
  loadRooms();
}

// ============================================================
// PROFIL PRESIDENT — grille de visages, calcul d'age, modal
// (reutilise aussi dans dashboard.html, onglet Accueil > Mon profil)
// ============================================================
const PRES_FACE_SEEDS = [
  "Felix", "Aneka", "Milo", "Zoe", "Leo", "Nina",
  "Oscar", "Ines", "Adam", "Maya", "Tom", "Chloe",
  "Hugo", "Sara", "Nils", "Iris", "Marco", "Elena",
];

function presFaceUrl(seed) {
  return `https://api.dicebear.com/7.x/avataaars/svg?seed=${encodeURIComponent(seed)}&backgroundColor=1f6b42,262a33,0d0f13`;
}

function computeAgeFromDob(dobStr) {
  const dob = new Date(dobStr);
  if (isNaN(dob.getTime())) return null;
  const today = new Date();
  let age = today.getFullYear() - dob.getFullYear();
  const m = today.getMonth() - dob.getMonth();
  if (m < 0 || (m === 0 && today.getDate() < dob.getDate())) age--;
  return age;
}

let presSelectedFace = PRES_FACE_SEEDS[0];
let presPendingAction = null; // { type: "create", name } | { type: "join", gameId, gameName }

function renderPresFaceGrid() {
  const grid = document.getElementById("presFaceGrid");
  grid.innerHTML = PRES_FACE_SEEDS.map(seed => `
    <button type="button" class="pres-face-item ${seed === presSelectedFace ? "selected" : ""}" data-seed="${seed}">
      <img src="${presFaceUrl(seed)}" alt="Visage ${seed}" loading="lazy">
    </button>
  `).join("");
  grid.querySelectorAll(".pres-face-item").forEach(btn => {
    btn.addEventListener("click", () => {
      presSelectedFace = btn.getAttribute("data-seed");
      grid.querySelectorAll(".pres-face-item").forEach(b => b.classList.toggle("selected", b === btn));
    });
  });
}

function updatePresAgeHint() {
  const val = document.getElementById("presDobInput").value;
  const hint = document.getElementById("presAgeHint");
  if (!val) { hint.textContent = ""; return; }
  const age = computeAgeFromDob(val);
  hint.textContent = age !== null ? `${age} ans` : "";
}
document.getElementById("presDobInput").addEventListener("input", updatePresAgeHint);

function openPresidentModal(action, title, sub) {
  presPendingAction = action;
  presSelectedFace = PRES_FACE_SEEDS[Math.floor(Math.random() * PRES_FACE_SEEDS.length)];
  document.getElementById("presModalTitle").textContent = title;
  document.getElementById("presModalSub").textContent = sub;
  document.getElementById("presNomInput").value = "";
  document.getElementById("presPrenomInput").value = "";
  document.getElementById("presDobInput").value = "";
  document.getElementById("presAgeHint").textContent = "";
  renderPresFaceGrid();
  document.getElementById("presOverlay").classList.remove("hidden");
  document.getElementById("presNomInput").focus();
}

function closePresidentModal() {
  document.getElementById("presOverlay").classList.add("hidden");
  presPendingAction = null;
}

document.getElementById("presCancelBtn").addEventListener("click", closePresidentModal);

document.getElementById("presConfirmBtn").addEventListener("click", async () => {
  const nom = document.getElementById("presNomInput").value.trim();
  const prenom = document.getElementById("presPrenomInput").value.trim();
  const dob = document.getElementById("presDobInput").value;

  if (!nom) { toast("Entre un nom", true); return; }
  if (!prenom) { toast("Entre un prenom", true); return; }
  if (!dob) { toast("Entre une date de naissance", true); return; }
  const age = computeAgeFromDob(dob);
  if (age === null || age < 18 || age > 90) { toast("Date de naissance invalide (18 a 90 ans)", true); return; }
  if (!presPendingAction) { closePresidentModal(); return; }

  const presidentData = {
    president_nom: nom,
    president_prenom: prenom,
    president_date_naissance: dob,
    president_visage_url: presFaceUrl(presSelectedFace),
  };

  const btn = document.getElementById("presConfirmBtn");
  btn.disabled = true;
  try {
    if (presPendingAction.type === "create") {
      await actuallyCreateRoom(presPendingAction.name, presidentData);
    } else if (presPendingAction.type === "join") {
      await actuallyJoinRoom(presPendingAction.gameId, presPendingAction.gameName, presidentData);
    }
    closePresidentModal();
  } catch (e) {
    console.error(e);
    toast("Erreur : " + e.message, true);
  } finally {
    btn.disabled = false;
  }
});

// ============================================================
// CREER UNE ROOM
// ============================================================
document.getElementById("createRoomBtn").addEventListener("click", () => {
  const name = document.getElementById("roomNameInput").value.trim();
  if (!name) { toast("Donne un nom a la room", true); return; }

  openPresidentModal(
    { type: "create", name },
    "Cree ton president",
    `Tu vas creer la room "${name}". Cree le president que tu incarneras dans cette partie.`
  );
});

async function actuallyCreateRoom(name, presidentData) {
  const code = generateRoomCode();
  const { data: game, error: gameErr } = await supabaseClient
    .from("games")
    .insert({ nom: name, code_invitation: code, created_by: userId })
    .select()
    .single();

  if (gameErr) throw gameErr;

  const { error: memberErr } = await supabaseClient
    .from("game_participants")
    .insert({ game_id: game.id, user_id: userId, is_host: true, pseudo: userPseudo, ...presidentData });

  if (memberErr) throw memberErr;

  toast(`Room creee ! Generation du monde en cours (jusqu'a ~2 min)...`);
  document.getElementById("roomNameInput").value = "";
  loadRooms();
  startGenerationPolling();
}

// ============================================================
// REJOINDRE UNE ROOM
// ============================================================
document.getElementById("joinRoomBtn").addEventListener("click", async () => {
  const code = document.getElementById("joinCodeInput").value.trim().toUpperCase();
  if (!code) { toast("Entre un code de room", true); return; }

  const btn = document.getElementById("joinRoomBtn");
  btn.disabled = true;

  try {
    const { data: game, error: gameErr } = await supabaseClient
      .from("games")
      .select()
      .eq("code_invitation", code)
      .single();

    if (gameErr || !game) { toast("Room introuvable pour ce code", true); return; }

    const { data: existing } = await supabaseClient
      .from("game_participants")
      .select("id")
      .eq("game_id", game.id)
      .eq("user_id", userId)
      .maybeSingle();

    if (existing) {
      toast(`Room "${game.nom}" deja rejointe !`);
      document.getElementById("joinCodeInput").value = "";
      loadRooms();
      return;
    }

    document.getElementById("joinCodeInput").value = "";
    openPresidentModal(
      { type: "join", gameId: game.id, gameName: game.nom },
      "Cree ton president",
      `Tu vas rejoindre la room "${game.nom}". Cree le president que tu incarneras dans cette partie.`
    );
  } catch (e) {
    console.error(e);
    toast("Erreur en rejoignant : " + e.message, true);
  } finally {
    btn.disabled = false;
  }
});

async function actuallyJoinRoom(gameId, gameName, presidentData) {
  const { error: memberErr } = await supabaseClient
    .from("game_participants")
    .insert({ game_id: gameId, user_id: userId, is_host: false, pseudo: userPseudo, ...presidentData });

  if (memberErr) throw memberErr;

  toast(`Room "${gameName}" rejointe !`);
  loadRooms();
}

// ============================================================
// DEMARRER LA PARTIE (host uniquement)
// ============================================================
async function startGame(gameId, btnEl) {
  btnEl.disabled = true;
  try {
    const { count } = await supabaseClient
      .from("game_participants")
      .select("id", { count: "exact", head: true })
      .eq("game_id", gameId);

    if (!count || count < 2) {
      toast("Il faut au moins 2 joueurs pour demarrer", true);
      btnEl.disabled = false;
      return;
    }

    const { error } = await supabaseClient
      .from("games")
      .update({ statut: "mercato" })
      .eq("id", gameId);

    if (error) throw error;

    toast("Partie demarree !");
    loadRooms();
  } catch (e) {
    console.error(e);
    toast("Erreur au demarrage : " + e.message, true);
    btnEl.disabled = false;
  }
}

// ============================================================
// SUPPRIMER UNE ROOM (host uniquement)
// ============================================================
async function deleteGame(gameId, gameName, btnEl) {
  const sure = confirm(
    `Supprimer definitivement "${gameName}" ?\n\n` +
    `Ca supprime aussi tous les clubs/joueurs/staff copies pour cette partie, ` +
    `le calendrier, les evenements et les participants. Impossible a annuler.`
  );
  if (!sure) return;

  btnEl.disabled = true;
  try {
    const { error } = await supabaseClient
      .from("games")
      .delete()
      .eq("id", gameId);

    if (error) throw error;

    toast(`Room "${gameName}" supprimee`);
    loadRooms();
  } catch (e) {
    console.error(e);
    toast("Erreur lors de la suppression : " + e.message, true);
    btnEl.disabled = false;
  }
}

// ============================================================
// QUITTER UNE ROOM (participant non-host)
// ============================================================
async function leaveGame(gameId, gameName, btnEl) {
  const sure = confirm(`Quitter la room "${gameName}" ?`);
  if (!sure) return;

  btnEl.disabled = true;
  try {
    const { error } = await supabaseClient
      .from("game_participants")
      .delete()
      .eq("game_id", gameId)
      .eq("user_id", userId);

    if (error) throw error;

    toast(`Tu as quitte "${gameName}"`);
    loadRooms();
  } catch (e) {
    console.error(e);
    toast("Erreur en quittant la room : " + e.message, true);
    btnEl.disabled = false;
  }
}

// ============================================================
// KICKER UN PARTICIPANT (host uniquement)
// ============================================================
async function kickParticipant(gameId, targetUserId, targetPseudo, btnEl) {
  const sure = confirm(`Exclure "${targetPseudo}" de la room ?`);
  if (!sure) return;

  btnEl.disabled = true;
  try {
    const { error } = await supabaseClient
      .from("game_participants")
      .delete()
      .eq("game_id", gameId)
      .eq("user_id", targetUserId);

    if (error) throw error;

    toast(`"${targetPseudo}" a ete exclu de la room`);
    loadRooms();
  } catch (e) {
    console.error(e);
    toast("Erreur lors de l'exclusion : " + e.message, true);
    btnEl.disabled = false;
  }
}

// ============================================================
// GENERATION DU MONDE (asynchrone, via pg_cron cote base)
// ============================================================
let generationPollTimer = null;

function startGenerationPolling() {
  if (generationPollTimer) return; // deja en cours
  generationPollTimer = setInterval(async () => {
    await loadRooms();
  }, 5000);
}

function stopGenerationPolling() {
  if (generationPollTimer) {
    clearInterval(generationPollTimer);
    generationPollTimer = null;
  }
}

async function retryGeneration(gameId, btnEl) {
  btnEl.disabled = true;
  try {
    const { error } = await supabaseClient
      .from("games")
      .update({ monde_genere: false, monde_generation_erreur: null })
      .eq("id", gameId);

    if (error) throw error;

    toast("Nouvelle tentative de generation lancee...");
    loadRooms();
    startGenerationPolling();
  } catch (e) {
    console.error(e);
    toast("Erreur en relancant la generation : " + e.message, true);
    btnEl.disabled = false;
  }
}

// ============================================================
// LISTER MES ROOMS
// ============================================================
async function loadRooms() {
  const container = document.getElementById("roomsList");

  try {
    const { data: memberships, error } = await supabaseClient
      .from("game_participants")
      .select("game_id, is_host, games(id, nom, code_invitation, statut, jour_actuel, saison, monde_genere, monde_generation_erreur)")
      .eq("user_id", userId);

    if (error) throw error;

    if (!memberships || memberships.length === 0) {
      container.innerHTML = '<div class="empty">Tu n\'as rejoint aucune room pour l\'instant.</div>';
      return;
    }

    // Recupere TOUS les participants (avec pseudo) de toutes mes rooms en une requete
    const allGameIds = memberships.map(m => m.game_id);
    const { data: allParticipants } = await supabaseClient
      .from("game_participants")
      .select("game_id, user_id, pseudo, is_host")
      .in("game_id", allGameIds);

    const participantsByGame = {};
    (allParticipants || []).forEach(p => {
      if (!participantsByGame[p.game_id]) participantsByGame[p.game_id] = [];
      participantsByGame[p.game_id].push(p);
    });

    container.innerHTML = "";
    memberships.forEach(m => {
      const g = m.games;
      if (!g) return;

      const div = document.createElement("div");
      div.className = "room-item";

      const participants = participantsByGame[g.id] || [];
      const isGenerating = !g.monde_genere && !g.monde_generation_erreur;
      const hasError = !!g.monde_generation_erreur;
      const isReady = g.monde_genere && !hasError;
      const canStart = m.is_host && g.statut === "lobby" && isReady;
      const pseudosHtml = participants
        .map(p => {
          const kickable = m.is_host && p.user_id !== userId;
          const kickBtn = kickable
            ? `<button class="kick-btn" data-kick-game="${g.id}" data-kick-user="${p.user_id}" data-kick-pseudo="${escapeHtml(p.pseudo || "?")}" title="Kicker">✕</button>`
            : "";
          return `<span class="pseudo-chip">${p.is_host ? "👑 " : ""}${escapeHtml(p.pseudo || "?")}${kickBtn}</span>`;
        })
        .join("");

      let statusBannerHtml = "";
      if (isGenerating) {
        statusBannerHtml = `<div class="start-hint">⏳ Generation du monde en cours (clubs, joueurs, staff...) — jusqu'a 2 minutes. La page se met a jour toute seule.</div>`;
      } else if (hasError) {
        statusBannerHtml = `<div class="start-hint" style="color:#e05656">⚠️ Echec de la generation du monde : ${escapeHtml(g.monde_generation_erreur)}</div>`;
      }

      div.innerHTML = `
        <div class="room-item-top">
          <div>
            <div class="name">${escapeHtml(g.nom)} ${m.is_host ? "👑" : ""}</div>
            <div class="meta">Saison ${g.saison} · Jour ${g.jour_actuel} · ${escapeHtml(g.statut)}</div>
          </div>
          <div class="code-badge">${escapeHtml(g.code_invitation)}</div>
        </div>
        <div class="pseudo-list">${pseudosHtml}</div>
        <div class="host-actions">
          <button class="secondary" data-goto="${g.id}" ${isReady ? "" : "disabled"}>Acceder a la partie</button>
          ${canStart ? `<button class="gold" data-start="${g.id}">Demarrer la partie</button>` : ""}
          ${hasError && m.is_host ? `<button class="secondary" data-retry="${g.id}">Reessayer la generation</button>` : ""}
          ${m.is_host ? `<button class="danger" data-delete="${g.id}">Supprimer</button>` : `<button class="danger" data-leave="${g.id}">Quitter</button>`}
        </div>
        ${statusBannerHtml}
        ${canStart ? `<div class="start-hint">Demarre le decompte des jours (mercato, matchs...) pour tout le monde. A faire une fois que tous les joueurs attendus ont rejoint — impossible d'ajouter quelqu'un apres.</div>` : ""}
      `;

      container.appendChild(div);
    });

    // Polling automatique tant qu'au moins une room est en cours de generation
    if (memberships.some(m => m.games && !m.games.monde_genere && !m.games.monde_generation_erreur)) {
      startGenerationPolling();
    } else {
      stopGenerationPolling();
    }

    container.querySelectorAll("[data-start]").forEach(btn => {
      btn.addEventListener("click", () => startGame(btn.getAttribute("data-start"), btn));
    });
    container.querySelectorAll("[data-delete]").forEach(btn => {
      const id = btn.getAttribute("data-delete");
      const g = memberships.find(m => m.games && m.games.id === id)?.games;
      btn.addEventListener("click", () => deleteGame(id, g?.nom || "cette partie", btn));
    });
    container.querySelectorAll("[data-leave]").forEach(btn => {
      const id = btn.getAttribute("data-leave");
      const g = memberships.find(m => m.games && m.games.id === id)?.games;
      btn.addEventListener("click", () => leaveGame(id, g?.nom || "cette partie", btn));
    });
    container.querySelectorAll("[data-kick-user]").forEach(btn => {
      btn.addEventListener("click", () => kickParticipant(
        btn.getAttribute("data-kick-game"),
        btn.getAttribute("data-kick-user"),
        btn.getAttribute("data-kick-pseudo"),
        btn
      ));
    });
    container.querySelectorAll("[data-retry]").forEach(btn => {
      btn.addEventListener("click", () => retryGeneration(btn.getAttribute("data-retry"), btn));
    });
    container.querySelectorAll("[data-goto]").forEach(btn => {
      btn.addEventListener("click", () => {
        window.location.href = `dashboard.html?game=${btn.getAttribute("data-goto")}`;
      });
    });
  } catch (e) {
    console.error(e);
    container.innerHTML = '<div class="empty">Erreur de chargement des rooms.</div>';
  }
}

// INIT : verifie si une session existe deja

(async () => {
  if (!supabaseClient) return;
  try {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (session?.user) {
      onAuthSuccess(session.user);
    }
  } catch (e) {
    showFatalError(e);
  }
})();
</script>
