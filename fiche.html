<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FM Web — Fiche joueur</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-2: #1c2029;
    --border: #262a33;
    --text: #e8eaed;
    --text-dim: #8b909c;
    --accent: #4ade80;
    --gold: #fbbf24;
    --danger: #ef4444;
    --topbar-h: 60px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  #appRoot {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    background: var(--bg); z-index: 5;
  }

  .fm-header {
    display: flex; justify-content: space-between; align-items: center; flex-wrap: nowrap;
    gap: 14px; padding: 12px 22px; flex: 0 0 auto;
    background: linear-gradient(120deg, #4c1116, #7a1620 55%, #9c2430);
    border-bottom: 1px solid rgba(0,0,0,0.3);
  }
  .fm-header .title-block { display: flex; align-items: center; gap: 14px; min-width: 0; }
  .fm-header .back-link {
    color: rgba(255,255,255,0.75); text-decoration: none; font-size: 13px;
    flex-shrink: 0; padding-right: 14px; border-right: 1px solid rgba(255,255,255,0.2); white-space: nowrap;
  }
  .fm-header .back-link:hover { color: #fff; }
  .topbar-avatar {
    width: 38px; height: 38px; border-radius: 50%; flex: 0 0 auto;
    border: 2px solid rgba(255,255,255,0.3); overflow: hidden; background: var(--panel-2);
  }
  .topbar-avatar img, .topbar-avatar svg { width: 100%; height: 100%; display: block; }

  /* Le titre de la topbar est aussi un champ de recherche globale (clubs + joueurs),
     meme principe que sur dashboard.html : le nom du joueur s'affiche en placeholder. */
  .page-title-wrap { position: relative; min-width: 0; }
  .page-title-input {
    background: transparent; border: none; outline: none; color: #fff;
    font-size: 18px; font-weight: 800; letter-spacing: 0.02em; padding: 2px 0;
    width: 230px; max-width: 40vw; font-family: inherit;
  }
  .page-title-input::placeholder {
    color: rgba(255,255,255,0.92); font-weight: 800; opacity: 1;
  }
  .manager-line, .player-meta {
    font-size: 12px; color: rgba(255,255,255,0.78); margin-top: 2px; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }
  .fm-search-dropdown {
    position: absolute; top: calc(100% + 8px); left: 0; min-width: 300px; max-width: 380px;
    background: #14171d; border: 1px solid var(--border); border-radius: 10px;
    box-shadow: 0 12px 32px rgba(0,0,0,0.5); z-index: 200; max-height: 380px; overflow-y: auto;
  }
  .fm-search-dropdown.hidden { display: none !important; }
  .search-group-label {
    padding: 8px 12px 4px; font-size: 10px; text-transform: uppercase;
    letter-spacing: 0.05em; color: var(--text-dim);
  }
  .search-result-item {
    display: flex; align-items: center; gap: 10px; padding: 8px 12px; font-size: 13px;
    color: var(--text); cursor: pointer;
  }
  .search-result-item:hover { background: rgba(251,191,36,0.1); color: var(--gold); }
  .search-result-icon { flex-shrink: 0; font-size: 13px; }
  .search-result-sub { font-size: 11px; color: var(--text-dim); margin-top: 1px; }
  .search-empty { padding: 14px 12px; font-size: 12px; color: var(--text-dim); text-align: center; }

  .fm-header .right-block { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  .nav-arrows { display: flex; gap: 6px; }
  .nav-btn {
    background: rgba(0,0,0,0.28); border: 1px solid rgba(255,255,255,0.25); color: #fff;
    border-radius: 8px; width: 34px; height: 34px; cursor: pointer; font-size: 14px;
    display: flex; align-items: center; justify-content: center;
  }
  .nav-btn:hover:not(:disabled) { background: rgba(0,0,0,0.4); }
  .nav-btn:disabled { opacity: 0.35; cursor: default; }
  .fm-date-badge {
    background: rgba(0,0,0,0.28); border-radius: 8px; padding: 7px 14px;
    text-align: right; line-height: 1.35; color: #fff;
  }
  .fm-date-badge .day-num { font-size: 13px; font-weight: 800; white-space: nowrap; }
  .fm-date-badge .season-line { font-size: 11px; color: rgba(255,255,255,0.7); }

  .fm-body { flex: 1; display: flex; align-items: stretch; min-height: 0; }
  .fm-sidebar {
    width: 220px; flex-shrink: 0; background: var(--panel); border-right: 1px solid var(--border);
    overflow-y: auto; padding: 10px 0;
  }
  .fm-nav-item {
    display: flex; align-items: center; gap: 12px; padding: 12px 20px; font-size: 13.5px;
    color: var(--text-dim); cursor: pointer; border-left: 3px solid transparent; user-select: none;
  }
  .fm-nav-item:hover { background: rgba(255,255,255,0.03); color: var(--text); }
  .fm-nav-item.active {
    background: rgba(251,191,36,0.08); color: var(--gold); border-left-color: var(--gold); font-weight: 700;
  }
  .fm-nav-icon { width: 18px; text-align: center; flex-shrink: 0; }

  .fm-content-wrap {
    flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; overflow: hidden;
  }

  @media (max-width: 900px) {
    .fm-header { padding: 10px 14px; }
    .fm-header .back-link { display: none; }
    .fm-body { flex-direction: column; }
    .fm-sidebar {
      width: 100%; height: auto; flex-shrink: 0; display: flex; overflow-x: auto;
      overflow-y: hidden; padding: 4px; border-right: none; border-bottom: 1px solid var(--border);
    }
    .fm-nav-item { border-left: none; border-bottom: 3px solid transparent; white-space: nowrap; }
    .fm-nav-item.active { border-left-color: transparent; border-bottom-color: var(--gold); }
    .fm-content-wrap { overflow-y: auto; }
  }

  .wrap {
    flex: 1 1 auto;
    width: 100%;
    margin: 0;
    padding: clamp(10px, 1.4vw, 20px);
    display: grid;
    gap: clamp(10px, 1.2vw, 18px);
    grid-template-columns: minmax(240px, 320px) minmax(0, 1fr) minmax(260px, 380px);
    grid-template-rows: auto auto auto;
    grid-template-areas:
      "identity attrs radar"
      "postes   attrs radar"
      "footer   footer footer";
    align-items: stretch;
  }
  @media (max-width: 1300px) {
    .wrap {
      grid-template-columns: 1fr 1fr;
      grid-template-areas:
        "identity radar"
        "postes   radar"
        "attrs    attrs"
        "footer   footer";
    }
  }
  @media (max-width: 800px) {
    .wrap {
      grid-template-columns: 1fr;
      grid-template-areas:
        "identity"
        "attrs"
        "postes"
        "radar"
        "footer";
    }
  }
  .hidden { display: none !important; }

  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; padding: 16px 18px;
    display: flex; flex-direction: column; min-width: 0;
  }
  .card h3 {
    margin: 0 0 14px 0; font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--text-dim); font-weight: 600;
  }

  .area-identity { grid-area: identity; }
  .area-postes { grid-area: postes; }
  .area-radar { grid-area: radar; }
  .area-footer { grid-area: footer; display: grid; grid-template-columns: 1.1fr 1fr; gap: clamp(10px,1.2vw,18px); }
  @media (max-width: 980px) { .area-footer { grid-template-columns: 1fr; } }

  /* --- Attributs : écran le plus important, mis en valeur --- */
  .area-attrs {
    grid-area: attrs;
    background: linear-gradient(180deg, rgba(74,222,128,0.06), var(--panel) 40%);
    border: 1px solid rgba(74,222,128,0.35);
    box-shadow: 0 0 0 1px rgba(74,222,128,0.05), 0 12px 28px rgba(0,0,0,0.35);
  }
  .attrs-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 4px; }
  .attrs-head h3 { margin: 0; font-size: 14px; color: var(--accent); letter-spacing: 0.06em; }
  .poste-select-label {
    font-size: 12px; color: var(--gold); font-weight: 600; background: rgba(251,191,36,0.1);
    border: 1px solid rgba(251,191,36,0.3); padding: 3px 10px; border-radius: 20px;
  }
  .poste-select-label.empty { color: var(--text-dim); background: transparent; border-color: var(--border); }
  .attrs-legend { display: flex; gap: 14px; font-size: 11px; color: var(--text-dim); margin: 6px 0 14px; flex-wrap: wrap; }
  .attrs-legend span { display: inline-flex; align-items: center; gap: 5px; }
  .legend-dot { width: 9px; height: 9px; border-radius: 3px; display: inline-block; }
  .legend-dot.major { background: var(--accent); }
  .legend-dot.minor { background: var(--gold); }

  .attrs-cols { display: grid; grid-template-columns: repeat(3, 1fr); gap: clamp(10px,1.6vw,22px); flex: 1; }
  @media (max-width: 1500px) and (min-width: 1301px) { .attrs-cols { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 700px) { .attrs-cols { grid-template-columns: 1fr; } }
  .attrs-cols h4 { margin: 0 0 6px 0; font-size: 12.5px; color: var(--text); text-transform: uppercase; letter-spacing: 0.04em; border-bottom: 1px solid var(--border); padding-bottom: 6px; }

  .attr-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 5px 8px; font-size: 13.5px; border-radius: 6px; margin: 1px 0;
    transition: background 0.15s;
  }
  .attr-name { color: var(--text-dim); }
  .attr-val { font-weight: 700; min-width: 22px; text-align: right; }
  .attr-high { color: var(--accent); }
  .attr-mid { color: var(--text); }
  .attr-low { color: var(--text-dim); }

  .attr-row.stat-major {
    background: rgba(74,222,128,0.16);
    box-shadow: inset 3px 0 0 var(--accent);
  }
  .attr-row.stat-major .attr-name { color: #d8f9e4; font-weight: 700; }
  .attr-row.stat-minor {
    background: rgba(251,191,36,0.10);
    box-shadow: inset 3px 0 0 var(--gold);
  }
  .attr-row.stat-minor .attr-name { color: #fde8b4; font-weight: 600; }

  /* --- Identité / photo --- */
  .player-photo-wrap { width: 100%; aspect-ratio: 1 / 1; border-radius: 10px; overflow: hidden; border: 1px solid var(--border); background: var(--panel-2); margin-bottom: 14px; }
  .player-photo-wrap img, .player-photo-wrap svg { width: 100%; height: 100%; display: block; object-fit: cover; }

  .identity-row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 13px; border-bottom: 1px solid var(--border); }
  .identity-row:last-child { border-bottom: none; }
  .identity-label { color: var(--text-dim); }
  .identity-value { font-weight: 600; text-align: right; }
  .nat-chip {
    display: inline-flex; align-items: center; gap: 5px; background: #14171d; border: 1px solid var(--border);
    padding: 2px 6px; border-radius: 5px;
  }
  .flag-icon { width: 18px; height: auto; display: block; border-radius: 2px; }
  .poste-chip {
    display: inline-block; background: rgba(74,222,128,0.1); border: 1px solid rgba(74,222,128,0.3);
    color: var(--accent); font-size: 11px; padding: 2px 7px; border-radius: 5px; font-weight: 600; margin: 2px 2px 0 0;
    cursor: pointer;
  }
  .poste-chip:hover { background: rgba(74,222,128,0.22); }
  .status-chip {
    display: inline-block; background: rgba(251,191,36,0.12); border: 1px solid rgba(251,191,36,0.35);
    color: var(--gold); font-size: 11px; padding: 2px 7px; border-radius: 5px; font-weight: 600;
  }
  .fit-chip {
    display: inline-block; font-size: 11px; padding: 2px 7px; border-radius: 5px; font-weight: 600;
  }
  .fit-ok { background: rgba(74,222,128,0.12); border: 1px solid rgba(74,222,128,0.35); color: var(--accent); }
  .fit-bad { background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.35); color: var(--danger); }

  .radar-wrap { display: flex; flex-direction: column; align-items: center; gap: 14px; flex: 1; justify-content: center; }
  #radarHolder { width: 100%; max-width: 380px; }
  #radarHolder svg { width: 100%; height: auto; display: block; }
  .stars-row { display: flex; justify-content: space-between; width: 100%; font-size: 12px; padding: 4px 0; align-items: center; }
  .stars { position: relative; display: inline-block; font-size: 14px; letter-spacing: 2px; line-height: 1; }
  .stars-bg { color: var(--border); }
  .stars-fg { position: absolute; top: 0; left: 0; overflow: hidden; white-space: nowrap; color: var(--gold); }
  .stars.locked .stars-bg { color: #30343e; }
  .locked-hint { font-size: 10px; color: var(--text-dim); cursor: help; }

  .feet-row { display: flex; gap: 18px; justify-content: center; margin-top: 4px; }
  .foot-block { text-align: center; }
  .foot-label { font-size: 11px; color: var(--text-dim); margin-top: 4px; }
  .foot-level { font-size: 11px; font-weight: 600; }

  .contract-row { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  .contract-row:last-child { border-bottom: none; }
  .contract-label { color: var(--text-dim); }
  .contract-value { font-weight: 600; }
  .contract-soon { color: var(--danger); }

  .bar-row { margin-bottom: 12px; }
  .bar-head { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 4px; }
  .bar-label { color: var(--text-dim); }
  .bar-track { height: 6px; border-radius: 4px; background: var(--panel-2); border: 1px solid var(--border); overflow: hidden; }
  .bar-fill { height: 100%; background: var(--accent); }
  .bar-fill.risk { background: var(--gold); }
  .bar-fill.bad { background: var(--danger); }

  .pitch-holder { display: flex; justify-content: center; }
  .pitch-cell, .pitch-gk { cursor: pointer; transition: filter 0.12s; }
  .pitch-cell:hover, .pitch-gk:hover { filter: brightness(1.35); }
  .pitch-cell.selected, .pitch-gk.selected { stroke: #60a5fa !important; stroke-width: 3 !important; }

  .empty-state { text-align: center; color: var(--text-dim); font-size: 14px; padding: 60px 20px; }

  /* --- Mise à l'échelle globale : au lieu de compresser l'intérieur de chaque module,
     on réduit tout l'ensemble (topbar + contenu) proportionnellement pour que ça tienne
     sans scroll sur les résolutions plus modestes. Calculé en JS (fitScale). --- */
  #scaleOuter {
    flex: 1 1 auto; display: flex; flex-direction: column; align-items: center;
    overflow: hidden; width: 100%; min-height: 0;
  }
  #scaleRoot { width: 100%; transform-origin: top center; flex: 0 0 auto; }
  @media (max-width: 900px) { #scaleOuter { overflow: visible; } }

  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--panel); border: 1px solid var(--border); padding: 10px 18px;
    border-radius: 8px; font-size: 13px; opacity: 0; pointer-events: none; transition: opacity 0.2s;
    z-index: 100;
  }
  .toast.show { opacity: 1; }
  .toast.error { border-color: var(--danger); color: var(--danger); }
</style>
</head>
<body>

<div id="appRoot">
  <div class="fm-header" id="fmHeader">
    <div class="title-block">
      <a href="#" id="backLink" class="back-link">← Retour</a>
      <div class="topbar-avatar" id="topbarAvatar"></div>
      <div class="page-title-wrap" id="fmSearchWrap">
        <input type="text" class="page-title-input" id="fmSearchInput" placeholder="Chargement..." autocomplete="off">
        <div class="fm-search-dropdown hidden" id="fmSearchDropdown"></div>
        <div class="manager-line" id="playerMeta"></div>
      </div>
    </div>
    <div class="right-block">
      <div class="nav-arrows">
        <button class="nav-btn" id="prevBtn" title="Joueur précédent">◀</button>
        <button class="nav-btn" id="nextBtn" title="Joueur suivant">▶</button>
      </div>
      <div class="fm-date-badge">
        <div class="day-num" id="fmDateLabel">Jour -</div>
        <div class="season-line" id="fmSeasonLabel">Saison -</div>
      </div>
    </div>
  </div>

  <div class="fm-body">
    <div class="fm-sidebar" id="fmSidebar"></div>

    <div class="fm-content-wrap">
      <div id="scaleOuter">
      <div id="scaleRoot">

      <div class="wrap" id="content">
  <div class="card area-identity">
    <div class="player-photo-wrap" id="playerPhotoWrap"></div>
    <h3>Identité</h3>
    <div id="identityRows"></div>
    <div class="feet-row" id="feetRow"></div>
  </div>

  <div class="card area-attrs">
    <div class="attrs-head">
      <h3>Attributs</h3>
      <span class="poste-select-label" id="selectedPosteLabel">Cliquez sur un poste du terrain</span>
    </div>
    <div class="attrs-legend">
      <span><span class="legend-dot major"></span> Stat majeure pour le poste sélectionné</span>
      <span><span class="legend-dot minor"></span> Stat importante pour le poste sélectionné</span>
    </div>
    <div class="attrs-cols" id="attrsCols"></div>
  </div>

  <div class="card area-postes">
    <h3>Postes</h3>
    <div class="pitch-holder" id="pitchHolder"></div>
    <div id="posteChips" style="margin-top:10px"></div>
  </div>

  <div class="card area-radar">
    <h3>Profil global</h3>
    <div class="radar-wrap">
      <div id="radarHolder"></div>
      <div style="width:100%">
        <div class="stars-row"><span>Niveau actuel</span><span id="starsCA"></span></div>
        <div class="stars-row"><span>Potentiel</span><span id="starsPotentiel"></span></div>
        <div class="stars-row"><span>Réputation mondiale</span><span id="starsRep"></span></div>
      </div>
    </div>
  </div>

  <div class="area-footer">
    <div class="card">
      <h3>Contrat &amp; valeur</h3>
      <div id="contractRows"></div>
    </div>

    <div class="card">
      <h3>Condition</h3>
      <div id="conditionRows"></div>
    </div>
  </div>
</div>

      </div>
      </div>

      <div id="emptyState" class="empty-state hidden">Joueur introuvable.</div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = "https://occesdpptttbwwjyuaja.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9jY2VzZHBwdHR0Ynd3anl1YWphIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI5MjQ1MTAsImV4cCI6MjA5ODUwMDUxMH0.iQxZFp1wIs9TzCqC7j-DjEUuxPBqK0Hgp6N_9aq7wss";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const params = new URLSearchParams(window.location.search);
const gameId = params.get("game");
const playerId = params.get("player");
let clubIdParam = params.get("club");

function toast(msg, isError = false) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.className = "toast show" + (isError ? " error" : "");
  setTimeout(() => { el.className = "toast"; }, 2500);
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str ?? "";
  return div.innerHTML;
}

// ---------- Date réelle de la partie (identique à dashboard.html) ----------
function computeRealDate(dateDebut, jourActuel) {
  if (!dateDebut) return null;
  const base = new Date(`${dateDebut}T00:00:00`);
  if (isNaN(base.getTime())) return null;
  const jours = Number(jourActuel);
  base.setDate(base.getDate() + (Number.isFinite(jours) ? jours : 0));
  return base;
}
function formatRealDate(date) {
  if (!date) return null;
  return new Intl.DateTimeFormat("fr-FR", {
    day: "2-digit", month: "long", year: "numeric",
  }).format(date).toUpperCase();
}
function renderFmDateBadge(game) {
  if (!game) return;
  const realDate = computeRealDate(game.date_debut, game.jour_actuel);
  const dateLabel = formatRealDate(realDate) || `Jour ${game.jour_actuel ?? "-"}`;
  document.getElementById("fmDateLabel").textContent = dateLabel;
  document.getElementById("fmSeasonLabel").textContent = `Saison ${game.saison ?? "-"}`;
}

// ---------- Sidebar de navigation FM (identique à dashboard.html) ----------
const FM_NAV_ITEMS = [
  { key: "accueil", icon: "🏠", label: "Accueil", href: "dashboard.html" },
  { key: "messagerie", icon: "📬", label: "Boîte de réception", href: null },
  { key: "effectif", icon: "👥", label: "Effectif", href: "squad.html" },
  { key: "staff", icon: "💼", label: "Staff", href: null },
  { key: "tactique", icon: "♟️", label: "Tactique", href: null },
  { key: "datacenter", icon: "📊", label: "Data Center", href: null },
  { key: "basejoueurs", icon: "🗂️", label: "Base de données de joueurs", href: "dashboard.html" },
  { key: "infosclub", icon: "🛡️", label: "Infos club", href: "club.html" },
  { key: "competitions", icon: "🏆", label: "Compétitions", href: null },
];
function renderFmSidebar(clubId) {
  const el = document.getElementById("fmSidebar");
  el.innerHTML = FM_NAV_ITEMS.map(item => `
    <div class="fm-nav-item ${item.key === "effectif" ? "active" : ""}" data-key="${item.key}">
      <span class="fm-nav-icon">${item.icon}</span>
      <span>${item.label}</span>
    </div>
  `).join("");

  el.querySelectorAll(".fm-nav-item").forEach(row => {
    const item = FM_NAV_ITEMS.find(i => i.key === row.getAttribute("data-key"));
    row.addEventListener("click", () => {
      if (item.key === "effectif") {
        window.location.href = `squad.html?game=${encodeURIComponent(gameId)}&club=${encodeURIComponent(clubId || "")}`;

      } else {

      }
    });
  });
}

function formatMoneyShort(n) {
  if (n === null || n === undefined) return "-";
  if (Math.abs(n) >= 1000000) return (n / 1000000).toLocaleString("fr-FR", { maximumFractionDigits: 1 }) + " M€";
  if (Math.abs(n) >= 1000) return (n / 1000).toLocaleString("fr-FR", { maximumFractionDigits: 0 }) + " k€";
  return new Intl.NumberFormat("fr-FR").format(n) + " €";
}
function roundStep(n) {
  if (n < 500000) return 50000;
  if (n < 2000000) return 100000;
  if (n < 10000000) return 500000;
  if (n < 50000000) return 1000000;
  if (n < 150000000) return 5000000;
  return 10000000;
}
function valueRange(v) {
  if (v === null || v === undefined) return "-";
  const step = roundStep(v);
  const low = Math.max(0, Math.round((v * 0.85) / step) * step);
  const high = Math.round((v * 1.15) / step) * step;
  if (low === high) return formatMoneyShort(low);
  return `${formatMoneyShort(low)} - ${formatMoneyShort(high)}`;
}

function formatDate(d) {
  if (!d) return "-";
  return new Date(d).toLocaleDateString("fr-FR", { day: "2-digit", month: "short", year: "numeric" });
}
function ageFromDob(dob) {
  if (!dob) return "-";
  const b = new Date(dob), now = new Date();
  let age = now.getFullYear() - b.getFullYear();
  const m = now.getMonth() - b.getMonth();
  if (m < 0 || (m === 0 && now.getDate() < b.getDate())) age--;
  return age;
}

function getStatsKey(base, side) {
  if (base === "D") return side === "C" ? "DC" : "D_WIDE";

function labelForToken(base, side) {
  const names = {

    MO: "Milieu offensif", BT: "Buteur", GB: "Gardien",
  };
  const sideNames = { G: "Gauche", C: "Central(e)", D: "Droit" };
  if (base === "GB") return "Gardien (GB)";
  const code = base + (side || "");
  return `${names[base] || base} ${side ? sideNames[side] || "" : ""} (${code})`.replace(/\s+/g," ").trim();

function attrValClass(v) {

  }).join("");

}
// list: paires [cle] ou [cle, poids] (poids par defaut = 1). Moyenne ponderee des stats renseignees.
function avgOf(list, data) {
  let sum = 0, wsum = 0;
  list.forEach(([key, weight]) => {
    const v = data[key];
    if (v === null || v === undefined) return;
    const w = weight ?? 1;
    sum += v * w;
    wsum += w;
  });
  return wsum ? sum / wsum : 0;
}

function selectPositionByTokens(tokens) {

// ---------- Radar SVG 8 axes ----------
// Ordre imposé (sens horaire depuis le haut) : Défense, Physique, Vitesse, Vision du jeu, Attaque, Technique, Jeu aérien, Mental.
//
// Note sur l'échelle : les attributs vont techniquement de 1 à 20 mais dans les faits
// tournent presque toujours entre ~3 et ~19. Une projection lineaire brute (valeur/20)
// ecrase donc les ecarts reels au milieu de l'echelle : un point faible a 7 ne "rentre"
// presque pas par rapport a un profil moyen a 11-12. RADAR_MIN/RADAR_MAX etirent la
// plage utile sur tout le rayon du graphique pour que les points faibles se voient
// vraiment, et RADAR_GAMMA accentue encore un peu l'ecart autour du centre du graphique.
const RADAR_MIN = 3, RADAR_MAX = 19, RADAR_GAMMA = 1.15;
function radarNormalize(value) {
  const t = (value - RADAR_MIN) / (RADAR_MAX - RADAR_MIN);
  const clamped = Math.max(0, Math.min(1, t));
  return Math.pow(clamped, RADAR_GAMMA);
}

function radarSVG(axes) {
  const size = 340, cx = size / 2, cy = size / 2, maxR = 118;
  const n = axes.length;
  const angleFor = i => -Math.PI / 2 + i * (2 * Math.PI / n);
  const pt = (r, i) => [cx + r * Math.cos(angleFor(i)), cy + r * Math.sin(angleFor(i))];

  let grid = "";
  [0.25, 0.5, 0.75, 1].forEach(frac => {
    const pts = axes.map((_, i) => pt(maxR * frac, i).join(",")).join(" ");
    grid += `<polygon points="${pts}" fill="none" stroke="#262a33" stroke-width="1"/>`;
  });
  let spokes = "";
  axes.forEach((_, i) => {
    const [x, y] = pt(maxR, i);
    spokes += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#262a33" stroke-width="1"/>`;
  });

  const valuePts = axes.map((a, i) => pt(maxR * radarNormalize(a.value), i).join(",")).join(" ");
  const shape = `<polygon points="${valuePts}" fill="rgba(74,222,128,0.25)" stroke="#4ade80" stroke-width="2"/>`;

  let labels = "";
  axes.forEach((a, i) => {
    const [x, y] = pt(maxR + 30, i);
    labels += `<text x="${x}" y="${y}" fill="#8b909c" font-size="12" text-anchor="middle" dominant-baseline="middle">${escapeHtml(a.label)}</text>`;
  });

  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${grid}${spokes}${shape}${labels}</svg>`;
}

// Catégories composites (approximation maison faute de formules officielles de rôle en base).
// Chaque entrée est [cle, poids] : les stats vraiment caractéristiques de l'axe pèsent plus
// lourd que les stats périphériques ou déjà comptabilisées ailleurs (ex: "puissance" compte
// pour Physique ET Jeu aérien, mais avec un poids réduit sur ce second axe pour ne pas
// diluer l'impact du jeu de tête / de la détente verticale).
function buildRadarAxes(gp) {
  return [
    { label: "Défense", value: avgOf([
      ["tacles",1.4],["marquage",1.4],["anticipation",1],["placement",1.2],["agressivite",0.6],
    ], gp) },
    { label: "Physique", value: avgOf([
      ["endurance",1],["equilibre",0.8],["puissance",1],["qualite_physique_naturelle",1.2],
    ], gp) },
    { label: "Vitesse", value: avgOf([
      ["acceleration",1.3],["vitesse",1.3],["agilite",0.8],
    ], gp) },
    { label: "Vision du jeu", value: avgOf([
      ["vision_du_jeu",1.5],["passes",1.2],["inspiration",0.7],
    ], gp) },
    { label: "Attaque", value: avgOf([
      ["finition",1.5],["appels_de_balle",1],["tir_de_loin",1],["penalty",0.4],
    ], gp) },
    { label: "Technique", value: avgOf([
      ["technique",1.8],["controle_de_balle",1.8],["dribbles",1.6],
      ["centres",0.45],["corners",0.3],["coup_franc",0.3],["touche_longues",0.3],
    ], gp) },
    { label: "Jeu aérien", value: avgOf([
      ["jeu_de_tete",1.7],["detente_verticale",1.5],["puissance",0.5],
    ], gp) },
    { label: "Mental", value: avgOf([

      ["determination",1],["jeu_collectif",1],["leadership",0.8],["courage",0.8],
      ["volume_de_jeu",0.9],["agressivite",0.6],
    ], gp) },
  ];
}

      fill="none" stroke="#262a33" stroke-width="1.5"/>
    <line x1="14" y1="35" x2="14" y2="40" stroke="#262a33" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="24" y1="35" x2="24" y2="40" stroke="#262a33" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="34" y1="35" x2="34" y2="40" stroke="#262a33" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="44" y1="35" x2="44" y2="40" stroke="#262a33" stroke-width="2.5" stroke-linecap="round"/>
  </svg>`;
}

// ---------- Petit terrain de postes (cliquable) ----------
const BASE_TO_ROW = { D: 0, AL: 1, MD: 1, M: 2, MO: 3, BT: 4 };
const COL_FROM_LETTER = { G: 0, C: 1, D: 2 };
const LETTER_FROM_COL = ["G", "C", "D"];
function parsePosteToken(token) {
  const t = token.trim();
  if (t === "GB") return { isGK: true };
  const m = t.match(/^([A-Za-zÀ-ÿ/]+?)(?:\s*\(([A-ZÀ-Ÿ]+)\))?$/);
  if (!m) return null;
  const bases = m[1].split("/").map(s => s.trim()).filter(Boolean);
  const sides = (m[2] || "C").split("");
  return { bases, sides };
}
// Base "par défaut" pour explorer une case même si le joueur n'y joue pas.
function defaultBaseForCell(row, col) {
  const side = LETTER_FROM_COL[col];
  if (row === 0) return "D";
  if (row === 1) return side === "C" ? "MD" : "AL";
  if (row === 2) return "M";
  if (row === 3) return "MO";
  return "BT";
}
// MD et BT n'existent jamais avec un cote (G/D) dans les donnees : meme si
// la case cliquee est sur une colonne laterale de leur ligne, on force un
// cote central pour ne pas fabriquer un poste qui n'existe pas ("Milieu
// defensif Droit", "Buteur Gauche"...).
const CENTER_ONLY_BASES = new Set(["MD", "BT"]);
function defaultSideForCell(row, col) {
  const base = defaultBaseForCell(row, col);
  return CENTER_ONLY_BASES.has(base) ? "C" : LETTER_FROM_COL[col];
}

let pitchCellTokens = null; // grille [row][col] -> tableau de {base, side}
let pitchGKActive = false;
let selectedCellKey = null;

function handlePitchCellClick(row, col) {
  const key = `${row}-${col}`;
  const svg = document.getElementById("pitchHolder").querySelector("svg");
  if (svg) svg.querySelectorAll(".pitch-cell, .pitch-gk").forEach(el => el.classList.remove("selected"));
  if (selectedCellKey === key) {
    selectedCellKey = null;
    applyStatHighlight(null);
    return;
  }
  selectedCellKey = key;
  if (svg) {
    const target = svg.querySelector(`[data-cellkey="${key}"]`);
    if (target) target.classList.add("selected");
  }
  const tokens = (pitchCellTokens && pitchCellTokens[row] && pitchCellTokens[row][col] && pitchCellTokens[row][col].length)
    ? pitchCellTokens[row][col]
    : [{ base: defaultBaseForCell(row, col), side: defaultSideForCell(row, col) }];
  selectPositionByTokens(tokens);
}
function handlePitchGKClick() {
  const key = "gk";
  const svg = document.getElementById("pitchHolder").querySelector("svg");
  if (svg) svg.querySelectorAll(".pitch-cell, .pitch-gk").forEach(el => el.classList.remove("selected"));
  if (selectedCellKey === key) {
    selectedCellKey = null;
    applyStatHighlight(null);
    return;
  }
  selectedCellKey = key;
  if (svg) {
    const target = svg.querySelector('[data-cellkey="gk"]');
    if (target) target.classList.add("selected");
  }
  selectPositionByTokens([{ base: "GB", side: null }]);
}

function pitchSVG(postes) {
  const grid = [[false, false, false], [false, false, false], [false, false, false], [false, false, false], [false, false, false]];
  const cellTokens = [[[], [], []], [[], [], []], [[], [], []], [[], [], []], [[], [], []]];
  let isGK = false;
  (postes || []).forEach(token => {
    const parsed = parsePosteToken(token);
    if (!parsed) return;
    if (parsed.isGK) { isGK = true; return; }
    parsed.bases.forEach(base => {
      const row = BASE_TO_ROW[base];
      if (row === undefined) return;
      parsed.sides.forEach(side => {
        const col = COL_FROM_LETTER[side];
        if (col === undefined) return;
        grid[row][col] = true;
        cellTokens[row][col].push({ base, side });
      });
    });
  });
  pitchCellTokens = cellTokens;
  pitchGKActive = isGK;

  const w = 200, h = 290;
  const colX = [44, 100, 156];
  const rowY = [232, 187, 142, 97, 52];

  let cells = "";
  for (let r = 0; r < 5; r++) {
    for (let c = 0; c < 3; c++) {
      const active = grid[r][c];
      cells += `<rect class="pitch-cell" data-cellkey="${r}-${c}" onclick="handlePitchCellClick(${r},${c})"
        x="${colX[c] - 15}" y="${rowY[r] - 15}" width="30" height="30" rx="6"
        fill="${active ? "rgba(74,222,128,0.9)" : "rgba(255,255,255,0.05)"}"
        stroke="${active ? "#4ade80" : "#2c313c"}" stroke-width="${active ? 2 : 1}"/>`;
    }
  }

  const gkFill = isGK ? "rgba(74,222,128,0.9)" : "rgba(255,255,255,0.05)";
  const gkStroke = isGK ? "#4ade80" : "#2c313c";

  return `
  <svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="width:100%;max-width:220px;height:auto">
    <rect x="4" y="4" width="${w - 8}" height="${h - 8}" rx="10" fill="#0d3b20" stroke="#1f4a2c" stroke-width="2"/>
    <line x1="4" y1="${h / 2}" x2="${w - 4}" y2="${h / 2}" stroke="#1f4a2c" stroke-width="2"/>
    <circle cx="${w / 2}" cy="${h / 2}" r="28" fill="none" stroke="#1f4a2c" stroke-width="2"/>
    <rect x="${w / 2 - 36}" y="6" width="72" height="28" fill="none" stroke="#1f4a2c" stroke-width="2"/>
    <rect x="${w / 2 - 36}" y="${h - 34}" width="72" height="28" fill="none" stroke="#1f4a2c" stroke-width="2"/>
    <rect class="pitch-gk" data-cellkey="gk" onclick="handlePitchGKClick()"
      x="${w / 2 - 17}" y="${h - 21}" width="34" height="15" fill="${gkFill}" stroke="${gkStroke}" stroke-width="${isGK ? 2 : 1}" rx="4"/>
    ${cells}
  </svg>`;
}

let rosterOrder = [];
let currentIndex = -1;

function goTo(id) {
  const url = new URL(window.location.href);
  url.searchParams.set("player", id);
  window.location.href = url.toString();
}

function bar(label, value, max = 100, cls = "") {
  const pct = Math.max(0, Math.min(100, ((value ?? 0) / max) * 100));
  return `
    <div class="bar-row">
      <div class="bar-head"><span class="bar-label">${label}</span><span>${value ?? "-"}${max === 100 ? "%" : ""}</span></div>
      <div class="bar-track"><div class="bar-fill ${cls}" style="width:${pct}%"></div></div>
    </div>`;
}

async function loadRoster(gid, clubId) {
  const { data } = await supabaseClient
    .from("game_players")
    .select("id, nom, reputation_mondiale")
    .eq("game_id", gid)
    .eq("game_club_id", clubId)
    .order("reputation_mondiale", { ascending: false, nullsFirst: false });
  rosterOrder = data || [];
  currentIndex = rosterOrder.findIndex(p => String(p.id) === String(playerId));
  document.getElementById("prevBtn").disabled = currentIndex <= 0;
  document.getElementById("nextBtn").disabled = currentIndex === -1 || currentIndex >= rosterOrder.length - 1;
}

document.getElementById("prevBtn").addEventListener("click", () => {
  if (currentIndex > 0) goTo(rosterOrder[currentIndex - 1].id);
});
document.getElementById("nextBtn").addEventListener("click", () => {
  if (currentIndex >= 0 && currentIndex < rosterOrder.length - 1) goTo(rosterOrder[currentIndex + 1].id);
});

// Sélectionne automatiquement le premier poste actif du joueur (ou GB) au chargement.
function autoSelectDefaultPosition() {
  if (pitchGKActive) { handlePitchGKClick(); return; }
  if (!pitchCellTokens) return;
  for (let r = 0; r < pitchCellTokens.length; r++) {
    for (let c = 0; c < pitchCellTokens[r].length; c++) {
      if (pitchCellTokens[r][c].length) { handlePitchCellClick(r, c); return; }
    }
  }
}

// ===================== RECHERCHE GLOBALE (icone dans la topbar) =====================
// Meme principe que sur dashboard.html / squad.html : recherche live sur les
// clubs et joueurs de la partie, avec redirection au clic sur un resultat.
let searchDebounceTimer = null;

let headerSearchDocListenerAttached = false;
function initHeaderSearch() {
  const input = document.getElementById("fmSearchInput");
  const dropdown = document.getElementById("fmSearchDropdown");
  if (!input || !dropdown) return;

  input.addEventListener("input", () => {
    clearTimeout(searchDebounceTimer);
    const q = input.value.trim();
    if (q.length < 2) {
      dropdown.classList.add("hidden");
      dropdown.innerHTML = "";
      return;
    }
    searchDebounceTimer = setTimeout(() => runGlobalSearch(q, dropdown), 250);
  });

  input.addEventListener("focus", () => {
    if (input.value.trim().length >= 2 && dropdown.innerHTML) dropdown.classList.remove("hidden");
  });

  input.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      input.value = "";
      dropdown.classList.add("hidden");
      dropdown.innerHTML = "";
      input.blur();
    }
  });

  if (!headerSearchDocListenerAttached) {
    document.addEventListener("click", (e) => {
      const wrap = document.getElementById("fmSearchWrap");
      const dd = document.getElementById("fmSearchDropdown");
      if (wrap && dd && !wrap.contains(e.target)) dd.classList.add("hidden");
    });
    headerSearchDocListenerAttached = true;
  }
}

async function runGlobalSearch(q, dropdown) {
  // Recherche par mots : chaque mot doit apparaitre dans le nom (peu importe
  // l'ordre), ce qui permet de trouver "Adrien Rabiot" meme tape dans un
  // autre ordre, ou "Saka" tout seul. Les joueurs sont classes par reputation
  // mondiale pour faire remonter les plus connus en premier plutot que des
  // correspondances anecdotiques.
  const words = q.trim().split(/\s+/).filter(Boolean);

  let clubQuery = supabaseClient.from("game_clubs").select("id, nom").eq("game_id", gameId);
  words.forEach(w => { clubQuery = clubQuery.ilike("nom", `%${w}%`); });

  let playerQuery = supabaseClient
    .from("game_players")
    .select("id, nom, poste_brut, game_club_id, reputation_mondiale")
    .eq("game_id", gameId);
  words.forEach(w => { playerQuery = playerQuery.ilike("nom", `%${w}%`); });

  const [
    { data: clubs },
    { data: players, error: playersError },
  ] = await Promise.all([
    clubQuery.order("nom", { ascending: true }).limit(6),
    playerQuery.order("reputation_mondiale", { ascending: false, nullsFirst: false }).limit(8),
  ]);
  if (playersError) console.error(playersError);

  // Noms de club recuperes a part (plutot qu'une jointure imbriquee
  // club:game_clubs(nom)) : cette jointure est fragile si la relation FK
  // n'est pas explicite cote Supabase et faisait echouer silencieusement
  // toute la recherche joueurs (aucun resultat, meme pour un nom existant).
  let clubNameById = {};
  if (players && players.length > 0) {
    const clubIds = [...new Set(players.map(p => p.game_club_id).filter(Boolean))];
    if (clubIds.length > 0) {
      const { data: clubRows } = await supabaseClient
        .from("game_clubs")
        .select("id, nom")
        .in("id", clubIds);
      (clubRows || []).forEach(c => { clubNameById[c.id] = c.nom; });
    }
  }

  const hasClubs = clubs && clubs.length > 0;
  const hasPlayers = players && players.length > 0;

  if (!hasClubs && !hasPlayers) {
    dropdown.innerHTML = `<div class="search-empty">Aucun résultat pour "${escapeHtml(q)}"</div>`;
    dropdown.classList.remove("hidden");
    return;
  }

  let html = "";
  if (hasClubs) {
    html += `<div class="search-group-label">Clubs</div>`;
    html += clubs.map(c => `
      <div class="search-result-item" data-type="club" data-id="${c.id}">
        <span class="search-result-icon">🛡️</span>
        <span>${escapeHtml(c.nom)}</span>
      </div>
    `).join("");
  }
  if (hasPlayers) {
    html += `<div class="search-group-label">Joueurs</div>`;
    html += players.map(p => `
      <div class="search-result-item" data-type="player" data-id="${p.id}" data-club="${p.game_club_id ?? ""}">
        <span class="search-result-icon">🧍</span>
        <span>
          <div>${escapeHtml(p.nom)}</div>
          <div class="search-result-sub">${escapeHtml(p.poste_brut || "-")}${clubNameById[p.game_club_id] ? " · " + escapeHtml(clubNameById[p.game_club_id]) : ""}</div>
        </span>
      </div>
    `).join("");
  }

  dropdown.innerHTML = html;
  dropdown.classList.remove("hidden");

  dropdown.querySelectorAll(".search-result-item").forEach(item => {
    item.addEventListener("click", () => {
      const type = item.getAttribute("data-type");
      const id = item.getAttribute("data-id");
      if (type === "club") {
        window.location.href = `squad.html?game=${encodeURIComponent(gameId)}&club=${encodeURIComponent(id)}`;
      } else {
        const clubId = item.getAttribute("data-club");
        window.location.href = `fiche.html?game=${encodeURIComponent(gameId)}&club=${encodeURIComponent(clubId)}&player=${encodeURIComponent(id)}`;
      }
    });
  });
}
initHeaderSearch();

// Le bouton retour doit ramener a l'ecran precedent (base de donnees,
// effectif du club regarde, etc.) plutot que systematiquement vers
// l'effectif du club du joueur affiche. On s'appuie sur l'historique du
// navigateur (chaque navigation vers fiche.html est un vrai changement de
// page, donc history.back() renvoie exactement a la page/onglet/club qui a
// ouvert cette fiche). Si aucune page precedente fiable n'est detectee
// (acces direct, lien partage, page rechargee...), on garde en repli le lien
// classique vers l'effectif du club du joueur deja pose sur le href.
function initBackLink() {
  const backLinkEl = document.getElementById("backLink");
  if (!backLinkEl) return;

  let cameFromApp = false;
  try {
    cameFromApp = !!document.referrer && new URL(document.referrer).origin === window.location.origin;
  } catch (e) {
    cameFromApp = false;
  }

  if (cameFromApp && window.history.length > 1) {
    backLinkEl.addEventListener("click", (e) => {
      e.preventDefault();
      window.history.back();
    });
  }
}

async function loadFiche() {
  renderFmSidebar(clubIdParam);

  if (!gameId || !playerId) {
    document.getElementById("fmSearchInput").placeholder = "Joueur introuvable";
    document.getElementById("content").classList.add("hidden");
    document.getElementById("emptyState").classList.remove("hidden");
    return;
  }

  const { data: { session } } = await supabaseClient.auth.getSession();
  if (!session?.user) { window.location.href = "index.html"; return; }

  const { data: game } = await supabaseClient
    .from("games").select("date_debut, jour_actuel, saison").eq("id", gameId).single();
  if (game) {
    gameCurrentDate = new Date(game.date_debut);
    gameCurrentDate.setDate(gameCurrentDate.getDate() + (game.jour_actuel || 0));
    renderFmDateBadge(game);
  }

  // IMPORTANT : on ne sélectionne jamais ca / potentiel / traits cachés ici.
  // Ces colonnes sont d'ailleurs désormais bloquées côté base (REVOKE) pour anon/authenticated.
  const selectCols = [
    "id", "game_id", "game_club_id", "nom", "age", "forme", "moral", "blessure_jours",
    "nationalite", "poste_brut", "postes", "statut_special", "reputation_mondiale",
    "personnalite", "pied_gauche", "pied_droit", "date_naissance",
    "contrat_expire", "salaire_actuel", "valeur_marchande_actuelle",
    ...ALL_ATTR_KEYS,
  ].join(", ");

  const { data: gp, error } = await supabaseClient
    .from("game_players")
    .select(`${selectCols}, players:player_ref ( taille_cm, poids_kg )`)
    .eq("id", playerId)
    .eq("game_id", gameId)
    .single();

  if (error || !gp) {
    document.getElementById("fmSearchInput").placeholder = "Joueur introuvable";
    document.getElementById("content").classList.add("hidden");
    document.getElementById("emptyState").classList.remove("hidden");
    toast("Impossible de charger ce joueur", true);
    return;
  }

  const extra = gp.players || {};
  clubIdParam = clubIdParam || gp.game_club_id;

  document.getElementById("backLink").href = `squad.html?game=${encodeURIComponent(gameId)}&club=${encodeURIComponent(clubIdParam || "")}`;
  initBackLink();
  renderFmSidebar(clubIdParam);

  let clubNom = "";
  if (clubIdParam) {
    const { data: club } = await supabaseClient.from("game_clubs").select("nom").eq("id", clubIdParam).single();
    clubNom = club?.nom || "";
  }

  document.getElementById("fmSearchInput").placeholder = (gp.nom || "").toUpperCase();
  document.getElementById("playerMeta").textContent = [gp.poste_brut, clubNom].filter(Boolean).join(" · ");
  renderPlayerPhoto(gp);

  // Identité
  document.getElementById("identityRows").innerHTML = `
    ${gp.statut_special ? `<div style="margin-bottom:10px"><span class="status-chip">${escapeHtml(gp.statut_special)}</span></div>` : ""}
    <div class="identity-row"><span class="identity-label">Nationalité</span><span class="identity-value">${flagImg(gp.nationalite)}</span></div>
    <div class="identity-row"><span class="identity-label">Âge</span><span class="identity-value">${gp.age ?? ageFromDob(gp.date_naissance)}</span></div>
    <div class="identity-row"><span class="identity-label">Date de naissance</span><span class="identity-value">${formatDate(gp.date_naissance)}</span></div>
    <div class="identity-row"><span class="identity-label">Taille / Poids</span><span class="identity-value">${extra.taille_cm ? extra.taille_cm + " cm" : "-"} / ${extra.poids_kg ? extra.poids_kg + " kg" : "-"}</span></div>
    <div class="identity-row"><span class="identity-label">Personnalité</span><span class="identity-value">${escapeHtml(gp.personnalite || "-")}</span></div>
  `;
  document.getElementById("feetRow").innerHTML = `
    <div class="foot-block">${bootSVG(gp.pied_gauche)}<div class="foot-label">Pied gauche</div><div class="foot-level">${escapeHtml(gp.pied_gauche || "-")}</div></div>
    <div class="foot-block">${bootSVG(gp.pied_droit)}<div class="foot-label">Pied droit</div><div class="foot-level">${escapeHtml(gp.pied_droit || "-")}</div></div>
  `;

  // Postes / terrain
  document.getElementById("pitchHolder").innerHTML = pitchSVG(gp.postes);
  document.getElementById("posteChips").innerHTML = (gp.postes || [])
    .map(p => `<span class="poste-chip">${escapeHtml(p)}</span>`)
    .join("") || `<span class="poste-chip">${escapeHtml(gp.poste_brut || "-")}</span>`;

  // Attributs
  const isGK = (gp.poste_brut || "").toUpperCase().includes("GB");
  let colsHtml = renderAttrColumn("Technique", TECH, gp) + renderAttrColumn("Mental", MENTAL, gp) + renderAttrColumn("Physique", PHYSIQUE, gp);
  if (isGK) colsHtml += renderAttrColumn("Gardien", GARDIEN, gp);
  document.getElementById("attrsCols").innerHTML = colsHtml;

  // Radar 8 axes
  document.getElementById("radarHolder").innerHTML = radarSVG(buildRadarAxes(gp));

  // Réputation : toujours visible (information publique)
  document.getElementById("starsRep").innerHTML = starsHtml(starsFromReputation(gp.reputation_mondiale));

  // Niveau actuel / potentiel : jamais en clair, étoiles visibles seulement pour son propre effectif
  const { data: scouting } = await supabaseClient.rpc("get_player_scouting", { p_game_player_id: gp.id });
  const scoutInfo = Array.isArray(scouting) ? scouting[0] : scouting;
  const lockedHint = "Disponible uniquement pour les joueurs de votre effectif";
  if (scoutInfo?.is_own) {
    document.getElementById("starsCA").innerHTML = starsHtml(Number(scoutInfo.niveau_stars));
    document.getElementById("starsPotentiel").innerHTML = starsHtml(Number(scoutInfo.potentiel_stars));
  } else {
    document.getElementById("starsCA").innerHTML = starsHtml(0, true, lockedHint);
    document.getElementById("starsPotentiel").innerHTML = starsHtml(0, true, lockedHint);
  }

  // Contrat
  document.getElementById("contractRows").innerHTML = `
    <div class="contract-row"><span class="contract-label">Club</span><span class="contract-value">${escapeHtml(clubNom || "-")}</span></div>
    <div class="contract-row"><span class="contract-label">Salaire</span><span class="contract-value">${formatMoneyShort(gp.salaire_actuel)}${gp.salaire_actuel ? " / mois" : ""}</span></div>
    <div class="contract-row"><span class="contract-label">Fin de contrat</span><span class="contract-value ${isContractSoon(gp.contrat_expire) ? "contract-soon" : ""}">${formatDate(gp.contrat_expire)}</span></div>
    <div class="contract-row"><span class="contract-label">Valeur estimée</span><span class="contract-value">${valueRange(gp.valeur_marchande_actuelle)}</span></div>
  `;

  // Condition (forme / moral / blessure) — données jusqu'ici inutilisées dans l'app
  const blesse = (gp.blessure_jours || 0) > 0;
  document.getElementById("conditionRows").innerHTML = `
    ${bar("Condition physique", gp.forme, 100, (gp.forme ?? 100) < 60 ? "bad" : "")}
    ${bar("Moral", gp.moral, 100, (gp.moral ?? 100) < 40 ? "bad" : "")}
    <div class="contract-row" style="border-top:1px solid var(--border); margin-top:6px; padding-top:10px">
      <span class="contract-label">Disponibilité</span>
      <span class="fit-chip ${blesse ? "fit-bad" : "fit-ok"}">${blesse ? `Blessé (${gp.blessure_jours} j.)` : "Apte"}</span>
    </div>
  `;

  selectedCellKey = null;
  autoSelectDefaultPosition();

  await loadRoster(gameId, clubIdParam);

  scheduleFitScale();
}

// ---------- Mise à l'échelle globale ----------
// Plutôt que de compresser l'intérieur de chaque module, on réduit l'ensemble
// (topbar + contenu) proportionnellement pour que tout tienne sans scroll,
// quelle que soit la résolution. Sous 800px de large (mise en page mobile
// empilée), on ne touche à rien : le scroll y est normal et attendu.
const SCALE_MIN = 0.6;
let fitScaleRAF = null;
function fitScale() {
  const outer = document.getElementById("scaleOuter");
  const root = document.getElementById("scaleRoot");
  if (!outer || !root) return;

  if (window.innerWidth <= 800) {
    root.style.transform = "none";
    outer.style.height = "auto";
    return;
  }

  root.style.transform = "none";
  outer.style.height = "auto";
  // Force un reflow avant mesure pour avoir la vraie hauteur naturelle du contenu.
  const naturalHeight = root.scrollHeight;
  const available = outer.parentElement.clientHeight || window.innerHeight;

  let scale = Math.min(1, available / naturalHeight);
  scale = Math.max(SCALE_MIN, scale);

  root.style.transform = `scale(${scale})`;
  outer.style.height = Math.round(naturalHeight * scale) + "px";
}
function scheduleFitScale() {
  if (fitScaleRAF) cancelAnimationFrame(fitScaleRAF);
  fitScaleRAF = requestAnimationFrame(fitScale);
}
window.addEventListener("resize", scheduleFitScale);

loadFiche();
